<text x="24" y="34" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="700" fill="#333" text-anchor="start">WF-004  결제 정보 상태: 할인 0건 / 정기배송 탭</text><text x="24" y="54" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#777" text-anchor="start">샵단 > 장바구니 · 반응형 스킨 기준 · 정보구조 와이어프레임</text><text x="40" y="96" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" font-weight="700" fill="#333" text-anchor="start">할인 0건 (일반구매)</text><g id="AREA-CART-PAY"><rect x="40" y="110" width="340" height="210" fill="#fff" stroke="#9aa0a6" stroke-width="1" rx="0"/><text x="56" y="140" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14" font-weight="700" fill="#333" text-anchor="start">결제 정보</text><rect x="240" y="126" width="124" height="22" fill="#fff" stroke="#9aa0a6" stroke-width="1" stroke-dasharray="4 3" rx="0"/><text x="248" y="141" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="start">[최대 할인 적용 ○●]</text><rect x="240" y="151" width="110" height="18" fill="#eef1f5" stroke="#c5cbd3" stroke-width="1" rx="3"/><text x="246" y="164" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="10" font-weight="400" fill="#4a5563" text-anchor="start">CMP-MAX-TOGGLE</text><text x="56" y="180" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" font-weight="700" fill="#333" text-anchor="start">총 상품 금액 ︿</text><text x="364" y="180" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" font-weight="700" fill="#333" text-anchor="end">000,000원</text><text x="64" y="200" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#777" text-anchor="start">ㄴ 상품 금액</text><text x="364" y="200" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#777" text-anchor="end">000,000원</text><text x="64" y="218" font-family="Prete