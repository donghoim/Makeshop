<svg xmlns="http://www.w3.org/2000/svg" width="560" height="760" viewBox="0 0 560 760">
<title>WF-003 쿠폰 선택 모달</title>
<rect width="560" height="760" fill="#fafafa"/>
<text x="24" y="34" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="700" fill="#333" text-anchor="start">WF-003  쿠폰 선택 모달 (상품쿠폰 / 장바구니 쿠폰 공통)</text><text x="24" y="54" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#777" text-anchor="start">샵단 > 장바구니 · 반응형 스킨 기준 · 정보구조 와이어프레임</text><rect x="60" y="80" width="440" height="640" fill="#fff" stroke="#555" stroke-width="2" rx="6"/><text x="80" y="110" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14" font-weight="700" fill="#333" text-anchor="start">상품쿠폰 적용 / 장바구니 쿠폰 적용</text><text x="480" y="110" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="end">[×]</text><text x="80" y="146" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" font-weight="700" fill="#333" text-anchor="start">쿠폰 등록</text><line x1="80" y1="156" x2="480" y2="156" stroke="#333"/><rect x="80" y="168" width="300" height="28" fill="#fff" stroke="#9aa0a6" stroke-width="1" rx="0"/><text x="90" y="187" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#999" text-anchor="start">쿠폰 번호 입력</text><rect x="390" y="168" width="90" height="28" fill="#fff" stroke="#9aa0a6" stroke-width="1" rx="0"/><text x="435" y="187" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="middle">[등록]</text><rect x="330" y="133" width="82" height="18" fill="#eef1f5" stroke="#c5cbd3" stroke-width="1" rx="3"/><text x="336" y="146" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="10" font-weight="400" fill="#4a5563" text-anchor="start">AREA-M-REG</text><text x="80" y="220" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" font-weight="700" fill="#333" text-anchor="start">적용 쿠폰 선택 (1개 선택)</text><line x1="80" y1="230" x2="480" y2="230" stroke="#333"/><text x="84" y="256" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="start">○ 쿠폰 적용 안함</text><text x="84" y="288" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="start">○ 할인값 | 쿠폰명 · 설명 · 유효기간</text><text x="84" y="320" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="start">○ 할인값 | 쿠폰명 · 쿠폰 중복 사용 불가능</text><rect x="330" y="207" width="103" height="18" fill="#eef1f5" stroke="#c5cbd3" stroke-width="1" rx="3"/><text x="336" y="220" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="10" font-weight="400" fill="#4a5563" text-anchor="start">AREA-M-SINGLE</text><text x="80" y="370" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" font-weight="700" fill="#333" text-anchor="start">적용 중복 쿠폰 선택 (여러 개 선택)</text><line x1="80" y1="380" x2="480" y2="380" stroke="#333"/><text x="84" y="406" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="start">□ 할인값 | 중복 쿠폰명 · 설명 · 유효기간</text><text x="84" y="438" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="start">□ 할인값 | 중복 쿠폰명 (중복 불가 쿠폰 선택 시 비활성)</text><rect x="330" y="357" width="82" height="18" fill="#eef1f5" stroke="#c5cbd3" stroke-width="1" rx="3"/><text x="336" y="370" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="10" font-weight="400" fill="#4a5563" text-anchor="start">AREA-M-DUP</text><text x="80" y="480" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" font-weight="700" fill="#333" text-anchor="start">적용 불가 쿠폰 (선택 불가)</text><line x1="80" y1="490" x2="480" y2="490" stroke="#333"/><text x="84" y="516" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#999" text-anchor="start">할인값 | 쿠폰명 · 사용 조건</text><rect x="330" y="467" width="75" height="18" fill="#eef1f5" stroke="#c5cbd3" stroke-width="1" rx="3"/><text x="336" y="480" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="10" font-weight="400" fill="#4a5563" text-anchor="start">AREA-M-NA</text><text x="80" y="564" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="10" font-weight="400" fill="#777" text-anchor="start">· 결제수단 제한 안내 · 조건부 미적용 안내 · 적용불가 상세는 마이페이지</text><rect x="80" y="584" width="400" height="40" fill="#e9e9e9" stroke="#9aa0a6" stroke-width="1" rx="0"/><text x="280" y="609" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" font-weight="700" fill="#333" text-anchor="middle">[쿠폰적용]</text>
</svg>
