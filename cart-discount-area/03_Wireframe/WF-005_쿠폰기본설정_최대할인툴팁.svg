<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640">
<title>WF-005 쿠폰 기본 설정 모달 최대 할인 자동 적용 툴팁</title>
<rect width="1180" height="640" fill="#fafafa"/>
<text x="24" y="34" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="700" fill="#333" text-anchor="start">WF-005  쿠폰 기본 설정 모달 · 최대 할인 자동 적용 툴팁</text><text x="24" y="54" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#777" text-anchor="start">관리자 > 프로모션 > 쿠폰 > 쿠폰 관리 > [쿠폰 기본 설정] · 정보구조 와이어프레임(기존 모달, 툴팁 문구만 추가)</text><rect x="24" y="80" width="560" height="520" fill="#fff" stroke="#555" stroke-width="2" rx="0"/><text x="44" y="114" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="700" fill="#333" text-anchor="start">쿠폰 기본 설정</text><text x="568" y="104" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="end">[×]</text><text x="44" y="136" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" font-weight="700" fill="#333" text-anchor="start">기본설정</text><rect x="44" y="148" width="190" height="30" fill="#f3f4f6" stroke="#9aa0a6" stroke-width="1" rx="0"/><text x="54" y="168" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="start">스마트 쿠폰 사용 여부</text><rect x="234" y="148" width="330" height="30" fill="#fff" stroke="#9aa0a6" stroke-width="1" rx="0"/><text x="246" y="168" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="start">◉ 사용함  ○ 사용안함</text><rect x="44" y="178" width="190" height="30" fill="#f3f4f6" stroke="#9aa0a6" stroke-width="1" rx="0"/><text x="54" y="198" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="start">쿠폰 사용 범위 설정</text><rect x="234" y="178" width="330" height="30" fill="#fff" stroke="#9aa0a6" stroke-width="1" rx="0"/><text x="246" y="198" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="start">□ 전체  ☑ 상품  □ 장바구니</text><rect x="44" y="208" width="190" height="30" fill="#f3f4f6" stroke="#9aa0a6" stroke-width="1" rx="0"/><text x="54" y="228" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="start">최대 할인 자동 적용 (?)</text><rect x="234" y="208" width="330" height="30" fill="#fff" stroke="#9aa0a6" stroke-width="1" rx="0"/><text x="246" y="228" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="start">◉ 사용함  ○ 사용안함</text><rect x="42" y="206" width="524" height="34" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4 3" rx="0"/><rect x="44" y="238" width="190" height="30" fill="#f3f4f6" stroke="#9aa0a6" stroke-width="1" rx="0"/><text x="54" y="258" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="start">쿠폰존 정렬기본값 설정 (?)</text><rect x="234" y="238" width="330" height="30" fill="#fff" stroke="#9aa0a6" stroke-width="1" rx="0"/><text x="246" y="258" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="start">◉ 유효기간 순  ○ 쿠폰명 순  ○ 최신등록 순</text><rect x="44" y="275" width="166" height="18" fill="#eef1f5" stroke="#c5cbd3" stroke-width="1" rx="3"/><text x="50" y="288" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="10" font-weight="400" fill="#4a5563" text-anchor="start">CMP-COUPON-MAXAUTO-TIP</text><text x="44" y="316" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#999" text-anchor="start">쿠폰 사용 설정 · 쿠폰 노출 설정 (현행 유지)</text><rect x="44" y="330" width="520" height="160" fill="#fff" stroke="#9aa0a6" stroke-width="1" stroke-dasharray="4 3" rx="0"/><text x="304" y="416" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#999" text-anchor="middle">기존 항목 변경 없음</text><rect x="194" y="512" width="100" height="32" fill="#fff" stroke="#9aa0a6" stroke-width="1" rx="0"/><text x="244" y="533" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="middle">[취소]</text><rect x="314" y="512" width="100" height="32" fill="#e9e9e9" stroke="#9aa0a6" stroke-width="1" rx="0"/><text x="364" y="533" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" font-weight="700" fill="#333" text-anchor="middle">[저장]</text><line x1="224" y1="222" x2="620" y2="170" stroke="#555" stroke-dasharray="4 3"/><rect x="620" y="150" width="540" height="250" fill="#fff" stroke="#333" stroke-width="1" rx="4"/><text x="634" y="174" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" font-weight="700" fill="#333" text-anchor="start">최대 할인 자동 적용 툴팁 (? 아이콘 마우스 오버)</text><text x="634" y="202" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start">쿠폰 최대 할인 적용의 경우 아래 케이스들은 적용이 불가능합니다.</text><text x="634" y="220" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start">- 중복쿠폰 및 적립/배송비할인/배송비무료 쿠폰</text><text x="634" y="238" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start">- 쿠폰 중복 사용 불가 쿠폰</text><text x="634" y="256" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start">- 특정 결제수단 지정된 쿠폰</text><text x="634" y="274" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start">- 회원 추가 혜택 적용불가 쿠폰</text><text x="634" y="292" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start">- 쿠폰/적립금 동시사용 불가 쿠폰</text><text x="1146" y="202" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="10" font-weight="400" fill="#999" text-anchor="end">기존 안내 유지</text><line x1="634" y1="318" x2="1146" y2="318" stroke="#ddd"/><rect x="630" y="326" width="520" height="62" fill="#fff" stroke="#333" stroke-width="1" stroke-dasharray="4 3" rx="0"/><text x="638" y="346" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="start">장바구니에 쿠폰·할인 영역이 적용된 상점은 이 설정에 따라</text><text x="638" y="364" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#333" text-anchor="start">주문서의 쿠폰 적용 방식이 달라집니다.</text><text x="856" y="364" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="700" fill="#333" text-anchor="start">장바구니 내 쿠폰 및 할인 영역 노출 방법 ></text><text x="638" y="382" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="10" font-weight="400" fill="#999" text-anchor="start">추가: 안내 1문장 + 오른쪽 텍스트 링크(개별디자인 TIP, OPEN-004)</text><text x="620" y="426" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#777" text-anchor="start">· 링크 클릭 → 개별디자인 TIP 게시글 새 창(INT-011)</text><text x="620" y="446" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#777" text-anchor="start">· 설정값·저장 동작 변경 없음 · 관련 정책 POL-057</text><text x="620" y="466" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" font-weight="400" fill="#777" text-anchor="start">· 사용안함: 장바구니 적용 쿠폰 주문서 인계 / 사용함: 주문서 자동 적용 기준(POL-052~056)</text>
</svg>
