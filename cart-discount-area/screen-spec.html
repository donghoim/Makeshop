<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장바구니 할인 화면정의서</title>
<link rel="stylesheet" href="./src/css/cart.css">
<style>
  :root { --b:#e3e5e8; --tx:#1b1d21; --mu:#6b7280; --pin:#e5484d; --hi:#1d3f8f; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--tx); background:#f4f5f7; }
  .sp { display:grid; grid-template-columns:260px minmax(0,1fr) 400px; height:100vh; }
  nav { background:#fff; border-right:1px solid var(--b); overflow:auto; padding:16px 12px; }
  nav h1 { font-size:15px; margin:0 0 2px; }
  nav .meta { color:var(--mu); font-size:11px; margin-bottom:12px; }
  nav input { width:100%; height:32px; border:1px solid var(--b); border-radius:4px; padding:0 8px; font:inherit; margin-bottom:10px; }
  nav .grp { font-size:11px; color:var(--mu); font-weight:700; margin:12px 4px 4px; }
  nav a { display:block; padding:6px 8px; border-radius:4px; color:var(--tx); text-decoration:none; font-size:12px; }
  nav a small { display:block; color:var(--mu); font-size:10px; }
  nav a.on { background:#eef2fb; color:var(--hi); font-weight:700; }
  main { overflow:auto; padding:20px; }
  .shead { background:#fff; border:1px solid var(--b); border-radius:6px; padding:12px 16px; margin-bottom:12px; display:grid; grid-template-columns:auto 1fr auto 1fr; gap:4px 14px; font-size:12px; }
  .shead b { color:var(--mu); font-weight:600; }
  .stage-wrap { background:#fff; border:1px solid var(--b); border-radius:6px; padding:16px; overflow:auto; }
  .stage { position:relative; margin:0 auto; background:#fff; }
  .stage.mobile { border:1px solid #ccc; }
  .pin { position:absolute; z-index:40; width:22px; height:22px; border-radius:50%; background:var(--pin); color:#fff; font:700 12px/22px sans-serif; text-align:center; transform:translate(-60%,-60%); box-shadow:0 0 0 2px #fff; pointer-events:none; }
  .box { position:absolute; z-index:39; border:2px solid var(--pin); border-radius:3px; pointer-events:none; }
  .hint { color:var(--mu); font-size:11px; margin:8px 2px 0; }
  aside.desc { background:#fff; border-left:1px solid var(--b); overflow:auto; padding:16px; }
  aside.desc h2 { font-size:12px; letter-spacing:.5px; color:var(--mu); margin:0 0 10px; }
  .card { border:1px solid var(--b); border-radius:6px; padding:10px 12px; margin-bottom:10px; }
  .card h3 { margin:0 0 4px; font-size:13px; display:flex; gap:8px; align-items:center; }
  .card h3 span { flex:0 0 20px; height:20px; border-radius:50%; background:var(--pin); color:#fff; font-size:11px; text-align:center; line-height:20px; }
  .card ul { margin:4px 0 0; padding-left:16px; }
  .card li { margin:2px 0; }
  .card .ref { color:var(--hi); font-size:11px; margin-top:6px; }
  .card table { border-collapse:collapse; width:100%; margin-top:6px; font-size:11px; }
  .card th, .card td { border:1px solid var(--b); padding:3px 5px; text-align:left; vertical-align:top; }
  .card th { background:#f7f8fa; }
  @media (max-width:1100px) { .sp { grid-template-columns:200px minmax(0,1fr); } aside.desc { grid-column:1/3; border-left:0; border-top:1px solid var(--b); } .sp { height:auto; } }
</style>
</head>
<body>
<div class="sp">
  <nav>
    <h1>장바구니 할인 화면정의서</h1>
    <div class="meta">원본 요청 · 샵단 &gt; 장바구니 · 반응형 스킨 기준 · 2026-10-27</div>
    <input id="q" placeholder="화면 검색" aria-label="화면 검색">
    <div id="toc"></div>
  </nav>
  <main>
    <div class="shead" id="shead"></div>
    <div class="stage-wrap"><div class="stage" id="stage"></div></div>
    <p class="hint">화면 안의 버튼·토글·체크박스는 실제로 동작합니다. 조작하면 번호 위치가 함께 갱신됩니다. 목업 금액은 정책서 계산 기준으로 산출한 예시입니다.</p>
  </main>
  <aside class="desc"><h2>DESCRIPTION</h2><div id="desc"></div></aside>
</div>

var ctrl, cur;
function el(id) { return document.getElementById(id); }
function renderToc(filter) {
  var h = '', last = '';
  SCREENS.forEach(function (s, i) {
    var text = s.id + ' ' + s.name + ' ' + s.g;
    if (filter && text.indexOf(filter) < 0) return;
    if (s.g !== last) { h += '<div class="grp">' + s.g + '</div>'; last = s.g; }
    h += '<a href="#' + s.id + '" data-i="' + i + '" class="' + (cur === i ? 'on' : '') + '">' + s.name + '<small>' + s.id + '</small></a>';
  });
  el('toc').innerHTML = h;
}
function placePins() {
  var s = SCREENS[cur], stage = el('stage');
  stage.querySelectorAll('.pin,.box').forEach(function (n) { n.remove(); });
  var sr = stage.getBoundingClientRect(), cards = '';
  s.pins.forEach(function (p, i) {
    var n = i + 1, t = stage.querySelector('[data-mk="' + p[0] + '"]');
    if (t) {
      var r = t.getBoundingClientRect();
      var box = document.createElement('div'); box.className = 'box';
      box.style.cssText = 'left:' + (r.left - sr.left - 3) + 'px;top:' + (r.top - sr.top - 3) + 'px;width:' + (r.width + 6) + 'px;height:' + (r.height + 6) + 'px';
      var pin = document.createElement('div'); pin.className = 'pin'; pin.textContent = n;
      pin.style.left = (r.left - sr.left) + 'px'; pin.style.top = (r.top - sr.top) + 'px';
      stage.appendChild(box); stage.appendChild(pin);
    }
    var d = p[1];
    cards += '<div class="card"><h3><span>' + n + '</span>' + d.t + '</h3><ul>' + d.b.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' + (d.extra || '') + '<div class="ref">' + d.r + '</div></div>';
  });
  el('desc').innerHTML = cards;
}
function show(i) {
  cur = i; var s = SCREENS[i];
  location.hash = s.id;
  el('shead').innerHTML = '<b>화면 ID</b><span>' + s.id + '</span><b>경로</b><span>샵단 &gt; 장바구니</span><b>화면</b><span>' + s.g + ' · ' + s.name + '</span><b>상태</b><span>' + s.st + ' · ' + CART_DATA.CART_TYPES[s.opts.cartType].label + '</span>';
  var stage = el('stage'); stage.innerHTML = ''; stage.className = 'stage' + (s.width ? ' mobile' : ''); stage.style.width = (s.width || 1180) + 'px';
  var root = document.createElement('div'); stage.appendChild(root);
  var opts = Object.assign({ chrome: false, onRender: function () { requestAnimationFrame(placePins); } }, s.opts);
  ctrl = CartApp.mount(root, opts);
  if (s.setup) s.setup(ctrl);
  renderToc(el('q').value.trim());
  requestAnimationFrame(placePins);
}
el('toc').addEventListener('click', function (e) { var a = e.target.closest('a'); if (!a) return; e.preventDefault(); show(+a.getAttribute('data-i')); });
el('q').addEventListener('input', function () { renderToc(this.value.trim()); });
window.addEventListener('resize', function () { placePins(); });
var start = SCREENS.findIndex(function (s) { return '#' + s.id === location.hash; });
show(start < 0 ? 0 : start);
</script>
