<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사이트 보안 설정 — 보안 설정 탭</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="screen">
  <div class="head">
    <div class="title">사이트 보안 설정 <span class="manual">매뉴얼</span></div>
    <div class="crumbs">설정 &gt; 기본 설정 &gt; 사이트 보안 설정</div>
  </div>
  <div class="tabs"><span>접속 관리</span><span class="on">보안 설정</span></div>

  <div class="section">
    <div class="section-title">비정상 로그인 방지</div>
    <div class="row">
      <div class="label">계정 잠금 <span class="q">?</span></div>
      <div class="field"><div class="seg"><span class="on">사용</span><span>사용안함</span></div></div>
    </div>
    <div class="row sub">
      <div class="label">횟수 설정</div>
      <div class="field">로그인 <span class="select">5회</span> 실패 시, 계정 잠금</div>
    </div>
    <div class="row">
      <div class="label">캡챠 활성화 <span class="q">?</span></div>
      <div class="field"><div class="seg"><span class="on">활성화</span><span>비활성화</span></div></div>
    </div>
    <div class="row sub" style="border-bottom:0;">
      <div class="label">Site KEY</div>
      <div class="field"><div class="input wide">6Lc••••••••••••••••••••••••••••••••••</div></div>
    </div>
    <div class="row sub" style="border-bottom:0;">
      <div class="label">Secret KEY</div>
      <div class="field"><div class="input wide">6Lc••••••••••••••••••••••••••••••••••</div></div>
    </div>
    <div class="row sub">
      <div class="label"></div>
      <div class="field"><span class="btn">검증하기</span><span class="status" style="--c:#2f7cf6;">연결 성공 (마지막 확인: 2026.01.28 14:30)</span></div>
    </div>
  </div>
</div>
</body>
</html>
