<g id="area-form-guide">
<rect x="20" y="410" width="640" height="130" fill="#F2F2F2" stroke="#999999" stroke-width="1"/>
<text x="32" y="432" font-size="12" fill="#222222">- 통합옵션은 엑셀 파일로 옵션정보1/옵션정보2로 구분됩니다.</text>
<text x="32" y="453" font-size="12" fill="#222222">*옵션정보2: 옵션 조합 값, 옵션 조합 형태, 옵션 조합 가격, 옵션별 재고, 옵션 재고 관리 선택,</text>
<text x="32" y="474" font-size="12" fill="#222222">확인요청수량 사용 여부, 확인요청수량, 판매중지수량 사용 여부, 판매중지수량, 관리코드,</text>
<text x="32" y="495" font-size="12" fill="#222222">품목코드, 판매상태, 옵션 출력 방식</text>
<text x="32" y="516" font-size="12" fill="#222222">- 품목코드는 시스템이 부여하는 값으로, 업로드할 때 입력값은 반영되지 않습니다.</text>
<text x="32" y="537" font-size="12" fill="#222222">-[기본옵션]은 옵션 조합 정보(옵션정보2)가 포함되지 않습니다.</text>
</g>
