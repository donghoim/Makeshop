<g id="area-notes">
<text x="36" y="674" font-size="12" fill="#666666">- 품목코드는 관리코드(운영자 입력) 바로 앞 열에 텍스트로 표시합니다.</text>
<text x="36" y="692" font-size="12" fill="#666666">  입력칸이 아니며 선택해 복사만 할 수 있습니다.</text>
<text x="36" y="710" font-size="12" fill="#666666">- [옵션 재조합]·[옵션추가]로 새로 생긴 행(마지막 행)은 저장 전이라 빈 값입니다.</text>
<text x="36" y="728" font-size="12" fill="#666666">  저장 후 다시 열면 표시됩니다.</text>
<text x="36" y="746" font-size="12" fill="#666666">- 재고·판매중지수량·주문한도 열은 현행대로 상태 열 주변에 표시되고, 품목코드 위치는 그대로입니다.</text>
<text x="36" y="764" font-size="12" fill="#666666">- 종료(삭제)된 품목은 표시하지 않습니다. 식별자 미부여 상품은 모든 행이 빈 값입니다.</text>
</g>
