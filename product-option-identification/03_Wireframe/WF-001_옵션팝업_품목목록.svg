<g id="CMP-ITEM-CODE-TOOLTIP">
<rect x="760" y="672" width="480" height="70" fill="#FFFFFF" stroke="#999999" stroke-width="1" rx="4"/>
<text x="772" y="694" font-size="11" fill="#666666">품목코드 (?) 도움말 (마우스오버 시 표시)</text>
<text x="772" y="710" font-size="11" fill="#666666">시스템이 품목마다 자동으로 부여하는 고유 코드입니다. 수정할 수 없으며,</text>
<text x="772" y="726" font-size="11" fill="#666666">운영자가 입력하는 관리코드와 다릅니다. 새로 추가한 옵션은 저장한 뒤 표시됩니다.</text>
</g>
<g id="area-grid-actions">
