<script type="application/json" id="proto">"<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>상품 상세 최대할인가 목업 · 메이크샵 관리자<\/title>\n<style>\n/* 상품 상세 최대할인가 목업 — 선배포 기본 스킨(반응형) 화면 구성 기준 */\n:root{--ink:#111;--sub:#767676;--line:#e5e5e5;--panel:#f4f4f4;--blue:#2f6fed;--accent:#ff5a1f;--red:#e5484d;--muted:#b8b8b8}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{font-family:Pretendard,\"Apple SD Gothic Neo\",\"Malgun Gothic\",sans-serif;color:var(--ink);font-size:14px;background:#fff;min-width:320px}\nbutton{font:inherit;cursor:pointer}\na{color:inherit;text-decoration:none}\n.topbanner{background:#333;color:#fff;text-align:center;font-size:13px;padding:9px 16px}\n.gnb{border-bottom:1px solid var(--line)}\n.gnb-in{max-width:1200px;margin:0 auto;padding:18px 20px 14px;display:flex;align-items:center;gap:40px;flex-wrap:wrap}\n.logo{font-size:24px;font-weight:800;letter-spacing:-.03em}\n.cate{display:flex;gap:28px;font-size:14px;font-weight:600}\n.util{margin-left:auto;display:flex;gap:16px;font-size:12px;color:#444}\n.ico-cart i{display:inline-block;margin-left:3px;background:var(--accent);color:#fff;border-radius:8px;font-style:normal;font-size:10px;padding:0 5px}\n.page{max-width:1200px;margin:0 auto;padding:16px 20px 80px}\n.crumb{font-size:12px;color:var(--sub);margin-bottom:24px}\n.detail{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:60px;align-items:start}\n.main-img{aspect-ratio:1/1;background:#efefef;display:flex;align-items:center;justify-content:center}\n.knit{width:58%;height:62%;border-radius:28% 28% 8% 8%;background:repeating-linear-gradient(90deg,#e7dccb 0 6px,#ddd0bb 6px 9px);box-shadow:inset 0 -26px 0 #d8cab3}\n.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}\n.thumbs span{aspect-ratio:1/1;background:#efefef}\n.tags{display:flex;gap:6px;margin-bottom:12px}\n.tags span{font-size:11px;color:#555;background:#f rgin-top:1px}\n.cb::after{content:\"\";width:5px;height:9px;border-right:2px solid transparent;border-bottom:2px solid transparent;transform:rotate(45deg) translate(-1px,-1px)}\n.cb.on{background:var(--blue);border-color:var(--blue)}\n.cb.on::after{border-color:#fff}\n.cb.auto{background:#fff;border-color:#d7d7d7;cursor:default}\n.cb.auto::after{border-color:#c4c4c4}\n.cb.dis{background:#ececec;border-color:#d7d7d7;cursor:not-allowed}\n.tag-nodup{display:inline-block;margin-left:6px;font-size:11px;color:var(--red);background:#ffe9e4;padding:1px 6px;border-radius:2px}\n.btn-down{border:0;border-radius:10px;font-size:11px;padding:3px 9px;background:#111;color:#fff;white-space:nowrap}\n.btn-down::after{content:\" ⤓\"}\n.btn-down.done{background:#c9c9c9;color:#fff;cursor:default}\n.btn-down.done::after{content:\"\"}\n.btn-more{background:none;border:0;font-size:12px;color:#333;padding:0}\n.mb-warn{font-size:11.5px;color:var(--red);margin:-2px 0 4px 28px}\n.mb-note{border-top:1.5px solid #555;padding-top:12px;font-size:12px;color:#333;display:flex;gap:6px;align-items:center}\n.mb-note::before{content:\"i\";width:15px;height:15px;border-radius:50%;background:#111;color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}\n.opt{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:10px}\n.opt-line{display:flex;justify-content:space-between;font-size:13px;color:#555}\n.opt select{height:40px;border:1px solid #ccc;padding:0 10px;font:inherit}\n.buy{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}\n.buy button{height:50px;border:1px solid #111;background:#fff;font-weight:700}\n.buy button.primary{background:#111;color:#fff}\n/* 대화상자·토스트 */\n.dlg-wrap{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}\n.dlg-wrap[hidden]{display:none}\n.dlg{background:#fff;border-radius:10px;width:420px;max-width:calc(100% - 32px);padding:22px 24px 18px;box-shadow:0 10px 30px rgba(0,0,0,.2)}\n.dlg h5{margin:0 0 10px;font-size:15px}\n.dlg p{margin:0 0 6px;font-size:13.5px;line-height:1.6}\n.dlg ul{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.8}\n.dlg .acts{text-align:right;margin-top:16px}\n.dlg .acts button{background:var(--blue);color:#fff;border:0;border-radius:16px;padding:7px 20px}\n#toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:#222;color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}\n#toast.show{opacity:1}\n/* 목업 시나리오 패널 */\n.demo{position:fixed;right:16px;top:120px;width:230px;background:#fff;border:1px solid #d6dbe3;border-radius:10px;box-shadow:0 6px 20px rgba(20,40,80,.12);font-size:12px;z-index:40;max-height:calc(100vh - 140px);overflow:auto}\n.demo.closed .demo-body{display:none}\n.demo-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #eef1f5;font-weight:700;color:#1d3a6e}\n.demo-head button{border:1px solid #d6dbe3;background:#fff;border-radius:5px;font-size:11px;padding:2px 7px}\n.demo-body{padding:6px 12px 12px}\n.demo-body h6{margin:10px 0 4px;font-size:11px;color:#6b778c}\n.demo-body label{display:flex;gap:6px;align-items:center;padding:2px 0;cursor:pointer}\n.demo-body .reset{margin-top:10px;width:100%;border:1px solid #d6dbe3;background:#f6f8fb;border-radius:5px;padding:5px}\n/* 모바일 */\nbody.is-mobile .gnb-in,body.is-mobile .page{max-width:390px}\nbody.is-mobile .cate,body.is-mobile .crumb{display:none}\nbody.is-mobile .detail{grid-template-columns:1fr;gap:20px}\nbody.is-mobile .page{padding:12px 16px 60px}\n@media (max-width:900px){\n  .detail{grid-template-columns:1fr;gap:20px}\n  .cate{display:none}\n  .demo{top:auto;bottom:12px;right:12px;width:210px;max-height:50vh}\n}\n\n<\/style>\n<\/head>\n<body>\n<div class=\"topbanner\">3월 한정 선착순 1+1 이벤트, 20% 할인 쿠폰도 드려요<\/div>\n<header class=\"gnb\">\n  <div class=\"gnb-in\">\n    <a class=\"logo\" href=\"#\">Shoply<\/a>\n    <nav class=\"cate\"><a>아우터<\/a><a>탑<\/a><a>원피스<\/a><a>스커트<\/a><a>팬츠<\/a><a>백<\/a><a>슈즈<\/a><a>액세서리<\/a><\/nav>\n    <div class=\"util\"><span class=\"ico-cart\">장바구니<i>1<\/i><\/span><span>마이<\/span><span>검색<\/span><\/div>\n  <\/div>\n<\/header>\n<main class=\"page\" id=\"page\">\n  <div class=\"crumb\">HOME &gt; 아우터 &gt; 가디건<\/div>\n  <div class=\"detail\">\n    <section class=\"gallery\">\n      <div class=\"main-img\" aria-label=\"상품 이미지\"><div class=\"knit\"><\/div><\/div>\n      <div class=\"thumbs\"><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><\/div>\n    <\/section>\n    <section class=\"info\" id=\"info\"><\/section>\n  <\/div>\n<\/main>\n<aside class=\"demo\" id=\"demo\" aria-label=\"목업 시나리오\"><\/aside>\n<div class=\"dlg-wrap\" id=\"dlg\" hidden><\/div>\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n<script>\n/* 화면정의서 내장용 브리지 — 목업(iframe srcdoc) 안에서 화면별 준비 단계를 실행하고 번호 마커를 그린다. */\nwindow.SpecBridge = {\n  sleep: (ms) => new Promise((r) => setTimeout(r, ms)),\n  async run(steps) { for (const s of steps) await this.step(s); },\n  async step(s) {\n    const [op, a, b] = s;\n    if (op === \"api\") window.MaxApp[a](...(b || []));\n    if (op === \"click\") { const el = this.find(a); if (el) el.click(); }\n    if (op === \"set\") { const el = this.find(a); if (el) { el.value = b; el.dispatchEvent(new Event(\"input\", { bubbles: true })); } }\n    if (op === \"js\") new Function(a)();\n    if (op === \"wait\") await this.sleep(a);\n    await this.sleep(80);\n  },\n  /** \"selector@포함텍스트|n번째^상위선택자\" */\n  find(spec) {\n    let anc = null, idx = 1, text = null;\n    if (spec.includes(\"^\")) [spec, anc] = spec.split(\"^\");\n    if (spec.includes(\"|\")) { const p = spec.split(\"|\"); spec = p[0]; idx = +p[1]; }\n    if (spec.includes(\"@\")) [spec, text] = spec.split(\"@\");\n    let list = [...document.querySelectorAll(spec)].filter((e) => e.getClientRects().length);\n    if (text) list = list.filter((e) => e.textContent.includes(text) || (e.value || \"\").includes(text));\n    let el = list[idx - 1] || null;\n    if (el && anc) el = el.closest(anc);\n    return el;\n  },\n  mark(marks) {\n    document.querySelectorAll(\".spec-mark,.spec-box\").forEach((e) => e.remove());\n    const missing = [];\n    marks.forEach(([n, spec]) => {\n      const el = this.find(spec);\n      if (!el) { missing.push(n + \" \" + spec); return; }\n      const r = el.getBoundingClientRect();\n      const x = r.left + window.scrollX, y = r.top + window.scrollY;\n      const box = document.createElement(\"div\");\n      box.className = \"spec-box\"; box.dataset.n = n;\n      Object.assign(box.style, { left: x - 3 + \"px\", top: y - 3 + \"px\", width: r.width + 6 + \"px\", height: r.height + 6 + \"px\" });\n      const m = document.createElement(\"div\");\n      m.className = \"spec-mark\"; m.dataset.n = n; m.textContent = n;\n      Object.assign(m.style, { left: Math.max(2, x - 14) + \"px\", top: Math.max(2, y - 14) + \"px\" });\n      document.body.appendChild(box); document.body.appendChild(m);\n    });\n    return { missing };\n  },\n  focus(n) { document.querySelectorAll(\".spec-box,.spec-mark\").forEach((e) => e.classList.toggle(\"is-on\", e.dataset.n === n)); },\n  modalNeed() { return 0; },\n  height() { return Math.max(document.documentElement.scrollHeight, document.body.scrollHeight, this.modalNeed()); },\n};\ndocument.addEventListener(\"DOMContentLoaded\", () => {\n  const css = document.createElement(\"style\");\n  css.textContent = `.demo{display:none!important}\n  body{overflow:visible!important}\n  .layout{min-height:0!important}\n  .overlay{position:absolute!important;min-height:100%;align-items:flex-start;padding-top:60px}\n  .win{max-height:none!important;overflow:visible!important}\n  .dlg-wrap{position:absolute!important;inset:0 0 auto 0!important;height:100%;display:block!important;background:rgba(0,0,0,.18)!important}\n  .dlg-wrap[hidden]{display:none!important}\n  .dlg{position:absolute;left:50%;top:420px;transform:translateX(-50%)}\n  .spec-box{position:absolute;z-index:3000;border:2px dashed #e5484d;border-radius:4px;pointer-events:none}\n  .spec-mark{position:absolute;z-index:3001;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#e5484d;color:#fff;font:700 12px/24px \"Malgun Gothic\",sans-serif;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:none}\n  .spec-box.is-on{border-style:solid;border-width:3px;background:rgba(229,72,77,.08)}\n  .spec-mark.is-on{background:#111;transform:scale(1.15)}`;\n  document.head.appendChild(css);\n});\n\n<\/script>\n<script>\n/* 목업 데이터 — 상품 상세 최대할인가(원본 요청). 금액·이름은 예시 값입니다. */\nwindow.MOCK = {\n  product: {\n    tags: [\"신상품\", \"베스트\", \"오늘출발\"],\n    name: \"카라 아이보리 긴팔 니트 가디건\",\n    eng: \"Loose Fit Collar Knit Cardigan\",\n    price: 100000,\n    replaceText: \"가격 문의\",\n  },\n  /* 상품 할인(POL-016): 리바이 > 기간 > 신상품 중 최상위 1건 */\n  productDc: { name: \"26년 1월 20% 할인\", type: \"기간 할인\", rate: 0.2 },\n  bulkDc: { name: \"대량 구매 할인\", tiers: [\"3개 이상 구매 시 3% 할인\", \"5개 이상 구매 시 5% 할인\", \"10개 이상 구매 시 10% 할인\"] },\n  /* 상품 추가 할인(POL-020): 상품별 그룹할인 */\n  groupDc: { name: \"일반회원\", rate: 0.1 },\n  /* 쿠폰(POL-022부터 POL-037까지). area: product | order, dup: 중복 쿠폰, noDup: 중복 불가 */\n  coupons: [\n    { id: \"c1\", area: \"product\", name: \"상품 쿠폰 10% 할인\", rate: 0.1, owned: true, cond: \"상품 금액 30,000원 이상 시 구매 가능\" },\n    { id: \"c2\", area: \"product\", name: \"신규 가입 상품 쿠폰 5% 할인\", rate: 0.05, owned: false, noDup: true },\n    { id: \"c3\", area: \"product\", name: \"가디건 기획전 3,000원 할인\", amount: 3000, owned: false, dup: true },\n    { id: \"c4\", area: \"product\", name: \"앱 전용 상품 중복 쿠폰 2,000원\", amount: 2000, owned: false, dup: true, appOnly: true },\n    { id: \"c5\", area: \"order\", name: \"장바구니 쿠폰 10% 할인\", rate: 0.1, owned: true },\n    { id: \"c6\", area: \"order\", name: \"적립금 함께 사용 불가 장바구니 쿠폰 5,000원\", amount: 5000, owned: false, noReserve: true, noDup: true },\n    { id: \"c7\", area: \"order\", name: \"장바구니 중복 쿠폰 1,000원 할인\", amount: 1000, owned: false, dup: true },\n  ],\n  /* 적립금 즉시 할인(POL-038, POL-039) */\n  reserveSale: { name: \"사용 적립금 즉시 할인\", rate: 0.02 },\n  /* 회원 등급 할인(POL-040, POL-041) */\n  gradeDc: { name: \"일반회원 결제 시 5% 추가 할인\", rate: 0.05 },\n  /* 앱 전용 할인(POL-042, POL-043) */\n  appDc: { name: \"앱 구매 할인\", amount: 500 },\n  /* 보유 적립금(POL-044부터 POL-052까지): 상품 구매액 30%까지 사용 */\n  reserve: { owned: 15000, limitRate: 0.3 },\n  /* 결제수단별 프로모션(POL-053부터 POL-058까지) */\n  payments: [\n    { id: \"p1\", name: \"무통장 입금 시 5% 할인\", rate: 0.05 },\n    { id: \"p2\", name: \"네이버페이 결제 시 2,000원 할인\", amount: 2000 },\n    { id: \"p3\", name: \"카드 결제 시 3% 할인\", rate: 0.03, memberOnly: true },\n    { id: \"p4\", name: \"휴대폰 결제 시 적립금 1% 적립\", rate: 0.01, rewardOnly: true },\n  ],\n};\n\n<\/script>\n<script>\n/* 상품 상세 최대할인가 목업 — 원본 요청\n   정책 번호는 사양 정의서 14장 정책 원장(POL) 기준입니다.\n   window.MaxApp: 화면정의서 브리지에서 호출하는 API */\n(function () {\n  \"use strict\";\n  const M = window.MOCK;\n  const AREAS = [\n    [\"productDc\", \"상품 할인\"], [\"groupDc\", \"상품 추가 할인\"], [\"productCoupon\", \"상품 쿠폰 할인\"], [\"orderCoupon\", \"장바구니 쿠폰 할인\"],\n    [\"grade\", \"회원 등급 할인\"], [\"app\", \"앱 전용 할인\"], [\"reserve\", \"적립금 사용\"], [\"reserveSale\", \"적립금 즉시 할인\"], [\"payment\", \"결제수단별 프로모션\"],\n  ];\n  const won = (n) => Math.round(n).toLocaleString(\"ko-KR\") + \"원\";\n  const minus = (n) => (n > 0 ? \"-\" : \"\") + won(n);\n  const floor100 = (n) => Math.floor(n / 100) * 100;\n  const esc = (s) => String(s).replace(/[&<>\"]/g, (c) => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\" }[c]));\n\n  let S;\n  function fresh() {\n    return {\n      member: true, app: false, open: false, mobile: false,\n      removed: {}, removeAll: false, couponFail: false, replaceText: false, reserveBlocked: false, zero: false,\n      owned: Object.fromEntries(M.coupons.map((c) => [c.id, c.owned])),\n      sel: new Set(), reserveUser: true, pay: null,\n    };\n  }\n\n  /* ---------- 노출 판단 ---------- */\n  function couponsIn(area) {\n    if (S.couponFail) return [];\n    return M.coupons.filter((c) => c.area === area); // 예시 쿠폰은 모두 다운로드 쿠폰(비회원·미보유 회원에게 받기로 노출, POL-027)\n  }\n  function paymentsVisible() {\n    return M.payments.filter((p) => !p.rewardOnly && (S.member || !p.memberOnly)); // POL-054, POL-055\n  }\n  function visible(key) {\n    if (S.removeAll || S.removed[key]) return false; // POL-010, POL-012\n    if (key === \"groupDc\" || key === \"grade\" || key === \"reserveSale\") return S.member; // POL-015, POL-021\n    if (key === \"app\") return S.app; // POL-042\n    if (key === \"productCoupon\") return couponsIn(\"product\").length > 0;\n    if (key === \"orderCoupon\") return couponsIn(\"order\").length > 0;\n    if (key === \"payment\") return paymentsVisible().length > 0;\n    return true;\n  }\n  const single = (c) => !c.dup;\n  const isOn = (c) => S.sel.has(c.id);\n  function nodupOn(area) { return couponsIn(area).find((c) => c.noDup && isOn(c)); }\n  function couponDisabled(c) { const nd = nodupOn(c.area); return !!(nd && nd.id !== c.id); } // POL-034\n  function reserveBlockedByCoupon() {\n    return [\"product\", \"order\"].some((a) => visible(a === \"product\" ? \"productCoupon\" : \"orderCoupon\") && couponsIn(a).some((c) => c.noReserve && isOn(c)));\n  }\n  function reserveOwned() { return S.zero ? 200000 : M.reserve.owned; }\n  function reserveUsable() { return S.member && !S.reserveBlocked && reserveOwned() > 0; } // POL-051\n\n  /* ---------- 기본 선택 (POL-033, POL-046, POL-056) ---------- */\n  function autoSelect() {\n    S.sel.clear();\n    const base = M.product.price * (1 - M.productDc.rate) * (S.member ? 1 - M.groupDc.rate : 1);\n    [\"product\", \"order\"].forEach((a) => {\n      if (!visible(a === \"product\" ? \"productCoupon\" : \"orderCoupon\")) return;\n      const best = couponsIn(a).filter(single).sort((x, y) => cAmt(y, base) - cAmt(x, base))[0];\n      if (best) S.sel.add(best.id);\n    });\n    S.reserveUser = true;\n    S.pay = null;\n    const r = calc();\n    const sorted = r.payList.slice().sort((x, y) => y.amt - x.amt);\n    S.payOrder = sorted.map((p) => p.id); // 정렬은 진입 시 차감액 기준으로 고정(POL-056)\n    if (sorted.length) S.pay = sorted[0].id;\n  }\n  function cAmt(c, base) { return c.rate ? Math.round(base * c.rate) : c.amount; }\n\n  /* ---------- 계산 (POL-009부터 POL-014까지, 영역별 POL) ---------- */\n  function calc() {\n    const P = M.product.price;\n    let cur = P;\n    const out = { lines: {}, payList: [] };\n    const take = (key, amt) => { const eff = Math.max(0, Math.min(amt, cur)); cur -= eff; return eff; };\n    if (visible(\"productDc\")) out.lines.productDc = take(\"productDc\", Math.round(P * M.productDc.rate));\n    if (visible(\"groupDc\")) out.lines.groupDc = take(\"groupDc\", Math.round(cur * M.groupDc.rate));\n    const base2 = cur;\n    out.coupon = {};\n    let pc = 0;\n    if (visible(\"productCoupon\")) couponsIn(\"product\").forEach((c) => { const a = cAmt(c, base2); out.coupon[c.id] = a; if (isOn(c)) pc += a; });\n    take(\"productCoupon\", pc);\n    const base3 = cur;\n    let oc = 0;\n    if (visible(\"orderCoupon\")) couponsIn(\"order\").forEach((c) => { const a = cAmt(c, base3); out.coupon[c.id] = a; if (isOn(c)) oc += a; });\n    take(\"orderCoupon\", oc);\n    if (visible(\"reserveSale\")) out.lines.reserveSale = take(\"reserveSale\", Math.round(base3 * M.reserveSale.rate)); // POL-039\n    if (visible(\"grade\")) out.lines.grade = take(\"grade\", Math.round(base3 * M.gradeDc.rate)); // POL-041\n    if (visible(\"app\")) out.lines.app = take(\"app\", M.appDc.amount); // POL-043\n    if (visible(\"reserve\")) {\n      const limit = S.zero ? reserveOwned() : floor100(base3 * M.reserve.limitRate);\n      const use = S.member ? floor100(Math.min(reserveOwned(), limit)) : 0; // POL-045\n      out.reserveUse = use;\n      out.reserveOn = reserveUsable() && !reserveBlockedByCoupon() && S.reserveUser;\n      if (out.reserveOn) take(\"reserve\", use);\n    }\n    if (visible(\"payment\")) {\n      const pbase = cur; // OPEN-002: 주문서 기준 금액(목업은 보유 적립금 차감 후 금액)\n      out.payList = paymentsVisible().map((p) => ({ id: p.id, name: p.name, amt: p.rate ? Math.round(pbase * p.rate) : Math.min(p.amount, pbase) }));\n      const sp = out.payList.find((p) => p.id === S.pay);\n      if (sp) take(\"payment\", sp.amt);\n    }\n    out.final = Math.max(0, cur); // POL-007\n    return out;\n  }\n\n  /* ---------- 렌더 ---------- */\n  const row = (o) => `<div class=\"mb-row ${o.cls || \"\"}\"${o.id ? ` data-row=\"${o.id}\"` : \"\"}>${o.cb}<div class=\"nm\">${o.nm}<\/div>${o.btn || \"\"}<div class=\"val\">${o.val}<\/div><\/div>`;\n  const cbAuto = '<span class=\"cb auto\" aria-hidden=\"true\"><\/span>';\n  function render() {\n    document.body.classList.toggle(\"is-mobile\", S.mobile);\n    const r = calc();\n    const P = M.product.price;\n    const dcPrice = P - Math.round(P * M.productDc.rate);\n    let h = `<div class=\"tags\">${M.product.tags.map((t) => `<span>${t}<\/span>`).join(\"\")}<\/div>\n      <h1 class=\"pname\">${M.product.name}<\/h1><div class=\"peng\">${M.product.eng}<\/div>`;\n    if (S.replaceText) {\n      h += `<div class=\"price-replace\" id=\"price-replace\">${M.product.replaceText}<\/div>`; // POL-003\n    } else {\n      h += `<div class=\"price-row\" id=\"price-row\"><b>${won(dcPrice)}<\/b><s>${won(P)}<\/s><span class=\"rate\">20%<\/span>\n        <span class=\"tools\"><button class=\"btn-dark\" data-act=\"noop\">쿠폰받기 ⤓<\/button><span>♡<\/span><span>⇪<\/span><\/span><\/div>`;\n      h += `<section class=\"mb\" id=\"mb\" aria-label=\"최대할인가\">\n        <div class=\"mb-sum\"><div class=\"amt\" id=\"mb-amt\">${won(r.final)}<small>최대할인가<\/small><\/div>\n        ${S.removeAll ? \"\" : `<button class=\"mb-toggle${S.open ? \" on\" : \"\"}\" id=\"mb-toggle\" data-act=\"toggle\" aria-expanded=\"${S.open}\">${S.open ? \"닫기\" : \"자세히보기\"}<i><\/i><\/button>`}<\/div>`;\n      if (S.open && !S.removeAll) {\n        h += `<div class=\"mb-detail\" id=\"mb-detail\">${AREAS.filter(([k]) => visible(k)).map(([k, t]) => `<div class=\"mb-area\" data-area=\"${k}\"><h4>${t}<\/h4>${areaBody(k, r)}<\/div>`).join(\"\")}`;\n        h += `<div class=\"mb-note\">최종 결제 금액에 따라 최대할인가는 달라질 수 있습니다.<\/div><\/div>`;\n      }\n      h += `<\/section>`;\n    }\n    h += `<div class=\"opt\"><div class=\"opt-line\"><span>적립금<\/span><span>800원 (1%)<\/span><\/div><div class=\"opt-line\"><span>배송비<\/span><span>3,000원 (50,000원 이상 무료)<\/span><\/div>\n      <select aria-label=\"옵션 선택\"><option>[필수] 색상 / 사이즈 선택<\/option><\/select>\n      <div class=\"buy\"><button data-act=\"noop\">장바구니<\/button><button class=\"primary\" data-act=\"noop\">바로 구매<\/button><\/div><\/div>`;\n    document.getElementById(\"info\").innerHTML = h;\n    renderDemo();\n  }\n\n  function areaBody(k, r) {\n    if (k === \"productDc\") {\n      return row({ cls: \"auto\", cb: cbAuto, nm: esc(M.productDc.name), val: minus(r.lines.productDc) }) +\n        row({ cls: \"auto\", id: \"bulk\", cb: cbAuto, nm: esc(M.bulkDc.name), val: `<button class=\"btn-more\" data-act=\"bulk\">더보기 ∨<\/button>` }); // POL-017\n    }\n    if (k === \"groupDc\") return row({ cls: \"auto\", cb: cbAuto, nm: esc(M.groupDc.name), val: minus(r.lines.groupDc) });\n    if (k === \"productCoupon\" || k === \"orderCoupon\") {\n      const area = k === \"productCoupon\" ? \"product\" : \"order\";\n      const list = couponsIn(area);\n      const singles = list.filter(single), dups = list.filter((c) => c.dup);\n      const one = (c) => {\n        const dis = couponDisabled(c);\n        const btn = S.member && S.owned[c.id] ? `<button class=\"btn-down done\" disabled>발급완료<\/button>` : `<button class=\"btn-down\" data-act=\"down\" data-id=\"${c.id}\">받기<\/button>`;\n        return row({ id: c.id, cls: dis ? \"mute\" : \"\", cb: `<button class=\"cb${isOn(c) ? \" on\" : \"\"}${dis ? \" dis\" : \"\"}\" data-act=\"coupon\" data-id=\"${c.id}\" aria-pressed=\"${isOn(c)}\" aria-label=\"${esc(c.name)}\"><\/button>`,\n          nm: `${esc(c.name)}${c.noDup ? '<span class=\"tag-nodup\">중복불가<\/span>' : \"\"}${c.cond ? `<small>(${esc(c.cond)})<\/small>` : \"\"}`, btn, val: minus(r.coupon[c.id]) });\n      };\n      return singles.map(one).join(\"\") + (singles.length && dups.length ? '<div class=\"mb-sep\"><\/div>' : \"\") + dups.map(one).join(\"\");\n    }\n    if (k === \"grade\") return row({ cls: \"auto\", cb: cbAuto, nm: esc(M.gradeDc.name), val: minus(r.lines.grade) });\n    if (k === \"app\") return row({ cls: \"auto\", cb: cbAuto, nm: esc(M.appDc.name), val: minus(r.lines.app) });\n    if (k === \"reserveSale\") return row({ cls: \"auto\", cb: cbAuto, nm: esc(M.reserveSale.name), val: minus(r.lines.reserveSale) });\n    if (k === \"reserve\") {\n      const blocked = reserveBlockedByCoupon();\n      const usable = reserveUsable() && !blocked;\n      const h = row({ id: \"reserve\", cls: usable ? \"\" : \"mute\", cb: `<button class=\"cb${r.reserveOn ? \" on\" : \"\"}${usable ? \"\" : \" dis\"}\" data-act=\"reserve\" aria-pressed=\"${!!r.reserveOn}\" aria-label=\"보유 적립금 사용\"><\/button>`,\n        nm: \"보유 적립금 사용\", val: usable ? minus(r.reserveUse) : won(r.reserveUse) });\n      return h + (S.member && blocked ? '<div class=\"mb-warn\" id=\"reserve-warn\">선택한 쿠폰은 적립금과 함께 사용할 수 없습니다.<\/div>' : \"\");\n    }\n    if (k === \"payment\") {\n      return r.payList.slice().sort((a, b) => (S.payOrder || []).indexOf(a.id) - (S.payOrder || []).indexOf(b.id)).map((p) => row({ id: p.id, cb: `<button class=\"cb${S.pay === p.id ? \" on\" : \"\"}\" data-act=\"pay\" data-id=\"${p.id}\" aria-pressed=\"${S.pay === p.id}\" aria-label=\"${esc(p.name)}\"><\/button>`, nm: esc(p.name), val: minus(p.amt) })).join(\"\"); // POL-056\n    }\n    return \"\";\n  }\n\n  /* ---------- 동작 ---------- */\n  function toast(msg) { const t = document.getElementById(\"toast\"); t.textContent = msg; t.classList.add(\"show\"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove(\"show\"), 1800); }\n  function dialog(title, body) {\n    const d = document.getElementById(\"dlg\");\n    d.innerHTML = `<div class=\"dlg\" role=\"dialog\" aria-modal=\"true\" aria-label=\"${esc(title)}\"><h5>${esc(title)}<\/h5>${body}<div class=\"acts\"><button data-act=\"close\">확인<\/button><\/div><\/div>`;\n    d.hidden = false;\n  }\n  function clickCoupon(id) {\n    const c = M.coupons.find((x) => x.id === id);\n    if (couponDisabled(c)) return;\n    if (isOn(c)) { S.sel.delete(id); render(); return; }\n    if (single(c)) couponsIn(c.area).filter(single).forEach((x) => S.sel.delete(x.id)); // 단일 쿠폰은 영역당 1개\n    if (c.noDup) couponsIn(c.area).forEach((x) => S.sel.delete(x.id)); // 중복 불가: 단독 선택\n    S.sel.add(id);\n    render(); // 보유 적립금 체크 상태(reserveUser)는 바꾸지 않음(POL-048)\n  }\n  function download(id) {\n    const c = M.coupons.find((x) => x.id === id);\n    if (!S.member) { dialog(\"알림\", \"<p>로그인 후 이용 가능합니다.<\/p><p style=\\\"color:#767676;font-size:12px\\\">확인을 누르면 로그인 화면으로 이동합니다(목업은 이동하지 않음).<\/p>\"); return; } // POL-035\n    if (c.appOnly && !S.app) { dialog(\"알림\", \"<p>해당 쿠폰은 (모바일 웹, 앱)에서 다운이 가능합니다.<\/p>\"); return; }\n    S.owned[id] = true; render(); toast(\"쿠폰이 발급되었습니다.\");\n  }\n  document.addEventListener(\"click\", (e) => {\n    const b = e.target.closest(\"[data-act]\");\n    if (!b) return;\n    const act = b.dataset.act, id = b.dataset.id;\n    if (act === \"toggle\") { S.open = !S.open; render(); }\n    else if (act === \"coupon\") clickCoupon(id);\n    else if (act === \"down\") download(id);\n    else if (act === \"reserve\") { if (!reserveUsable() || reserveBlockedByCoupon()) return; S.reserveUser = !S.reserveUser; render(); } // POL-047\n    else if (act === \"pay\") { S.pay = S.pay === id ? null : id; render(); } // POL-057\n    else if (act === \"bulk\") dialog(M.bulkDc.name, `<p>수량에 따라 할인되며 최대할인가에는 반영되지 않습니다.<\/p><ul>${M.bulkDc.tiers.map((t) => `<li>${t}<\/li>`).join(\"\")}<\/ul>`);\n    else if (act === \"close\") document.getElementById(\"dlg\").hidden = true;\n    else if (act === \"noop\") toast(\"목업에서는 동작하지 않습니다.\");\n  });\n\n  /* ---------- 시나리오 패널 ---------- */\n  function renderDemo() {\n    const d = document.getElementById(\"demo\");\n    const ck = (key, label, on) => `<label><input type=\"checkbox\" data-demo=\"${key}\"${on ? \" checked\" : \"\"}>${label}<\/label>`;\n    d.innerHTML = `<div class=\"demo-head\">목업 시나리오<button data-demo-fold>${d.classList.contains(\"closed\") ? \"펼치기\" : \"접기\"}<\/button><\/div><div class=\"demo-body\">\n      <h6>방문자<\/h6><label><input type=\"radio\" name=\"who\" data-demo=\"member\"${S.member ? \" checked\" : \"\"}>회원(일반회원)<\/label><label><input type=\"radio\" name=\"who\" data-demo=\"guest\"${S.member ? \"\" : \" checked\"}>비회원<\/label>\n      ${ck(\"app\", \"파워앱 접속\", S.app)}${ck(\"mobile\", \"모바일 화면\", S.mobile)}\n      <h6>개별디자인에서 영역 지우기<\/h6>${AREAS.map(([k, t]) => ck(\"rm-\" + k, t, S.removed[k])).join(\"\")}${ck(\"removeAll\", \"상세 내역 전체\", S.removeAll)}\n      <h6>설정·상태<\/h6>${ck(\"reserveBlocked\", \"적립금 사용 조건 미충족\", S.reserveBlocked)}${ck(\"couponFail\", \"쿠폰 조회 실패\", S.couponFail)}${ck(\"zero\", \"0원 사례(적립금 20만 원, 한도 없음)\", S.zero)}${ck(\"replaceText\", \"가격 대체 문구 상품\", S.replaceText)}\n      <button class=\"reset\" data-demo-reset>처음 상태로<\/button><\/div>`;\n  }\n  document.addEventListener(\"change\", (e) => {\n    const k = e.target.dataset && e.target.dataset.demo;\n    if (!k) return;\n    const v = e.target.checked;\n    if (k === \"member\") set({ member: true }); else if (k === \"guest\") set({ member: false });\n    else if (k.startsWith(\"rm-\")) { S.removed[k.slice(3)] = v; reinit(); }\n    else set({ [k]: v });\n  });\n  document.addEventListener(\"click\", (e) => {\n    if (e.target.closest(\"[data-demo-fold]\")) { document.getElementById(\"demo\").classList.toggle(\"closed\"); renderDemo(); }\n    if (e.target.closest(\"[data-demo-reset]\")) { S = fresh(); autoSelect(); render(); }\n  });\n  function set(o) { Object.assign(S, o); if (!(\"mobile\" in o)) reinit(); else render(); }\n  function reinit() { const keepOpen = S.open; autoSelect(); S.open = keepOpen; render(); } // 설정이 바뀌면 진입 시 기본 선택부터 다시 계산(POL-013)\n\n  /* ---------- 화면정의서 브리지 API ---------- */\n  window.MaxApp = {\n    reset() { S = fresh(); autoSelect(); render(); },\n    open(v = true) { S.open = v; render(); },\n    guest() { S.member = false; reinit(); },\n    app() { S.app = true; reinit(); },\n    mobile() { S.mobile = true; render(); },\n    remove(...keys) { keys.forEach((k) => (S.removed[k] = true)); reinit(); },\n    removeAll() { S.removeAll = true; reinit(); },\n    flag(k) { S[k] = true; reinit(); },\n    coupon(id) { clickCoupon(id); },\n    down(id) { download(id); },\n    reserve() { S.reserveUser = !S.reserveUser; render(); },\n    pay(id) { S.pay = S.pay === id ? null : id; render(); },\n    bulk() { document.querySelector('[data-act=\"bulk\"]').click(); },\n    state() { return S; },\n  };\n  S = fresh(); autoSelect(); render();\n})();\n\n<\/script>\n<\/body>\n<\/html>\n"</script>
<script type="application/json" id="screens">[{"id":"1-1","group":"1. 회원 화면","title":"기본 화면(상세 접힘)","scr":"WF-001","path":"쇼핑몰 > 상품 상세 > 최대할인가 섹션","wf":"WF-001 · INT-001","fr":"FR-001, FR-011","pol":"POL-001, POL-008, POL-013","steps":[],"marks":[["※","#price-row"],["1","#mb-amt"],["2","#mb-toggle"]],"desc":[["※","판매가 영역 (기존)",["상품 할인이 반영된 판매가·정가·할인율, 쿠폰받기 버튼은 바꾸지 않습니다."]],["1","최대할인가 (변경)",["진입 시 기본 선택(쿠폰·보유 적립금·결제수단)을 적용한 뒤 화면 체크 상태로 계산한 금액입니다(POL-013).","상세 내역이 접혀 있어도 내역에 있는 선택된 할인은 모두 반영합니다(POL-011).","결과가 0원 이하면 0원으로 표시합니다(POL-007)."]],["2","자세히보기 (기존)",["진입 시 상세 내역은 접혀 있고, 누르면 펼쳐지며 '닫기'로 바뀝니다(POL-008)."]]],"staticHtml":null},{"id":"1-2","group":"1. 회원 화면","title":"상세 내역 펼침","scr":"WF-002","path":"쇼핑몰 > 상품 상세 > 최대할인가 섹션","wf":"WF-002 · INT-002","fr":"FR-002부터 FR-011까지","pol":"POL-009, POL-014, POL-016, POL-020, POL-033, POL-040, POL-044, POL-046, POL-056","steps":[["api","open",[true]]],"marks":[["1",".mb-area[data-area=\"productDc\"]"],["2",".mb-area[data-area=\"groupDc\"]"],["3",".mb-area[data-area=\"productCoupon\"]"],["4",".mb-area[data-area=\"orderCoupon\"]"],["5",".mb-area[data-area=\"grade\"]"],["6",".mb-area[data-area=\"reserve\"]"],["7",".mb-area[data-area=\"reserveSale\"]"],["8",".mb-area[data-area=\"payment\"]"],["9",".mb-note"]],"desc":[["1","상품 할인 (기존)",["리바이 > 기간 > 신상품 중 최상위 1건을 자동 적용합니다. 고객이 해제할 수 없습니다(POL-016).","대량 구매 할인은 적용 상품이면 항상 보이고, 최대할인가에는 반영하지 않습니다(POL-017)."]],["2","상품 추가 할인 (기존)",["상품별 그룹할인. 해당 그룹 회원에게만 보이며 자동 적용합니다(POL-020)."]],["3","상품 쿠폰 할인 (변경)",["쿠폰 노출은 발급·노출·사용기간을 모두 보는 일반 기준입니다(POL-023부터 POL-026까지).","진입 시 차감액이 가장 큰 단일 쿠폰 1건을 자동 선택합니다. 중복 쿠폰은 자동 선택하지 않습니다(POL-033).","단일 쿠폰과 중복 쿠폰 사이를 점선으로 나눕니다."]],["4","장바구니 쿠폰 할인 (변경)",["상품 쿠폰까지 뺀 금액에 적용합니다(POL-037). 노출·선택 규칙은 상품 쿠폰과 같습니다."]],["5","회원 등급 할인 (기존)",["결제 조건에 따른 혜택 중 추가 할인. (상품 할인·상품 추가 할인·상품 쿠폰을 뺀 금액) × 할인율입니다(POL-041)."]],["6","적립금 사용 (변경)",["진입 시 선택된 상태이며, 고객이 해제할 수 있습니다(POL-046, POL-047).","사용 금액은 1회 최대 사용 한도 기준이며 100원 단위는 버립니다(POL-045)."]],["7","적립금 즉시 할인 (기존)",["지급 예정 적립금을 자동 <script>
'use strict';
const PROTO=JSON.parse(document.getElementById('proto').textContent);
const pages=JSON.parse(document.getElementById('screens').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cur=-1,scale=1,fit=true,frame=null,docH=900,token=0;
function nav(){const q=$('search').value.trim().toLowerCase();let g='',o='';for(const p of pages){if(!(p.id+' '+p.group+' '+p.title+' '+p.scr).toLowerCase().includes(q))continue;if(g!==p.group){g=p.group;o+='<div class="group-label">'+esc(g)+'</div>';}o+='<a href="#s-'+p.id+'"'+(pages[cur]===p?' aria-current="page"':'')+'><span class="id">'+p.id+'</span><span>'+esc(p.title)+'</span></a>';}$('nav').innerHTML=o||'<p style="padding:12px;color:#6b778c;font-size:12px">일치하는 화면이 없습니다.</p>';}
function apply(){const w=1440;if(fit)scale=Math.min(1,Math.max(.2,($('viewport').clientWidth-42)/w));const s=$('sheet');s.style.width=Math.round(w*scale)+'px';s.style.height=Math.round(docH*scale)+'px';const inner=$('holder').firstElementChild;if(inner){inner.style.transform='scale('+scale+')';inner.style.transformOrigin='0 0';}$('zoom').textContent=Math.round(scale*100)+'%';}
function paintDesc(p,missing){const info=[['화면/기능명',p.title],['화면 ID',p.scr],['경로',p.path],['WF · FR',p.wf+' · '+p.fr],['관련 정책',p.pol]];
$('desc').innerHTML='<table class="info">'+info.map(r=>'<tr><th>'+r[0]+'</th><td>'+esc(r[1])+'</td></tr>').join('')+'</table><h3>DESCRIPTION</h3>'+(p.desc||[]).map(d=>'<div class="item" data-n="'+esc(d[0])+'"><div class="t"><span class="n'+(d[0]==='※'?' c':'')+'">'+esc(d[0])+'</span>'+esc(d[1])+'</div><ul>'+d[2].map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul></div>').join('')+(missing&&missing.length?'<p class="missing">마커 위치를 찾지 못함: '+esc(missing.join(', '))+'</p>':'');
$('desc').querySelectorAll('.item').forEach(it=>it.addEventListener('click',()=>focusMark(it.dataset.n)));}
function focusMark(n){$('desc').querySelectorAll('.item').forEach(i=>i.classList.toggle('on',i.dataset.n===n));if(!frame||!frame.contentWindow.SpecBridge)return;frame.contentWindow.SpecBridge.focus(n);const b=frame.contentDocument.querySelector('.spec-box[data-n="'+CSS.escape(n)+'"]');if(b){const y=parseFloat(b.style.top)*scale;$('viewport').scrollTo({top:Math.max(0,y-80),behavior:'smooth'});}}
async function select(id){let i=pages.findIndex(p=>p.id===id);if(i<0)i=0;cur=i;const p=pages[i];const my=++token;
$('title').textContent=p.id+' · '+p.title;$('breadcrumb').textContent='원본 요청 상품 상세 최대할인가 / '+p.group+' / '+p.scr;$('count').textContent=(i+1)+' / '+pages.length;$('prev').disabled=i===0;$('next').disabled=i===pages.length-1;
document.title=p.id+' '+p.title+' · 최대할인가 화면 정의서';nav();paintDesc(p);$('viewport').scrollTo(0,0);
const route=(p.steps||[]).filter(s=>s[0]==='go').map(s=>s[1]).pop();$('open').hidden=!route;if(route)$('open').href='../10_Prototype/index.html'+route;
const holder=$('holder');holder.innerHTML='';frame=null;
if(p.staticHtml){holder.innerHTML='<div class="static">'+p.staticHtml+'</div>';$('loading').hidden=true;docH=holder.firstElementChild.scrollHeight+10;apply();return;}
