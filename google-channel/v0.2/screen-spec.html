")}<\/select><\/td>\n            <td><select class=\"select select--sm m-age\" aria-label=\"연령대\"><option value=\"\">-<\/option>${AGES.map((g) => `<option value=\"${g[0]}\">${g[1]}<\/option>`).join(\"\")}<\/select><\/td>\n          <\/tr>`\n          )\n          .join(\"\")}<\/tbody><\/table><\/div>`;\n    const m = UI.modal({ title: \"선택 상품 카테고리 매칭\", size: \"xl\", body, footer: '<button type=\"button\" class=\"btn btn--line btn--lg\" data-act=\"cancel\">취소<\/button><button type=\"button\" class=\"btn btn--dark btn--lg\" data-act=\"save\">상품 피드 반영<\/button>' });\n    m.el.querySelectorAll(\"tbody tr\").forEach((tr) => {\n      const r = rows[+tr.dataset.i];\n      const use = tr.querySelector(\".m-use\");\n      const gs = tr.querySelector(\".m-gender\");\n      const as = tr.querySelector(\".m-age\");\n      const dd = UI.dropdown(tr.querySelector(\".m-gpc\"), {\n        items,\n        value: r.cur.gpc,\n        placeholder: \"카테고리를 선택해주세요\",\n        minListWidth: 420,\n        onChange: (v) => {\n          r.cur.gpc = v;\n          if (Store.isApparel(v)) {\n            if (!r.cur.gender) r.cur.gender = \"unisex\";\n            if (!r.cur.age) r.cur.age = \"all ages\";\n          }\n          sync();\n        },\n      });\n      function sync() {\n        const on = r.cur.useFeed && !r.locked;\n        const ap = Store.isApparel(r.cur.gpc);\n        dd.setDisabled(!on);\n        gs.disabled = as.disabled = !(on && ap);\n        gs.value = ap ? r.cur.gender : \"\";\n        as.value = ap ? r.cur.age : \"\";\n      }\n      use.addEventListener(\"change\", () => { r.cur.useFeed = use.checked; sync(); });\n      gs.addEventListener(\"change\", () => (r.cur.gender = gs.value));\n      as.addEventListener(\"change\", () => (r.cur.age = as.value));\n      sync();\n    });\n    INFO.bind(m.el);\n    m.el.querySelector('[data-act=\"cancel\"]').addEventListener(\"click\", () => m.close(true));\n    m.el.querySelector('[data-act=\"save\"]').addEventListener(\"click\", async () => {\n      const editable = rows.filter((r) => !r.locked);\n      if (editable.some((r) => r.cur.useFeed && !r.cur.gpc)) return UI.alert(\"상품 피드를 사용하려면 페이스북 카테고리를 선택해 주세요.\");\n      const changed = editable.filter((r) => [\"useFeed\", \"gpc\", \"gender\", \"age\"].some((k) => r.cur[k] !== r.init[k]));\n      const res = Store.saveProductSettings(changed.map((r) => Object.assign({ id: r.p.id }, r.cur)));\n      await UI.alert(\"선택한 상품이 상품 피드에 반영되었습니다.\");\n      m.close(true);\n      view.sel.clear();\n      App.render();\n      if (changed.length) UI.toast(`반영 결과 — 반영대기(전송 큐 등록) ${res.queued}건${res.restricted ? ` · 노출제한 ${res.restricted}건` : \"\"}${res.unused ? ` · 사용안함 ${res.unused}건` : \"\"}`, \"info\");\n    });\n  }\n\n  return { render };\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   SCR 3-5 · 광고 관리 탭 (미연동 / 연동완료) + 3-5-2 항목 설정\n   - 성과 데이터: Mock 캠페인의 일 평균 지표 × 조회기간 내 운영일수(날짜별 변동 가중치)로 산출\n   ========================================================================== */\nconst AdsPage = (function () {\n  const SIZES = [20, 30, 50, 70, 100];\n  const PERIODS = [[\"today\", \"오늘\"], [\"yesterday\", \"어제\"], [\"7d\", \"7일\"], [\"30d\", \"1개월\"], [\"month\", \"이번 달\"], [\"custom\", \"직접설정\"]];\n  /* 항목 정의 (7-4-7) */\n  const COLS = {\n    campaign_name: { label: \"캠페인명\", desc: \"Meta 광고 관리자에 등록된 캠페인 이름\", fixed: true },\n    objective: { label: \"목표\", desc: \"캠페인 목표 유형\" },\n    impressions: { label: \"노출수\", desc: \"광고가 노출된 총 횟수\" },\n    clicks: { label: \"클릭수\", desc: \"광고 클릭 총 횟수\" },\n    purchases: { label: \"구매수\", desc: \"광고를 통해 발생한 구매 건수\" },\n    roas: { label: \"ROAS\", desc: \"광고비 1원 대비 발생 매출 비율\" },\n    revenue: { label: \"매출\", desc: \"광고로 발생한 총 매출액\" },\n    spend: { label: \"광고비용\", desc: \"해당 기간 총 광고 집행 비용\" },\n    start_time: { label: \"시작일시\", desc: \"광고 시작일\" },\n    stop_time: { label: \"종료일시\", desc: \"광고 종료일\" },\n    reach: { label: \"도달수\", desc: \"광고를 본 순 사용자 수\" },\n    frequency: { label: \"빈도\", desc: \"1인당 평균 광고 노출 횟수\" },\n    cpm: { label: \"CPM\", desc: \"1,000회 노출당 비용\" },\n    ctr: { label: \"CTR\", desc: \"클릭수 ÷ 노출수 X 100\" },\n    cpc: { label: \"CPC\", desc: \"클릭 1회당 평균 광고 비용\" },\n    add_to_cart: { label: \"장바구니 추가\", desc: \"광고 클릭 후 장바구니에 담긴 횟수\" },\n    initiate_checkout: { label: \"결제 시작\", desc: \"광고 클릭 후 결제를 시작한 횟수\" },\n    cvr: { label: \"전환율\", desc: \"구매수 ÷ 클릭수 X 100\" },\n    cpa: { label: \"CPA\", desc: \"구매 1건당 평균 광고 비용\" },\n  };\n  const ALL_KEYS = Object.keys(COLS);\n  const view = { period: \"yesterday\", from: null, to: null, q: \"\", page: 1, size: 20, draft: null };\n\n  /* ---------------- 날짜 유틸 ---------------- */\n  const DAY = 86400000;\n  const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };\n  const addDays = (d, n) => new Date(d.getTime() + n * DAY);\n  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, \"0\")}-${String(d.getDate()).padStart(2, \"0\")}`;\n  const parse = (s) => { const [y, m, d] = s.split(\"-\").map(Number); return new Date(y, m - 1, d); };\n  function range() {\n    const t = today0();\n    switch (view.period) {\n      case \"today\": return [t, t];\n      case \"yesterday\": return [addDays(t, -1), addDays(t, -1)];\n      case \"7d\": return [addDays(t, -7), addDays(t, -1)];\n      case \"30d\": return [addDays(t, -30), addDays(t, -1)];\n      case \"month\": return [new Date(t.getFullYear(), t.getMonth(), 1), t];\n      case \"custom\": return view.from && view.to ? [parse(view.from), parse(view.to)] : [addDays(t, -1), addDays(t, -1)];\n    }\n  }\n  /** 날짜별 변동 가중치 (결정적 의사난수) */\n  const w = (d, i) => 0.75 + ((Math.sin(d.getTime() / DAY * 1.7 + i * 3.1) + 1) / 2) * 0.5;\n\n  function aggregate(from, to) {\n    const t = today0();\n    return window.MOCK.campaigns\n      .map((c, i) => {\n        const s = addDays(t, c.s);\n        const e = c.e == null ? null : addDays(t, c.e);\n        const a = { name: c.name, objective: c.objective, start: s, stop: e, imp: 0, clk: 0, buy: 0, rev: 0, spend: 0, reach: 0, atc: 0, ic: 0, days: 0 };\n        for (let d = new Date(Math.max(from, s)); d <= to && (!e || d <= e); d = addDays(d, 1)) {\n          if (d > t) break;\n          const k = w(d, i) * (d.getTime() === t.getTime() ? 0.45 : 1); // 오늘은 집계 진행 중\n          a.imp += c.imp * k; a.clk += c.clk * k; a.buy += c.buy * k; a.rev += c.rev * k; a.spend += c.spend * k; a.atc += c.atc * k; a.ic += c.ic * k;\n          a.days++;\n        }\n        a.reach = a.days ? c.reach * Math.min(2.4, 1 + Math.log(a.days) * 0.35) : 0;\n        [\"imp\", \"clk\", \"buy\", \"rev\", \"spend\", \"reach\", \"atc\", \"ic\"].forEach((x) => (a[x] = Math.round(a[x])));\n        return a;\n      })\n      .filter((a) => a.days > 0);\n  }\n  function total(list) {\n    return list.reduce((s, a) => { [\"imp\", \"clk\", \"buy\", \"rev\", \"spend\"].forEach((k) => (s[k] += a[k])); return s; }, { imp: 0, clk: 0, buy: 0, rev: 0, spend: 0 });\n  }\n  const div = (a, b) => (b ? a / b : null);\n  const roasTxt = (r) => (r == null ? \"-\" : r.toFixed(1) + \"x\");\n  const roasCls = (r) => (r == null ? \"\" : r >= 3 ? \"up\" : \"down\");\n\n  function value(k, a) {\n    switch (k) {\n      case \"campaign_name\": return `<span class=\"camp-name\">${UI.esc(a.name)}<\/span>`;\n      case \"objective\": return a.objective;\n      case \"impressions\": return UI.fmt(a.imp);\n      case \"clicks\": return UI.fmt(a.clk);\n      case \"purchases\": return UI.fmt(a.buy);\n      case \"roas\": { const r = div(a.rev, a.spend); return `<span class=\"${roasCls(r)}\">${roasTxt(r)}<\/span>`; }\n      case \"revenue\": return UI.fmt(a.rev);\n      case \"spend\": return UI.fmt(a.spend);\n      case \"start_time\": return ymd(a.start) + \" 00:00\";\n      case \"stop_time\": return a.stop ? ymd(a.stop) + \" 23:59\" : \"-\";\n      case \"reach\": return UI.fmt(a.reach);\n      case \"frequency\": return a.reach ? (a.imp / a.reach).toFixed(2) : \"-\";\n      case \"cpm\": return a.imp ? UI.fmt((a.spend / a.imp) * 1000) : \"-\";\n      case \"ctr\": return a.imp ? ((a.clk / a.imp) * 100).toFixed(2) + \"%\" : \"-\";\n      case \"cpc\": return a.clk ? UI.fmt(a.spend / a.clk) : \"-\";\n      case \"add_to_cart\": return UI.fmt(a.atc);\n      case \"initiate_checkout\": return UI.fmt(a.ic);\n      case \"cvr\": return a.clk ? ((a.buy / a.clk) * 100).toFixed(2) + \"%\" : \"-\";\n      case \"cpa\": return a.buy ? UI.fmt(a.spend / a.buy) : \"-\";\n    }\n  }\n\n  /* ---------------- 렌더 ---------------- */\n  function render(root) {\n    const s = Store.s;\n    if (!s.connected) {\n      root.appendChild(\n        App.emptyState({\n          title: \"비즈니스 자산 연동 후 광고 데이터를 확인할 수 있습니다.\",\n          desc: \"페이스북 채널 연동이 완료되면 광고 계정이 연결되고<br>캠페인 성과 데이터를 메이크샵에서 조회할 수 있습니다.\",\n          btn: \"비즈니스 자산 설정하기\",\n          note: \"연결 관리 탭에서 비즈니스 자산 설정하기 버튼을 클릭해 광고 계정, 픽셀 등을 연동하면 광고 관리 기능이 활성화됩니다.\",\n          onClick: App.gotoConnectAndStart,\n        })\n      );\n      return;\n    }\n    root.appendChild(\n      App.banner(\n        \"광고 관리\",\n        \"Meta 광고 운영 상태와 주요 정보를 확인하는 공간입니다. 연결된 광고 계정 정보부터 광고 상태, 주요 성과 정보를 확인할 수 있으며, Meta 광고 관리자와 연계하여 광고 운영을 이어갈 수 있습니다.<br>단순 계정 연결 상태가 아닌 실제 광고 운영 현황 중심으로 정보를 제공합니다.\"\n      )\n    );\n    root.appendChild(accountSection());\n    const camp = App.section(\"캠페인 목록\", `<select class=\"select select--sm\" id=\"ad-size\" aria-label=\"페이지당 노출 개수\">${SIZES.map((n) => `<option value=\"${n}\" ${n === view.size ? \"selected\" : \"\"}>${n}개씩 보기<\/option>`).join(\"\")}<\/select><button type=\"button\" class=\"btn btn--line btn--sm\" id=\"ad-cols\">${UI.icon.gear} 항목<\/button>`, '<div id=\"camp\"><\/div>');\n    root.appendChild(camp);\n    camp.querySelector(\"#ad-size\").addEventListener(\"change\", (e) => { view.size = +e.target.value; view.page = 1; paintCampaign(camp.querySelector(\"#camp\")); });\n    camp.querySelector(\"#ad-cols\").addEventListener(\"click\", () => openColumns(() => paintCampaign(camp.querySelector(\"#camp\"))));\n    paintCampaign(camp.querySelector(\"#camp\"));\n    root.appendChild(conversionSection());\n  }\n\n  /* ---------------- 2. 광고 계정 정보 ---------------- */\n  function accountSection() {\n    const s = Store.s;\n    const ad = window.MOCK.adAccount;\n    const a = window.MOCK.account;\n    const act = ad.id.replace(/^act_/, \"\");\n    const stCls = { 활성: \"pill--blue\", 비활성: \"pill--gray\", 차단: \"pill--red\", 미결제: \"pill--line\", 펜딩: \"pill--dark-line\" }[s.ads.status];\n    const body = `<dl class=\"kv\">\n      <div class=\"kv__row\"><dt>광고 계정명<\/dt><dd>${UI.esc(ad.name)} (${ad.id})<\/dd><dd class=\"kv__link\"><a class=\"ext\" data-ext=\"결제 수단 관리\" data-url=\"https://adsmanager.facebook.com/adsmanager/manage/billing_payments?act=${act}&business_id=${a.businessId}\">결제 수단 관리 ${UI.icon.ext}<\/a><\/dd><\/div>\n      <div class=\"kv__row\"><dt>계정 상태 ${UI.qmark(\"adStatus\")}<\/dt><dd><span class=\"pill ${stCls}\">${s.ads.status}<\/span><\/dd><dd class=\"kv__link\"><a class=\"ext\" data-ext=\"계정 상태 확인\" data-url=\"https://adsmanager.facebook.com/adsmanager/manage/accounts?act=${act}&business_id=${a.businessId}\">계정 상태 확인 ${UI.icon.ext}<\/a><\/dd><\/div>\n      <div class=\"kv__row\"><dt>이번 달 광고 지출<\/dt><dd>${UI.fmt(ad.monthSpend)}<\/dd><\/div>\n      <div class=\"kv__row\"><dt>잔여 크레딧 ${UI.qmark(\"credit\")}<\/dt><dd>${s.ads.billing === \"선불\" ? UI.fmt(ad.prepaidCredit) : \"0(후불)\"}<\/dd><\/div>\n    <\/dl>`;\n    const el = App.section(\"광고 계정 정보\", \"\", body);\n    ConnectPage.bindExt(el);\n    return el;\n  }\n\n  /* ---------------- 3~4. 캠페인 성과 요약 + 목록 ---------------- */\n  function paintCampaign(box) {\n    const [from, to] = range();\n    const t = today0();\n    const q = view.q.trim().toLowerCase();\n    const match = (a) => !q || a.name.toLowerCase().includes(q);\n    const list = aggregate(from, to).filter(match).sort((x, y) => y.spend - x.spend);\n    const span = Math.round((to - from) / DAY) + 1;\n    const prev = aggregate(addDays(from, -span), addDays(from, -1)).filter(match);\n    const cur = total(list);\n    const pv = total(prev);\n    const pct = (a, b) => (b ? ((a - b) / b) * 100 : null);\n    const ctr = div(cur.clk * 100, cur.imp);\n    const pctr = div(pv.clk * 100, pv.imp);\n    const card = (label, val, diff, extra) => `\n      <div class=\"kpi\"><div class=\"kpi__label\">${label}<\/div><div class=\"kpi__val\">${val}<\/div>\n      <div class=\"kpi__sub\">${diff == null ? '<span class=\"muted\">비교 데이터 없음<\/span>' : `<span class=\"${diff >= 0 ? \"up\" : \"down\"}\">${diff >= 0 ? \"↑\" : \"↓\"} ${Math.abs(diff).toFixed(1)}%<\/span> <span class=\"muted\">직전 동일 기간 대비<\/span>`}<\/div>${extra || \"\"}<\/div>`;\n    const roas = div(cur.rev, cur.spend);\n    const cols = Store.s.columns;\n    const pages = Math.max(1, Math.ceil(list.length / view.size));\n    if (view.page > pages) view.page = pages;\n    const rows = list.slice((view.page - 1) * view.size, view.page * view.size);\n    box.innerHTML = `\n      <div class=\"period-bar\">\n        <div class=\"seg\" role=\"group\" aria-label=\"조회기간\">${PERIODS.map((p) => `<button type=\"button\" class=\"${view.period === p[0] ? \"is-active\" : \"\"}\" data-p=\"${p[0]}\">${p[1]}<\/button>`).join(\"\")}<\/div>\n        <div class=\"dates\"><input type=\"date\" id=\"d-from\" value=\"${ymd(from)}\" max=\"${ymd(t)}\" ${view.period === \"custom\" ? \"\" : \"disabled\"} aria-label=\"시작일\"/><span>~<\/span><input type=\"date\" id=\"d-to\" value=\"${view.period === \"custom\" && !view.to ? \"\" : ymd(to)}\" min=\"${ymd(from)}\" max=\"${ymd(t)}\" ${view.period === \"custom\" ? \"\" : \"disabled\"} aria-label=\"종료일\"/><\/div>\n        <form class=\"search search--sm\" id=\"camp-search\"><button type=\"submit\" aria-label=\"검색\">${UI.icon.search}<\/button><input type=\"search\" placeholder=\"캠페인명으로 검색\" value=\"${UI.esc(view.q)}\" aria-label=\"캠페인명 검색\"/><\/form>\n      <\/div>\n      <div class=\"kpis\">\n        ${card(\"노출수\", UI.fmt(cur.imp), pct(cur.imp, pv.imp))}\n        ${card(\"클릭수\", UI.fmt(cur.clk), pct(cur.clk, pv.clk))}\n        ${card(\"CTR\", ctr == null ? \"-\" : ctr.toFixed(2) + \"%\", ctr != null && pctr ? pct(ctr, pctr) : null)}\n        ${card(\"전환(구매)\", UI.fmt(cur.buy), pct(cur.buy, pv.buy))}\n        ${card(\"광고지출\", UI.fmt(cur.spend), pct(cur.spend, pv.spend), `<div class=\"kpi__roas\">ROAS <b class=\"${roasCls(roas)}\">${roasTxt(roas)}<\/b><\/div>`)}\n      <\/div>\n      <p class=\"note note--right\">${UI.icon.info}<span>성과 데이터는 Meta Marketing API 기준이며 반영까지 최대 1일 이상 소요될 수 있습니다.<\/span><a class=\"ext\" data-ext=\"광고 관리자 바로가기\" data-url=\"https://adsmanager.facebook.com/adsmanager/manage/campaigns?act=${window.MOCK.adAccount.id.replace(/^act_/, \"\")}&business_id=${window.MOCK.account.businessId}\">광고 관리자 바로가기 ${UI.icon.ext}<\/a><\/p>\n      <div class=\"table-wrap\"><table class=\"table table--camp\">\n        <thead><tr>${cols.map((k) => `<th class=\"${k === \"campaign_name\" ? \"th-left\" : \"\"}\">${COLS[k].label}<\/th>`).join(\"\")}<\/tr><\/thead>\n        <tbody>${rows.length ? rows.map((a) => `<tr>${cols.map((k) => `<td class=\"${k === \"campaign_name\" ? \"td-left\" : \"\"}\">${value(k, a)}<\/td>`).join(\"\")}<\/tr>`).join(\"\") : `<tr><td colspan=\"${cols.length}\" class=\"table__empty\">표시할 캠페인이 없습니다.<\/td><\/tr>`}<\/tbody>\n      <\/table><\/div>\n      <div class=\"list-foot\"><div class=\"list-foot__left muted small\">조회기간 ${ymd(from)} ~ ${ymd(to)} · 총 ${list.length}개 캠페인 · 광고 비용 높은 순<\/div><div id=\"camp-pager\"><\/div><div><\/div><\/div>`;\n    box.querySelector(\"#camp-pager\").appendChild(UI.pagination(list.length, view.page, view.size, (p) => { view.page = p; paintCampaign(box); }));\n    box.querySelectorAll(\"[data-p]\").forEach((b) =>\n      b.addEventListener(\"click\", () => {\n        view.period = b.dataset.p;\n        if (view.period === \"custom\") { const [f, tt] = range(); view.from = view.from || ymd(f); view.to = view.to || ymd(tt); }\n        view.page = 1;\n        paintCampaign(box);\n      })\n    );\n    const fromEl = box.querySelector(\"#d-from\");\n    const toEl = box.querySelector(\"#d-to\");\n    fromEl.addEventListener(\"change\", () => {\n      if (!fromEl.value) return;\n      if (fromEl.value > ymd(t)) { fromEl.value = view.from; return UI.alert(\"미래 날짜는 조회기간으로 선택할 수 없습니다.\"); }\n      view.from = fromEl.value;\n      if (view.to && view.to < view.from) { view.to = null; UI.toast(\"시작일이 종료일보다 이후로 변경되어 종료일이 초기화되었습니다. 종료일을 다시 선택해 주세요.\", \"warn\"); }\n      if (view.from && view.to) { view.page = 1; paintCampaign(box); } else { toEl.value = \"\"; toEl.min = view.from; }\n    });\n    toEl.addEventListener(\"change\", () => {\n      if (!toEl.value) return;\n      if (toEl.value < view.from) { toEl.value = view.to || \"\"; return UI.alert(\"종료일은 시작일 이전 날짜로 선택할 수 없습니다.\"); }\n      if (toEl.value > ymd(t)) { toEl.value = view.to || \"\"; return UI.alert(\"미래 날짜는 조회기간으로 선택할 수 없습니다.\"); }\n      view.to = toEl.value;\n      view.page = 1;\n      paintCampaign(box);\n    });\n    box.querySelector(\"#camp-search\").addEventListener(\"submit\", (e) => { e.preventDefault(); view.q = e.target.querySelector(\"input\").value; view.page = 1; paintCampaign(box); });\n    box.querySelector(\"#camp-search input\").addEventListener(\"search\", (e) => { if (!e.target.value) { view.q = \"\"; view.page = 1; paintCampaign(box); } });\n    ConnectPage.bindExt(box);\n  }\n\n  /* ---------------- 3-5-2 항목 설정 ---------------- */\n  function openColumns(onSaved) {\n    const st = { sel: Store.s.columns.slice(), pickL: null, pickR: null, qL: \"\", qR: \"\" };\n    const body = `<div class=\"dual\">\n      <div class=\"dual__box\"><div class=\"dual__title\">선택 가능한 타이틀 목록<\/div><label class=\"dual__search\">${UI.icon.search}<input type=\"text\" placeholder=\"검색어를 입력해 주세요.\" data-q=\"L\"/><\/label><ul class=\"dual__list\" data-list=\"L\"><\/ul><\/div>\n      <div class=\"dual__mid\"><button type=\"button\" class=\"btn btn--dark btn--icon\" data-mv=\"add\" aria-label=\"추가\">»<\/button><button type=\"button\" class=\"btn btn--dark btn--icon\" data-mv=\"del\" aria-label=\"제외\">«<\/button><\/div>\n      <div class=\"dual__box\"><div class=\"dual__title\">선택한 타이틀 목록<\/div><label class=\"dual__search\">${UI.icon.search}<input type=\"text\" placeholder=\"검색어를 입력해 주세요.\" data-q=\"R\"/><\/label><ul class=\"dual__list\" data-list=\"R\"><\/ul><\/div>\n      <div class=\"dual__order\"><button type=\"button\" class=\"btn btn--gray btn--icon\" data-o=\"top\" aria-label=\"최상단 이동\">⇈<\/button><button type=\"button\" class=\"btn btn--gray btn--icon\" data-o=\"up\" aria-label=\"위로 이동\">↑<\/button><button type=\"button\" class=\"btn btn--gray btn--icon\" data-o=\"down\" aria-label=\"아래로 이동\">↓<\/button><button type=\"button\" class=\"btn btn--gray btn--icon\" data-o=\"bottom\" aria-label=\"최하단 이동\">⇊<\/button><\/div>\n    <\/div>`;\n    const m = UI.modal({ title: \"목록 타이틀 양식 관리\", size: \"lg\", cls: \"modal--cols\", body, footer: '<button type=\"button\" class=\"btn btn--line btn--lg\" data-act=\"reset\">초기화<\/button><button type=\"button\" class=\"btn btn--dark btn--lg\" data-act=\"save\">저장<\/button>' });\n    const L = m.el.querySelector('[data-list=\"L\"]');\n    const R = m.el.querySelector('[data-list=\"R\"]');\n    function li(k, side) {\n      const c = COLS[k];\n      const picked = side === \"L\" ? st.pickL === k : st.pickR === k;\n      return `<li data-k=\"${k}\" class=\"${picked ? \"is-picked\" : \"\"} ${c.fixed ? \"is-fixed\" : \"\"}\"><span>${c.fixed ? \"*\" : \"\"}${c.label}<\/span><em>${c.desc}<\/em><\/li>`;\n    }\n    function paint() {\n      const avail = ALL_KEYS.filter((k) => !st.sel.includes(k) && (!st.qL || COLS[k].label.includes(st.qL)));\n      const chosen = st.sel.filter((k) => !st.qR || COLS[k].label.includes(st.qR));\n      L.innerHTML = avail.length ? avail.map((k) => li(k, \"L\")).join(\"\") : '<li class=\"dual__empty\">항목이 없습니다.<\/li>';\n      R.innerHTML = chosen.map((k) => li(k, \"R\")).join(\"\") || '<li class=\"dual__empty\">항목이 없습니다.<\/li>';\n      L.querySelectorAll(\"[data-k]\").forEach((x) => x.addEventListener(\"click\", () => { st.pickL = x.dataset.k; paint(); }));\n      L.querySelectorAll(\"[data-k]\").forEach((x) => x.addEventListener(\"dblclick\", () => { st.pickL = x.dataset.k; move(\"add\"); }));\n      R.querySelectorAll(\"[data-k]\").forEach((x) => x.addEventListener(\"click\", () => { st.pickR = x.dataset.k; paint(); }));\n      R.querySelectorAll(\"[data-k]\").forEach((x) => x.addEventListener(\"dblclick\", () => { st.pickR = x.dataset.k; move(\"del\"); }));\n      const i = st.sel.indexOf(st.pickR);\n      const movable = st.pickR && !COLS[st.pickR].fixed;\n      m.el.querySelector('[data-o=\"top\"]').disabled = m.el.querySelector('[data-o=\"up\"]').disabled = !movable || i <= 1;\n      m.el.querySelector('[data-o=\"down\"]').disabled = m.el.querySelector('[data-o=\"bottom\"]').disabled = !movable || i === st.sel.length - 1;\n      m.el.querySelector('[data-mv=\"add\"]').disabled = !st.pickL;\n      m.el.querySelector('[data-mv=\"del\"]').disabled = !st.pickR || COLS[st.pickR].fixed;\n    }\n    function move(dir) {\n      if (dir === \"add\" && st.pickL) { st.sel.push(st.pickL); st.pickR = st.pickL; st.pickL = null; }\n      if (dir === \"del\" && st.pickR) {\n        if (COLS[st.pickR].fixed) return UI.alert(\"캠페인명은 필수 항목으로 제외할 수 없습니다.\");\n        st.sel = st.sel.filter((k) => k !== st.pickR); st.pickL = st.pickR; st.pickR = null;\n      }\n      paint();\n    }\n    m.el.querySelectorAll(\"[data-mv]\").forEach((b) => b.addEventListener(\"click\", () => move(b.dataset.mv)));\n    m.el.querySelectorAll(\"[data-o]\").forEach((b) =>\n      b.addEventListener(\"click\", () => {\n        const i = st.sel.indexOf(st.pickR);\n        const arr = st.sel.filter((k) => k !== st.pickR);\n        const pos = { top: 1, up: Math.max(1, i - 1), down: Math.min(arr.length, i + 1), bottom: arr.length }[b.dataset.o];\n        arr.splice(pos, 0, st.pickR);\n        st.sel = arr;\n        paint();\n      })\n    );\n    m.el.querySelectorAll(\"[data-q]\").forEach((x) => x.addEventListener(\"input\", () => { st[\"q\" + x.dataset.q] = x.value.trim(); paint(); }));\n    m.el.querySelector('[data-act=\"reset\"]').addEventListener(\"click\", () => { st.sel = Store.DEFAULT_COLUMNS.slice(); st.pickL = st.pickR = null; paint(); UI.toast(\"기본 항목 구성으로 초기화되었습니다. [저장]을 눌러야 적용됩니다.\", \"info\"); });\n    m.el.querySelector('[data-act=\"save\"]').addEventListener(\"click\", () => {\n      Store.s.columns = st.sel.slice();\n      Store.save();\n      m.close(true);\n      onSaved();\n      UI.toast(\"캠페인 목록 항목 설정이 저장되었습니다.\", \"success\");\n    });\n    paint();\n  }\n\n  /* ---------------- 5. 전환 추적 설정 ---------------- */\n  function conversionSection() {\n    const s = Store.s;\n    const draft = { capi: s.ads.capi, naver: s.ads.naver, kakao: s.ads.kakao };\n    const row = (k, label, info, enabled, hint) => `\n      <div class=\"conv-row\"><div class=\"conv-row__label\">${label} ${UI.qmark(info)}<\/div>\n      <div class=\"seg seg--wide ${enabled ? \"\" : \"is-disabled\"}\" data-k=\"${k}\"><button type=\"button\" data-v=\"on\" ${enabled ? \"\" : \"disabled\"}>사용<\/button><button type=\"button\" data-v=\"off\" ${enabled ? \"\" : \"disabled\"}>사용안함<\/button><\/div>\n      ${hint ? `<span class=\"row-hint\">${hint}<\/span>` : \"\"}<\/div>`;\n    const body = `\n      ${row(\"capi\", \"Meta 전환 API(CAPI) 연동\", \"capi\", true, \"\")}\n      ${row(\"naver\", \"네이버페이 구매 전환\", \"naver\", s.prereq.naver, s.prereq.naver ? \"\" : \"네이버 연동 설정에서 주문형 네이버페이 사용 및 공통 인증키 입력 후 사용할 수 있습니다.\")}\n      ${row(\"kakao\", \"카카오톡 체크아웃 구매 전환\", \"kakao\", s.prereq.kakao, s.prereq.kakao ? \"\" : \"카카오 연동 설정에서 톡 체크아웃 연동 후 사용할 수 있습니다.\")}\n      <p class=\"note\" id=\"capi-note\" hidden>${UI.icon.info}<span>Meta 전환 API(CAPI) 연동이 '사용안함'이면 네이버페이·카카오톡 체크아웃 구매 전환을 '사용'으로 설정해도 외부 결제 Purchase 이벤트는 전송되지 않습니다.<\/span><\/p>\n      <div class=\"conv-foot\"><button type=\"button\" class=\"btn btn--primary btn--lg\" data-act=\"save\">확인<\/button><\/div>`;\n    const el = App.section(\"전환 추적 설정\", \"\", body);\n    function paint() {\n      el.querySelectorAll(\".seg[data-k]\").forEach((g) => g.querySelectorAll(\"button\").forEach((b) => b.classList.toggle(\"is-active\", draft[g.dataset.k] === b.dataset.v)));\n      el.querySelector(\"#capi-note\").hidden = !(draft.capi === \"off\" && (draft.naver === \"on\" || draft.kakao === \"on\"));\n    }\n    el.querySelectorAll(\".seg[data-k] button\").forEach((b) => b.addEventListener(\"click\", () => { draft[b.parentElement.dataset.k] = b.dataset.v; paint(); }));\n    el.querySelector('[data-act=\"save\"]').addEventListener(\"click\", async () => {\n      Object.assign(s.ads, draft);\n      Store.save();\n      await UI.alert(\"전환 추적 설정이 저장되었습니다.\");\n    });\n    paint();\n    return el;\n  }\n\n  return { render, COLS };\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   SCR 3-6 · Shops 관리 탭 (미연동 / 연동완료)\n   - 메이크샵은 Shop·판매 채널을 생성·수정·삭제하지 않으며, 연결 정보 조회와 Meta 관리 화면 이동만 제공\n   - 커머스 계정은 연동하지 않는다(2026-10-19 결정). 바로가기는 연결된 카탈로그·비즈니스 ID 기준\n   ========================================================================== */\nconst ShopsPage = (function () {\n  function render(root) {\n    const s = Store.s;\n    const a = window.MOCK.account;\n    if (!s.connected) {\n      root.appendChild(\n        App.emptyState({\n          title: \"비즈니스 자산 연동 후 Shop을 관리할 수 있습니다.\",\n          desc: \"Meta 비즈니스 연동이 완료되면 카탈로그가 연결되고,<br>Facebook·Instagram Shops 설정 화면으로 바로 이동할 수 있습니다.\",\n          btn: \"비즈니스 자산 설정하기\",\n          note: \"연결 관리 탭에서 비즈니스 자산 설정하기 버튼을 클릭해 Instagram 계정과 카탈로그를 연결하면 Shops 관리 기능이 활성화됩니다.\",\n          onClick: App.gotoConnectAndStart,\n        })\n      );\n      return;\n    }\n    root.appendChild(\n      App.banner(\n        \"Shops 관리\",\n        \"Meta Shops를 이용하면 메이크샵 상품을 Facebook과 Instagram에서 고객에게 노출할 수 있습니다.<br>상품 정보는 연결된 Meta 제품 카탈로그를 통해 제공되며, Shop 생성 및 판매 채널 설정은 Meta Commerce Manager에서 진행할 수 있습니다.\"\n      )\n    );\n    const cmUrl = `https://business.facebook.com/commerce_manager/?business_id=${a.businessId}`;\n    const igOn = s.ig;\n    const igCard = `\n      <div class=\"shop-card\">\n        <div class=\"shop-card__head\"><h4>Instagram Shop<\/h4><button type=\"button\" class=\"btn btn--line btn--sm\" data-ext=\"Instagram Shop 설정 (Commerce Manager)\" data-url=\"${cmUrl}\">${UI.icon.gear} 설정<\/button><\/div>\n        <p class=\"muted\">Instagram 프로필과 상품을 연결하여 고객이 게시물과 Shop에서 상품을 발견할 수 있도록 설정합니다.<\/p>\n        <div class=\"shop-card__acct\"><span class=\"shop-ic\">${UI.icon.ig}<\/span><span>${igOn ? \"@\" + UI.esc(a.instagramUsername) : \"연결된 계정이 없습니다.\"}<\/span><span class=\"pill ${igOn ? \"pill--blue\" : \"pill--gray\"}\">${igOn ? \"연결중\" : \"미연결\"}<\/span><\/div>\n      <\/div>`;\n    const info = App.section(\n      \"Shops 정보\",\n      `<button type=\"button\" class=\"btn btn--line btn--sm\" data-ext=\"커머스 관리자 바로가기\" data-url=\"https://business.facebook.com/commerce/catalogs/${a.catalogId}/products?business_id=${a.businessId}\">커머스 관리자 바로가기<\/button>`,\n      igCard\n    );\n    ConnectPage.bindExt(info);\n    root.appendChild(info);\n  }\n  return { render };\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   광고 성과 집계 (Mock) — 일 평균 지표 × 조회기간 운영일수(날짜별 변동 가중치)\n   - Meta 광고 관리 탭과 같은 산식이라 통합 현황의 최근 7일 값이 채널 광고 화면 값과 같다 (POL-019)\n   ========================================================================== */\nconst Perf = (function () {\n  const DAY = 86400000;\n  const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };\n  const addDays = (d, n) => new Date(d.getTime() + n * DAY);\n  const w = (d, i) => 0.75 + ((Math.sin((d.getTime() / DAY) * 1.7 + i * 3.1) + 1) / 2) * 0.5;\n  const md = (d) => `${String(d.getMonth() + 1).padStart(2, \"0\")}.${String(d.getDate()).padStart(2, \"0\")}`;\n\n  /** Meta 캠페인: spend·rev / Google 캠페인: cost·value 를 같은 키(spend, rev)로 돌려준다 */\n  function rows(channel, from, to, filter) {\n    const t = today0();\n    const src = channel === \"meta\" ? window.MOCK.campaigns : window.GMOCK.campaigns;\n    return src\n      .map((c, i) => {\n        if (filter && !filter(c)) return null;\n        const s = addDays(t, c.s);\n        const e = c.e == null ? null : addDays(t, c.e);\n        const a = { c, name: c.name, type: c.type || c.objective, imp: 0, clk: 0, conv: 0, rev: 0, spend: 0, days: 0 };\n        for (let d = new Date(Math.max(from, s)); d <= to && (!e || d <= e); d = addDays(d, 1)) {\n          if (d > t) break;\n          const k = w(d, i) * (d.getTime() === t.getTime() ? 0.45 : 1);\n          a.imp += c.imp * k;\n          a.clk += c.clk * k;\n          a.conv += (c.buy != null ? c.buy : c.conv) * k;\n          a.rev += (c.rev != null ? c.rev : c.value) * k;\n          a.spend += (c.spend != null ? c.spend : c.cost) * k;\n          a.days++;\n        }\n        [\"imp\", \"clk\", \"conv\", \"rev\", \"spend\"].forEach((x) => (a[x] = Math.round(a[x])));\n        return a;\n      })\n      .filter((a) => a && a.days > 0);\n  }\n  function sum(list) {\n    return list.reduce((s, a) => { [\"imp\", \"clk\", \"conv\", \"rev\", \"spend\"].forEach((k) => (s[k] += a[k])); return s; }, { imp: 0, clk: 0, conv: 0, rev: 0, spend: 0 });\n  }\n  /** 어제까지 최근 7일 (POL-019) */\n  function last7() {\n    const t = today0();\n    return [addDays(t, -7), addDays(t, -1)];\n  }\n  function last7Label() {\n    const [f, e] = last7();\n    return `${md(f)}–${md(e)}`;\n  }\n  function last7Total(channel) {\n    const [f, e] = last7();\n    return sum(rows(channel, f, e));\n  }\n  return { rows, sum, last7, last7Label, last7Total, today0, addDays };\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   Google 탭 공통 — 표시 헬퍼, Google 계정 연동, 카테고리 매칭 모달(SCR-GOOGLE-FEED-002)\n   - 디자인은 Meta 채널 화면 기준(카드·섹션·표·버튼·팝업·상태 배지)을 그대로 쓴다 (POL-032)\n   ========================================================================== */\nconst GCommon = (function () {\n  const G = () => window.GMOCK;\n  const PALETTE = [\"#d9c3a5\", \"#9fb4c7\", \"#c7a0a0\", \"#a3b18a\", \"#b8a1c9\", \"#e0b77c\", \"#8fa3a8\", \"#c9b79c\"];\n  const GENDERS = [[\"male\", \"남성\"], [\"female\", \"여성\"], [\"unisex\", \"남녀공용\"]];\n  const AGES = [[\"adult\", \"청소년·성인\"], [\"kids\", \"아동\"], [\"toddler\", \"유아\"], [\"infant\", \"영아\"], [\"newborn\", \"신생아\"]];\n\n  function thumb(p, sm) {\n    if (p.r && p.r.noImage) return `<span class=\"thumb thumb--none\">No<br>Image<\/span>`;\n    const c = PALETTE[p.id % PALETTE.length];\n    const ch = UI.esc(p.name.replace(/^\\[[^\\]]*\\]\\s*/, \"\").charAt(0));\n    return `<span class=\"thumb\" style=\"background:linear-gradient(135deg, ${c}, #fff)\">${ch}<\/span>`;\n  }\n  const catPath = (p) => (p.cat ? UI.esc(Store.catPath(p.cat)) : '<span class=\"muted\">분류 미지정<\/span>');\n  function gpcLabel(id) {\n    const g = GStore.validGpc(id) ? Store.gpc(id) : null;\n    return g ? g.path : null;\n  }\n  function gpcCell(p) {\n    const l = gpcLabel(Store.effGpc(p));\n    return l ? `<span class=\"ellipsis\" title=\"${UI.esc(l)}\">${UI.esc(l)}<\/span>` : \"-\";\n  }\n  const stTag = (st) => `<span class=\"st st--${st}\">${st}<\/span>`;\n  const skuCount = (p) => Math.max(1, p.options); // 연동 상품 수 = 조합 옵션(SKU) 수\n  function priceText(p) {\n    if (p.r && p.r.priceText) return '<span class=\"muted\">가격문의<\/span>';\n    return UI.fmt(p.price) + \"원\";\n  }\n  function reason(p) {\n    const st = GStore.status(p);\n    if (st === \"노출제한\") {\n      const r = G().restrictReasons[GStore.restriction(p)];\n      return { title: r.label, guide: r.guide };\n    }\n    if (st === \"미승인\") {\n      const i = G().issueGroups[GStore.gp(p).issue] || G().issueGroups.other;\n      return { title: i.group, guide: i.description, detail: i.detail };\n    }\n    return null;\n  }\n  function statusBar(c, lastUpdate, hideTotal) {\n    const total = GStore.STATES.reduce((s, st) => s + (c[st] || 0), 0);\n    const segs = GStore.STATES.map((st) => (total && c[st] ? `<span class=\"sb sb--${st}\" style=\"width:${(c[st] / total) * 100}%\" title=\"${st} ${c[st]}개\"><\/span>` : \"\")).join(\"\");\n    return `\n      ${hideTotal ? \"\" : `<div class=\"sbar__top\"><b>상품개수 : ${UI.fmt(total)}개<\/b><span class=\"muted\">최근 업데이트 ${lastUpdate || \"-\"}<\/span><\/div>`}\n      <div class=\"sbar\">${segs}<\/div>\n      <ul class=\"legend\">${GStore.STATES.map((st) => `<li><i class=\"dot dot--${st}\"><\/i>${st}(${c[st] || 0})<\/li>`).join(\"\")}<\/ul>`;\n  }\n  const pill = (txt, kind) => `<span class=\"pill pill--${kind || \"blue\"}\">${txt}<\/span>`;\n  function bindExt(el) {\n    el.querySelectorAll(\"[data-ext]\").forEach((x) => x.addEventListener(\"click\", () => UI.openExternal(x.dataset.ext, x.dataset.url)));\n  }\n  const gLogoBig = () => UI.icon.google.replace('width=\"44\" height=\"44\"', 'width=\"80\" height=\"80\"');\n\n  /* ---------------- Google 계정 연동 (개인정보 동의 → Google 로그인·권한 동의) ---------------- */\n  function startAccount(onDone) {\n    const body = `\n      <div class=\"consent\">\n        <p class=\"consent__intro\">Google 채널 이용을 위해 아래와 같이 정보가 Google에 제공되며, 메이크샵이 연동 관리를 위해 일부 정보를 수집합니다.<\/p>\n        <div class=\"consent-box is-open\"><div class=\"consent-box__head\"><span>개인정보 및 쇼핑몰 정보 제3자 제공 동의(필수)<\/span><\/div>\n          <div class=\"consent-box__text\">제공받는 자: Google LLC<br>제공 목적: Merchant Center 상품 피드 등록, Google Ads 광고 성과 조회 및 전환 측정<br>제공 항목: 쇼핑몰 도메인, 상품 정보, 사업장 주소, 대표 전화번호(Merchant Center 연동 시)<br>국외 이전: 미국(Google LLC), 연동 시 정보통신망을 통해 수시 전송<\/div><\/div>\n        <div class=\"consent-box\"><div class=\"consent-box__head\"><span>개인정보 수집·이용 동의 (메이크샵)<\/span><\/div>\n          <div class=\"consent-box__text\">수집 항목: Google 계정 이메일, 인증 정보, Merchant Center 계정 ID, Google Ads 고객 ID<br>보유 기간: 연결 해제 시까지<\/div><\/div>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"g-agree1\" /><span><em>(필수)<\/em>위 제3자 제공 및 국외 이전에 동의합니다.<\/span><\/label>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"g-agree2\" /><span><em>(필수)<\/em>위 개인정보 수집 및 이용에 동의합니다.<\/span><\/label>\n      <\/div>`;\n    const m = UI.modal({ title: \"Google 채널 개인정보 수집 및 이용 동의\", size: \"md\", body, footer: '<button class=\"btn btn--dark btn--lg\" data-act=\"ok\" type=\"button\">확인<\/button>' });\n    m.el.querySelector('[data-act=\"ok\"]').addEventListener(\"click\", async () => {\n      if (!(m.el.querySelector(\"#g-agree1\").checked && m.el.querySelector(\"#g-agree2\").checked)) return UI.alert(\"필수 동의 항목에 모두 동의해 주세요.\");\n      m.close(true);\n      googleLogin(onDone);\n    });\n  }\n  function googleLogin(onDone) {\n    const a = G().account;\n    const body = `\n      <div class=\"glogin\">\n        <div class=\"glogin__logo\">${UI.icon.google}<\/div>\n        <h3>계정 선택<\/h3><p class=\"muted\">makeshop.co.kr(으)로 이동<\/p>\n        <button type=\"button\" class=\"glogin__acct\" data-act=\"pick\"><span class=\"glogin__av\">${a.name.charAt(0)}<\/span><span><b>${UI.esc(a.name)}<\/b><br><span class=\"muted\">${UI.esc(a.email)}<\/span><\/span><\/button>\n        <div class=\"glogin__scopes is-hidden\">\n          <h4>메이크샵에서 다음 권한을 요청합니다<\/h4>\n          <label class=\"chk\"><input type=\"checkbox\" checked /> Merchant Center 상품 데이터 관리<\/label>\n          <label class=\"chk\"><input type=\"checkbox\" checked /> Google Ads 계정 데이터 조회<\/label>\n          <label class=\"chk\"><input type=\"checkbox\" checked /> 사이트 소유권 확인(Search Console)<\/label>\n        <\/div>\n      <\/div>`;\n    const m = UI.modal({\n      title: \"Google 로그인 (시뮬레이션)\",\n      size: \"sm\",\n      body,\n      footer: '<button class=\"btn btn--line btn--lg\" data-act=\"cancel\" type=\"button\">취소<\/button><button class=\"btn btn--primary btn--lg\" data-act=\"allow\" type=\"button\" disabled>허용<\/button>',\n      onClose: () => { UI.toast(\"Google 계정 연동이 완료되지 않았습니다. 연동 정보는 저장되지 않습니다.\", \"warn\"); return true; },\n    });\n    m.el.querySelector('[data-act=\"pick\"]').addEventListener(\"click\", () => {\n      m.el.querySelector(\".glogin__scopes\").classList.remove(\"is-hidden\");\n      m.el.querySelector('[data-act=\"allow\"]').disabled = false;\n    });\n    m.el.querySelector('[data-act=\"cancel\"]').addEventListener(\"click\", () => m.close());\n    m.el.querySelector('[data-act=\"allow\"]').addEventListener(\"click\", () => {\n      GStore.connectAccount();\n      m.close(true);\n      UI.toast(\"Google 계정이 연결되었습니다. Merchant Center와 Google Ads를 각각 연결할 수 있습니다.\", \"success\");\n      onDone && onDone();\n    });\n  }\n\n  /* ---------------- 카테고리 매칭 모달 (SCR-GOOGLE-FEED-002) ---------------- */\n  function openCategoryMatch(auto) {\n    const s = GStore.s;\n    if (auto) { s.autoMatchShown = true; GStore.save(); }\n    const items = window.MOCK.gpcList.map((g) => ({ value: g.id, label: g.path }));\n    const cats = Store.leafCategories();\n    const SIZE = 8;\n    // 모달 안 입력값 (페이지를 이동해도 유지, [상품 피드 반영] 전에는 저장하지 않음)\n    const draft = {};\n    cats.forEach((c) => {\n      const cur = Store.s.catMap[c.id] || \"\";\n      draft[c.id] = { use: s.catUse[c.id] !== false, gpc: GStore.validGpc(cur) ? cur : \"\" };\n    });\n    let page = 1;\n    const body = `\n      <div class=\"infobox\">${UI.icon.info}<div>\n        · 메이크샵 카테고리를 Google 상품 카테고리(GPC)에 연결합니다. 매칭한 카테고리의 상품만 Google로 전송합니다.<br>\n        · Google 상품 카테고리는 Meta와 공통으로 사용합니다. Meta에서 설정한 카테고리는 선택되어 있고, 여기서 바꾸면 Meta에도 같이 적용됩니다.<br>\n        · 카테고리를 선택하지 않은 상품은 노출제한(카테고리 미매칭)으로 표시되며 전송하지 않습니다.<br>\n        · 사용여부를 끄면 해당 카테고리 상품은 사용안함으로 처리합니다.<\/div><\/div>\n      <div class=\"mtable-wrap\"><table class=\"mtable\">\n        <thead><tr><th style=\"width:90px\">사용여부<\/th><th>쇼핑몰 카테고리<\/th><th style=\"width:110px\">연동 상품 수<\/th><th style=\"width:380px\">Google 카테고리<\/th><\/tr><\/thead>\n        <tbody id=\"gcm-body\"><\/tbody><\/table><\/div>\n      <div id=\"gcm-pager\" class=\"gcm-pager\"><\/div>`;\n    const unmatched = () => cats.some((c) => draft[c.id].use && !draft[c.id].gpc);\n    const m = UI.modal({\n      title: \"Google 상품 카테고리 매칭\",\n      size: \"lg\",\n      body,\n      footer: '<button type=\"button\" class=\"btn btn--line btn--lg\" data-act=\"later\">다음에 반영<\/button><button type=\"button\" class=\"btn btn--dark btn--lg\" data-act=\"save\">상품 피드 반영<\/button>',\n      onClose: async () => {\n        if (unmatched() && !(await UI.confirm(\"카테고리를 매칭하지 않은 상품은 피드에서 제외되어 Google에 노출되지 않습니다.\\n다음에 반영하시겠습니까?\"))) return false;\n        // 최초 매칭을 닫으면 이미 공통 GPC가 있는 카테고리 상품은 전송 대상 (POL-064)\n        if (!GStore.s.firstMatchDone) { GStore.saveCategoryMatch([]); setTimeout(() => App.render(), 0); }\n        return true;\n      },\n    });\n    function paint() {\n      const rows = cats.slice((page - 1) * SIZE, page * SIZE);\n      const tb = m.el.querySelector(\"#gcm-body\");\n      tb.innerHTML = rows\n        .map((c) => {\n          const n = GStore.products().filter((p) => p.cat === c.id).length;\n          return `<tr data-cat=\"${c.id}\"><td><label class=\"switch\"><input type=\"checkbox\" class=\"gcm-use\" ${draft[c.id].use ? \"checked\" : \"\"} aria-label=\"사용여부\"/><i><\/i><\/label><\/td><td class=\"td-left\">${UI.esc(c.path.join(\" > \"))}<\/td><td>${n}<\/td><td><div class=\"gpc-dd\"><\/div><\/td><\/tr>`;\n        })\n        .join(\"\");\n      tb.querySelectorAll(\"tr\").forEach((tr) => {\n        const id = tr.dataset.cat;\n        const dd = UI.dropdown(tr.querySelector(\".gpc-dd\"), { items, value: draft[id].gpc, placeholder: \"카테고리를 선택해주세요\", minListWidth: 420, disabled: !draft[id].use, onChange: (v) => (draft[id].gpc = v) });\n        tr.querySelector(\".gcm-use\").addEventListener(\"change\", (e) => { draft[id].use = e.target.checked; dd.setDisabled(!e.target.checked); });\n      });\n      const pg = m.el.querySelector(\"#gcm-pager\");\n      pg.innerHTML = \"\";\n      pg.appendChild(UI.pagination(cats.length, page, SIZE, (p) => { page = p; paint(); }));\n    }\n    paint();\n    m.el.querySelector('[data-act=\"later\"]').addEventListener(\"click\", () => m.close());\n    m.el.querySelector('[data-act=\"save\"]').addEventListener(\"click\", async () => {\n      GStore.saveCategoryMatch(cats.map((c) => ({ cat: c.id, use: draft[c.id].use, gpc: draft[c.id].gpc || null })));\n      await UI.alert(\"선택한 카테고리가 상품 피드에 반영되었습니다.\");\n      m.close(true);\n      App.render();\n    });\n  }\n\n  return { GENDERS, AGES, thumb, catPath, gpcLabel, gpcCell, stTag, skuCount, priceText, reason, statusBar, pill, bindExt, gLogoBig, startAccount, openCategoryMatch };\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   SCR-GOOGLE-CONN-001 · Google 연결관리\n   - Google 계정 연결 후 Merchant Center·Google Ads를 각각 따로 연결한다 (POL-035)\n   - 연결 상태는 화면 진입마다 Google API로 다시 확인한다(결정 주체 Google, POL-036)\n   - 연결 절차 세부 화면은 v0.1 화면설계서 4-2부터 4-18을 따르며, 여기서는 단계만 시뮬레이션한다\n   ========================================================================== */\nconst GConnect = (function () {\n  const G = () => window.GMOCK;\n  const C = () => GCommon;\n\n  function render(root, params) {\n    const s = GStore.s;\n    if (s.account === \"none\") {\n      root.appendChild(\n        App.emptyState({\n          logo: C().gLogoBig(),\n          title: \"Google 계정 하나로<br>Merchant Center와 Google Ads를 연결하세요.\",\n          desc: \"Google 계정을 연결한 뒤 Merchant Center(상품 피드)와 Google Ads(광고 성과)를 필요한 것부터 각각 연결할 수 있습니다.\",\n          btn: \"Google 계정으로 시작하기\",\n          btnIcon: '<span class=\"g-ic\">G<\/span>',\n          note: \"Merchant Center만 연결해도 상품 피드를, Google Ads만 연결해도 광고 성과를 이용할 수 있습니다.\",\n          onClick: () => C().startAccount(() => App.render()),\n        })\n      );\n      if (params && params.open === \"account\") setTimeout(() => C().startAccount(() => App.render()), 150);\n      return;\n    }\n    root.appendChild(App.banner(\"연결관리\", \"Google 계정을 연결하고 Merchant Center와 Google Ads를 각각 연결하는 공간입니다.<br>Google 계정 연결 후 두 서비스는 따로 연결할 수 있으며, 연결 상태와 계정 정보를 확인할 수 있습니다.\"));\n    root.appendChild(accountSection());\n    root.appendChild(mcSection());\n    if (s.mc !== \"none\") root.appendChild(feedSection());\n    root.appendChild(adsSection());\n    if (params && params.open === \"ads\" && s.ads === \"none\") setTimeout(openAdsWizard, 150);\n    if (params && params.focus === \"mc\") setTimeout(() => { const el = root.querySelector(\"#g-mc\"); el && el.scrollIntoView({ behavior: \"smooth\", block: \"start\" }); el && el.classList.add(\"is-flash\"); }, 50);\n  }\n\n  /* ---------------- 1. Google 계정 ---------------- */\n  function accountSection() {\n    const s = GStore.s;\n    const re = s.account === \"reauth\";\n    const body = `<dl class=\"kv\"><div class=\"kv__row\"><dt>Google 계정<\/dt><dd><span class=\"g-av\">${G().account.name.charAt(0)}<\/span>${UI.esc(G().account.email)} ${re ? C().pill(\"재인증 필요\", \"red\") : C().pill(\"연결됨\")}<\/dd><dd class=\"kv__link\">${re ? '<button type=\"button\" class=\"btn btn--primary btn--sm\" data-act=\"relogin\">다시 연결하기<\/button>' : \"\"}<\/dd><\/div>\n      ${re ? `<div class=\"kv__row\"><dt><\/dt><dd class=\"kv__wide\"><p class=\"note note--warn\">${UI.icon.info}<span>Google 계정 인증이 만료되어 Merchant Center·Google Ads 모두 재인증이 필요합니다. 상품 피드 전송이 멈춰 있습니다.<\/span><\/p><\/dd><\/div>` : \"\"}<\/dl>`;\n    const el = App.section(\"Google 계정\", '<button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"unlink-all\">전체 연결 해제<\/button>', body);\n    el.querySelector('[data-act=\"unlink-all\"]').addEventListener(\"click\", async () => {\n      if (!(await UI.confirm(\"Google 계정 연결을 해제하면 Merchant Center와 Google Ads 연결도 함께 해제되고 상품 피드 자동 전송이 중단됩니다.\\n전체 연결을 해제하시겠습니까?\"))) return;\n      GStore.disconnectAll();\n      App.render();\n      UI.toast(\"Google 전체 연결이 해제되었습니다.\", \"success\");\n    });\n    const rl = el.querySelector('[data-act=\"relogin\"]');\n    if (rl) rl.addEventListener(\"click\", () => C().startAccount(() => { GStore.s.account = \"connected\"; if (GStore.s.mc === \"reauth\") GStore.s.mc = \"connected\"; if (GStore.s.ads === \"reauth\") GStore.s.ads = \"connected\"; GStore.save(); GStore.scheduleQueue(); App.render(); }));\n    return el;\n  }\n\n  /* ---------------- 2. Merchant Center ---------------- */\n  function mcSection() {\n    const s = GStore.s;\n    const st = GStore.mcState();\n    let body;\n    let actions = \"\";\n    if (st === \"none\") {\n      body = `<p class=\"sec__lead\">연결된 Merchant Center 계정과 도메인 인증, 판매국가·배송 설정 상태입니다.<br>Merchant Center를 연결하면 메이크샵 상품을 Google에 무료 리스팅·쇼핑 광고로 노출할 수 있습니다.<\/p>\n        <button type=\"button\" class=\"btn btn--primary btn--lg\" data-act=\"mc-connect\">Merchant Center 연동하기<\/button>`;\n    } else {\n      const a = s.mcAccount || G().merchantCandidates[0];\n      const statePill = st === \"reauth\" ? C().pill(\"재인증 필요\", \"red\") : C().pill(\"연결됨\");\n      const domain = { none: [C().pill(\"인증 필요\", \"gray\"), '<button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"domain\">인증하기<\/button>'], verifying: [C().pill(\"인증 중\", \"line\"), \"\"], done: [C().pill(\"인증 완료\", \"solid-blue\"), \"\"], fail: [C().pill(\"인증 실패\", \"red\"), '<button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"domain\">다시 시도<\/button>'] }[s.domain];\n      body = `<dl class=\"kv\">\n        <div class=\"kv__row\"><dt>Merchant Center 계정 ID<\/dt><dd>${a.id} ${statePill}${s.mcSuspended ? \" \" + C().pill(\"계정 정지됨\", \"red\") : \"\"}<\/dd><dd class=\"kv__link\"><a class=\"ext\" data-ext=\"Merchant Center 바로가기\" data-url=\"https://merchants.google.com/mc/overview?a=${a.id}\">Merchant Center 바로가기 ${UI.icon.ext}<\/a><\/dd><\/div>\n        ${s.mcSuspended ? `<div class=\"kv__row\"><dt><\/dt><dd class=\"kv__wide\"><p class=\"note note--warn\">${UI.icon.info}<span>Google이 Merchant Center 계정을 정지했습니다. 연결은 유지되며, 정지 해제는 Merchant Center에서 진행해 주세요.<\/span><\/p><\/dd><\/div>` : \"\"}\n        ${st === \"reauth\" ? `<div class=\"kv__row\"><dt><\/dt><dd class=\"kv__wide\"><p class=\"note note--warn\">${UI.icon.info}<span>Merchant Center 접근 권한을 확인할 수 없습니다. 다시 연결해 주세요. Google Ads는 영향이 없습니다.<\/span><\/p><\/dd><\/div>` : \"\"}\n        <div class=\"kv__row\"><dt>비즈니스 이름<\/dt><dd>${UI.esc(a.name)}<\/dd><\/div>\n        <div class=\"kv__row\"><dt>비즈니스 국가<\/dt><dd>대한민국<\/dd><\/div>\n        <div class=\"kv__row\"><dt>연결 완료 일시<\/dt><dd>2026-07-28 14:32<\/dd><\/div>\n        <div class=\"kv__row\"><dt>쇼핑몰 도메인 인증<\/dt><dd>${domain[0]} <span class=\"muted\">${G().merchant.domain}${s.domain === \"done\" ? \" · 2026-07-28 15:10\" : \"\"}<\/span><\/dd><dd class=\"kv__link\">${domain[1]}<\/dd><\/div>\n        <div class=\"kv__row\"><dt>판매국가·배송 설정<\/dt><dd>${s.shipping ? C().pill(\"설정 완료\", \"solid-blue\") + ' <span class=\"muted\">판매 국가 대한민국 · 쇼핑몰 배송 설정 자동 가져오기<\/span>' : C().pill(\"설정 필요\", \"gray\")}<\/dd><dd class=\"kv__link\"><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"ship\">${s.shipping ? \"변경하기\" : \"설정하기\"}<\/button><\/dd><\/div>\n      <\/dl>`;\n      actions = '<button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"mc-change\">계정 변경<\/button><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"mc-unlink\">연결 해제<\/button>';\n    }\n    const el = App.section(\"Merchant Center\", actions, body);\n    el.id = \"g-mc\";\n    C().bindExt(el);\n    const on = (k, fn) => { const b = el.querySelector(`[data-act=\"${k}\"]`); if (b) b.addEventListener(\"click\", fn); };\n    on(\"mc-connect\", () => openMcWizard(false));\n    on(\"mc-change\", async () => {\n      if (!(await UI.confirm(\"Merchant Center 계정을 바꾸면 Google 상품 피드 정보를 초기화하고 전송 대상 상품을 다시 전송합니다.\\n계정을 변경하시겠습니까?\"))) return;\n      openMcWizard(true);\n    });\n    on(\"mc-unlink\", async () => {\n      if (!(await UI.confirm(\"Merchant Center 연결을 해제하면 상품 피드 자동 전송이 중단되고 쇼핑 광고 기능을 사용할 수 없습니다. Goog 장되었습니다.\", \"success\");\n      afterSetup();\n    });\n  }\n  /** Merchant Center 연결 마법사: 준비사항 → 계정 선택 → 사업자 정보 제공 동의 → 전화번호 인증 → 약관 동의 */\n  function openMcWizard(isChange) {\n    const steps = isChange ? [\"계정 선택\"] : [\"준비사항 확인\", \"계정 선택\", \"사업자 정보 제공 동의\", \"대표 전화번호 인증\", \"판매자 약관 동의\"];\n    let i = 0;\n    let picked = G().merchantCandidates[0];\n    const phone = { verified: false, googleDone: false }; // 전화번호 인증은 Google 화면에서 직접 진행 (POL-043)\n    const m = UI.modal({ title: isChange ? \"Merchant Center 계정 변경\" : \"Merchant Center 연결\", size: \"md\", body: '<div id=\"mcw\"><\/div>', footer: '<button type=\"button\" class=\"btn btn--line btn--lg\" data-act=\"prev\">이전<\/button><button type=\"button\" class=\"btn btn--dark btn--lg\" data-act=\"next\">다음<\/button>' });\n    const box = m.el.querySelector(\"#mcw\");\n    const next = m.el.querySelector('[data-act=\"next\"]');\n    function paint() {\n      const name = steps[i];\n      const stepper = `<ol class=\"wstep\">${steps.map((x, k) => `<li class=\"${k === i ? \"is-on\" : k < i ? \"is-done\" : \"\"}\">${k + 1}. ${x}<\/li>`).join(\"\")}<\/ol>`;\n      let h = \"\";\n      if (name === \"준비사항 확인\") h = `<p class=\"sec__lead\">Merchant Center 연결 전에 아래 4가지가 준비되어야 합니다.<\/p><ul class=\"checklist\">${[\"커넥트 정보(사업자 정보) 등록\", \"SSL 보안 인증서 적용\", \"쇼핑몰 이용약관·환불 정책 등록\", \"결제 수단 등록\"].map((x) => `<li><span class=\"ok\">✓<\/span>${x}<span class=\"muted\">완료<\/span><\/li>`).join(\"\")}<\/ul>`;\n      if (name === \"계정 선택\") h = `<p class=\"sec__lead\">연결할 Merchant Center 계정을 선택하세요.<\/p>${G().merchantCandidates.map((c, k) => `<label class=\"radio-card\"><input type=\"radio\" name=\"mc\" value=\"${k}\" ${c.id === picked.id ? \"checked\" : \"\"}/><span><b>${UI.esc(c.name)}<\/b><br><span class=\"muted\">${c.id}<\/span><\/span><\/label>`).join(\"\")}<label class=\"radio-card\"><input type=\"radio\" name=\"mc\" value=\"new\"/><span><b>새 Merchant Center 계정 만들기<\/b><\/span><\/label>`;\n      if (name === \"사업자 정보 제공 동의\") h = // [인증 확인]을 누를 때만 phoneVerificationState 조회 — VERIFIED 인증 완료 / UNVERIFIED 미인증\n        const st = box.querySelector(\"#ph-st\");\n        st.innerHTML = '<span class=\"spin\"><\/span>';\n        ck.disabled = true;\n        setTimeout(() => {\n          phone.verified = phone.googleDone;\n          st.innerHTML = phone.verified ? C().pill(\"인증 완료\", \"solid-blue\") : C().pill(\"미인증\", \"gray\");\n          box.querySelector(\"#ph-msg\").textContent = phone.verified ? \"Google에서 대표 전화번호 인증이 확인되었습니다.\" : \"아직 인증되지 않았습니다. [Google에서 인증하기]로 인증을 마친 뒤 다시 확인해 주세요.\";\n          ck.disabled = false;\n        }, 700);\n      });\n    }\n    m.el.querySelector('[data-act=\"prev\"]').addEventListener(\"click\", () => { if (i > 0) { i--; paint(); } });\n    next.addEventListener(\"click\", async () => {\n      const name = steps[i];\n      if (name === \"사업자 정보 제공 동의\" && !box.querySelector(\"#mc-agree\").checked) return UI.alert(\"사업자 정보 제공에 동의해 주세요.\");\n      if (name === \"대표 전화번호 인증\" && !phone.verified) return UI.alert(\"대표 전화번호 인증을 완료한 뒤 [인증 확인]을 눌러 주세요.\");\n      if (name === \"판매자 약관 동의\" && !box.querySelector(\"#mc-tos\").checked) return UI.alert(\"판매자 서비스 약관에 동의해 주세요.\");\n      if (i < steps.length - 1) { i++; paint(); return; }\n      m.close(true);\n      if (isChange) {\n        GStore.changeMc(picked);\n        UI.toast(\"Merchant Center 계정이 변경되었습니다. 전송 대상 상품을 반영대기로 다시 등록했습니다.\", \"success\");\n        App.render();\n      } else {\n        GStore.connectMc(picked);\n        UI.toast(\"Merchant Center가 연결되었습니다. 도메인 인증과 판매국가·배송 설정을 진행해 주세요.\", \"success\");\n        App.nav(\"#/google/connect?focus=mc\");\n      }\n    });\n    paint();\n  }\n\n  /* ---------------- 3. 상품 피드 요약 (Meta 연결관리와 같은 구성) ---------------- */\n  function feedSection() {\n    const s = GStore.s;\n    const list = GStore.products();\n    const done = Store.leafCategories().every((c) => s.catUse[c.id] === false || GStore.validGpc(Store.s.catMap[c.id]));\n    const c = GStore.counts(list);\n    const sent = s.firstMatchDone;\n    const body = `<dl class=\"kv\">\n        <div class=\"kv__row\"><dt>카테고리 설정<\/dt><dd>${done ? C().pill(\"설정완료\", \"solid-blue\") : C().pill(\"미설정\", \"gray\")} <button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"match\">상품 카테고리 매칭<\/button><\/dd><\/div>\n        <div class=\"kv__row kv__row--top\"><dt>Merchant Center 연동 상품<\/dt><dd class=\"kv__wide\">${C().statusBar(c, sent ? s.lastAuto : null)}<\/dd><\/div>\n      <\/dl>`;\n    const el = App.section(\"상품 피드\", \"\", body);\n    el.querySelector('[data-act=\"match\"]').addEventListener(\"click\", () => C().openCategoryMatch(false));\n    return el;\n  }\n\n  /* ---------------- 4. Google Ads ---------------- */\n  function adsSection() {\n    const s = GStore.s;\n    const st = GStore.adsState();\n    let body;\n    let actions = \"\";\n    if (st === \"none\") {\n      body = `<p class=\"sec__lead\">Google Ads를 연결하면 광고 측정 상태와 캠페인·상품 광고 성과를 확인할 수 있습니다. Merchant Center가 없어도 연결할 수 있습니다.<\/p><button type=\"button\" class=\"btn btn--primary btn--lg\" data-act=\"ads-connect\">Google Ads 연결하기<\/button>`;\n    } else {\n      const a = s.adsAccount || G().adsAccounts[0];\n      body = `<dl class=\"kv\">\n        <div class=\"kv__row\"><dt>광고 계정<\/dt><dd>${UI.esc(a.name)} (${a.id}) ${st === \"reauth\" ? C().pill(\"재인증 필요\", \"red\") : C().pill(\"연결됨\")}<\/dd><dd class=\"kv__link\"><a class=\"ext\" data-ext=\"Google Ads 바로가기\" data-url=\"https://ads.google.com/aw/overview?ocid=${a.id.replace(/-/g, \"\")}\">Google Ads 바로가기 ${UI.icon.ext}<\/a><\/dd><\/div>\n        ${st === \"reauth\" ? `<div class=\"kv__row\"><dt><\/dt><dd class=\"kv__wide\"><p class=\"note note--warn\">${UI.icon.info}<span>Google Ads 접근 권한을 확인할 수 없습니다. 다시 연결해 주세요. 상품 피드 전송은 계속됩니다.<\/span><\/p><\/dd><\/div>` : \"\"}\n        <div class=\"kv__row\"><dt>Merchant Center 연결<\/dt><dd>${s.mc !== \"none\" ? C().pill(\"연결됨\") : C().pill(\"미연결\", \"gray\") + ' <span class=\"muted\">쇼핑 광고 성과는 Merchant Center 연결 후 확인할 수 있습니다.<\/span>'}<\/dd><\/div>\n      <\/dl>`;\n      actions = '<button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"ads-change\">계정 변경<\/button><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"ads-unlink\">연결 해제<\/button>';\n    }\n    const el = App.section(\"Google Ads\", actions, body);\n    C().bindExt(el);\n    const on = (k, fn) => { const b = el.querySelector(`[data-act=\"${k}\"]`); if (b) b.addEventListener(\"click\", fn); };\n    on(\"ads-connect\", openAdsWizard);\n    on(\"ads-change\", openAdsWizard);\n    on(\"ads-unlink\", async () => {\n      if (!(await UI.confirm(\"Google Ads 연결만 해제합니다. Merchant Center와 상품 피드는 유지됩니다.\\n연결을 해제하시겠습니까?\"))) return;\n      GStore.disconnectAds();\n      App.render();\n      UI.toast(\"Google Ads 연결이 해제되었습니다.\", \"success\");\n    });\n    return el;\n  }\n  /** Google Ads 연결: 약관 동의 → 계정 선택 → 연동 설정 확인(10개 항목, 필수 3개) → 완료 */\n  function openAdsWizard() {\n    const steps = [\"약관 동의\", \"계정 선택\", \"연동 설정 확인\"];\n    const CHECKS = [[\"계정 연결\", true], [\"광고 성과 조회 권한\", true], [\"연결 정보 저장\", true], [\"Google Tag 설치\", false], [\"향상된 전환 설정\", false], [\"전환 액션 확인\", false], [\"Merchant Center 연결 확인\", false], [\"결제 정보 확인\", false], [\"계정 상태 확인\", false], [\"자동 태그 추가\", false]];\n    let i = 0;\n    let picked = G().adsAccounts[0];\n    const m = UI.modal({ title: \"Google Ads 연결\", size: \"md\", body: '<div id=\"adw\"><\/div>', footer: '<button type=\"button\" class=\"btn btn--line btn--lg\" data-act=\"prev\">이전<\/button><button type=\"button\" class=\"btn btn--dark btn--lg\" data-act=\"next\">다음<\/button>' });\n    const box = m.el.querySelector(\"#adw\");\n    const next = m.el.querySelector('[data-act=\"next\"]');\n    function paint() {\n      const stepper = `<ol class=\"wstep\">${steps.map((x, k) => `<li class=\"${k === i ? \"is-on\" : k < i ? \"is-done\" : \"\"}\">${k + 1}. ${x}<\/li>`).join(\"\")}<\/ol>`;\n      let h = \"\";\n      if (i === 0) h = `<div class=\"consent-box is-open\"><div class=\"consent-box__text\">Google Ads 계정의 캠페인·성과 데이터를 메이크샵에서 조회하고, 쇼핑몰에 Google Tag를 설치합니다.<\/div><\/div><label class=\"chk\"><input type=\"checkbox\" id=\"ad-agree\"/><span><em>(필수)<\/em>위 내용에 동의합니다.<\/span><\/label>`;\n      if (i === 1) h = `<p class=\"sec__lead\">연결할 Google Ads 계정을 선택하세요.<\/p>${G().adsAccounts.map((c, k) => `<label class=\"radio-card\"><input type=\"radio\" name=\"ad\" value=\"${k}\" ${c.id === picked.id ? \"checked\" : \"\"}/><span><b>${UI.esc(c.name)}<\/b><br><span class=\"muted\">고객 ID ${c.id}<\/span><\/span><\/label>`).join(\"\")}`;\n      if (i === 2) h = `<p class=\"sec__lead\">연동 설정을 확인하고 있습니다. 필수 3개 항목이 모두 완료되어야 연결됩니다.<\/p><ul class=\"checklist\" id=\"ad-checks\">${CHECKS.map((c) => `<li><span class=\"spin\"><\/span>${c[0]}${c[1] ? ' <em class=\"req\">필수<\/em>' : \"\"}<span class=\"muted\">확인 중<\/span><\/li>`).join(\"\")}<\/ul>`;\n      box.innerHTML = stepper + h;\n      m.el.querySelector('[data-act=\"prev\"]').disabled = i === 0 || i === 2;\n      next.textContent = i === 2 ? \"연결 완료\" : \"다음\";\n      box.querySelectorAll('input[name=\"ad\"]').forEach((r) => r.addEventListener(\"change\", () => (picked = G().adsAccounts[+r.value])));\n      if (i === 2) {\n        next.disabled = true;\n        box.querySelectorAll(\"#ad-checks li\").forEach((li, k) =>\n          setTimeout(() => {\n            const opt = !CHECKS[k][1] && k % 3 === 1;\n            li.querySelector(\".spin\").outerHTML = opt ? '<span class=\"warn\">!<\/span>' : '<span class=\"ok\">✓<\/span>';\n            li.lastElementChild.textContent = opt ? \"설정 필요\" : \"완료\";\n            if (k === CHECKS.length - 1) next.disabled = false;\n          }, 180 * (k + 1))\n        );\n      }\n    }\n    m.el.querySelector('[data-act=\"prev\"]').addEventListener(\"click\", () => { if (i > 0) { i--; paint(); } });\n    next.addEventListener(\"click\", () => {\n      if (i === 0 && !box.querySelector(\"#ad-agree\").checked) return UI.alert(\"필수 항목에 동의해 주세요.\");\n      if (i < 2) { i++; paint(); return; }\n      GStore.connectAds(picked);\n      m.close(true);\n      App.render();\n      UI.toast(\"Google Ads가 연결되었습니다. '설정 필요' 항목은 오류가 아니며 구글애즈 탭에서 확인할 수 있습니다.\", \"success\");\n    });\n    paint();\n  }\n\n  return { render, openAdsWizard, openMcWizard };\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   SCR-GOOGLE-FEED-001 · Google 상품피드 (+ FEED-003 상품 상세, FEED-004 선택 수정, 동기화 이력)\n   - 메이크샵이 Merchant Center에 전송한 상품만 관리한다 (POL-062)\n   ========================================================================== */\nconst GFeed = (function () {\n  const C = () => GCommon;\n  const G = () => window.GMOCK;\n  const TABS = [\"전체\", \"활동중\", \"검토중\", \"미승인\", \"노출제한\", \"사용안함\", \"반영대기\"];\n  const SIZES = [10, 20, 50, 100];\n  const view = { tab: \"전체\", q: \"\", page: 1, size: 10, sel: new Set() };\n\n  function render(root, params) {\n    const s = GStore.s;\n    if (params && params.tab && TABS.includes(params.tab)) { view.tab = params.tab; view.page = 1; view.sel.clear(); }\n    root.appendChild(App.banner(\"상품피드\", \"메이크샵 상품을 Merchant Center로 보내고 상품별 상태와 전송 결과를 확인하는 공간입니다.<br>카테고리를 매칭한 상품을 자동으로 전송하고, 상품 수정 내용도 자동으로 반영합니다.\"));\n    if (GStore.queueBlocked()) {\n      const n = document.createElement(\"p\");\n      n.className = \"note note--warn\";\n      n.innerHTML = `${UI.icon.info}<span>재인증이 필요해 상품 피드 전송이 멈춰 있습니다. 연결관리에서 다시 연결하면 전송을 이어갑니다.<\/span><a class=\"lnk\" href=\"#/google/connect\">연결관리로 이동<\/a>`;\n      root.appendChild(n);\n    }\n    root.appendChild(operationSection());\n    const c = GStore.counts(GStore.products());\n    const reg = App.section(\"상품 피드 등록 현황\", `<button type=\"button\" class=\"btn btn--line btn--sm\" data-ext=\"Merchant Center 바로가기\" data-url=\"https://merchants.google.com/mc/products/diagnostics?a=${(s.mcAccount || G().merchantCandidates[0]).id}\">Merchant Center 바로가기<\/button>`, C().statusBar(c, null, true) + (!s.firstMatchDone ? `<p class=\"note note--warn\">${UI.icon.info}<span>상품 카테고리 매칭 전입니다. 연결관리 &gt; 상품 카테고리 매칭에서 [상품 피드 반영]을 누르면 매칭된 상품이 반영대기로 등록되어 자동 전송됩니다.<\/span><\/p>` : \"\"));\n    C().bindExt(reg);\n    root.appendChild(reg);\n    root.appendChild(programSection(c));\n    const listSec = App.section(\"상품 피드\", \"\", '<div id=\"gfeed-list\"><\/div>', { cls: \"sec--list\" });\n    root.appendChild(listSec);\n    paintList(listSec.querySelector(\"#gfeed-list\"));\n  }\n\n  /* ---------------- 1. 운영 현황 ---------------- */\n  function operationSection() {\n    const s = GStore.s;\n    const q = GStore.queueSize();\n    const failN = s.lastResult === \"일부 실패\" ? 3 : 0;\n    const resultPill = { 성공: \"blue\", \"일부 실패\": \"red\", 실패: \"red\", \"진행 중\": \"line\" }[s.lastResult];\n    const items = [\n      [\"최근 전체 동기화\", s.lastFull || \"-\"],\n      [\"최근 자동 동기화\", s.lastAuto || \"-\"],\n      [\"최근 동기화 결과\", s.lastResult ? C().pill(s.lastResult, resultPill) : \"-\"],\n      [\"반영대기 상품 수\", UI.fmt(q)],\n      [\"전송 실패 상품 수\", UI.fmt(failN)],\n    ];\n    const body = `<div class=\"opgrid\">${items.map((x) => `<div class=\"opgrid__item\"><span class=\"opgrid__label\">${x[0]}<\/span><span class=\"opgrid__val\">${x[1]}<\/span><\/div>`).join(\"\")}<\/div>`;\n    const busy = q > 0 && s.syncing;\n    const el = App.section(\"운영 현황\", `<button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"hist\">동기화 이력<\/button><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"resync\" ${busy ? \"disabled title=\\\"큐에 전송 중인 상품이 있습니다.\\\"\" : \"\"}>다시 동기화<\/button>`, body);\n    el.querySelector('[data-act=\"hist\"]').addEventListener(\"click\", openHistory);\n    el.querySelector('[data-act=\"resync\"]').addEventListener(\"click\", async () => {\n      if (!(await UI.confirm(\"전송 조건을 충족한 전체 상품을 다시 전송합니다.\\n다시 동기화하시겠습니까?\"))) return;\n      GStore.fullSync();\n      App.render();\n      UI.toast(\"전체 동기화를 시작했습니다. 전송 대상 상품이 반영대기로 등록되었습니다.\", \"info\");\n    });\n    return el;\n  }\n\n  /* ---------------- 3. 프로그램별 피드 (aggregateProductStatuses, POL-075) ---------------- */\n  function programSection(c) {\n    const extraDisapproved = GStore.products().filter((p) => GStore.status(p) === \"활동중\" && p.id % 17 === 0).length;\n    const rows = [\n      [\"무료 리스팅\", c.활동중, c.검토중, c.미승인],\n      [\"쇼핑 광고\", c.활동중 - extraDisapproved, c.검토중, c.미승인 + extraDisapproved],\n    ];\n    const body = `<div class=\"table-wrap\"><table class=\"table table--compact\"><thead><tr><th class=\"th-left\">프로그램<\/th><th>전체<\/th><th>정상<\/th><th>검토중<\/th><th>미승인<\/th><\/tr><\/thead><tbody>${rows.map((r) => `<tr><td class=\"td-left\">${r[0]}<\/td><td>${UI.fmt(r[1] + r[2] + r[3])}<\/td><td>${UI.fmt(r[1])}<\/td><td>${UI.fmt(r[2])}<\/td><td>${UI.fmt(r[3])}<\/td><\/tr>`).join(\"\")}<\/tbody><\/table><\/div>\n      <p class=\"note\">${UI.icon.info}<span>Merchant Center의 프로그램별 집계(대한민국 기준)입니다. 두 프로그램의 상품 수는 더하지 않습니다.<\/span><\/p>`;\n    return App.section(\"프로그램별 피드\", \"\", body);\n  }\n\n  /* ---------------- 4. 상품 피드 목록 ---------------- */\n  function paintList(box) {\n    const q = view.q.trim().toLowerCase();\n    const base = GStore.products().filter((p) => !q || p.name.toLowerCase().includes(q));\n    const c = GStore.counts(base);\n    const rows = view.tab === \"전체\" ? base : base.filter((p) => GStore.status(p) === view.tab);\n    const pages = Math.max(1, Math.ceil(rows.length / view.size));\n    if (view.page > pages) view.page = pages;\n    const pageRows = rows.slice((view.page - 1) * view.size, view.page * view.size);\n    const cols = columnsFor(view.tab);\n    box.innerHTML = `\n      <div class=\"list-tools\">\n        <div class=\"stabs\" role=\"tablist\">${TABS.map((t) => `<button type=\"button\" role=\"tab\" class=\"stab ${t === view.tab ? \"is-active\" : \"\"}\" data-tab=\"${t}\">${t} <b>${c[t]}<\/b><\/button>`).join(\"\")}<\/div>\n        <div class=\"list-tools__right\">\n          <form class=\"search\" id=\"gfeed-search\"><button type=\"submit\" aria-label=\"검색\">${UI.icon.search}<\/button><input type=\"search\" placeholder=\"상품명으로 검색\" value=\"${UI.esc(view.q)}\" aria-label=\"상품명 검색\" /><\/form>\n          <select class=\"select\" id=\"gfeed-size\" aria-label=\"페이지당 노출 개수\">${SIZES.map((n) => `<option value=\"${n}\" ${n === view.size ? \"selected\" : \"\"}>${n}개씩<\/option>`).join(\"\")}<\/select>\n        <\/div>\n      <\/div>\n      <div class=\"table-wrap\"><table class=\"table\">\n        <thead><tr>${cols.map((k) => `<th class=\"col-${k}\">${head(k)}<\/th>`).join(\"\")}<\/tr><\/thead>\n        <tbody>${pageRows.length ? pageRows.map((p) => `<tr>${cols.map((k) => `<td class=\"col-${k}\">${cell(k, p)}<\/td>`).join(\"\")}<\/tr>`).join(\"\") : `<tr><td colspan=\"${cols.length}\" class=\"table__empty\">${view.q ? \"검색 결과가 없습니다.\" : \"표시할 상품이 없습니다.\"}<\/td><\/tr>`}<\/tbody>\n      <\/table><\/div>\n      <div class=\"list-foot\"><div class=\"list-foot__left\"><button type=\"button\" class=\"btn btn--line\" data-act=\"bulk\">선택 수정<\/button>${view.tab === \"반영대기\" ? '<span class=\"muted small\">반영대기 상품은 전송 큐에서 순서대로 자동 전송됩니다. 직접 전송하는 기능은 없습니다.<\/span>' : \"\"}<\/div><div id=\"gfeed-pager\"><\/div><div class=\"list-foot__right muted small\">총 ${UI.fmt(rows.length)}건 · 선택 ${view.sel.size}건<\/div><\/div>`;\n    box.querySelector(\"#gfeed-pager\").appendChild(UI.pagination(rows.length, view.page, view.size, (p) => { view.page = p; view.sel.clear(); paintList(box); }));\n    box.querySelectorAll(\"[data-tab]\").forEach((b) => b.addEventListener(\"click\", () => { view.tab = b.dataset.tab; view.page = 1; view.sel.clear(); paintList(box); }));\n    box.querySelector(\"#gfeed-search\").addEventListener(\"submit\", (e) => { e.preventDefault(); view.q = e.target.querySelector(\"input\").value; view.page = 1; view.sel.clear(); paintList(box); });\n    box.querySelector(\"#gfeed-size\").addEventListener(\"change\", (e) => { view.size = +e.target.value; view.page = 1; view.sel.clear(); paintList(box); });\n    const all = box.querySelector(\"#gchk-all\");\n    const chks = [...box.querySelectorAll(\".row-chk\")];\n    const foot = () => (box.querySelector(\".list-foot__right\").textContent = `총 ${UI.fmt(rows.length)}건 · 선택 ${view.sel.size}건`);\n    all.checked = chks.length > 0 && chks.every((x) => x.checked);\n    all.addEventListener(\"change\", () => { chks.forEach((x) => { x.checked = all.checked; all.checked ? view.sel.add(+x.value) : view.sel.delete(+x.value); }); foot(); });\n    chks.forEach((x) => x.addEventListener(\"change\", () => { x.checked ? view.sel.add(+x.value) : view.sel.delete(+x.value); all.checked = chks.every((y) => y.checked); foot(); }));\n    box.querySelectorAll(\"[data-detail]\").forEach((b) => b.addEventListener(\"click\", () => openDetail(+b.dataset.detail)));\n    box.querySelector('[data-act=\"bulk\"]').addEventListener(\"click\", () => {\n      const ids = pageRows.filter((p) => view.sel.has(p.id)).map((p) => p.id);\n      if (!ids.length) return UI.alert(\"선택된 상품이 없습니다.\");\n      openBulk(ids);\n    });\n  }\n  function columnsFor(tab) {\n    if (tab === \"전체\") return [\"chk\", \"info\", \"price\", \"sku\", \"status\", \"gpc\", \"manage\"];\n    if (tab === \"미승인\" || tab === \"노출제한\") return [\"chk\", \"info\", \"price\", \"sku\", \"gpc\", \"reason\", \"manage\"];\n    if (tab === \"사용안함\") return [\"chk\", \"info\", \"price\", \"sku\", \"manage\"];\n    return [\"chk\", \"info\", \"price\", \"sku\", \"gpc\", \"manage\"];\n  }\n  function head(k) {\n    return {\n      chk: '<input type=\"checkbox\" id=\"gchk-all\" aria-label=\"현재 페이지 전체 선택\" />',\n      info: \"상품정보\",\n      price: \"가격\",\n      sku: \"연동 상품 수\",\n      status: \"상태\",\n      gpc: \"Google 상품 카테고리\",\n      reason: view.tab === \"미승인\" ? \"미승인 사유\" : \"노출제한 사유\",\n      manage: \"관리\",\n    }[k];\n  }\n  function cell(k, p) {\n    switch (k) {\n      case \"chk\": return `<input type=\"checkbox\" class=\"row-chk\" value=\"${p.id}\" ${view.sel.has(p.id) ? \"checked\" : \"\"} aria-label=\"${UI.esc(p.name)} 선택\" />`;\n      case \"info\": return `<div class=\"pinfo\">${C().thumb(p)}<div><div class=\"pinfo__name\">${UI.esc(p.name)}<\/div><div class=\"pinfo__cat\">${C().catPath(p)}<\/div><\/div><\/div>`;\n      case \"price\": return C().priceText(p);\n      case \"sku\": return UI.fmt(C().skuCount(p));\n      case \"status\": return C().stTag(GStore.status(p));\n      case \"gpc\": return C().gpcCell(p);\n      case \"reason\": { const r = C().reason(p); return r ? `<b class=\"reason__t\">${UI.esc(r.title)}<\/b><div class=\"muted small\">${UI.esc(r.guide)}<\/div>` : \"-\"; }\n      case \"manage\": return `<button type=\"button\" class=\"btn btn--line btn--sm\" data-detail=\"${p.id}\">상세<\/button>`;\n    }\n  }\n\n  /* ---------------- FEED-003 상품 상세 설정 ---------------- */\n  function openDetail(id) {\n    const p = GStore.products().find((x) => x.id === id);\n    const g = GStore.gp(p);\n    const st = GStore.status(p);\n    const r = C().reason(p);\n    const items = window.MOCK.gpcList.map((x) => ({ value: x.id, label: x.path }));\n    const cur = { use: GStore.effUse(p), gpc: GStore.validGpc(Store.effGpc(p)) ? Store.effGpc(p) : \"\", gender: g.gender || \"\", age: g.age || \"\" };\n    const rr = p.r || {};\n    const body = `\n      <h4 class=\"mh\">상품 기본정보<\/h4>\n      <div class=\"pbasic\">${C().thumb(p)}<dl class=\"kv kv--tight\">\n        <div class=\"kv__row\"><dt>상품코드<\/dt><dd>P${String(p.no).padStart(8, \"0\")}<\/dd><\/div>\n        <div class=\"kv__row\"><dt>카테고리<\/dt><dd>${C().catPath(p)}<\/dd><\/div>\n        <div class=\"kv__row\"><dt>상품명<\/dt><dd>${UI.esc(p.name)}<\/dd><\/div>\n        <div class=\"kv__row\"><dt>판매가<\/dt><dd>${C().priceText(p)}<\/dd><\/div>\n        <div class=\"kv__row\"><dt>진열상태<\/dt><dd>${rr.display ? \"진열 안 함\" : \"진열함\"}<\/dd><\/div>\n        <div class=\"kv__row\"><dt>판매상태<\/dt><dd>${rr.sale ? \"판매 안 함\" : rr.soldout ? \"품절\" : \"판매함\"}<\/dd><\/div>\n      <\/dl><\/div>\n      <div class=\"pbasic__foot\"><span class=\"muted small\">상품 정보는 여기서 수정할 수 없습니다.<\/span><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"edit\">상품 상세 관리<\/button><\/div>\n      <h4 class=\"mh\">Google 피드 상태<\/h4>\n      <div class=\"graybox gstate\">${C().stTag(st)} <span class=\"tag-gray\">판정: ${GStore.judge(st)}<\/span>\n        <ul><li>최근 연동일시 ${g.status ? GStore.s.lastAuto || \"-\" : \"-\"}<\/li>${r ? `<li>사유 <b>${UI.esc(r.title)}<\/b> — ${UI.esc(r.guide)}<\/li>` : \"\"}${r && r.detail ? `<li class=\"muted\">Google 안내: ${UI.esc(r.detail)}<\/li>` : \"\"}<\/ul><\/div>\n      <h4 class=\"mh\">카테고리 매칭<\/h4>\n      <table class=\"mtable\"><thead><tr><th style=\"width:90px\">사용여부<\/th><th>Google 상품 카테고리<\/th><th style=\"width:140px\">성별<\/th><th style=\"width:150px\">연령대<\/th><\/tr><\/thead>\n        <tbody><tr><td><label class=\"switch\"><input type=\"checkbox\" class=\"d-use\" ${cur.use ? \"checked\" : \"\"}/><i><\/i><\/label><\/td><td><div class=\"d-gpc\"><\/div><\/td><td>${sel(\"d-gender\", C().GENDERS)}<\/td><td>${sel(\"d-age\", C().AGES)}<\/td><\/tr><\/tbody><\/table>\n      <p class=\"note\">${UI.icon.info}<span>Google 상품 카테고리는 Meta와 공통값입니다. 여기서 바꾸면 Meta에도 같이 적용되고 두 채널 모두 다시 판정합니다. 성별·연령대는 의류 및 액세서리 카테고리에서만 입력합니다.<\/span><\/p>`;\n    const m = UI.modal({ title: \"상품 상세 설정\", size: \"lg\", body, footer: '<button type=\"button\" class=\"btn btn--line btn--lg\" data-act=\"cancel\">취소<\/button><button type=\"button\" class=\"btn btn--dark btn--lg\" data-act=\"save\">상품 피드 반영<\/button>' });\n    const gs = m.el.querySelector(\".d-gender\");\n    const as = m.el.querySelector(\".d-age\");\n    const dd = UI.dropdown(m.el.querySelector(\".d-gpc\"), { items, value: cur.gpc, placeholder: \"카테고리를 선택해주세요\", minListWidth: 420, onChange: (v) => { cur.gpc = v; sync(); } });\n    function sync() {\n      const ap = Store.isApparel(cur.gpc);\n      dd.setDisabled(!cur.use);\n      gs.disabled = as.disabled = !(cur.use && ap);\n      if (!ap) { gs.innerHTML = '<option value=\"\">해당없음<\/option>'; as.innerHTML = '<option value=\"\">해당없음<\/option>'; }\n      else { restoreOpts(gs, C().GENDERS, cur.gender); restoreOpts(as, C().AGES, cur.age); }\n    }\n    m.el.querySelector(\".d-use\").addEventListener(\"change\", (e) => { cur.use = e.target.checked; sync(); });\n    gs.addEventListener(\"change\", () => (cur.gender = gs.value));\n    as.addEventListener(\"change\", () => (cur.age = as.value));\n    sync();\n    m.el.querySelector('[data-act=\"edit\"]').addEventListener(\"click\", () => UI.toast(\"메이크샵 상품 상세 관리 화면이 새 창으로 열립니다. (프로토타입 미연결)\", \"info\"));\n    m.el.querySelector('[data-act=\"cancel\"]').addEventListener(\"click\", () => m.close(true));\n    m.el.querySelector('[data-act=\"save\"]').addEventListener(\"click\", async () => {\n      if (cur.use && !cur.gpc) return UI.alert(\"상품 피드를 사용하려면 Google 상품 카테고리를 선택해 주세요.\");\n      GStore.saveProducts([{ id, use: cur.use, gpc: cur.gpc || null, gender: Store.isApparel(cur.gpc) ? cur.gender : null, age: Store.isApparel(cur.gpc) ? cur.age : null }]);\n      await UI.alert(\"선택한 상품이 상품 피드에 반영되었습니다.\");\n      m.close(true);\n      App.render();\n    });\n  }\n  function sel(cls, opts) {\n    return `<select class=\"select select--sm ${cls}\" aria-label=\"${cls}\"><option value=\"\">선택<\/option>${opts.map((o) => `<option value=\"${o[0]}\">${o[1]}<\/option>`).join(\"\")}<\/select>`;\n  }\n  function restoreOpts(selEl, opts, val) {\n    selEl.innerHTML = `<option value=\"\">선택<\/option>${opts.map((o) => `<option value=\"${o[0]}\">${o[1]}<\/option>`).join(\"\")}`;\n    selEl.value = val || \"\";\n  }\n\n  /* ---------------- FEED-004 선택 상품 카테고리 매칭 ---------------- */\n  function openBulk(ids) {\n    const items = window.MOCK.gpcList.map((x) => ({ value: x.id, label: x.path }));\n    const rows = ids.map((id) => {\n      const p = GStore.products().find((x) => x.id === id);\n      const g = GStore.gp(p);\n      return { p, cur: { use: GStore.effUse(p), gpc: GStore.validGpc(Store.effGpc(p)) ? Store.effGpc(p) : \"\", gender: g.gender || \"\", age: g.age || \"\" } };\n    });\n    const body = `\n      <div class=\"infobox\">${UI.icon.info}<div>· 선택한 상품 ${rows.length}건의 Google 상품 카테고리·사용여부·성별·연령대를 수정합니다.<br>· [적용]은 아래 목록의 입력값만 바꾸고, [상품 피드 반영]을 눌러야 저장과 전송이 이루어집니다.<\/div><\/div>\n      <div class=\"bulkbar\"><b>일괄 변경<\/b>\n        <select class=\"select select--sm\" id=\"b-use\"><option value=\"\">사용여부<\/option><option value=\"on\">사용<\/option><option value=\"off\">사용안함<\/option><\/select>\n        ${sel(\"b-gender\", C().GENDERS).replace('<option value=\"\">선택<\/option>', '<option value=\"\">성별<\/option>')}\n        ${sel(\"b-age\", C().AGES).replace('<option value=\"\">선택<\/option>', '<option value=\"\">연령대<\/option>')}\n        <button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"apply\">적용<\/button><\/div>\n      <div class=\"mtable-wrap mtable-wrap--wide\"><table class=\"mtable mtable--prod\">\n        <thead><tr><th>사용여부<\/th><th>상태<\/th><th>상품정보<\/th><th>쇼핑몰 카테고리<\/th><th>Google 상품 카테고리<\/th><th>성별<\/th><th>연령대<\/th><\/tr><\/thead>\n        <tbody>${rows.map((r, i) => `<tr data-i=\"${i}\"><td><label class=\"switch\"><input type=\"checkbox\" class=\"m-use\"/><i><\/i><\/label><\/td><td>${C().stTag(GStore.status(r.p))}<\/td><td><div class=\"pinfo pinfo--sm\">${C().thumb(r.p)}<div class=\"pinfo__name\">${UI.esc(r.p.name)}<\/div><\/div><\/td><td>${C().catPath(r.p)}<\/td><td><div class=\"m-gpc\"><\/div><\/td><td>${sel(\"m-gender\", C().GENDERS)}<\/td><td>${sel(\"m-age\", C().AGES)}<\/td><\/tr>`).join(\"\")}<\/tbody><\/table><\/div>`;\n    const m = UI.modal({ title: \"선택 상품 카테고리 매칭\", size: \"xl\", body, footer: '<button type=\"button\" class=\"btn btn--line btn--lg\" data-act=\"cancel\">취소<\/button><button type=\"button\" class=\"btn btn--dark btn--lg\" data-act=\"save\">상품 피드 반영<\/button>' });\n    const syncs = [];\n    m.el.querySelectorAll(\"tbody tr\").forEach((tr) => {\n      const r = rows[+tr.dataset.i];\n      const use = tr.querySelector(\".m-use\");\n      const gs = tr.querySelector(\".m-gender\");\n      const as = tr.querySelector(\".m-age\");\n      const dd = UI.dropdown(tr.querySelector(\".m-gpc\"), { items, value: r.cur.gpc, placeholder: \"카테고리를 선택해주세요\", minListWidth: 420, onChange: (v) => { r.cur.gpc = v; sync(); } });\n      function sync() {\n        const ap = Store.isApparel(r.cur.gpc);\n        use.checked = r.cur.use;\n        dd.setDisabled(!r.cur.use);\n        if (ap) { restoreOpts(gs, C().GENDERS, r.cur.gender); restoreOpts(as, C().AGES, r.cur.age); }\n        else { gs.innerHTML = as.innerHTML = '<option value=\"\">해당없음<\/option>'; }\n        gs.disabled = as.disabled = !(r.cur.use && ap);\n      }\n      use.addEventListener(\"change\", () => { r.cur.use = use.checked; sync(); });\n      gs.addEventListener(\"change\", () => (r.cur.gender = gs.value));\n      as.addEventListener(\"change\", () => (r.cur.age = as.value));\n      sync();\n      syncs.push(sync);\n    });\n    m.el.querySelector('[data-act=\"apply\"]').addEventListener(\"click\", () => {\n      const u = m.el.querySelector(\"#b-use\").value;\n      const ge = m.el.querySelector(\".b-gender\").value;\n      const ag = m.el.querySelector(\".b-age\").value;\n      rows.forEach((r) => {\n        if (u) r.cur.use = u === \"on\";\n        if (Store.isApparel(r.cur.gpc)) { if (ge) r.cur.gender = ge; if (ag) r.cur.age = ag; } // 성별·연령대는 의류 GPC 상품에만 적용\n      });\n      syncs.forEach((f) => f());\n      UI.toast(\"입력값을 바꿨습니다. [상품 피드 반영]을 눌러야 저장됩니다.\", \"info\");\n    });\n    m.el.querySelector('[data-act=\"cancel\"]').addEventListener(\"click\", () => m.close(true));\n    m.el.querySelector('[data-act=\"save\"]').addEventListener(\"click\", async () => {\n      if (rows.some((r) => r.cur.use && !r.cur.gpc)) return UI.alert(\"상품 피드를 사용하려면 Google 상품 카테고리를 선택해 주세요.\");\n      const res = GStore.saveProducts(rows.map((r) => ({ id: r.p.id, use: r.cur.use, gpc: r.cur.gpc || null, gender: Store.isApparel(r.cur.gpc) ? r.cur.gender : null, age: Store.isApparel(r.cur.gpc) ? r.cur.age : null })));\n      await UI.alert(\"선택한 상품이 상품 피드에 반영되었습니다.\");\n      m.close(true);\n      view.sel.clear();\n      App.render();\n      UI.toast(`반영 결과 — 반영대기 ${res.queued}건${res.restricted ? ` · 노출제한 ${res.restricted}건` : \"\"}${res.unused ? ` · 사용안함 ${res.unused}건` : \"\"}`, \"info\");\n    });\n  }\n\n  /* ---------------- 동기화 이력 (재시도 버튼 없음, POL-076) ---------------- */\n  function openHistory() {\n    const f = { days: 30, result: \"\" };\n    const m = UI.modal({ title: \"동기화 이력\", size: \"lg\", body: '<div id=\"hist\"><\/div>', footer: '<button type=\"button\" class=\"btn btn--dark btn--lg\" data-act=\"close\">닫기<\/button>' });\n    const box = m.el.querySelector(\"#hist\");\n    function paint() {\n      const list = GStore.s.history.filter((h) => (h.at == null || -h.at <= f.days) && (!f.result || h.result === f.result));\n      box.innerHTML = `\n        <div class=\"hist-filter\"><select class=\"select select--sm\" id=\"h-days\">${[[7, \"최근 7일\"], [30, \"최근 30일\"], [90, \"최근 90일\"]].map((o) => `<option value=\"${o[0]}\" ${o[0] === f.days ? \"selected\" : \"\"}>${o[1]}<\/option>`).join(\"\")}<\/select>\n          <select class=\"select select--sm\" id=\"h-res\"><option value=\"\">결과 전체<\/option>${[\"성공\", \"일부 실패\", \"실패\", \"진행 중\"].map((r) => `<option ${r === f.result ? \"selected\" : \"\"}>${r}<\/option>`).join(\"\")}<\/select><\/div>\n        <div class=\"mtable-wrap\"><table class=\"mtable\"><thead><tr><th>일시<\/th><th>유형<\/th><th>결과<\/th><th>대상<\/th><th>성공<\/th><th>실패<\/th><th>상세<\/th><\/tr><\/thead>\n        <tbody>${list.length ? list.map((h, i) => `<tr><td>${h.atStr}<\/td><td>${h.type}<\/td><td>${h.result}<\/td><td>${h.target}<\/td><td>${h.ok}<\/td><td>${h.fail}<\/td><td>${h.fail ? `<button type=\"button\" class=\"btn btn--line btn--sm\" data-h=\"${GStore.s.history.indexOf(h)}\">상세<\/button>` : \"-\"}<\/td><\/tr>`).join(\"\") : '<tr><td colspan=\"7\" class=\"table__empty\">조회된 이력이 없습니다.<\/td><\/tr>'}<\/tbody><\/table><\/d
