<script type="application/json" id="proto">"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n<title>마케팅 채널 관리 — 메이크샵 어드민 Prototype v0.2<\/title>\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css\" />\n<style>\n/* ==========================================================================\n   Meta 비즈니스 Prototype — 메이크샵 어드민 스타일 (04_Screen-Spec 기준)\n   ========================================================================== */\n:root {\n  --c-primary: #1f7bff;\n  --c-primary-d: #1667e0;\n  --c-primary-l: #e9f2ff;\n  --c-dark: #353f50;\n  --c-dark-2: #1d2433;\n  --c-bg: #f1f4f8;\n  --c-card: #fff;\n  --c-border: #e3e7ee;\n  --c-border-2: #cfd6e0;\n  --c-text: #2b313b;\n  --c-text-strong: #111722;\n  --c-text-sub: #5b6575;\n  --c-text-faint: #8d96a5;\n  --c-red: #e5484d;\n  --c-green: #16a34a;\n  --c-orange: #f59e0b;\n  --st-활동중: #1f7bff;\n  --st-검토중: #3c4658;\n  --st-미승인: #8a93a5;\n  --st-노출제한: #f6c343;\n  --st-사용안함: #d8dde6;\n  --st-반영대기: #f3f5f8;\n  --radius: 8px;\n  --shadow: 0 1px 2px rgba(17, 23, 34, 0.04);\n}\n* { box-sizing: border-box; }\nhtml, body { margin: 0; }\nbody {\n  font-family: \"Pretendard\", -apple-system, BlinkMacSystemFont, \"Apple SD Gothic Neo\", \"Malgun Gothic\", sans-serif;\n  font-size: 13px; color: var(--c-text); background: #fff; -webkit-font-smoothing: antialiased;\n}\nbutton, input, select { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\na { color: inherit; text-decoration: none; cursor: pointer; }\nul { margin: 0; padding: 0; list-style: none; }\nh1, h2, h3, h4, p { margin: 0; }\n.muted { color: var(--c-text-faint); }\n.small { font-size: 12px; }\n.up { color: var(--c-green); }\n.down { color: var(--c-red); }\n\n/* ---------------- Top bar / GNB ---------------- */\n.topbar { height: 44px; background: var(--c-primary); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 12px; gap: 12px; }\n.topbar__left, .topbar__right { display: flex; align-items: center; gap: 14px; white-space: nowrap; overflow: hidden; }\n.logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; margin-right: 6px; }\n.logo b { font-style: italic; }\n.ver-chip, .brand-chip { background: #0d4fb8; border-radius: 3px; padding: 3px 7px; font-size: 11px; font-weight: 700; }\n.brand-chip { background: #0b2e6b; letter-spacing: 0.5px; }\n.topbar__meta { opacity: 0.92; padding-left: 10px; border-left: 1px solid rgba(255, 255, 255, 0.35); }\n.topbar__meta:first-of-type { border: 0; padding-left: 0; }\n.topbar__right .dot { position: relative; }\n.topbar__right .dot::after { content: \"\"; position: absolute; top: -3px; right: -6px; width: 5px; height: 5px; background: #ffd400; border-radius: 50%; }\n.gnb { height: 56px; border-bottom: 1px solid var(--c-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #fff; }\n.gnb ul { display: flex; gap: 2px; height: 100%; overflow-x: auto; scrollbar-width: none; }\n.gnb li { padding: 0 16px; display: flex; align-items: center; font-size: 14px; font-weight: 700; color: var(--c-text-strong); white-space: nowrap; border-bottom: 2px solid transparent; }\n.gnb li.is-active { color: var(--c-primary); border-color: var(--c-primary); }\n.gnb__right { display: flex; align-items: center; gap: 18px; font-size: 12px; white-space: nowrap; }\n.gnb__search input { width: 180px; height: 30px; border: 1px solid var(--c-border); border-radius: 4px; padding: 0 8px; }\n.subbar { padding: 10px 20px; font-size: 12px; border-bottom: 1px solid var(--c-border); color: var(--c-text-sub); }\n.subbar__btn { display: inline-block; margin-left: 10px; background: #eef1f5; border-radius: 3px; padding: 3px 8px; color: var(--c-primary); }\n\n/* ---------------- Layout / LNB ---------------- */\n.layout { display: flex; min-height: calc(100vh - 140px); }\n.lnb { width: 220px; flex: 0 0 220px; border-right: 1px solid var(--c-border); background: #fff; }\n.lnb__head { text-align: center; padding: 28px 0 18px; border-bottom: 1px solid var(--c-border); }\n.lnb__head h2 { font-size: 22px; font-weight: 800; color: var(--c-text-strong); margin-bottom: 8px; }\n.chip-manual { display: inline-block; background: var(--c-primary-l); color: var(--c-primary); border-radius: 10px; font-size: 11px; padding: 2px 10px; font-weight: 600; vertical-align: middle; margin-left: 8px; }\n.lnb__head .chip-manual { margin-left: 0; }\n.lnb__group { padding: 12px 0; border-bottom: 1px solid var(--c-border); }\n.lnb__gtitle { display: flex; justify-content: space-between; padding: 4px 10px 6px; font-size: 11px; color: var(--c-text-faint); }\n.lnb__group li { padding: 6px 10px; font-size: 13px; color: var(--c-text); position: relative; }\n.lnb__group li::before { content: \"· \"; }\n.lnb__group li.is-active { background: var(--c-primary-l); color: var(--c-primary); margin: 0 4px; border-radius: 3px; }\n.lnb__group li.is-active a { display: inline-block; width: 80%; }\n.lnb__group .star { position: absolute; right: 10px; color: #9fbcf0; }\n.lnb__qs { background: #f4f7fb; padding: 16px 10px; }\n.lnb__qs-title { color: var(--c-primary); font-weight: 700; margin-bottom: 10px; }\n.lnb__qs-radios { display: flex; gap: 10px; font-size: 12px; margin-bottom: 10px; }\n.lnb__qs-row { display: flex; gap: 4px; }\n.lnb__qs-row > div { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }\n.lnb__qs-row select, .lnb__qs-row input { height: 30px; border: 1px solid var(--c-border-2); border-radius: 2px; padding: 0 6px; background: #fff; width: 100%; font-size: 12px; }\n.lnb__qs-row button { width: 54px; border: 0; background: var(--c-primary); color: #fff; font-weight: 700; border-radius: 2px; }\n.content { flex: 1; min-width: 0; background: var(--c-bg); padding: 22px 28px 120px; }\n\n/* ---------------- Page head ---------------- */\n.page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }\n.page-head h1 { font-size: 19px; font-weight: 700; color: var(--c-text-strong); }\n.crumbs { display: flex; font-size: 11px; color: var(--c-text-faint); }\n.crumbs span + span::before { content: \"›\"; margin: 0 8px; }\n\n/* ---------------- Meta 2-column ---------------- */\n.meta-wrap { display: flex; gap: 22px; align-items: flex-start; }\n.subnav { width: 150px; flex: 0 0 150px; padding: 20px 0 14px; position: sticky; top: 12px; }\n.subnav__logo { display: flex; justify-content: center; padding-bottom: 18px; }\n.subnav a { display: block; padding: 13px 20px; font-size: 13px; color: var(--c-text-sub); border-left: 3px solid transparent; }\n.subnav a:hover { background: #f6f8fb; }\n.subnav a.is-active { background: var(--c-primary-l); color: var(--c-primary); border-left-color: var(--c-primary); font-weight: 600; }\n.meta-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px; }\n\n/* ---------------- Cards / sections ---------------- */\n.card { background: var(--c-card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid #edf0f4; }\n.banner { display: flex; justify-content: space-between; gap: 20px; padding: 22px 28px; align-items: flex-start; }\n.banner__title { color: var(--c-primary); font-size: 14px; font-weight: 700; margin-bottom: 12px; }\n.banner__desc { font-size: 12.5px; line-height: 1.8; color: var(--c-text-sub); }\n.sec__head { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; border-bottom: 1px solid var(--c-border); min-height: 62px; gap: 10px; flex-wrap: wrap; }\n.sec__head h3 { font-size: 14px; font-weight: 700; color: var(--c-text-strong); }\n.sec__actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }\n.sec__toggle { border: 0; background: none; color: #a8b3c4; padding: 6px; display: flex; transition: transform 0.15s; }\n.sec.is-collapsed .sec__toggle { transform: rotate(180deg); }\n.sec.is-collapsed .sec__body { display: none; }\n.sec.is-collapsed .sec__head { border-bottom: 0; }\n.sec__body { padding: 22px 28px 26px; }\n.sec__lead { line-height: 1.8; margin-bottom: 18px; color: var(--c-text-sub); }\n\n/* ---------------- Key-Value rows ---------------- */\n.kv { margin: 0; }\n.kv__row { display: grid; grid-template-columns: 180px minmax(0, 360px) 1fr; align-items: center; min-height: 50px; gap: 12px; }\n.kv__row--top { align-items: start; padding-top: 14px; }\n.kv dt { color: var(--c-text-sub); font-size: 12.5px; display: flex; align-items: center; gap: 4px; }\n.kv dd { margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\n.kv__link { justify-content: flex-start; min-width: 200px; }\n.kv__wide { grid-column: 2 / 4; display: block !important; }\n.ext { color: var(--c-primary); display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }\n.ext:hover { text-decoration: underline; }\n.row-hint { font-size: 11.5px; color: var(--c-red); }\n\n/* ---------------- Pills / badges ---------------- */\n.pill { display: inline-flex; align-items: center; height: 24px; padding: 0 12px; border-radius: 12px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }\n.pill--blue { background: #e3efff; color: var(--c-primary); }\n.pill--solid-blue { background: #4d95ff; color: #fff; }\n.pill--gray { background: #e7eaef; color: #6b7585; }\n.pill--red { background: #fde7e8; color: var(--c-red); }\n.pill--line { border: 1px solid #b9c1ce; color: var(--c-text); }\n.pill--dark-line { border: 1px solid var(--c-dark-2); color: var(--c-dark-2); }\n.tag-gray { margin-left: 8px; font-size: 10.5px; background: #eef1f5; color: var(--c-text-sub); padding: 2px 6px; border-radius: 3px; }\n.qmark { width: 16px; height: 16px; border-radius: 50%; border: 0; background: #e6eaf0; color: #7d8798; font-size: 10px; font-weight: 700; display: inline-flex; ali ng: 14px 16px; margin-bottom: 12px; }\n\n<\/style>\n<\/head>\n<body>\n  <!-- ============ Top bar ============ -->\n  <header class=\"topbar\">\n    <div class=\"topbar__left\">\n      <span class=\"logo\">make<b>#<\/b><\/span>\n      <span class=\"ver-chip\">사용버전 ‹<\/span>\n      <span class=\"topbar__meta\">주문 1.0<\/span><span class=\"topbar__meta\">디자인 D4<\/span><span class=\"topbar__meta\">모바일 4.0<\/span><span class=\"topbar__meta\">통합옵션 사용<\/span>\n    <\/div>\n    <div class=\"topbar__right\">\n      <b>noblystudio<\/b><span>번호 : 244082<\/span><span>공지사항<\/span><span class=\"dot\">업그레이드<\/span><span>로그아웃<\/span>\n    <\/div>\n  <\/header>\n  <nav class=\"gnb\">\n    <ul>\n      <li>설정<\/li><li>상품<\/li><li>주문<\/li><li>회원<\/li><li>게시판/메일<\/li><li>프로모션<\/li><li>디자인<\/li>\n      <li>부가서비스<\/li><li>통계<\/li><li>CRM<\/li><li class=\"is-active\">마케팅<\/li>\n    <\/ul>\n    <div class=\"gnb__right\"><span>내 쇼핑몰 ▾<\/span><span>고객센터 ▾<\/span><label class=\"gnb__search\"><input type=\"text\" aria-label=\"메뉴 검색\" /><\/label><\/div>\n  <\/nav>\n  <div class=\"subbar\">등록된 스마트 폴더가 없습니다. 메뉴 우측의 ☆를 클릭하여 자주 사용하는 메뉴를 등록해주세요. <span class=\"subbar__btn\">★ 설정<\/span><\/div>\n\n  <div class=\"layout\">\n    <!-- ============ 마케팅 LNB ============ -->\n    <aside class=\"lnb\">\n      <div class=\"lnb__head\"><h2>마케팅<\/h2><span class=\"chip-manual\">매뉴얼<\/span><\/div>\n      <div class=\"lnb__group\">\n        <div class=\"lnb__gtitle\">마케팅 <i>⌃<\/i><\/div>\n        <ul id=\"lnb-menu\"><\/ul>\n      <\/div>\n      <div class=\"lnb__qs\">\n        <div class=\"lnb__qs-title\">Quick Search<\/div>\n        <div class=\"lnb__qs-radios\"><label><input type=\"radio\" name=\"qs\" checked /> 상품<\/label><label><input type=\"radio\" name=\"qs\" /> 회원<\/label><label><input type=\"radio\" name=\"qs\" /> 주문<\/label><\/div>\n        <div class=\"lnb__qs-row\"><div><select aria-label=\"검색 대상\"><option>전체상품<\/option><\/select><input type=\"text\" placeholder=\"검색어를 입력하세요\" /><\/div><button type=\"button\">검색<\/button><\/div>\n      <\/div>\n    <\/aside>\n\n    <!-- ============ Content ============ -->\n    <main class=\"content\" id=\"app\"><\/main>\n  <\/div>\n\n  <!-- ============ 프로토타입 시나리오 패널 (Drawer) ============ -->\n  <button class=\"scn-fab\" id=\"scn-open\" type=\"button\">⚙ 시나리오 패널<\/button>\n  <div class=\"drawer-dim\" id=\"drawer-dim\"><\/div>\n  <aside class=\"drawer\" id=\"scn-drawer\" aria-label=\"프로토타입 시나리오 패널\"><\/aside>\n\n  <script>\n/* 화면정의서 내장용 브리지 — 목업(iframe srcdoc) 안에서 실행된다.\n   - localStorage를 메모리로 대체해 사용자의 목업 상태와 섞이지 않게 한다.\n   - 화면별 준비 단계(steps)를 실행하고 번호 마커를 그린다. */\nwindow.SPEC_MODE = { hash: \"#/mkt/overview\" };\n(function () {\n  const mem = {};\n  const st = { getItem: (k) => (k in mem ? mem[k] : null), setItem: (k, v) => { mem[k] = String(v); }, removeItem: (k) => { delete mem[k]; }, clear: () => { Object.keys(mem).forEach((k) => delete mem[k]); } };\n  try { Object.defineProperty(window, \"localStorage\", { value: st, configurable: true }); } catch (e) { /* 무시 */ }\n})();\nwindow.SpecBridge = {\n  sleep: (ms) => new Promise((r) => setTimeout(r, ms)),\n  async run(steps) {\n    for (const s of steps) await this.step(s);\n  },\n  async step(s) {\n    const [op, a] = s;\n    if (op === \"meta\") { Store.reset(a); Store.s.queueAuto = false; Store.save(); }\n    if (op === \"google\") { GStore.reset(a); GStore.s.queueAuto = false; GStore.save(); }\n    if (op === \"set\") { Object.assign(GStore.s, a); GStore.save(); }\n    if (op === \"go\") { window.SPEC_MODE.hash = a; App.render(); }\n    if (op === \"click\") { const el = this.find(a); if (el) el.click(); }\n    if (op === \"js\") new Function(a)();\n    if (op === \"wait\") await this.sleep(a);\n    await this.sleep(80);\n  },\n  /** \"selector@포함텍스트|n번째^상위선택자\" */\n  find(spec) {\n    let anc = null;\n    let idx = 1;\n    let text = null;\n    if (spec.includes(\"^\")) [spec, anc] = spec.split(\"^\");\n    if (spec.includes(\"|\")) { const p = spec.split(\"|\"); spec = p[0]; 딩된 URL을 토스트로 노출 */\n  function openExternal(label, url) {\n    toast(`<b>새 탭 이동 (시뮬레이션)<\/b> · ${esc(label)}<br><span class=\"toast__url\">${esc(url)}<\/span>`, \"link\");\n  }\n\n  /* ---------------- Dialog: 브라우저 기본 alert / confirm 재현 ---------------- */\n  function dialog(message, withCancel) {\n    return new Promise((resolve) => {\n      const wrap = document.createElement(\"div\");\n      wrap.className = \"nd-overlay\";\n      wrap.innerHTML = `\n        <div class=\"nd\" role=\"alertdialog\" aria-modal=\"true\">\n          <div class=\"nd__title\">makeshop.co.kr 내용:<\/div>\n          <div class=\"nd__msg\">${esc(message).replace(/\\n/g, \"<br>\")}<\/div>\n          <div class=\"nd__btns\">\n            <button class=\"nd__btn nd__btn--ok\" data-r=\"1\">확인<\/button>\n            ${withCancel ? '<button class=\"nd__btn\" data-r=\"0\">취소<\/button>' : \"\"}\n          <\/div>\n        <\/div>`;\n      document.body.appendChild(wrap);\n      const okBtn = wrap.querySelector(\".nd__btn--ok\");\n      okBtn.focus();\n      const done = (r) => {\n        wrap.remove();\n        document.removeEventListener(\"keydown\", onKey, true);\n        resolve(r);\n      };\n      function onKey(e) {\n        if (e.key === \"Escape\") { e.stopPropagation(); done(false); }\n        if (e.key === \"Enter\") { e.stopPropagation(); e.preventDefault(); done(true); }\n      }\n      document.addEventListener(\"keydown\", onKey, true);\n      wrap.querySelectorAll(\"[data-r]\").forEach((b) => b.addEventListener(\"click\", () => done(b.dataset.r === \"1\")));\n    });\n  }\n  const alert = (m) => dialog(m, false);\n  const confirm = (m) => dialog(m, true);\n\n  /* ---------------- Modal (레이어 모달) ---------------- */\n  /**\n   * opts: { title, body(html), footer(html), size: 'sm'|'md'|'lg'|'xl', onClose(): boolean|Promise<boolean>, cls }\n   * 반환: { el, close(force) }\n   */\n  function modal(opts) {\n    const wrap = document.createElement(\"div\");\n    wrap.className = \"modal-overl if (!p.useFeed) return \"사용안함\";\n    if (restriction(p)) return \"노출제한\";\n    if (p.meta && !p.dirty) return p.meta;\n    return \"반영대기\";\n  }\n  function reason(p) {\n    const st = status(p);\n    if (st === \"노출제한\") return M.restrictReasons.find((x) => x.key === restriction(p)).text;\n    if (st === \"미승인\") return M.rejectReasons[p.reject] || M.rejectReasons.COMMERCE_POLICY_VIOLATION;\n    return \"\";\n  }\n  /** 연동 상품 수: Meta Catalog 에 실제 등록된 item(옵션 조합) 수. 미반영·제외 상품은 0 */\n  function linkedCount(p) {\n    return META_STATES.includes(status(p)) ? Math.max(1, p.options) : 0;\n  }\n  function counts(list) {\n    const c = { 전체: list.length };\n    FEED_STATES.forEach((s) => (c[s] = 0));\n    list.forEach((p) => c[status(p)]++);\n    return c;\n  }\n\n  /* ---------------- 전송 큐 (자동 처리 시뮬레이션) ---------------- */\n  let qTimer = null;\n  function scheduleQueue() {\n    if (!state.queueAuto || !state.connected) return;\n    clearTimeout(qTimer);\n    qTimer = setTimeout(() => {\n      const n = api.processQueue();\n      if (n && window.UI) UI.toast(`전송 큐 처리 완료 — 반영대기 상품 ${n}건이 Meta로 전송되어 검토중으로 바뀌었습니다.`, \"info\");\n      if (n && window.App && !document.querySelector(\".modal-overlay\")) App.render();\n    }, 5000);\n  }\n\n  /* ---------------- 액션 ---------------- */\n  const api = {\n    FEED_STATES,\n    META_STATES,\n    DEFAULT_COLUMNS,\n    get s() { return state; },\n    onChange(fn) { listeners.push(fn); },\n    save,\n    scheduleQueue,\n    cat, catPath, gpc, isApparel, effGpc, restriction, status, reason, linkedCount, counts,\n    leafCategories: () => M.categories,\n\n    reset(preset) {\n      state = preset === \"connected\" ? presetConnected() : baseState();\n      save();\n    },\n\n    /** FBE 연동 완료 (최초) */\n    connect(sel) {\n      // v0.2: GPC는 Meta·Google 공통값(POL-071)이라 연동 시 기존 공통값(catMap, 상품 gpc)을 유지한다\n      const keepGpc = {};\n      state.products.forEach((p) => (keepGpc[p.id] = p.gpc));\n      state.connected = true;\n      state.ig = sel ? sel.igChoice !== \"skip\" : true;\n      state.categorySaved = false;\n      state.lastUpdate = null;\n      state.products = clone(M.products).map((p) => Object.assign(p, { meta: null, reject: null, dirty: false, gpc: keepGpc[p.id] || null }));\n      save();\n      scheduleQueue();\n    },\n    /** [설정] 재연동 — 변경된 자산 반영 */\n    reconfigure(sel) {\n      if (sel) state.ig = sel.igChoice !== \"skip\";\n      state.assetError = \"none\";\n      save();\n      if (sel && sel.catalogChanged) api.changeCatalog();\n    },\n    disconnect() {\n      const keep = { domainVerified: state.domainVerified, unlinkResult: state.unlinkResult, prereq: state.prereq, columns: state.columns, catMap: state.catMap };\n      const keepGpc = {};\n      state.products.forEach((p) => (keepGpc[p.id] = p.gpc));\n      state = Object.assign(baseState(), keep);\n      state.products.forEach((p) => (p.gpc = keepGpc[p.id] || null));\n      save();\n    },\n    /** 카테고리 단위 매칭 [상품 피드 반영] → 매칭값 저장 + 전송 대상 상품 큐 등록(반영대기) */\n    saveCategoryMap(map) {\n      const changedCats = [];\n      Object.keys(map).forEach((cid) => {\n        const before = state.catMap[cid] || null;\n        const after = map[cid] || null;\n        if (after) state.catMap[cid] = after;\n        else delete state.catMap[cid];\n        if (before !== after) {\n          changedCats.push(cid);\n          state.products.forEach((p) => {\n            if (p.cat === cid && !p.gpc) p.dirty = true;\n          });\n        }\n      });\n      state.categorySaved = true;\n      state.lastUpdate = nowStr();\n      save();\n      scheduleQueue();\n      if (window.GStore && changedCats.length) GStore.onGpcChanged(changedCats, []); // 공통 GPC 변경 → Google 재판정\n    },\n    /** v0.2: Google 탭에서 공통 GPC를 바꾼 경우 — Meta도 해당 상품을 다시 판정(반영대기) */\n    applyCommonGpc(cats, productIds) {\n      if (!state.connected) return;\n      state.products.forEach((p) => {\n        if (productIds.includes(p.id) || (!p.gpc && cats.includes(p.cat))) p.dirty = true;\n      });\n      save();\n      scheduleQueue();\n    },\n    /** 전송 큐 처리 — 전송 시점 최신 정보로 재판정, 통과 상품만 최신 1건 Meta 전송(검토중) */\n    processQueue() {\n      let n = 0;\n      state.products.forEach((p) => {\n        if (status(p) === \"반영대기\") {\n          p.meta = \"검토중\";\n          p.reject = null;\n          p.dirty = false;\n          n++;\n        }\n      });\n      if (n) state.lastUpdate = nowStr();\n      save();\n      return n;\n    },\n    queueSize: () => state.products.filter((p) => status(p) === \"반영대기\").length,\n    /** 상품 단위 설정 [상품 피드 반영] — 상품 단위 저장 + 전송 대상 상품 큐 등록(반영대기) */\n    saveProductSettings(rows) {\n      const res = { queued: 0, restricted: 0, unused: 0 };\n      const gpcChanged = [];\n      rows.forEach((row) => {\n        const p = state.products.find((x) => x.id === row.id);\n        p.useFeed = row.useFeed;\n        if (row.useFeed) {\n          if (row.gpc !== effGpc(p)) { p.dirty = true; gpcChanged.push(p.id); }\n          p.gpc = row.gpc || null;\n          p.gender = isApparel(p.gpc || effGpc(p)) ? row.gender : null;\n          p.age = isApparel(p.gpc || effGpc(p)) ? row.age : null;\n          p.dirty = true; // 반영 = 큐 등록\n        }\n        const st = status(p);\n        if (st === \"반영대기\") res.queued++;\n        else if (st === \"노출제한\") res.restricted++;\n        else if (st === \"사용안함\") res.unused++;\n      });\n      state.lastUpdate = nowStr();\n      save();\n      scheduleQueue();\n      if (window.GStore && gpcChanged.length) GStore.onGpcChanged([], gpcChanged);\n      return res;\n    },\n    /** Meta 심사 결과 동기화 시뮬레이션: 검토중 → 활동중/미승인 */\n    syncMeta() {\n      let n = 0;\n      state.products.forEach((p) => {\n        if (p.meta === \"검토중\" && !p.dirty && status(p) === \"검토중\") {\n          n++;\n          if (p.id % 7 === 0) {\n            p.meta = \"미승인\";\n            p.reject = \"INVALID_IMAGE\";\n          } else p.meta = \"활동중\";\n        }\n      });\n      state.lastUpdate = nowStr();\n      save();\n      return n;\n    },\n    /** 카탈로그 변경(재설정) — 내부 피드 정보 초기화 → 전송 대상 상품 큐 재등록(반영대기) */\n    changeCatalog() {\n      state.products.forEach((p) => {\n        p.meta = null;\n        p.reject = null;\n        p.dirty = false;\n      });\n      state.lastUpdate = nowStr();\n      save();\n      scheduleQueue();\n    },\n  };\n  return api;\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   Google 채널 상태 저장소 + 상품 상태 판정 (사양 정의서 POL-035부터 POL-076)\n   - 상품·쇼핑몰 카테고리·공통 GPC(catMap, 상품 gpc)는 Meta Store와 같은 데이터를 쓴다(POL-071).\n   - 사용여부·성별·연령대·Google 판정 결과는 Google 채널 값으로 따로 저장한다.\n   - 판정 순서: 사용안함 → 노출제한 → 반영대기 → 미승인 → 검토중 → 활동중 (POL-052)\n   ========================================================================== */\nconst GStore = (function () {\n  const KEY = \"mktProto.google.v1\";\n  const G = window.GMOCK;\n  const STATES = [\"활동중\", \"검토중\", \"미승인\", \"노출제한\", \"사용안함\", \"반영대기\"];\n  const GOOGLE_STATES = [\"활동중\", \"검토중\", \"미승인\"];\n  const clone = (o) => JSON.parse(JSON.stringify(o));\n  function nowStr(offsetDays) {\n    const d = new Date(Date.now() + (offsetDays || 0) * 86400000);\n    const p = (n) => String(n).padStart(2, \"0\");\n    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;\n  }\n\n  /* ---------------- 프리셋 ---------------- */\n  function baseState() {\n    return {\n      account: \"none\", // none | connected | reauth (Google 계정, POL-037)\n      mc: \"none\", // none | connected | reauth (Merchant Center, POL-038)\n      mcSuspended: false, // 계정 정지됨 (POL-051)\n      mcAccount: null,\n      domain: \"none\", // none | verifying | done | fail\n      shipping: false,\n      firstMatchDone: false, // 최초 카테고리 매칭 모달 1회 자동 노출 (POL-063)\n      ads: \"none\", // none | connected | reauth\n      adsAccount: null,\n      mcLink: \"linked\", // Google Ads 기준 MC 연결 단계: none(Google Ads만 연결) | detected | linked\n      measure: { tag: true, enhanced: true, conv: true },\n      catUse: {},\n      prod: {},\n      lastFull: null,\n      lastAuto: null,\n      lastResult: null,\n      history: [],\n      queueAuto: true,\n      syncing: false,\n      // 통합 화면·권한 시나리오\n      apiFail: { meta: false, google: false },\n      noPerm: false,\n    };\n  }\n  function seedProducts(s) {\n    window.MOCK.products.forEach((p) => {\n      const g = { use: null, status: null, issue: null, dirty: false, gender: null, age: null };\n      if (p.id % 9 === 0) { g.status = \"미승인\"; g.issue = G.issueCodes[p.id % G.issueCodes.length]; }\n      else if (p.id % 10 === 0) g.status = \"검토중\";\n      else g.status = \"활동중\";\n      if (p.id % 14 === 0) g.dirty = true;\n      s.prod[p.id] = g;\n    });\n    s.prod[24].use = false;\n    s.catUse.c16 = false;\n  }\n  function presetFull() {\n    const s = baseState();\n    Object.assign(s, {\n      account: \"connected\", mc: \"connected\", mcAccount: clone(G.merchantCandidates[0]), domain: \"done\", shipping: true, firstMatchDone: true, autoMatchShown: true,\n      ads: \"connected\", adsAccount: clone(G.adsAccounts[0]), mcLink: \"linked\",\n      lastFull: nowStr(-3), lastAuto: nowStr(-0.1), lastResult: \"일부 실패\",\n    });\n    s.history = clone(G.syncHistory).map((h) => Object.assign(h, { atStr: nowStr(h.at) }));\n    seedProducts(s);\n    return s;\n  }\n  function presetAccountOnly() {\n    const s = baseState();\n    s.account = \"connected\";\n    seedEmpty(s);\n    return s;\n  }\n  function seedEmpty(s) {\n    window.MOCK.products.forEach((p) => (s.prod[p.id] = { use: null, status: null, issue: null, dirty: false, gender: null, age: null }));\n  }\n\n  let state = load() || presetFull();\n  function load() {\n    try {\n      const raw = localStorage.getItem(KEY);\n      return raw ? JSON.parse(raw) : null;\n    } catch (e) {\n      return null;\n    }\n  }\n  function save() {\n    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 저장 불가 환경 무시 */ }\n  }\n\n  /* ---------------- 연동 상태 ---------------- */\n  const accountOk = () => state.account === \"connected\";\n  const mcState = () => (state.account === \"reauth\" && state.mc !== \"none\" ? \"reauth\" : state.mc);\n  const adsState = () => (state.account === \"reauth\" && state.ads !== \"none\" ? \"reauth\" : state.ads);\n  const feedConnected = () => state.mc !== \"none\"; // 상품 피드 연동 = Merchant Center 연결\n  const queueBlocked = () => state.account === \"reauth\" || state.mc === \"reauth\"; // POL-059\n\n  /* ---------------- 판정 ---------------- */\n  const gp = (p) => state.prod[p.id] || (state.prod[p.id] = { use: null, status: null, issue: null, dirty: false, gender: null, age: null });\n  const validGpc = (id) => !!id && !!Store.gpc(id); // Google 택소노미 현재 버전에 있는지 (POL-073)\n  function effUse(p) {\n    const g = gp(p);\n    if (g.use != null) return g.use; // 상품 단위 설정 우선 (POL-066)\n    return !(p.cat && state.catUse[p.cat] === false);\n  }\n  function restriction(p) {\n    const r = p.r || {};\n    if (r.display) return \"display\";\n    if (r.sale) return \"sale\";\n    if (p.price === 0) return \"price0\";\n    if (r.priceText) return \"priceText\";\n    if (/개인\\s?결제/.test(p.name)) return \"privatePay\";\n    if (r.noImage) return \"noImage\";\n    if (r.noDesc) return \"noDesc\";\n    if (!validGpc(Store.effGpc(p))) return \"noGpc\";\n    return null; // 품절은 노출제한 사유가 아님 (POL-054)\n  }\n  function status(p) {\n    if (!effUse(p)) return \"사용안함\";\n    if (restriction(p)) return \"노출제한\";\n    const g = gp(p);\n    if (g.dirty || !g.status) return \"반영대기\";\n    return g.status;\n  }\n  function counts(list) {\n    const c = { 전체: list.length };\n    STATES.forEach((s) => (c[s] = 0));\n    list.forEach((p) => c[status(p)]++);\n    return c;\n  }\n  const products = () => Store.s.products;\n  /** 판정 주체 (SCR-GOOGLE-FEED-003) */\n  const judge = (st) => (GOOGLE_STATES.includes(st) ? \"Google\" : \"메이크샵\");\n\n  /* ---------------- 전송 큐 (자동 처리 시뮬레이션) ---------------- */\n  let qTimer = null;\n  function scheduleQueue() {\n    if (!state.queueAuto || !feedConnected()) return;\n    clearTimeout(qTimer);\n    qTimer = setTimeout(() => {\n      const n = api.processQueue();\n      if (n && window.UI) UI.toast(`전송 큐 처리 완료 — 반영대기 상품 ${n}건이 Merchant Center로 전송되어 검토중으로 바뀌었습니다.`, \"info\");\n      if (n && window.App && !document.querySelector(\".modal-overlay\")) App.render();\n    }, 5000);\n  }\n  function markDirty(cats, ids) {\n    products().forEach((p) => {\n      if (ids.includes(p.id) || (!p.gpc && cats.includes(p.cat))) gp(p).dirty = true;\n    });\n  }\n\n  const api = {\n    STATES,\n    GOOGLE_STATES,\n    get s() { return state; },\n    save,\n    nowStr,\n    accountOk, mcState, adsState, feedConnected, queueBlocked,\n    gp, validGpc, effUse, restriction, status, counts, judge, products,\n    scheduleQueue,\n\n    reset(preset) {\n      state = preset === \"full\" ? presetFull() : preset === \"account\" ? presetAccountOnly() : (() => { const s = baseState(); seedEmpty(s); return s; })();\n      save();\n    },\n\n    /* ---------- 연결 ---------- */\n    connectAccount() {\n      state.account = \"connected\";\n      save();\n    },\n    disconnectAll() {\n      const keep = { apiFail: state.apiFail, noPerm: state.noPerm, catUse: state.catUse };\n      state = Object.assign(baseState(), keep);\n      seedEmpty(state);\n      save();\n    },\n    connectMc(acc) {\n      state.mc = \"connected\";\n      state.mcAccount = clone(acc);\n      state.mcSuspended = false;\n      state.domain = \"none\";\n      state.shipping = false;\n      state.firstMatchDone = false;\n      state.autoMatchShown = false;\n      seedEmpty(state);\n      state.lastFull = state.lastAuto = state.lastResult = null;\n      state.history = [];\n      save();\n    },\n    /** Merchant Center 계정 변경 — 상품 피드 정보 초기화 후 전송 대상 반영대기 (POL-048) */\n    changeMc(acc) {\n      state.mcAccount = clone(acc);\n      products().forEach((p) => Object.assign(gp(p), { status: null, issue: null, dirty: true }));\n      save();\n      scheduleQueue();\n    },\n    /** Merchant Center만 해제 — 자동 전송 중단, 큐 비움, Google Ads 유지 (POL-049) */\n    disconnectMc() {\n      state.mc = \"none\";\n      state.mcAccount = null;\n      state.domain = \"none\";\n      state.shipping = false;\n      state.firstMatchDone = false;\n      state.autoMatchShown = false;\n      seedEmpty(state);\n      if (state.mcLink === \"linked\") state.mcLink = \"none\";\n      save();\n    },\n    connectAds(acc) {\n      state.ads = \"connected\";\n      state.adsAccount = clone(acc);\n      state.mcLink = state.mc !== \"none\" ? \"linked\" : \"none\";\n      save();\n    },\n    disconnectAds() {\n      state.ads = \"none\";\n      state.adsAccount = null;\n      save();\n    },\n\n    /* ---------- 공통 GPC 변경 ---------- */\n    /** Meta 쪽에서 공통 GPC를 바꾼 경우 호출된다 (Store.saveCategoryMap / saveProductSettings) */\n    onGpcChanged(cats, ids) {\n      if (!feedConnected()) return;\n      markDirty(cats, ids);\n      save();\n      scheduleQueue();\n    },\n    /** 카테고리 매칭 모달 [상품 피드 반영] — 공통 GPC·사용여부 저장, 두 채널 재판정 (POL-065, POL-072) */\n    saveCategoryMatch(rows) {\n      const changedCats = [];\n      rows.forEach((r) => {\n        const before = Store.s.catMap[r.cat] || null;\n        if (r.gpc !== before) {\n          if (r.gpc) Store.s.catMap[r.cat] = r.gpc;\n          else delete Store.s.catMap[r.cat];\n          changedCats.push(r.cat);\n        }\n        const wasUse = state.catUse[r.cat] !== false;\n        state.catUse[r.cat] = r.use;\n        if (wasUse !== r.use) changedCats.push(r.cat);\n      });\n      // 매칭된 카테고리 상품 중 전송 조건 충족 상품을 반영대기로 큐 등록 (최초 동기화 포함)\n      products().forEach((p) => {\n        if (changedCats.includes(p.cat) || !state.firstMatchDone) gp(p).dirty = true;\n      });\n      if (!state.firstMatchDone) {\n        state.firstMatchDone = true;\n        state.history.unshift({ atStr: nowStr(), type: \"최초 동기화\", result: \"진행 중\", target: products().filter((p) => status(p) === \"반영대기\").length, ok: 0, fail: 0 });\n      }\n      Store.save();\n      Store.applyCommonGpc(changedCats, []);\n      save();\n      scheduleQueue();\n    },\n    /** 상품 상세·선택 수정 [상품 피드 반영] (POL-065, POL-066, POL-070) */\n    saveProducts(rows) {\n      const gpcChanged = [];\n      const res = { queued: 0, restricted: 0, unused: 0 };\n      rows.forEach((row) => {\n        const p = products().find((x) => x.id === row.id);\n        const g = gp(p);\n        if ((row.gpc || null) !== (Store.effGpc(p) || null)) {\n          p.gpc = row.gpc || null;\n          gpcChanged.push(p.id);\n        }\n        g.use = row.use;\n        g.gender = row.gender || null;\n        g.age = row.age || null;\n        g.dirty = true;\n        const st = status(p);\n        if (st === \"반영대기\") res.queued++;\n        else if (st === \"노출제한\") res.restricted++;\n        else if (st === \"사용안함\") res.unused++;\n      });\n      Store.save();\n      if (gpcChanged.length) Store.applyCommonGpc([], gpcChanged);\n      save();\n      scheduleQueue();\n      return res;\n    },\n\n    /* ---------- 전송·동기화 ---------- */\n    queueSize: () => products().filter((p) => status(p) === \"반영대기\").length,\n    processQueue() {\n      if (queueBlocked()) return 0;\n      let n = 0;\n      products().forEach((p) => {\n        if (status(p) === \"반영대기\") {\n          Object.assign(gp(p), { status: \"검토중\", issue: null, dirty: false });\n          n++;\n        }\n      });\n      if (n) {\n        state.lastAuto = nowStr();\n        state.lastResult = \"성공\";\n        const pending = state.history.find((h) => h.result === \"진행 중\");\n        if (pending) Object.assign(pending, { result: \"성공\", ok: n, target: n });\n        else state.history.unshift({ atStr: nowStr(), type: \"자동 동기화\", result: \"성공\", target: n, ok: n, fail: 0 });\n        state.syncing = false;\n      }\n      save();\n      return n;\n    },\n    /** Google 심사 결과 반영 시뮬레이션: 검토중 → 활동중/미승인 */\n    syncGoogle() {\n      let n = 0;\n      products().forEach((p) => {\n        const g = gp(p);\n        if (status(p) === \"검토중\") {\n          n++;\n          if (p.id % 8 === 0) { g.status = \"미승인\"; g.issue = \"image_issue\"; }\n          else g.status = \"활동중\";\n        }\n      });\n      save();\n      return n;\n    },\n    /** [다시 동기화] — 전송 조건 충족 전체 상품 큐 등록 (POL-060) */\n    fullSync() {\n      products().forEach((p) => {\n        const st = status(p);\n        if (st !== \"사용안함\" && st !== \"노출제한\") gp(p).dirty = true;\n      });\n      state.syncing = true;\n      state.lastFull = nowStr();\n      state.lastResult = \"진행 중\";\n      state.history.unshift({ atStr: nowStr(), type: \"전체 동기화\", result: \"진행 중\", target: api.queueSize(), ok: 0, fail: 0 });\n      save();\n      scheduleQueue();\n    },\n\n    /* ---------- 통합 화면 값 ---------- */\n    /** 채널 등록 상품 수: 메이크샵이 전송해 채널에 등록된 상품(활동중·검토중·미승인) (POL-018) */\n    registeredCount: () => products().filter((p) => GOOGLE_STATES.includes(status(p))).length,\n  };\n  if (!Object.keys(state.prod).length) seedEmpty(state);\n  return api;\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   Meta 인증 팝업(Embedded Signup) 시뮬레이션\n   — 0단계(메이크샵 개인정보 동의 모달) 다음에 열리는, 실제 Meta OAuth 팝업을\n     최대한 유사하게 재현한 시뮬레이션. Meta가 소유·제공하는 화면이므로\n     실제 서비스에서는 이 팝업이 Meta 도메인에서 그대로 렌더링된다.\n   — 참고: 11_Reference/3-4. FBE 자산 연동(추정).png (전 구간 실 화면 캡처)\n   — 2026-10-19 결정: 커머스 계정 연동 제외. 커머스 계정 확인·커머스 계정 설정 완료 단계를 넣지 않는다.\n   ========================================================================== */\n\nconst FbeOAuth = (function () {\n  const APP_ID = \"2166377357431297\"; // 프로토타입 표기용 mock app id\n\n  function overlayRoot() {\n    let el = document.getElementById(\"fbwin-root\");\n    if (!el) {\n      el = document.createElement(\"div\");\n      el.id = \"fbwin-root\";\n      document.body.appendChild(el);\n    }\n    return el;\n  }\n\n  function close() {\n    const root = overlayRoot();\n    root.innerHTML = \"\";\n    if (typeof SidePanel !== \"undefined\") SidePanel.clearOverride();\n  }\n\n  function fLogoSvg(size) {\n    return `<svg width=\"${size}\" height=\"${size}\" viewBox=\"0 0 36 36\" fill=\"none\"><circle cx=\"18\" cy=\"18\" r=\"18\" fill=\"#1877F2\"/><path d=\"M25 18.06C25 13.6 21.42 10 17 10s-8 3.6-8 8.06c0 4.02 2.93 7.35 6.75 7.94v-5.61h-2.03v-2.33h2.03v-1.78c0-2.01 1.2-3.13 3.02-3.13.87 0 1.79.16 1.79.16v1.97h-1.01c-.99 0-1.3.62-1.3 1.25v1.5h2.22l-.36 2.33h-1.86v5.61C22.07 25.4 25 22.08 25 18.06Z\" fill=\"#fff\"/><\/svg>`;\n  }\n\n  /* ---------------- shared chrome renderer ---------------- */\n  function paintChrome(root, step, ctx) {\n    root.innerHTML = `\n      <div class=\"fbwin-overlay\">\n        <div class=\"fbwin\" role=\"dialog\" aria-modal=\"true\">\n          <div class=\"fbwin__titlebar\">\n            <span class=\"fbwin__favicon\">f<\/span>\n            <span class=\"fbwin__titletext\">${step.winTitle}<\/span>\n            <span class=\"fbwin__winctrl\"><span>&#8211;<\/span><span>&#9633;<\/span><span data-act=\"close\">&#10005;<\/span><\/span>\n          <\/div>\n          <div class=\"fbwin__addressbar\">\n            <span class=\"lock\">&#128274;<\/span>\n            <span class=\"url\">facebook.com${step.url}<\/span>\n          <\/div>\n          <div class=\"fbwin__progress\"><i style=\"width:${Math.round((ctx.stepIndex / (ctx.totalSteps - 1)) * 100)}%\"><\/i><\/div>\n          <div class=\"fbwin__body\" id=\"fbwin-body\"><\/div>\n          <div id=\"fbwin-footzone\"><\/div>\n        <\/div>\n      <\/div>\n    `;\n    root.querySelector('[data-act=\"close\"]').addEventListener(\"click\", () => ctx.cancel());\n    return root.querySelector(\"#fbwin-body\");\n  }\n\n  function renderNavFoot(zone, { onCancel, onBack, onNext, nextLabel, nextEnabled, hideCancel, hideBack }) {\n    zone.innerHTML = `\n      <div class=\"fbwin__navfoot\">\n        <div>${hideCancel ? \"\" : `<button class=\"fb-mini-btn\" data-nav=\"cancel\">취소<\/button>`}<\/div>\n        <div class=\"fbwin__navfoot-right\">\n          ${hideBack ? \"\" : `<button class=\"fb-mini-btn\" data-nav=\"back\">돌아가기<\/button>`}\n          <button class=\"fb-mini-btn fb-mini-btn--primary\" data-nav=\"next\" ${nextEnabled ? \"\" : \"disabled\"}>${nextLabel || \"다음\"}<\/button>\n        <\/div>\n      <\/div>\n    `;\n    if (!hideCancel) zone.querySelector('[data-nav=\"cancel\"]').addEventListener(\"click\", onCancel);\n    if (!hideBack) zone.querySelector('[data-nav=\"back\"]').addEventListener(\"click\", onBack);\n    zone.querySelector('[data-nav=\"next\"]').addEventListener(\"click\", () => {\n      if (zone.querySelector('[data-nav=\"next\"]').disabled) return;\n      onNext();\n    });\n  }\n\n  function radioList(container, items, selectedId, onChange) {\n    container.innerHTML = `<div class=\"fblist\">${items\n      .map(\n        (it) => `\n      <div class=\"fbrow ${it.id === selectedId ? \"is-selected\" : \"\"} ${it.disabled ? \"is-disabled\" : \"\"}\" data-id=\"${it.id}\">\n        <div class=\"fbrow__icon ${it.round ? \"fbrow__icon--circle\" : \"\"}\">${it.icon || \"\"}<\/div>\n        <div class=\"fbrow__body\">\n          <div class=\"fbrow__name\">${it.name}<\/div>\n          ${it.desc ? `<div class=\"fbrow__desc\">${it.desc}<\/div>` : \"\"}\n        <\/div>\n        <div class=\"fbrow__radio\"><\/div>\n      <\/div>`\n      )\n      .join(\"\")}<\/div>`;\n    container.querySelectorAll(\".fbrow\").forEach((row) => {\n      if (row.classList.contains(\"is-disabled\")) return;\n      row.addEventListener(\"click\", () => onChange(row.getAttribute(\"data-id\")));\n    });\n  }\n\n  /* ---------------- step definitions ---------------- */\n  function buildSteps(sel) {\n    return [\n      /* 1: LOGIN */\n      {\n        winTitle: \"Facebook - Chrome\",\n        url: \"/login.php?skip_api_login=1&api_key=\" + APP_ID,\n        sideTitle: \"Facebook 로그인\",\n        sideDesc: `\n          <p>Meta(Facebook) 계정으로 로그인하는 화면입니다.<\/p>\n          <p>이 화면은 Meta가 제공하는 화면이며, 메이크샵은 화면 구성이나 진행 순서를 임의로 바꿀 수 없습니다.<\/p>\n          <p>로그인 정보가 확인되어야 다음 단계인 권한 동의 화면으로 넘어갈 수 있습니다.<\/p>\n        `,\n        custom: true,\n        render(body, ctx) {\n          body.innerHTML = `\n            <div class=\"fbwin__brand\">${fLogoSvg(56)}<\/div>\n            <div style=\"margin-bottom:18px;\">\n              <input class=\"fbfield\" id=\"fb-email\" type=\"text\" placeholder=\"이메일 또는 휴대폰 번호\" value=\"${sel.email}\"/>\n              <input class=\"fbfield\" id=\"fb-pw\" type=\"password\" placeholder=\"비밀번호\" value=\"${sel.password || \"\"}\"/>\n              <button class=\"fbbtn fbbtn--primary\" id=\"fb-login-btn\">로그인<\/button>\n              <a class=\"fbbtn--link\">비밀번호를 잊으셨나요?<\/a>\n              <hr class=\"fbdivider\"/>\n              <button class=\"fbbtn fbbtn--outline\" id=\"fb-newacct-btn\">새 계정 만들기<\/button>\n            <\/div>\n          `;\n          const email = body.querySelector(\"#fb-email\");\n          const pw = body.querySelector(\"#fb-pw\");\n          const btn = body.querySelector(\"#fb-login-btn\");\n          function sync() {\n            btn.disabled = !(email.value.trim() && pw.value.trim());\n          }\n          email.addEventListener(\"input\", sync);\n          pw.addEventListener(\"input\", sync);\n          sync();\n          btn.addEventListener(\"click\", () => {\n            if (!(email.value.trim() && pw.value.trim())) return;\n            sel.email = email.value.trim();\n            sel.password = pw.value;\n            ctx.next();\n          });\n          body.querySelector(\"#fb-newacct-btn\").addEventListener(\"click\", () =>\n            UI.toast(\"프로토타입에서는 신규 Facebook 계정 생성을 시뮬레이션하지 않습니다.\", \"success\")\n          );\n        },\n        footStyle: \"meta\",\n      },\n\n      /* 2: OAUTH CONSENT */\n      {\n        winTitle: \"Facebook으로 로그인 - Chrome\",\n        url: \"/v22.0/dialog/oauth?app_id=\" + APP_ID,\n        sideTitle: \"권한 동의\",\n -ok\").addEventListener(\"click\", () => ctx.next());\n        },\n        footStyle: \"links\",\n      },\n\n      /* 11: PERMISSIONS */\n      {\n        winTitle: \"Facebook으로 로그인 - Chrome\",\n        url: \"/v22.0/dialog/oauth?app_id=\" + APP_ID,\n        sideTitle: \"권한 확인\",\n        sideDesc: `\n          <p>메이크샵 앱에 어떤 권한이 허용되었는지 확인하는 화면입니다.<\/p>\n          <p>이메일 수신, 카탈로그 관리, 비즈니스 확장 기능 관리, 광고 계정 관리 등의 권한 목록이 표시됩니다.<\/p>\n          <p>권한을 임의로 해제하면 메이크샵 앱의 일부 기능이 정상적으로 동작하지 않을 수 있습니다.<\/p>\n        `,\n        render(body, ctx) {\n          const perms = [\n            [\"&#9993;\", \"이메일 주소 정보 수신\", sel.email],\n            [\"&#128230;\", \"제품 카탈로그 관리\", sel.catalog],\n            [\"&#9881;\", \"비즈니스 확장 기능 관리\", \"추가 비즈니스 관리 확장 인터페이스 트리거\"],\n            [\"&#128200;\", \"액세스 권한이 있는 광고 계정의 광고 관리\", sel.adAccount],\n          ];\n          body.innerHTML = `\n            <h2 class=\"fbstep-head\">MakeShop 앱에 어떤 권한이 허용되었나요?<\/h2>\n            <div style=\"background:#fff7ed; border:1px solid #fed7aa; border-radius:6px; padding:10px 12px; font-size:11px; color:#9a3412; margin-bottom:10px;\">\n              이 옵션을 해제하면 MakeShop 앱이 제대로 작동하지 않을 수 있습니다.\n            <\/div>\n            <div id=\"fb-perm-list\">\n              ${perms\n                .map(\n                  ([ico, name, desc]) => `\n                <div class=\"fbperm-row\"><span class=\"ico\">${ico}<\/span><div><div style=\"font-weight:600;\">${name}<\/div><div style=\"color:#8a8d91;\">${desc}<\/div><\/div><\/div>`\n                )\n                .join(\"\")}\n            <\/div>\n          `;\n          ctx.setNextEnabled(true);\n        },\n        footStyle: \"nav\",\n      },\n\n      /* 12: DONE */\n      {\n        winTitle: \"Facebook으로 로그인 - Chrome\",\n        url: \"/v22.0/dialog/oauth?app_id=\" + APP_ID,\n        sideTitle: \"연동 완료\",\n        sideDesc: `\n          <p>Meta 자산 연동이 모두 완료되었음을 안내하는 화면입니다.<\/p>\n          <p>연동이 끝나면 더 많은 사람에게 비즈니스를 알리고, 구매 가능성이 높은 잠재 고객을 찾고, 웹사이트에서 발생한 행동 결과를 측정할 수 있습니다.<\/p>\n          <p>완료를 누르면 메이크샵 어드민으로 돌아오고, 광고 만들기를 선택하면 Meta 광고 관리자로 이동합니다.<\/p>\n        `,\n        custom: true,\n        render(body, ctx) {\n          body.innerHTML = `\n            <div class=\"fbwin__illust\">&#127881;<\/div>\n            <h2 class=\"fbwin__title\" style=\"font-size:17px;\">완료되었습니다!<\/h2>\n            <p class=\"fbwin__sub\">이제 웹사이트가 Facebook에 연결되었으므로 다음 작업을 수행할 수 있습니다:<\/p>\n            <ul class=\"fbwin__done-list\">\n              <li><span class=\"num\">1<\/span>더 많은 사람이 비즈니스를 발견하도록 유도해보세요<\/li>\n              <li><span class=\"num\">2<\/span>제품 및 서비스를 구매할 가능성이 높은 사람들을 찾을 수 있습니다<\/li>\n              <li><span class=\"num\">3<\/span>웹사이트에서 발생한 행동 결과를 측정할 수 있습니다<\/li>\n            <\/ul>\n            <div style=\"display:flex; gap:10px; margin-top:10px;\">\n              <button class=\"fbbtn fbbtn--outline\" id=\"fb-done-finish\" style=\"flex:1;\">완료<\/button>\n              <button class=\"fbbtn fbbtn--primary\" id=\"fb-done-ads\" style=\"flex:1.4;\">광고 만들기<\/button>\n            <\/div>\n          `;\n          body.querySelector(\"#fb-done-finish\").addEventListener(\"click\", () => ctx.finish(false));\n          body.querySelector(\"#fb-done-ads\").addEventListener(\"click\", () => ctx.finish(true));\n        },\n        footStyle: \"links\",\n      },\n    ];\n  }\n\n  /* ---------------- controller ---------------- */\n  function open({ onComplete, onCancel }) {\n    const account = window.MOCK.account;\n    const adAccount = window.MOCK.adAccount;\n    const emailMatch = /\\(([^)]+)\\)/.exec(account.fbAccountLabel);\n    const sel = {\n      email: emailMatch ? emailMatch[1] : \"user@example.com\",\n      password: \"\",\n      displayName: account.fbAccountLabel.split(\"(\")[0].trim(),\n      portfolio: account.businessManagerName,\n      portfolioChoice: \"biz\",\n      page: account.pageName,\n      pageChoice: \"page1\",\n      instagramHandle: account.instagramUsername,\n      igChoice: account.instagramConnected ? \"ig1\" : \"skip\",\n      catalog: account.businessManagerName + \" 카탈로그\",\n      catalogChoice: \"cat1\",\n      adAccount: adAccount.name,\n      adAccountId: adAccount.id,\n      adAccountChoice: \"ad1\",\n      pixel: \"Meta 픽셀(\" + account.businessManagerName + \")\",\n      pixelId: account.pixelId,\n      pixelChoice: \"pixel1\",\n    };\n\n    const steps = buildSteps(sel);\n    let idx = 0;\n    const root = overlayRoot();\n\n    function paintStep() {\n      const step = steps[idx];\n      if (typeof SidePanel !== \"undefined\") SidePanel.setOverride(step.sideTitle, step.sideDesc);\n      const ctx = {\n        stepIndex: idx,\n        totalSteps: steps.length,\n        next: () => {\n          if (idx < steps.length - 1) {\n            idx++;\n            paintStep();\n          }\n        },\n        back: () => {\n          if (idx > 0) {\n            idx--;\n            paintStep();\n          }\n        },\n        cancel: () => {\n          close();\n          if (onCancel) onCancel();\n        },\n        finish: (wantsAds) => {\n          close();\n          if (onComplete) onComplete(sel, wantsAds);\n        },\n        setNextEnabled: (val) => {\n          const btn = root.querySelector('[data-nav=\"next\"]');\n          if (btn) btn.disabled = !val;\n        },\n      };\n\n      const body = paintChrome(root, step, ctx);\n      const footZone = root.querySelector(\"#fbwin-footzone\");\n\n      if (step.footStyle === \"meta\") {\n        footZone.innerHTML = `<div class=\"fbwin__foot\"><span class=\"fbwin__meta-logo\">&#8734; Meta<\/span><\/div>`;\n      } else if (step.footStyle === \"links\") {\n        footZone.innerHTML = `\n          <div class=\"fbwin__footlinks\">\n            <span>문제가 있으신가요? <a>문의하기<\/a><\/span>\n            <a>고객 센터<\/a>\n          <\/div>`;\n      } else if (step.footStyle === \"nav\") {\n        renderNavFoot(footZone, {\n          onCancel: ctx.cancel,\n          onBack: ctx.back,\n          onNext: ctx.next,\n          nextEnabled: false,\n          hideBack: idx === 0,\n        });\n      }\n\n      step.render(body, ctx);\n    }\n\n    paintStep();\n  }\n\n  return { open };\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   Info Layer(툴팁) 문구 — 04_Screen-Spec 기준\n   data-info=\"<key>\" 를 가진 (?) 버튼 클릭 시 UI.infoLayer 로 노출\n   ========================================================================== */\nconst INFO = (function () {\n  const more = (state) => ` <a class=\"lnk\" data-goto-feed=\"${state}\">자세히보기<\/a>`;\n  const stateList = `\n    <li><b>활동중 :<\/b> Meta 승인이 완료되어 정상적으로 노출 중인 상태입니다.<\/li>\n    <li><b>검토중 :<\/b> Meta에서 상품을 검수하고 있는 상태입니다.<\/li>\n    <li><b>미승인 :<\/b> Meta 정책 위반 등으로 승인이 거부된 상태입니다.${more(\"미승인\")}<\/li>\n    <li><b>노출제한 :<\/b> 카테고리 미매칭 또는 상품 품질 조건에 해당하여 메이크샵에서 전송을 제한한 상태입니다.${more(\"노출제한\")}<\/li>\n    <li><b>사용안함 :<\/b> 사용여부 해제로 피드에서 제외된 상태입니다.<\/li>\n    <li><b>반영대기 :<\/b> Meta 상품 피드에 현재 반영 대기 중인 상태입니다.${more(\"반영대기\")}<\/li>`;\n  const data = {\n    mktReg: {\n      title: \"채널 등록 상품 수\",\n      html: `<ul><li>메이크샵이 전송해 채널에 등록된 상품 수입니다(활동중·검토중·미승인).<\/li><li>반영대기·노출제한·사용안함 상품과 채널에서 직접 등록한 상품은 세지 않습니다.<\/li><li>Google은 Merchant Center가 연결되지 않았으면 '-'로 표시합니다.<\/li><\/ul>`,\n    },\n    catalog: {\n      title: \"카탈로그 연동 상품\",\n      html: `<ul><li>카탈로그 연동 상품은 메이크샵 상품이 Meta 카탈로그로 전송된 현황을 상태별로 요약한 항목입니다.<\/li>\n        <li>각 상태별 상품 수와 비율을 통해 전체 상품의 연동 현황을 한눈에 확인할 수 있습니다.<ul>${stateList}<\/ul><\/li>\n        <li>상태별 상세 현황 및 상품 관리는 상품 피드 탭에서 확인할 수 있습니다.<\/li><\/ul>`,\n    },\n    approval: {\n      title: \"승인상태\",\n      html: `<ul><li>승인상태는 상품이 Meta 상품 피드에 반영된 결과를 나타내는 항목이며, 메이크샵 사전 처리 단계와 Meta 심사 단계를 거쳐 승인 상태가 결정됩니다.<ul>${stateList}<\/ul><\/li><\/ul>`,\n    },\n    useFeed: {\n      title: \"사용여부\",\n      html: `<ul><li>사용여부는 해당 상품을 Meta 상품 피드로 전송할지 여부를 설정하는 항목입니다.<\/li>\n        <li>사용함으로 설정한 상품은 카테고리 매칭 정보와 함께 Meta 카탈로그로 전송됩니다.<\/li>\n        <li>사용안함으로 설정한 상품은 카테고리 매칭 여부와 관계없이 피드에서 제외되며, Meta에 노출되지 않습니다.<\/li>\n        <li>사용안함으로 설정한 상품은 '사용안함' 상태로 표시됩니다.<\/li><\/ul>`,\n    },\n    reason: {\n      title: \"사유\",\n      html: `<ul><li><b>미승인<\/b> : Meta API를 통해 전달받은 미승인 사유를 기준으로 안내 문구를 노출합니다.<\/li>\n        <li><b>노출제한<\/b> : 메이크샵 상품 검증 결과에 따라 노출제한 사유를 안내합니다.<\/li><\/ul>`,\n    },\n    adStatus: {\n      title: \"계정 상태\",\n      html: `<ul><li>계정 상태는 연동된 Meta 광고 계정의 현재 운영 상태를 나타내는 항목입니다.<\/li>\n        <li>계정 상태는 Meta 기준으로 표시되며, 상태 변경은 Meta 광고 관리자에서 확인·처리할 수 있습니다.<ul>\n        <li><b>활성 :<\/b> 정상 상태로 광고 집행이 가능합니다.<\/li>\n        <li><b>차단 :<\/b> 정책 위반 등으로 Meta가 계정을 비활성화하여 광고 집행이 불가한 상태입니다.<\/li>\n        <li><b>비활성 :<\/b> 계정이 해지되었거나 종료된 상태입니다.<\/li>\n        <li><b>미결제 :<\/b> 결제 실패 등 미정산 금액으로 광고가 중단된 상태입니다.<\/li>\n        <li><b>펜딩 :<\/b> Meta의 검토(리스크 검토·정산 대기 등)가 진행 중인 상태입니다.<\/li><\/ul><\/li><\/ul>`,\n    },\n    credit: {\n      title: \"잔여 크레딧\",\n      html: `<ul><li>잔여 크레딧은 광고 계정에 남아 있는 사용 가능한 광고 비용을 나타내는 항목입니다.<\/li>\n        <li>선불 계정의 경우 충전된 잔여 금액이 표시됩니다.<\/li>\n        <li>후불 계정의 경우 잔여 크레딧은 0으로 표시되며, 후불 결제 방식임을 함께 안내합니다.<\/li>\n        <li>크레딧 충전 및 결제 수단 변경은 Meta 광고 관리자에서 처리할 수 있습니다.<\/li><\/ul>`,\n    },\n    capi: {\n      title: \"Meta 전환 API(CAPI) 연동\",\n      html: `<ul><li>메이크샵 서버와 Meta 서버를 연결해 쇼핑몰에서 발생한 고객 행동 데이터를 직접 전송하는 기능입니다.<\/li>\n        <li>상품 조회부터 장바구니, 주문, 구매까지 광고 성과 측정에 필요한 주요 이벤트를 전달합니다.<\/li>\n        <li>브라우저 환경에 따라 일부 데이터가 누락되는 경우를 보완하여 보다 안정적인 전환 측정을 지원합니다.<\/li>\n        <li>전송된 데이터는 페이스북·인스타그램 광고의 전환 및 구매 성과 분석에 활용됩니다.<\/li><\/ul>`,\n    },\n    naver: {\n      title: \"네이버페이 구매 전환\",\n      html: `<ul><li>네이버페이 주문형으로 결제된 구매 건을 Meta 광고 전환으로 수집할지 설정하는 항목입니다.<\/li>\n        <li>네이버페이 주문형은 결제가 외부 채널에서 완료되어 픽셀로 전환이 수집되지 않으므로, 전환 API(CAPI)를 통해 서버에서 직접 구매 정보를 전송합니다.<\/li>\n        <li>사용으로 설정하면 네이버페이 주문형 결제 완료 건이 Meta 광고 성과에 구매 전환으로 반영됩니다.<\/li>\n        <li>동일 주문의 중복 전환은 주문번호 기준으로 자동 제거되어 한 건으로 집계됩니다.<\/li>\n        <li>사용안함으로 설정하면 네이버페이 주문형 결제 건은 전환으로 수집되지 않습니다.<\/li>\n        <li>네이버 연동 설정에서 주문형 네이버페이 사용 및 공통 인증키가 입력된 경우에만 사용할 수 있습니다.<\/li><\/ul>`,\n    },\n    kakao: {\n      title: \"카카오톡 체크아웃 구매 전환\",\n      html: `<ul><li>카카오톡 체크아웃으로 결제된 구매 건을 Meta 광고 전환으로 수집할지 설정하는 항목입니다.<\/li>\n        <li>카카오톡 체크아웃은 결제가 외부 채널에서 완료되어 픽셀로 전환이 수집되지 않으므로, 전환 API(CAPI)를 통해 서버에서 직접 구매 정보를 전송합니다.<\/li>\n        <li>사용으로 설정하면 카카오톡 체크아웃 결제 완료 건이 Meta 광고 성과에 구매 전환으로 반영됩니다.<\/li>\n        <li>동일 주문의 중복 전환은 주문번호 기준으로 자동 제거되어 한 건으로 집계됩니다.<\/li>\n        <li>사용안함으로 설정하면 카카오톡 체크아웃 결제 건은 전환으로 수집되지 않습니다.<\/li>\n        <li>카카오 연동 설정에서 톡 체크아웃이 연동된 경우에만 사용할 수 있습니다.<\/li><\/ul>`,\n    },\n  };\n\n  /** 컨테이너 내 (?) 버튼 바인딩 */\n  function bind(root) {\n    root.querySelectorAll(\"[data-info]\").forEach((b) =>\n      b.addEventListener(\"click\", (e) => {\n        e.stopPropagation();\n        const d = data[b.dataset.info];\n        if (d) UI.infoLayer(b, d.title, d.html);\n      })\n    );\n  }\n  // 툴팁 내 '자세히보기' → 상품 피드 탭의 해당 상태 필터로 이동\n  document.addEventListener(\"click\", (e) => {\n    const a = e.target.closest && e.target.closest(\"[data-goto-feed]\");\n    if (!a) return;\n    UI.closeInfo();\n    document.querySelectorAll(\".modal-overlay\").forEach((m) => m.remove());\n    document.body.classList.remove(\"is-modal-open\");\n    location.hash = \"#/meta/feed?tab=\" + encodeURIComponent(a.dataset.gotoFeed);\n  });\n  return { data, bind };\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   SCR 3-2 · Meta 비즈니스 홈\n   - 각 영역 버튼은 연동 상태에 따라 [설정하기] 또는 [자세히 보기] 중 1개만 노출\n   ========================================================================== */\nconst HomePage = (function () {\n  const ILL = {\n    connect: '<svg viewBox=\"0 0 120 120\" width=\"110\" height=\"110\"><g fill=\"none\" stroke=\"#1877f2\" stroke-width=\"14\" stroke-linecap=\"round\"><path d=\"M52 68 30 90a14 14 0 0 1-20-20l22-22\"/><path d=\"M68 52 90 30a14 14 0 0 1 20 20L88 72\"/><\/g><path d=\"M45 75 75 45\" stroke=\"#64a9ff\" stroke-width=\"12\" stroke-linecap=\"round\"/><circle cx=\"86\" cy=\"88\" r=\"16\" fill=\"#cfe3ff\"/><circle cx=\"86\" cy=\"88\" r=\"6\" fill=\"#fff\"/><\/svg>',\n    feed: '<svg viewBox=\"0 0 120 120\" width=\"110\" height=\"110\"><path d=\"M14 38h22c14 0 22 44 38 44h24\" fill=\"none\" stroke=\"#1877f2\" stroke-width=\"12\" stroke-linecap=\"round\"/><path d=\"M14 82h22c14 0 22-44 38-44h24\" fill=\"none\" stroke=\"#9ec9ff\" stroke-width=\"12\" stroke-linecap=\"round\"/><path d=\"m92 26 14 12-14 12M92 70l14 12-14 12\" fill=\"none\" stroke=\"#1877f2\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>',\n    ads: '<svg viewBox=\"0 0 120 120\" width=\"110\" height=\"110\"><path d=\"M44 46h18l34-20v68L62 74H44z\" fill=\"#1877f2\"/><rect x=\"26\" y=\"46\" width=\"20\" height=\"28\" rx=\"4\" fill=\"#64a9ff\"/><path d=\"M98 52h10M98 68h10\" stroke=\"#1877f2\" stroke-width=\"7\" stroke-linecap=\"round\"/><circle cx=\"40\" cy=\"88\" r=\"16\" fill=\"#cfe3ff\"/><circle cx=\"40\" cy=\"88\" r=\"6\" fill=\"#fff\"/><\/svg>',\n    shops: '<svg viewBox=\"0 0 120 120\" width=\"110\" height=\"110\"><rect x=\"26\" y=\"34\" width=\"70\" height=\"60\" rx=\"10\" fill=\"#1877f2\"/><rect x=\"26\" y=\"20\" width=\"70\" height=\"28\" rx=\"8\" fill=\"#9ec9ff\"/><path d=\"M44 20v18a8 8 0 0 0 16 0V20M62 20v18a8 8 0 0 0 16 0V20\" fill=\"#cfe3ff\"/><rect x=\"64\" y=\"62\" width=\"22\" height=\"9\" rx=\"4.5\" fill=\"#fff\"/><circle cx=\"30\" cy=\"92\" r=\"14\" fill=\"#cfe3ff\"/><circle cx=\"30\" cy=\"92\" r=\"5\" fill=\"#fff\"/><\/svg>',\n  };\n  const AREAS = [\n    {\n      key: \"connect\", title: \"연결 관리\",\n      desc: \"Meta 비즈니스 기능 사용을 위해 필요한 계정을 연결하는 공간입니다. 페이스북 FBE(Facebook Business Extension) 로그인을 통해<br>Facebook 페이지, 인스타그램 계정, 광고 계정, 픽셀, 제품 카탈로그, Commerce Manager 등을 한 번에 연동할 수 있습니다.<br>연결 완료 후에는 상품 연동부터 광고 성과 측정 등 Meta 관련 기능을 메이크샵에서 통합 관리할 수 있으며, 현재 연결된 계정 및 권한 상태도 함께 확인할 수 있습니다.\",\n      done: (s) => s.connected,\n    },\n    {\n      key: \"feed\", title: \"상품 피드\",\n      desc: \"메이크샵 상품을 Meta 제품 카탈로그와 연동하고 관리하는 공간입니다. 쇼핑 채널 및 광고 운영에 필요한 상품 데이터를 Meta로 전달하며,<br>상품 연동 상태·동기화 현황·오류 여부 등을 확인할 수 있습니다.<br>카탈로그 생성 이후 상품의 등록·수정·삭제 등 변경 사항이 자동으로 업데이트되며, 최신 상품 정보가 Meta 채널에 지속적으로 반영됩니다.\",\n      done: (s) => s.connected && s.categorySaved, // 미설정(카테고리 매칭 전)/미연동 → 설정하기\n    },\n    {\n      key: \"ads\", title: \"광고 관리\",\n      desc: \"Meta 광고 운영 상태와 주요 정보를 확인하는 공간입니다. 연결된 광고 계정 정보부터 광고 상태, 주요 성과 정보를 확인할 수 있으며,<br>Meta 광고 관리자와 연계하여 광고 운영을 이어갈 수 있습니다.<br>단순 계정 연결 상태가 아닌 실제 광고 운영 현황 중심으로 정보를 제공합니다.\",\n      done: (s) => s.connected,\n    },\n    {\n      key: \"shops\", title: \"Shops 관리\",\n      desc: \"Meta Shops를 이용하면 메이크샵 상품을 Facebook과 Instagram에서 고객에게 노출할 수 있습니다.<br>상품 정보는 연결된 Meta 제품 카탈로그를 통해 제공되며, Shop 생성 및 판매 채널 설정은 Meta Commerce Manager에서 진행할 수 있습니다.\",\n      done: (s) => s.connected,\n    },\n  ];\n\n  function render(root) {\n    const s = Store.s;\n    AREAS.forEach((a) => {\n      const done = a.done(s);\n      const el = document.createElement(\"section\");\n      el.className = \"card home-card\";\n      el.innerHTML = `\n        <div class=\"home-card__txt\">\n          <h3>${a.title}<\/h3>\n          <p>${a.desc}<\/p>\n          <div class=\"home-card__btns\">${done ? `<button type=\"button\" class=\"btn btn--gray btn--lg\" data-go=\"${a.key}\">자세히 보기<\/button>` : `<button type=\"button\" class=\"btn btn--primary btn--lg\" data-go=\"${a.key}\">설정하기<\/button>`}<\/div>\n        <\/div>\n        <div class=\"home-card__ill\" aria-hidden=\"true\">${ILL[a.key]}<\/div>`;\n      el.querySelector(\"[data-go]\").addEventListener(\"click\", () => App.go(a.key));\n      root.appendChild(el);\n    });\n  }\n  return { render };\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   SCR 3-3 · 연결 관리 탭 (미연동 / 연동완료) + 3-3-2 상품 카테고리 매칭 모달\n   ========================================================================== */\nconst ConnectPage = (function () {\n  const A = () => window.MOCK.account;\n  const AD = () => window.MOCK.adAccount;\n\n  function render(root) {\n    const s = Store.s;\n    if (!s.connected) {\n      root.appendChild(\n        App.emptyState({\n          title: \"페이스북부터 인스타그램까지,<br>한 곳에서 간편하게 관리하세요.\",\n          desc: \"한 번의 로그인으로 필요한 채널을 빠르고 안전하게 연동할 수 있습니다.\",\n          btn: \"Facebook Business Extension 시작하기\",\n          fbIcon: true,\n          note: \"FBE(Facebook Business Extension)를 이용하면 Facebook 페이지 연결, 비즈니스 관리자 연결, 광고 계정, 픽셀, 카탈로그 등을 한 번에 설정할 수 있습니다.\",\n          onClick: App.startFbe,\n        })\n      );\n      return;\n    }\n    root.appendChild(\n      App.banner(\n        \"연결 관리\",\n        \"Meta 비즈니스 기능 사용을 위해 필요한 계정을 연결하는 공간입니다. 페이스북 FBE(Facebook Business Extension) 로그인을 통해 Facebook 페이지, 광고 계정, 픽셀, 제품 카탈로그, Commerce Manager 등을<br>한 번에 연동할 수 있습니다. 연결 완료 후에는 상품 연동부터 광고 성과 측정 등 Meta 관련 기능을 메이크샵에서 통합 관리할 수 있으며, 현재 연결된 계정 및 권한 상태도 함께 확인할 수 있습니다.\"\n      )\n    );\n    root.appendChild(assetSection());\n    root.appendChild(feedSection());\n    root.appendChild(adsSection());\n    if (!s.domainVerified) root.appendChild(domainSection());\n  }\n\n  /* ---------------- 2. 비즈니스 자산 연동 정보 ---------------- */\n  function assetSection() {\n    const s = Store.s;\n    const a = A();\n    const bid = a.businessId;\n    const fail = (key) => s.assetError === key;\n    const failCell = `<span class=\"pill pill--red\">확인불가<\/span><span class=\"row-hint\">자산 조회에 실패했습니다(권한 부족·토큰 만료 등). [설정]에서 재연동해 주세요.<\/span>`;\n    const rows = [\n      [\"페이스북 계정\", `${UI.esc(a.fbEmail)} <span class=\"pill pill--blue\">연결됨<\/span>`, null],\n      [\"비즈니스 관리자\", UI.esc(a.businessManagerName), [\"비즈니스 관리자 바로가기\", `https://business.facebook.com/settings/info?business_id=${bid}`]],\n      [\"페이지\", fail(\"page\") ? failCell : UI.esc(a.pageName), fail(\"page\") ? null : [\"페이지 바로가기\", `https://www.facebook.com/${a.pageId}`]],\n      [\"픽셀 정보\", fail(\"pixel\") ? failCell : `픽셀 ID : ${a.pixelId}`, fail(\"pixel\") ? null : [\"이벤트 관리자 바로가기\", `https://business.facebook.com/events_manager2/list/pixel/${a.pixelId}/overview?business_id=${bid}`]],\n      [\"인스타그램 계정\", s.ig ? \"@\" + UI.esc(a.instagramUsername) : '<span class=\"pill pill--gray\">미연결<\/span>', s.ig ? [\"인스타그램 설정 바로가기\", `https://business.facebook.com/settings/instagram-account-v2s?business_id=${bid}`] : null],\n    ];\n    const body = `<dl class=\"kv\">${rows\n      .map((r) => `<div class=\"kv__row\"><dt>${r[0]}<\/dt><dd>${r[1]}<\/dd><dd class=\"kv__link\">${r[2] ? `<a class=\"ext\" data-ext=\"${r[2][0]}\" data-url=\"${r[2][1]}\">${r[2][0]} ${UI.icon.ext}<\/a>` : \"\"}<\/dd><\/div>`)\n      .join(\"\")}<\/dl>`;\n    const el = App.section(\"비즈니스 자산 연동 정보\", `<button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"unlink\">연결 해제<\/button><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"setting\">${UI.icon.gear} 설정<\/button>`, body);\n    bindExt(el);\n    el.querySelector('[data-act=\"setting\"]').addEventListener(\"click\", () => App.openWizard(false));\n    el.querySelector('[data-act=\"unlink\"]').addEventListener(\"click\", unlink);\n    return el;\n  }\n  async function unlink() {\n    const ok = await UI.confirm(\"연결을 해제하면 Meta 상품 피드 동기화, 광고 계정 조회 및 전환 추적 기능이 중단됩니다. 이미 Meta에 전달된 정보의 삭제는 Meta 정책에 따릅니다.\\n연결을 해제하시겠습니까?\");\n    if (!ok) return;\n    const r = Store.s.unlinkResult;\n    if (r === \"network\") return UI.alert(\"연결 해제에 실패했습니다. 잠시 후 다시 시도해 주세요.\");\n    if (r === \"auth\") return UI.alert(\"연결 해제 권한이 만료되었습니다. 다시 로그인 후 시도해 주세요.\");\n    Store.disconnect();\n    App.go(\"connect\");\n    UI.toast(\"Meta 비즈니스 연결이 해제되었습니다. 최초 연동 가이드 화면으로 전환됩니다.\", \"success\");\n  }\n\n  /* ---------------- 3. 상품 피드 요약 ---------------- */\n  function feedSection() {\n    const s = Store.s;\n    const matched = Object.keys(s.catMap).length;\n    const active = s.categorySaved && matched > 0;\n    const c = active ? Store.counts(s.products) : { 전체: 0, 활동중: 0, 검토중: 0, 미승인: 0, 노출제한: 0, 사용안함: 0, 반영대기: 0 };\n    const body = `\n      <dl class=\"kv\">\n        <div class=\"kv__row\"><dt>카테고리 설정<\/dt><dd>${active ? `<span class=\"pill pill--solid-blue\">설정완료<\/span><span class=\"muted\">매칭 ${matched} / ${Store.leafCategories().length}개 카테고리<\/span>` : \"미설정\"} <button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"match\">상품 카테고리 매칭<\/button><\/dd><\/div>\n        <div class=\"kv__row kv__row--top\"><dt>카탈로그 연동 상품 ${UI.qmark(\"catalog\")}<\/dt><dd class=\"kv__wide\">${statusBar(c, active ? s.lastUpdate : null)}<\/dd><\/div>\n      <\/dl>`;\n    const el = App.section(\"상품 피드\", \"\", body);\n    el.querySelector('[data-act=\"match\"]').addEventListener(\"click\", () => openCategoryMatch(false));\n    return el;\n  }\n  /** 상태별 요약 바 + 범례 (연결 관리·상품 피드 탭 공용) */\n  function statusBar(c, lastUpdate, hideTotal) {\n    const total = c.전체 || 0;\n    const segs = Store.FEED_STATES.map((st) => (total && c[st] ? `<span class=\"sb sb--${st}\" style=\"width:${(c[st] / total) * 100}%\" title=\"${st} ${c[st]}개\"><\/span>` : \"\")).join(\"\");\n    return `\n      ${hideTotal ? \"\" : `<div class=\"sbar__top\"><b>상품개수 : ${UI.fmt(total)}개<\/b>${lastUpdate ? `<span class=\"muted\">최근 업데이트 ${lastUpdate}<\/span>` : \"\"}<\/div>`}\n      <div class=\"sbar\">${segs}<\/div>\n      <ul class=\"legend\">${Store.FEED_STATES.map((st) => `<li><i class=\"dot dot--${st}\"><\/i>${st}(${c[st] || 0})<\/li>`).join(\"\")}<\/ul>`;\n  }\n\n  /* ---------------- 4. 광고 관리 요약 ---------------- */\n  function adsSection() {\n    const a = A();\n    const ad = AD();\n    const actId = ad.id.replace(/^act_/, \"\");\n    const body = `<dl class=\"kv\"><div class=\"kv__row\"><dt>광고 계정<\/dt><dd>${UI.esc(ad.name)}<\/dd><dd class=\"kv__link\"><a class=\"ext\" data-ext=\"광고 계정 바로가기\" data-url=\"https://adsmanager.facebook.com/adsmanager/manage/campaigns?act=${actId}&business_id=${a.businessId}\">광고 계정 바로가기 ${UI.icon.ext}<\/a><\/dd><\/div><\/dl>`;\n    const el = App.section(\"광고 관리\", `<button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"setting\">${UI.icon.gear} 설정<\/button>`, body);\n    bindExt(el);\n    el.querySelector('[data-act=\"setting\"]').addEventListener(\"click\", () => App.openWizard(false));\n    return el;\n  }\n\n  /* ---------------- 5. 도메인 인증 안내 (미인증 시에만) ---------------- */\n  function domainSection() {\n    const body = `\n      <p class=\"sec__lead\">Meta 광고의 전환 추적 및 웹 이벤트 구성을 위해 쇼핑몰 도메인 인증이 필요합니다.<br>도메인 인증은 Meta 비즈니스 관리자에서 직접 진행하며, 연동 전·후 언제든 진행할 수 있습니다.<\/p>\n      <ol class=\"steps3\">\n        <li><b>Meta 비즈니스 관리자 접속<\/b><span>연동에 사용할 비즈니스 계정으로 로그인<\/span><\/li>\n        <li><b>도메인 등록<\/b><span>비즈니스 설정 &gt; 브랜드 보안 &gt; 도메인 &gt; 추가<\/span><\/li>\n        <li><b>소유권 인증<\/b><span>DNS TXT · 메타태그 · HTML 파일 중 택1로 인증<\/span><\/li>\n      <\/ol>\n      <p class=\"note\">${UI.icon.info}<span>인증 결과가 Meta에 반영되기까지 최대 72시간이 소요될 수 있습니다.<\/span><a class=\"ext\" data-ext=\"Meta 비즈니스 관리자 바로가기\" data-url=\"https://business.facebook.com/settings/owned-domains\">Meta 비즈니스 관리자 바로가기 ${UI.icon.ext}<\/a><\/p>`;\n    const el = App.section(\"도메인 인증 안내\", `<button type=\"button\" class=\"btn btn--line btn--sm\" data-ext=\"도메인 인증 도움말\" data-url=\"https://www.facebook.com/business/help/321167023127050\">자세히 보기<\/button>`, body);\n    bindExt(el);\n    return el;\n  }\n\n  function bindExt(el) {\n    el.querySelectorAll(\"[data-ext]\").forEach((x) => x.addEventListener(\"click\", () => UI.openExternal(x.dataset.ext, x.dataset.url)));\n  }\n\n  /* ---------------- 3-3-2 상품 카테고리 매칭 모달 (카테고리 단위) ---------------- */\n  function openCategoryMatch(auto) {\n    const s = Store.s;\n    const items = window.MOCK.gpcList.map((g) => ({ value: g.id, label: g.path }));\n    const cats = Store.leafCategories();\n    const body = `\n      <div class=\"infobox\">${UI.icon.info}<div>내 쇼핑몰의 상품 분류와 가장 유사한 페이스북의 상품 분류를 선택해주세요.<br>매칭된 카테고리의 상품은 자동으로 다음 업데이트 시 페이스북 상품 피드로 자동 수집됩니다.<\/div><\/div>\n      <div class=\"mtable-wrap\"><table class=\"mtable\">\n        <thead><tr><th>쇼핑몰 카테고리<\/th><th>페이스북 카테고리<\/th><\/tr><\/thead>\n        <tbody>${cats.map((c) => `<tr><td>${UI.esc(c.path.join(\" > \"))}<\/td><td><div class=\"gpc-dd\" data-cat=\"${c.id}\"><\/div><\/td><\/tr>`).join(\"\")}<\/tbody>\n      <\/table><\/div>\n      <ul class=\"bullets muted\">\n        <li>판매불가능으로 설정된 상품은 Meta 전송 대상에 포함되지 않으니 판매 상태를 확인해주세요.<\/li>\n        <li>Meta 카테고리 연결을 해제하거나 연결된 카테고리를 삭제할 경우 상품 연동이 해제될 수 있으니 유의해주세요.<\/li>\n      <\/ul>`;\n    const dds = {};\n    const confirmClose = () => UI.confirm(\"카테고리를 매칭하지 않은 상품은 피드에서 제외되어 Meta에 노출되지 않습니다.\\n다음에 반영하시겠습니까?\");\n    const m = UI.modal({\n      title: \"상품 카테고리 매칭\",\n      size: \"lg\",\n      body,\n      footer: '<button type=\"button\" class=\"btn btn--line btn--lg\" data-act=\"later\">다음에 반영<\/button><button type=\"button\" class=\"btn btn--dark btn--lg\" data-act=\"save\">상품 피드 반영<\/button>',\n      onClose: confirmClose,\n    });\n    m.el.querySelectorAll(\".gpc-dd\").forEach((d) => {\n      const c = Store.cat(d.dataset.cat);\n      dds[c.id] = UI.dropdown(d, { items, value: s.catMap[c.id] || \"\" /* v0.2: Meta·Google 공통 GPC */, placeholder: \"카테고리를 선택해주세요\", minListWidth: 420 });\n    });\n    m.el.querySelector('[data-act=\"later\"]').addEventListener(\"click\", () => m.close());\n    m.el.querySelector('[data-act=\"save\"]').addEventListener(\"click\", async () => {\n      const map = {};\n      Object.keys(dds).forEach((k) => (map[k] = dds[k].value || null));\n      Store.saveCategoryMap(map);\n      await UI.alert(\"선택한 카테고리가 상품 피드에 반영되었습니다.\");\n      m.close(true);\n      App.render();\n    });\n    if (auto) m.el.classList.add(\"is-auto\");\n  }\n\n  return { render, openCategoryMatch, statusBar, bindExt };\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   SCR 3-4 · 상품 피드 탭 (미연동 / 연동완료) + 3-4-2 선택 상품 카테고리 매칭\n   ========================================================================== */\nconst FeedPage = (function () {\n  const TABS = [\"전체\", \"활동중\", \"검토중\", \"미승인\", \"노출제한\", \"사용안함\", \"반영대기\"];\n  const SIZES = [20, 30, 50, 70, 100];\n  const GENDERS = [[\"unisex\", \"남녀공용\"], [\"male\", \"남성\"], [\"female\", \"여성\"]];\n  const AGES = [[\"all ages\", \"전연령\"], [\"adult\", \"성인\"], [\"teen\", \"청소년\"], [\"kids\", \"어린이\"], [\"toddler\", \"유아\"], [\"infant\", \"영아\"], [\"newborn\", \"신생아\"]];\n  const view = { tab: \"전체\", q: \"\", page: 1, size: 20, sel: new Set() };\n\n  /* ---------------- 썸네일 (mock 이미지) ---------------- */\n  const PALETTE = [\"#d9c3a5\", \"#9fb4c7\", \"#c7a0a0\", \"#a3b18a\", \"#b8a1c9\", \"#e0b77c\", \"#8fa3a8\", \"#c9b79c\"];\n  function thumb(p) {\n    if (p.r && p.r.noImage) return `<span class=\"thumb thumb--none\">No<br>Image<\/span>`;\n    const c = PALETTE[p.id % PALETTE.length];\n    const ch = UI.esc(p.name.replace(/^\\[[^\\]]*\\]\\s*/, \"\").charAt(0));\n    return `<span class=\"thumb\" style=\"background:linear-gradient(135deg, ${c}, #fff)\">${ch}<\/span>`;\n  }\n  function priceText(p) {\n    if (p.r && p.r.priceText) return '<span class=\"muted\">가격문의<\/span>';\n    return UI.fmt(p.price);\n  }\n  function gpcText(p) {\n    const g = Store.gpc(Store.effGpc(p));\n    return g ? `<span class=\"ellipsis\" title=\"${UI.esc(g.path)}\">${UI.esc(g.path)}<\/span>` : '<span class=\"muted\">미설정<\/span>';\n  }\n  const stCls = (st) => \"st st--\" + st;\n\n  function render(root, params) {\n    const s = Store.s;\n    if (params && params.tab && TABS.includes(params.tab)) {\n      view.tab = params.tab;\n      view.page = 1;\n      view.sel.clear();\n    }\n    if (!s.connected) {\n      root.appendChild(\n        App.emptyState({\n          title: \"비즈니스 자산 연동 후 상품 피드를 사용할 수 있습니다.\",\n          desc: \"페이스북 채널 연동이 완료되면 상품 카탈로그가<br>자동으로 생성되고 Meta에 상품 피드가 연동됩니다.\",\n          btn: \"비즈니스 자산 설정하기\",\n          note: \"연결 관리 탭에서 비즈니스 자산 설정하기 버튼을 클릭해 카탈로그, Facebook 페이지, 픽셀 등을 연동하면 상품 피드가 자동으로 활성화됩니다.\",\n          onClick: App.gotoConnectAndStart,\n        })\n      );\n      return;\n    }\n    root.appendChild(\n      App.banner(\n        \"상품 피드\",\n        \"메이크샵 상품을 Meta 제품 카탈로그와 연동하고 관리하는 공간입니다. 쇼핑 채널 및 광고 운영에 필요한 상품 데이터를 Meta로 전달하며, 상품 연동 상태·동기화 현황·오류 여부 등을 확인할 수 있습니다.<br>카탈로그 생성 이후 상품의 등록·수정·삭제 등 변경 사항이 자동으로 업데이트되며, 최신 상품 정보가 Meta 채널에 지속적으로 반영됩니다.\"\n      )\n    );\n    // 2. 상품 피드 등록 현황\n    const a = window.MOCK.account;\n    const summary = App.section(\n      \"상품 피드 등록 현황\",\n      `<button type=\"button\" class=\"btn btn--line btn--sm\" data-ext=\"Meta Catalog 바로가기\" data-url=\"https://business.facebook.com/commerce/catalogs/${a.catalogId}/products?business_id=${a.businessId}\">Meta Catalog 바로가기<\/button>`,\n      ConnectPage.statusBar(Store.counts(s.products), s.lastUpdate, true) +\n        (!s.categorySaved ? `<p class=\"note note--warn\">${UI.icon.info}<span>상품 카테고리 매칭 전입니다. 연결 관리 &gt; 상품 카테고리 매칭에서 카테고리를 매칭하고 [상품 피드 반영]을 누르면 전송 대상 상품이 반영대기로 등록되어 Meta로 자동 전송됩니다.<\/span><\/p>` : \"\")\n    );\n    summary.querySelector(\".sec__toggle\").remove();\n    ConnectPage.bindExt(summary);\n    root.appendChild(summary);\n    // 3. 상품 피드 목록\n    const listSec = App.section(\"상품 피드 목록\", \"\", '<div id=\"feed-list\"><\/div>', { cls: \"sec--list\" });\n    root.appendChild(listSec);\n    paintList(listSec.querySelector(\"#feed-list\"));\n  }\n\n  function filtered() {\n    const q = view.q.trim().toLowerCase();\n    return Store.s.products.filter((p) => !q || p.name.toLowerCase().includes(q));\n  }\n\n  function paintList(box) {\n    const base = filtered();\n    const c = Store.counts(base);\n    const rows = view.tab === \"전체\" ? base : base.filter((p) => Store.status(p) === view.tab);\n    const pages = Math.max(1, Math.ceil(rows.length / view.size));\n    if (view.page > pages) view.page = pages;\n    const pageRows = rows.slice((view.page - 1) * view.size, view.page * view.size);\n    const cols = columnsFor(view.tab);\n\n    box.innerHTML = `\n      <div class=\"list-tools\">\n        <div class=\"stabs\" role=\"tablist\">${TABS.map((t) => `<button type=\"button\" role=\"tab\" class=\"stab ${t === view.tab ? \"is-active\" : \"\"}\" data-tab=\"${t}\" aria-selected=\"${t === view.tab}\">${t} <b>${c[t]}<\/b><\/button>`).join(\"\")}<\/div>\n        <div class=\"list-tools__right\">\n          <form class=\"search\" id=\"feed-search\"><button type=\"submit\" aria-label=\"검색\">${UI.icon.search}<\/button><input type=\"search\" placeholder=\"검색어를 입력해 주세요.\" value=\"${UI.esc(view.q)}\" aria-label=\"상품명 검색\" /><\/form>\n          <select class=\"select\" id=\"feed-size\" aria-label=\"페이지당 노출 개수\">${SIZES.map((n) => `<option value=\"${n}\" ${n === view.size ? \"selected\" : \"\"}>${n}개씩 보기<\/option>`).join(\"\")}<\/select>\n        <\/div>\n      <\/div>\n      <div class=\"table-wrap\"><table class=\"table\">\n        <thead><tr>${cols.map((k) => `<th class=\"col-${k}\">${head(k)}<\/th>`).join(\"\")}<\/tr><\/thead>\n        <tbody>${pageRows.length ? pageRows.map((p) => `<tr>${cols.map((k) => `<td class=\"col-${k}\">${cell(k, p)}<\/td>`).join(\"\")}<\/tr>`).join(\"\") : `<tr><td colspan=\"${cols.length}\" class=\"table__empty\">표시할 상품이 없습니다.<\/td><\/tr>`}<\/tbody>\n      <\/table><\/div>\n      <div class=\"list-foot\"><div class=\"list-foot__left\"><button type=\"button\" class=\"btn btn--line\" data-act=\"bulk\">선택 수정<\/button>${view.tab === \"반영대기\" ? '<span class=\"muted small\">반영대기 상품은 전송 큐에서 순서대로 Meta에 자동 전송됩니다. 직접 전송하는 기능은 없습니다.<\/span>' : \"\"}<\/div><div id=\"feed-pager\"><\/div><div class=\"list-foot__right muted small\">총 ${UI.fmt(rows.length)}건 · 선택 ${view.sel.size}건<\/div><\/div>`;\n\n    box.querySelector(\"#feed-pager\").appendChild(UI.pagination(rows.length, view.page, view.size, (p) => { view.page = p; view.sel.clear(); paintList(box); }));\n    box.querySelectorAll(\"[data-tab]\").forEach((b) => b.addEventListener(\"click\", () => { view.tab = b.dataset.tab; view.page = 1; view.sel.clear(); paintList(box); }));\n    box.querySelector(\"#feed-search\").addEventListener(\"submit\", (e) => {\n      e.preventDefault();\n      view.q = e.target.querySelector(\"input\").value;\n      view.page = 1;\n      view.sel.clear();\n      paintList(box);\n    });\n    box.querySelector(\"#feed-search input\").addEventListener(\"search\", (e) => { if (!e.target.value) { view.q = \"\"; view.page = 1; paintList(box); } });\n    box.querySelector(\"#feed-size\").addEventListener(\"change\", (e) => { view.size = +e.target.value; view.page = 1; view.sel.clear(); paintList(box); });\n    // 체크박스 (현재 페이지 기준)\n    const all = box.querySelector(\"#chk-all\");\n    const chks = [...box.querySelectorAll(\".row-chk\")];\n    all.checked = chks.length > 0 && chks.every((x) => x.checked);\n    all.addEventListener(\"change\", () => { chks.forEach((x) => { x.checked = all.checked; all.checked ? view.sel.add(+x.value) : view.sel.delete(+x.value); }); paintFootCount(box, rows.length); });\n    chks.forEach((x) => x.addEventListener(\"change\", () => { x.checked ? view.sel.add(+x.value) : view.sel.delete(+x.value); all.checked = chks.every((y) => y.checked); paintFootCount(box, rows.length); }));\n    box.querySelectorAll(\"[data-detail]\").forEach((b) => b.addEventListener(\"click\", () => openProductModal([+b.dataset.detail], box)));\n    box.querySelector('[data-act=\"bulk\"]').addEventListener(\"click\", async () => {\n      const ids = pageRows.filter((p) => view.sel.has(p.id)).map((p) => p.id);\n      if (!ids.length) return UI.alert(\"선택된 상품이 없습니다.\");\n      openProductModal(ids, box);\n    });\n    INFO.bind(box);\n  }\n  function paintFootCount(box, total) {\n    box.querySelector(\".list-foot__right\").textContent = `총 ${UI.fmt(total)}건 · 선택 ${view.sel.size}건`;\n  }\n\n  function columnsFor(tab) {\n    if (tab === \"전체\") return [\"chk\", \"info\", \"status\", \"linked\", \"price\", \"gpc\", \"manage\"];\n    if (tab === \"미승인\" || tab === \"노출제한\") return [\"chk\", \"info\", \"linked\", \"price\", \"reason\", \"manage\"];\n    if (tab === \"사용안함\") return [\"chk\", \"info\", \"linked\", \"price\", \"manage\"];\n    return [\"chk\", \"info\", \"linked\", \"price\", \"gpc\", \"manage\"];\n  }\n  function head(k) {\n    return {\n      chk: '<input type=\"checkbox\" id=\"chk-all\" aria-label=\"현재 페이지 전체 선택\" />',\n      info: \"상품정보\",\n      status: `승인상태 ${UI.qmark(\"approval\")}`,\n      linked: \"연동 상품 수\",\n      price: \"가격\",\n      gpc: \"페이스북 카테고리\",\n      reason: `사유 ${UI.qmark(\"reason\")}`,\n      manage: \"관리\",\n    }[k];\n  }\n  function cell(k, p) {\n    const st = Store.status(p);\n    switch (k) {\n      case \"chk\": return `<input type=\"checkbox\" class=\"row-chk\" value=\"${p.id}\" ${view.sel.has(p.id) ? \"checked\" : \"\"} aria-label=\"${UI.esc(p.name)} 선택\" />`;\n      case \"info\": return `<div class=\"pinfo\">${thumb(p)}<div><div class=\"pinfo__name\">${UI.esc(p.name)}<\/div><div class=\"pinfo__cat\">${p.cat ? pathLabel(Store.cat(p.cat).path) : \"분류 미지정\"}<\/div><\/div><\/div>`;\n      case \"status\": return `<span class=\"${stCls(st)}\">${st}<\/span>`;\n      case \"linked\": return UI.fmt(Store.linkedCount(p));\n      case \"price\": return priceText(p);\n      case \"gpc\": return gpcText(p);\n      case \"reason\": return `<span class=\"reason\">${UI.esc(Store.reason(p))}<\/span>`;\n      case \"manage\": return `<button type=\"button\" class=\"btn btn--line btn--sm\" data-detail=\"${p.id}\">상세<\/button>`;\n    }\n  }\n  function pathLabel(path) {\n    const lv = [\"(대분류)\", \"(중분류)\", \"(소분류)\"];\n    return path.map((x, i) => `${lv[i] || \"\"} ${UI.esc(x)}`).join(\" &gt; \");\n  }\n\n  /* ---------------- 3-4-2 선택 상품 카테고리 매칭 (상품별) ---------------- */\n  function openProductModal(ids, listBox) {\n    const items = window.MOCK.gpcList.map((g) => ({ value: g.id, label: g.path }));\n    const rows = ids.map((id) => {\n      const p = Store.s.products.find((x) => x.id === id);\n      const g = Store.effGpc(p) || \"\";\n      const ap = Store.isApparel(g);\n      return { p, init: { useFeed: p.useFeed, gpc: g,
