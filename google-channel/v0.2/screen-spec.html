iv>`;\n      box.querySelector(\"#h-days\").addEventListener(\"change\", (e) => { f.days = +e.target.value; paint(); });\n      box.querySelector(\"#h-res\").addEventListener(\"change\", (e) => { f.result = e.target.value; paint(); });\n      box.querySelectorAll(\"[data-h]\").forEach((b) => b.addEventListener(\"click\", () => openFail(GStore.s.history[+b.dataset.h])));\n    }\n    paint();\n    m.el.querySelector('[data-act=\"close\"]').addEventListener(\"click\", () => m.close(true));\n  }\n  function openFail(h) {\n    const ps = (h.failIds || []).map((id) => GStore.products().find((p) => p.id === id)).filter(Boolean);\n    const body = `<p class=\"sec__lead\">${h.atStr} ${h.type} 실패 상품 ${h.fail}건입니다. 실패 상품은 반영대기로 남아 다음 전송에서 다시 보냅니다.<\/p>\n      <table class=\"mtable\"><thead><tr><th>상품정보<\/th><th>실패 사유<\/th><\/tr><\/thead><tbody>${ps.map((p) => `<tr><td class=\"td-left\">${UI.esc(p.name)}<\/td><td class=\"td-left\">${UI.esc(h.cause || window.GMOCK.failReasons[p.id] || \"Merchant API 일시 오류. 다음 전송에서 다시 보냅니다.\")}<\/td><\/tr>`).join(\"\")}<\/tbody><\/table>`;\n    const m = UI.modal({ title: \"동기화 실패 상세\", size: \"md\", body, footer: '<button type=\"button\" class=\"btn btn--dark btn--lg\" data-act=\"close\">닫기<\/button>' });\n    m.el.querySelector('[data-act=\"close\"]').addEventListener(\"click\", () => m.close(true));\n  }\n\n  return { render };\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   Google 구글애즈 탭 — v0.1 화면설계서 6-1부터 6-7 기준, 화면 틀만 Meta 디자인으로 변경\n   - 계정 정보·Merchant Center 연결 단계(POL-077), 광고 측정(POL-079), 광고 기준·상품 기준 성과(POL-080부터 POL-085),\n     광고 운영 상태 모달(POL-086부터 POL-089)\n   ========================================================================== */\nconst GAds = (function () {\n  const C = () => GCommon;\n  const PERIODS = [[\"today\", \"오늘\"], [\"yesterday\", \"어제\"], [\"7d\", \"최근 7일\"], [\"30d\", \"최근 30일\"], [\"month\", \"이번 달\"]];\n  const SUBS = [\"전체\", \"실적 최대화\", \"쇼핑\", \"검색\", \"디스플레이\", \"동영상\"];\n  const view = { mode: \"ad\", period: \"7d\", sub: \"전체\" };\n\n  const productMode = () => GStore.s.mc !== \"none\" && GStore.s.mcLink === \"linked\"; // 상품 기준 탭 노출 (POL-080)\n  function range(period) {\n    const t = Perf.today0();\n    const a = Perf.addDays;\n    switch (period) {\n      case \"today\": return [t, t, [a(t, -1), a(t, -1)]];\n      case \"yesterday\": return [a(t, -1), a(t, -1), [a(t, -2), a(t, -2)]];\n      case \"7d\": return [a(t, -7), a(t, -1), [a(t, -14), a(t, -8)]];\n      case \"30d\": return [a(t, -30), a(t, -1), [a(t, -60), a(t, -31)]];\n      case \"month\": { const f = new Date(t.getFullYear(), t.getMonth(), 1); const n = Math.round((t - f) / 86400000) + 1; return [f, t, [a(f, -n), a(f, -1)]]; }\n    }\n  }\n\n  function render(root) {\n    const s = GStore.s;\n    const st = GStore.adsState();\n    root.appendChild(App.banner(\"구글애즈\", \"Google Ads 광고 측정 상태와 캠페인·상품 광고 성과를 확인하는 공간입니다.<br>광고 운영 상태와 Google이 제안하는 개선 권장사항을 함께 확인할 수 있습니다.\"));\n    if (st === \"reauth\") {\n      const n = document.createElement(\"p\");\n      n.className = \"note note--warn\";\n      n.innerHTML = `${UI.icon.info}<span>Google Ads 재인증이 필요합니다. 아래는 마지막으로 확인된 정보입니다.<\/span><a class=\"lnk\" href=\"#/google/connect\">연결관리로 이동<\/a>`;\n      root.appendChild(n);\n    }\n    root.appendChild(accountSection());\n    root.appendChild(measureSection());\n    if (!productMode() && view.mode === \"product\") view.mode = \"ad\"; // 조회 중 MC 연동이 해제되면 광고 기준으로 전환\n    const perf = App.section(\"광고 성과\", \"\", '<div id=\"gads-perf\"><\/div>');\n    root.appendChild(perf);\n    paintPerf(perf.querySelector(\"#gads-perf\"));\n  }\n\n  /* ---------------- 계정 정보 ---------------- */\n  function accountSection() {\n    const s = GStore.s;\n    const a = s.adsAccount || window.GMOCK.adsAccounts[0];\n    const stage = s.mc !== \"none\" && s.mcLink === \"linked\" ? \"MC 연동 완료\" : s.mcLink === \"detected\" && s.mc === \"none\" ? \"MC 연결 감지\" : \"Google Ads만 연결\";\n    const body = `<dl class=\"kv\">\n      <div class=\"kv__row\"><dt>광고 계정<\/dt><dd>${UI.esc(a.name)} (${a.id}) ${GStore.adsState() === \"reauth\" ? C().pill(\"재인증 필요\", \"red\") : C().pill(\"연결됨\")}<\/dd><dd class=\"kv__link\"><a class=\"ext\" data-ext=\"Google Ads 바로가기\" data-url=\"https://ads.google.com/aw/overview\">Google Ads 바로가기 ${UI.icon.ext}<\/a><\/dd><\/div>\n      <div class=\"kv__row\"><dt>Merchant Center 연결<\/dt><dd>${C().pill(stage, stage === \"MC 연동 완료\" ? \"blue\" : \"gray\")}<\/dd><\/div>\n      ${stage === \"MC 연결 감지\" ? `<div class=\"kv__row\"><dt><\/dt><dd class=\"kv__wide\"><div class=\"infobox\">${UI.icon.info}<div>이 Google Ads 계정에 이미 연결된 Merchant Center 계정이 있습니다(${window.GMOCK.merchantCandidates[0].id}).<br>메이크샵에 연결하면 쇼핑 광고와 상품 기준 성과를 확인할 수 있습니다.<div style=\"margin-top:10px\"><button type=\"button\" class=\"btn btn--primary btn--sm\" data-act=\"link-mc\">이 Merchant Center를 메이크샵에 연결<\/button><\/div><\/div><\/div><\/dd><\/div>` : \"\"}\n      ${stage === \"Google Ads만 연결\" ? `<div class=\"kv__row\"><dt><\/dt><dd class=\"kv__wide\"><p class=\"note\">${UI.icon.info}<span>Merchant Center가 연결되지 않아 쇼핑 광고 성과는 확인할 수 없습니다. 오류가 아닙니다.<\/span><\/p><\/dd><\/div>` : \"\"}\n    <\/dl>`;\n    const el = App.section(\"계정 정보\", '<button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"status\">광고 운영 상태<\/button>', body);\n    C().bindExt(el);\n    el.querySelector('[data-act=\"status\"]').addEventListener(\"click\", openStatus);\n    const lk = el.querySelector('[data-act=\"link-mc\"]');\n    if (lk) lk.addEventListener(\"click\", linkDetected);\n    return el;\n  }\n  /** 감지된 MC 연결: 계정 선택 생략, 동의 → 전화번호 인증 → 약관 동의 (POL-078) */\n  async function linkDetected() {\n    if (!(await UI.confirm(\"감지된 Merchant Center 계정을 메이크샵에 연결합니다.\\n사업자 정보 제공 동의, 대표 전화번호 인증, 판매자 약관 동의를 진행합니다.\"))) return;\n    GStore.connectMc(window.GMOCK.merchantCandidates[0]);\n    GStore.s.mcLink = \"linked\";\n    GStore.save();\n    UI.toast(\"Merchant Center가 연결되었습니다. 연결관리에서 도메인 인증과 판매국가·배송 설정을 진행해 주세요.\", \"success\");\n    App.render();\n  }\n\n  /* ---------------- 광고 측정 ---------------- */\n  function measureSection() {\n    const m = GStore.s.measure;\n    const row = (label, ok, desc) => `<div class=\"kv__row\"><dt>${label}<\/dt><dd>${ok ? C().pill(\"정상\") : C().pill(\"설정 필요\", \"gray\")} <span class=\"muted\">${desc}<\/span><\/dd><\/div>`;\n    const body = `<dl class=\"kv\">${row(\"Google Tag\", m.tag, \"메이크샵이 설치한 연동 계정 기준 태그\")}${row(\"향상된 전환\", m.enhanced, \"메이크샵 설정 완료 여부\")}${row(\"전환 상태\", m.conv, \"전환 액션 존재 + 활성\")}<\/dl>\n      <p class=\"note\">${UI.icon.info}<span>'정상'은 설정이 완료되었다는 뜻이며 전환 수집을 보장하지는 않습니다.<\/span><\/p>`;\n    return App.section(\"광고 측정\", \"\", body);\n  }\n\n  /* ---------------- 광고 성과 ---------------- */\n  function paintPerf(box) {\n    const pm = productMode();\n    const shoppingOk = GStore.s.mc !== \"none\";\n    const [f, t, prev] = range(view.period);\n    const filter = (c) => view.mode === \"product\" ? c.shopping : view.sub === \"전체\" || c.type === view.sub;\n    const cur = Perf.rows(\"google\", f, t, filter);\n    const before = Perf.sum(Perf.rows(\"google\", prev[0], prev[1], filter));\n    const tot = Perf.sum(cur);\n    const kpis = [[\"비용\", tot.spend, before.spend, \"원\"], [\"노출수\", tot.imp, before.imp, \"\"], [\"클릭수\", tot.clk, before.clk, \"\"], [\"전환수\", tot.conv, before.conv, \"\"], [\"전환 가치\", tot.rev, before.rev, \"원\"]];\n    const delta = (a, b) => (!b ? '<span class=\"muted\">비교 데이터 없음<\/span>' : `<span class=\"${a >= b ? \"up\" : \"down\"}\">${a >= b ? \"▲\" : \"▼\"} ${Math.abs(((a - b) / b) * 100).toFixed(1)}%<\/span>`);\n    const roas = tot.spend ? Math.round((tot.rev / tot.spend) * 100) + \"%\" : \"-\";\n    box.innerHTML = `\n      <div class=\"perf-top\">\n        <div class=\"seg\">${[[\"ad\", \"광고 기준\"], [\"product\", \"상품 기준\"]].filter((x) => x[0] === \"ad\" || pm).map((x) => `<button type=\"button\" data-mode=\"${x[0]}\" class=\"${view.mode === x[0] ? \"is-active\" : \"\"}\">${x[1]}<\/button>`).join(\"\")}<\/div>\n        <div class=\"seg\">${PERIODS.map((p) => `<button type=\"button\" data-p=\"${p[0]}\" class=\"${view.period === p[0] ? \"is-active\" : \"\"}\">${p[1]}<\/button>`).join(\"\")}<\/div>\n      <\/div>\n      ${view.mode === \"ad\" ? `<div class=\"stabs stabs--sub\">${SUBS.map((x) => { const dis = x === \"쇼핑\" && !shoppingOk; return `<button type=\"button\" class=\"stab ${x === view.sub ? \"is-active\" : \"\"}\" data-sub=\"${x}\" ${dis ? 'disabled title=\"Merchant Center 연결이 필요합니다.\"' : \"\"}>${x}<\/button>`; }).join(\"\")}<\/div>` : \"\"}\n      <div class=\"kpis\">${kpis.map((k) => `<div class=\"kpi\"><span class=\"kpi__label\">${k[0]}<\/span><span class=\"kpi__val\">${UI.fmt(k[1])}${k[3]}<\/span><span class=\"kpi__sub\">${delta(k[1], k[2])}<\/span>${k[0] === \"전환 가치\" ? `<span class=\"kpi__roas\">ROAS ${roas}<\/span>` : \"\"}<\/div>`).join(\"\")}<\/div>\n      <div class=\"table-wrap\" style=\"margin-top:18px\">${view.mode === \"ad\" ? campTable(cur) : productTable(cur)}<\/div>`;\n    box.querySelectorAll(\"[data-mode]\").forEach((b) => b.addEventListener(\"click\", () => { view.mode = b.dataset.mode; paintPerf(box); }));\n    box.querySelectorAll(\"[data-p]\").forEach((b) => b.addEventListener(\"click\", () => { view.period = b.dataset.p; paintPerf(box); }));\n    box.querySelectorAll(\"[data-sub]\").forEach((b) => b.addEventListener(\"click\", () => { view.sub = b.dataset.sub; paintPerf(box); }));\n  }\n  function campTable(list) {\n    if (!list.length) return '<table class=\"table\"><tbody><tr><td class=\"table__empty\">조회 기간에 성과가 있는 캠페인이 없습니다.<\/td><\/tr><\/tbody><\/table>';\n    return `<table class=\"table table--camp\"><thead><tr><th class=\"th-left\">캠페인명<\/th><th>유형<\/th><th>노출수<\/th><th>클릭수<\/th><th>CTR<\/th><th>비용<\/th><th>전환수<\/th><th>전환 가치<\/th><th>ROAS<\/th><\/tr><\/thead><tbody>${list\n      .map((a) => `<tr><td class=\"td-left\"><span class=\"camp-name\">${UI.esc(a.name)}<\/span><\/td><td>${a.type}<\/td><td>${UI.fmt(a.imp)}<\/td><td>${UI.fmt(a.clk)}<\/td><td>${a.imp ? ((a.clk / a.imp) * 100).toFixed(2) + \"%\" : \"-\"}<\/td><td>${UI.fmt(a.spend)}<\/td><td>${UI.fmt(a.conv)}<\/td><td>${UI.fmt(a.rev)}<\/td><td>${a.spend ? Math.round((a.rev / a.spend) * 100) + \"%\" : \"-\"}<\/td><\/tr>`)\n      .join(\"\")}<\/tbody><\/table>`;\n  }\n  /** 상품 기준: segments.product_item_id로 메이크샵 상품과 매칭, 없으면 '삭제된 상품' (POL-084) */\n  function productTable(list) {\n    const tot = Perf.sum(list);\n    const ps = GStore.products().filter((p) => GStore.status(p) === \"활동중\").slice(0, 8);\n    const weights = ps.map((p, i) => 1 / (i + 2));\n    const wsum = weights.reduce((a, b) => a + b, 0) + 0.2;\n    const rows = ps.map((p, i) => ({ name: p.name, id: `online:ko:KR:${p.no}`, k: weights[i] / wsum }));\n    rows.push({ name: null, id: \"online:ko:KR:1000190\", k: 0.2 / wsum });\n    return `<table class=\"table table--camp\"><thead><tr><th class=\"th-left\">상품정보<\/th><th>노출수<\/th><th>클릭수<\/th><th>비용<\/th><th>전환수<\/th><th>전환 가치<\/th><th>ROAS<\/th><\/tr><\/thead><tbody>${rows\n      .map((r) => { const sp = tot.spend * r.k; const rv = tot.rev * r.k; return `<tr><td class=\"td-left\">${r.name ? UI.esc(r.name) : '<span class=\"muted\">삭제된 상품<\/span>'}<div class=\"muted small\">${r.id}<\/div><\/td><td>${UI.fmt(tot.imp * r.k)}<\/td><td>${UI.fmt(tot.clk * r.k)}<\/td><td>${UI.fmt(sp)}<\/td><td>${UI.fmt(tot.conv * r.k)}<\/td><td>${UI.fmt(rv)}<\/td><td>${sp ? Math.round((rv / sp) * 100) + \"%\" : \"-\"}<\/td><\/tr>`; })\n      .join(\"\")}<\/tbody><\/table>`;\n  }\n\n  /* ---------------- 광고 운영 상태 모달 (권장사항·진단) ---------------- */\n  function openStatus() {\n    const s = GStore.s;\n    const mcOk = s.mc !== \"none\";\n    const recs = window.GMOCK.recommendations;\n    const body = `\n      <div class=\"stabs\" id=\"st-tabs\"><button type=\"button\" class=\"stab is-active\" data-t=\"rec\">권장사항 <b>${recs.length}<\/b><\/button><button type=\"button\" class=\"stab\" data-t=\"diag\">진단<\/button><\/div>\n      <div id=\"st-body\" style=\"margin-top:14px\"><\/div>`;\n    const m = UI.modal({ title: \"광고 운영 상태\", size: \"lg\", body, footer: '<button type=\"button\" class=\"btn btn--dark btn--lg\" data-act=\"close\">닫기<\/button>' });\n    const sb = m.el.querySelector(\"#st-body\");\n    function paint(t) {\n      m.el.querySelectorAll(\"[data-t]\").forEach((b) => b.classList.toggle(\"is-active\", b.dataset.t === t));\n      if (t === \"rec\") sb.innerHTML = `<p class=\"muted small\" style=\"margin-bottom:10px\">최적화 점수 87.4% · Google Ads API가 반환한 권장사항만 표시합니다. 적용은 Google Ads에서 진행합니다.<\/p>${recs.map((r) => `<div class=\"rec\"><b>${r.type}<\/b><p>${r.text}<\/p><a class=\"ext\" data-ext=\"Google Ads에서 확인\" data-url=\"https://ads.google.com/aw/recommendations\">Google Ads에서 확인 ${UI.icon.ext}<\/a><\/div>`).join(\"\")}`;\n      else sb.innerHTML = mcOk ? `<div class=\"rec\"><b>계정 문제<\/b><p>표시할 계정 문제가 없습니다.<\/p><\/div><div class=\"rec rec--warn\"><b>상품 문제 · 쇼핑 광고<\/b><p>미승인 상품이 있어 일부 상품이 쇼핑 광고에 노출되지 않습니다. 개별 상품은 상품피드에서 확인하세요.<\/p><a class=\"lnk\" href=\"#/google/feed?tab=미승인\">상품피드 미승인 탭으로 이동<\/a><\/div>` : '<p class=\"table__empty\">Merchant Center가 연결되지 않아 진단 정보가 없습니다.<\/p>';\n      C().bindExt(sb);\n      sb.querySelectorAll('a[href^=\"#\"]').forEach((a) => a.addEventListener(\"click\", () => m.close(true)));\n    }\n    m.el.querySelectorAll(\"[data-t]\").forEach((b) => b.addEventListener(\"click\", () => paint(b.dataset.t)));\n    m.el.querySelector('[data-act=\"close\"]').addEventListener(\"click\", () => m.close(true));\n    paint(\"rec\");\n  }\n\n  return { render };\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   SCR-GOOGLE-HOME-001 · Google 하위 탭 / 홈 / 미연동 안내\n   - 하위 탭: 홈 | 연결관리 | 상품피드 | 구글애즈, Google 탭 진입 시 홈 (POL-032)\n   - 하위 탭은 항상 진입할 수 있고, 필요한 연동이 없으면 탭 안에 안내와 버튼 (POL-034)\n   ========================================================================== */\nconst GooglePages = (function () {\n  const TABS = [\n    { key: \"home\", label: \"홈\" },\n    { key: \"connect\", label: \"연결관리\" },\n    { key: \"feed\", label: \"상품피드\" },\n    { key: \"ads\", label: \"구글애즈\" },\n  ];\n  const ILL = {\n    connect: '<svg viewBox=\"0 0 120 120\" width=\"110\" height=\"110\"><g fill=\"none\" stroke=\"#4285F4\" stroke-width=\"14\" stroke-linecap=\"round\"><path d=\"M52 68 30 90a14 14 0 0 1-20-20l22-22\"/><path d=\"M68 52 90 30a14 14 0 0 1 20 20L88 72\"/><\/g><path d=\"M45 75 75 45\" stroke=\"#34A853\" stroke-width=\"12\" stroke-linecap=\"round\"/><circle cx=\"86\" cy=\"88\" r=\"16\" fill=\"#FBBC05\" opacity=\".35\"/><\/svg>',\n    feed: '<svg viewBox=\"0 0 120 120\" width=\"110\" height=\"110\"><rect x=\"18\" y=\"22\" width=\"84\" height=\"76\" rx=\"12\" fill=\"#e8f0fe\"/><rect x=\"30\" y=\"36\" width=\"26\" height=\"26\" rx=\"6\" fill=\"#4285F4\"/><rect x=\"64\" y=\"36\" width=\"26\" height=\"26\" rx=\"6\" fill=\"#34A853\"/><rect x=\"30\" y=\"68\" width=\"60\" height=\"8\" rx=\"4\" fill=\"#9ec1fb\"/><rect x=\"30\" y=\"82\" width=\"40\" height=\"8\" rx=\"4\" fill=\"#c6dafc\"/><\/svg>',\n    ads: '<svg viewBox=\"0 0 120 120\" width=\"110\" height=\"110\"><path d=\"M30 92 58 28\" stroke=\"#FBBC05\" stroke-width=\"18\" stroke-linecap=\"round\"/><path d=\"M62 28 90 92\" stroke=\"#4285F4\" stroke-width=\"18\" stroke-linecap=\"round\"/><circle cx=\"30\" cy=\"92\" r=\"11\" fill=\"#34A853\"/><\/svg>',\n  };\n  const CARDS = [\n    { key: \"connect\", title: \"연결관리\", desc: \"Google 계정을 연결하고 Merchant Center와 Google Ads를 각각 연결하는 공간입니다.<br>Google 계정 연결 후 두 서비스는 따로 연결할 수 있으며, 연결 상태와 계정 정보를 확인할 수 있습니다.\", done: () => GStore.s.account !== \"none\" },\n    { key: \"feed\", title: \"상품피드\", desc: \"메이크샵 상품을 Merchant Center로 보내고 상품별 상태와 전송 결과를 확인하는 공간입니다.<br>카테고리를 매칭한 상품을 자동으로 전송하고, 상품 수정 내용도 자동으로 반영합니다.\", done: () => GStore.s.mc !== \"none\", setup: \"#/google/connect?focus=mc\" },\n    { key: \"ads\", title: \"구글애즈\", desc: \"Google Ads 광고 측정 상태와 캠페인·상품 광고 성과를 확인하는 공간입니다.<br>광고 운영 상태와 Google이 제안하는 개선 권장사항을 함께 확인할 수 있습니다.\", done: () => GStore.s.ads !== \"none\", setup: \"#/google/connect?open=ads\" },\n  ];\n\n  function home(root) {\n    CARDS.forEach((a) => {\n      const done = a.done(); // 카드별 연동 여부를 따로 판정 (POL-033)\n      const el = document.createElement(\"section\");\n      el.className = \"card home-card\";\n      el.innerHTML = `\n        <div class=\"home-card__txt\"><h3>${a.title}<\/h3><p>${a.desc}<\/p>\n          <div class=\"home-card__btns\">${done ? '<button type=\"button\" class=\"btn btn--gray btn--lg\">자세히 보기<\/button>' : '<button type=\"button\" class=\"btn btn--primary btn--lg\">설정하기<\/button>'}<\/div><\/div>\n        <div class=\"home-card__ill\" aria-hidden=\"true\">${ILL[a.key]}<\/div>`;\n      el.querySelector(\"button\").addEventListener(\"click\", () => {\n        if (done) App.nav(\"#/google/\" + a.key);\n        else if (GStore.s.account === \"none\") App.nav(\"#/google/connect\");\n        else App.nav(a.setup || \"#/google/connect\");\n      });\n      root.appendChild(el);\n    });\n  }\n\n  /** 하위 탭 미연동 안내 — Google 계정 미연결을 먼저 판정 (POL-034) */\n  function guard(key, root) {\n    const s = GStore.s;\n    if (key !== \"feed\" && key !== \"ads\") return false;\n    const logo = GCommon.gLogoBig();\n    if (s.account === \"none\") {\n      root.appendChild(App.emptyState({ logo, title: \"Google 계정 연결 후 이용할 수 있습니다.\", desc: \"연결관리에서 Google 계정을 먼저 연결해 주세요.\", btn: \"Google 계정 연결하기\", btnIcon: '<span class=\"g-ic\">G<\/span>', onClick: () => App.nav(\"#/google/connect?open=account\") }));\n      return true;\n    }\n    if (key === \"feed\" && s.mc === \"none\") {\n      root.appendChild(App.emptyState({ logo, title: \"Merchant Center 연결 후 상품 피드를 사용할 수 있습니다.\", desc: \"Merchant Center를 연결하면 카테고리를 매칭한 상품이<br>Google에 자동으로 전송됩니다.\", btn: \"Merchant Center 연동하기\", onClick: () => App.nav(\"#/google/connect?focus=mc\") }));\n      return true;\n    }\n    if (key === \"ads\" && s.ads === \"none\") {\n      root.appendChild(App.emptyState({ logo, title: \"Google Ads 연결 후 광고 성과를 확인할 수 있습니다.\", desc: \"Merchant Center 연결 여부와 관계없이 Google Ads만 따로 연결할 수 있습니다.\", btn: \"Google Ads 연결하기\", onClick: () => App.nav(\"#/google/connect?open=ads\") }));\n      return true;\n    }\n    return false;\n  }\n\n  function render(key, root, params) {\n    if (key === \"home\") return home(root);\n    if (guard(key, root)) return;\n    if (key === \"connect\") return GConnect.render(root, params);\n    if (key === \"feed\") return GFeed.render(root, params);\n    if (key === \"ads\") return GAds.render(root, params);\n  }\n  return { TABS, render };\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   SCR-MKT-001 · 통합 현황 (메뉴 진입 시 기본 탭, POL-003)\n   - 채널 연결 현황 카드(Meta·Google·TikTok) + 채널별 운영 현황 표(Meta·Google)\n   - 외부 API를 호출하지 않고 메이크샵에 저장된 연결 상태·상품 상태로 표시한다 (POL-021)\n   - 운영 현황 표: 계정·상품 피드·광고 연결 상태 3종 + 채널 등록 상품 수 (POL-019)\n   ========================================================================== */\nconst MktOverview = (function () {\n  const CHANNELS = [\n    { key: \"meta\", name: \"Meta\", features: \"상품 피드 · 광고 관리 · Shops 관리\", icon: () => UI.icon.meta.replace('width=\"56\" height=\"35\"', 'width=\"40\" height=\"25\"'), home: \"#/meta/home\", connect: \"#/meta/connect\" },\n    { key: \"google\", name: \"Google\", features: \"상품 피드 · 구글애즈\", icon: () => UI.icon.google.replace('width=\"44\" height=\"44\"', 'width=\"30\" height=\"30\"'), home: \"#/google/home\", connect: \"#/google/connect\" },\n  ];\n  const LABEL = { none: \"미연결\", connected: \"연결됨\", reauth: \"재인증 필요\" };\n  /** 저장된 연결 상태 — Meta는 FBE 한 번에 연결되어 세 값이 같다(POL-014), Google은 서비스별(POL-015) */\n  function states(key) {\n    if (key === \"meta\") {\n      const v = Store.s.connected ? \"connected\" : \"none\";\n      return { account: v, feed: v, ads: v };\n    }\n    return { account: GStore.s.account, feed: GStore.mcState(), ads: GStore.adsState() };\n  }\n  /** 채널 등록 상품 수 — 상품 피드 미연결이면 '-' (POL-018, POL-020) */\n  function registered(key) {\n    if (key === \"meta\") return Store.s.connected ? Store.s.products.filter((p) => Store.META_STATES.includes(Store.status(p))).length : null;\n    return GStore.s.mc === \"none\" ? null : GStore.registeredCount();\n  }\n  function pill(v) {\n    return v === \"connected\" ? GCommon.pill(\"연결됨\") : v === \"reauth\" ? GCommon.pill(\"재인증 필요\", \"red\") : GCommon.pill(\"미연결\", \"gray\");\n  }\n\n  function render(root) {\n    // 1. 채널 연결 현황 (카드 배지는 계정 연결 상태)\n    const cards = document.createElement(\"section\");\n    cards.className = \"card sec\";\n    cards.innerHTML = `<div class=\"sec__head\"><h3>채널 연결 현황<\/h3><\/div><div class=\"sec__body\"><div class=\"chcards\">${CHANNELS.map((c) => {\n      const st = states(c.key).account;\n      const on = st !== \"none\";\n      return `<div class=\"chcard\"><div class=\"chcard__top\"><span class=\"chcard__ic\">${c.icon()}<\/span><div><b>${c.name}<\/b><p class=\"muted small\">${c.features}<\/p><\/div><\/div>\n        <div class=\"chcard__foot\">${pill(st)}<button type=\"button\" class=\"btn ${on ? \"btn--line\" : \"btn--primary\"} btn--sm\" data-go=\"${on ? c.home : c.connect}\">${on ? \"관리하기\" : \"연동하기\"}<\/button><\/div><\/div>`;\n    }).join(\"\")}\n      <div class=\"chcard is-ready\"><div class=\"chcard__top\"><span class=\"chcard__ic\">${UI.icon.tiktok.replace('width=\"44\" height=\"44\"', 'width=\"30\" height=\"30\"')}<\/span><div><b>TikTok<\/b><p class=\"muted small\">준비 중<\/p><\/div><\/div><div class=\"chcard__foot\">${GCommon.pill(\"준비 중\", \"gray\")}<\/div><\/div>\n    <\/div><\/div>`;\n    root.appendChild(cards);\n\n    // 2. 채널별 운영 현황\n    const tbl = document.createElement(\"section\");\n    tbl.className = \"card sec\";\n    tbl.innerHTML = `<div class=\"sec__head\"><h3>채널별 운영 현황<\/h3><\/div><div class=\"sec__body sec__body--flush\"><div class=\"table-wrap\"><table class=\"table table--compact\">\n      <thead><tr><th class=\"th-left\">채널<\/th><th>계정 연결 상태<\/th><th>상품 피드 연결 상태<\/th><th>광고 연결 상태<\/th><th>채널 등록 상품 수 ${UI.qmark(\"mktReg\")}<\/th><th>관리<\/th><\/tr><\/thead>\n      <tbody>${CHANNELS.map((c) => {\n        const s = states(c.key);\n        const reg = registered(c.key);\n        const on = s.account !== \"none\";\n        return `<tr data-ch=\"${c.key}\"><td class=\"td-left\"><span class=\"chname\">${c.icon()}${c.name}<\/span><\/td><td class=\"v-account\">${pill(s.account)}<\/td><td class=\"v-feed\">${pill(s.feed)}<\/td><td class=\"v-ads\">${pill(s.ads)}<\/td><td class=\"v-reg\">${reg == null ? \"-\" : UI.fmt(reg)}<\/td>\n          <td class=\"v-btn\"><button type=\"button\" class=\"btn ${on ? \"btn--line\" : \"btn--primary\"} btn--sm\" data-go=\"${on ? c.home : c.connect}\">${on ? \"바로가기\" : \"연동하기\"}<\/button><\/td><\/tr>`;\n      }).join(\"\")}<\/tbody><\/table><\/div>\n      <p class=\"note sec__note\">${UI.icon.info}<span>각 채널 화면에서 확인한 연결 상태와 상품 상태를 보여줍니다. 계정·상품 피드·광고 연결은 채널마다 Meta(비즈니스·카탈로그·광고 계정), Google(Google 계정·Merchant Center·Google Ads) 기준입니다.<\/span><\/p><\/div>`;\n    root.appendChild(tbl);\n    root.querySelectorAll(\"[data-go]\").forEach((b) => b.addEventListener(\"click\", () => App.nav(b.dataset.go)));\n  }\n  return { render };\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   SCR-MKT-002 · 통합 상품 피드 (조회 전용, POL-027)\n   - 채널 상태는 각 채널 상품피드에서 판정해 저장한 값을 표시한다(외부 API 호출 없음, POL-021)\n   - 메이크샵 등록 상품 전체를 상품 1개 1행으로, 채널별 상태 라벨을 그대로 표시 (POL-023, POL-024)\n   - 상품 피드가 연동되지 않은 채널(Google은 Merchant Center 미연결)은 '-' (POL-025)\n   ========================================================================== */\nconst MktFeed = (function () {\n  const SIZES = [20, 50, 100];\n  const STATES = [\"활동중\", \"검토중\", \"미승인\", \"노출제한\", \"사용안함\", \"반영대기\"];\n  const view = { name: \"\", no: \"\", ch: \"\", st: \"\", page: 1, size: 20 };\n\n  const metaOn = () => Store.s.connected;\n  const googleOn = () => GStore.feedConnected();\n  const chOn = (k) => (k === \"meta\" ? metaOn() : googleOn());\n  function chStatus(k, p) {\n    if (!chOn(k)) return null;\n    return k === \"meta\" ? Store.status(p) : GStore.status(p);\n  }\n\n  function render(root) {\n    if (view.ch && !chOn(view.ch)) { view.ch = \"\"; view.st = \"\"; }\n    const sec = document.createElement(\"section\");\n    sec.className = \"card sec\";\n    sec.innerHTML = `<div class=\"sec__body\">\n      <form class=\"sform\" id=\"mf-form\">\n        <div class=\"sform__row\"><label class=\"sform__label\" for=\"mf-name\">상품명<\/label><input class=\"input\" id=\"mf-name\" placeholder=\"상품명을 입력하세요\" value=\"${UI.esc(view.name)}\"/><\/div>\n        <div class=\"sform__row\"><label class=\"sform__label\" for=\"mf-no\">상품번호<\/label><input class=\"input\" id=\"mf-no\" placeholder=\"상품번호를 입력하세요\" value=\"${UI.esc(view.no)}\"/><\/div>\n        <div class=\"sform__row\"><span class=\"sform__label\">연동 상태<\/span>\n          <select class=\"select\" id=\"mf-ch\" aria-label=\"채널 선택\"><option value=\"\">채널 선택<\/option>${[[\"meta\", \"Meta\"], [\"google\", \"Google\"]].map((c) => `<option value=\"${c[0]}\" ${chOn(c[0]) ? \"\" : \"disabled\"} ${view.ch === c[0] ? \"selected\" : \"\"}>${c[1]}${chOn(c[0]) ? \"\" : \" (미연동)\"}<\/option>`).join(\"\")}<\/select>\n          <select class=\"select\" id=\"mf-st\" aria-label=\"상태 선택\" ${view.ch ? \"\" : \"disabled\"}><option value=\"\">상태 선택<\/option>${STATES.map((s) => `<option ${view.st === s ? \"selected\" : \"\"}>${s}<\/option>`).join(\"\")}<\/select>\n          <span class=\"muted small\">예: Google + 미승인 / 상품 피드가 연동되지 않은 채널은 선택할 수 없습니다.<\/span><\/div>\n        <div class=\"sform__btns\"><button type=\"submit\" class=\"btn btn--dark\">검색<\/button><button type=\"button\" class=\"btn btn--line\" data-act=\"reset\">초기화<\/button><\/div>\n      <\/form><\/div>`;\n    root.appendChild(sec);\n    const list = document.createElement(\"section\");\n    list.className = \"card sec sec--list\";\n    list.innerHTML = '<div class=\"sec__body\"><div id=\"mf-list\"><\/div><\/div>';\n    root.appendChild(list);\n\n    const f = sec.querySelector(\"#mf-form\");\n    f.querySelector(\"#mf-ch\").addEventListener(\"change\", (e) => { view.ch = e.target.value; f.querySelector(\"#mf-st\").disabled = !view.ch; if (!view.ch) f.querySelector(\"#mf-st\").value = \"\"; });\n    f.addEventListener(\"submit\", (e) => {\n      e.preventDefault();\n      view.name = f.querySelector(\"#mf-name\").value.trim();\n      view.no = f.querySelector(\"#mf-no\").value.trim();\n      view.ch = f.querySelector(\"#mf-ch\").value;\n      view.st = f.querySelector(\"#mf-st\").value;\n      view.page = 1;\n      load(list.querySelector(\"#mf-list\"));\n    });\n    f.querySelector('[data-act=\"reset\"]').addEventListener(\"click\", () => {\n      Object.assign(view, { name: \"\", no: \"\", ch: \"\", st: \"\", page: 1 });\n      App.render();\n    });\n    load(list.querySelector(\"#mf-list\"));\n  }\n  function load(box) {\n    box.innerHTML = '<div class=\"loading\"><span class=\"spin\"><\/span> 조회 중입니다.<\/div>';\n    setTimeout(() => paint(box), 300);\n  }\n  function rows() {\n    return Store.s.products\n      .filter((p) => !view.name || p.name.includes(view.name))\n      .filter((p) => !view.no || p.no === view.no)\n      // 채널만 고르고 상태를 고르지 않으면 채널 조건을 적용하지 않음 (POL-028)\n      .filter((p) => !(view.ch && view.st) || chStatus(view.ch, p) === view.st)\n      .sort((a, b) => b.id - a.id); // 상품 등록일 최신순 (POL-029)\n  }\n  function stCell(k, p) {\n    const st = chStatus(k, p);\n    return st ? `<span class=\"st st--${st}\">${st}<\/span>` : \"-\";\n  }\n  function paint(box) {\n    if (!box.isConnected) return;\n    const all = rows();\n    const pages = Math.max(1, Math.ceil(all.length / view.size));\n    if (view.page > pages) view.page = pages;\n    const pr = all.slice((view.page - 1) * view.size, view.page * view.size);\n    box.innerHTML = `\n      <div class=\"list-tools\"><b>총 ${UI.fmt(all.length)}개<\/b><select class=\"select select--sm\" id=\"mf-size\" aria-label=\"페이지당 개수\">${SIZES.map((n) => `<option value=\"${n}\" ${n === view.size ? \"selected\" : \"\"}>${n}개씩<\/option>`).join(\"\")}<\/select><\/div>\n      <div class=\"table-wrap table-wrap--sticky\"><table class=\"table\">\n        <thead><tr><th class=\"col-info sticky-col\">상품정보<\/th><th>Meta 상태<\/th><th>Google 상태<\/th><th class=\"col-manage2\">관리<\/th><\/tr><\/thead>\n        <tbody>${pr.length ? pr.map((p) => `<tr><td class=\"col-info sticky-col\"><div class=\"pinfo\">${GCommon.thumb(p)}<div><div class=\"pinfo__name\">${UI.esc(p.name)}<\/div><div class=\"pinfo__cat\">${p.no}<\/div><\/div><\/div><\/td><td>${stCell(\"meta\", p)}<\/td><td>${stCell(\"google\", p)}<\/td>\n          <td class=\"col-manage2\">${metaOn() ? '<button type=\"button\" class=\"btn btn--line btn--sm\" data-go=\"#/meta/feed\">Meta 관리 ' + UI.icon.ext + \"<\/button>\" : \"\"}${googleOn() ? '<button type=\"button\" class=\"btn btn--line btn--sm\" data-go=\"#/google/feed\">Google 관리 ' + UI.icon.ext + \"<\/button>\" : \"\"}<\/td><\/tr>`).join(\"\") : '<tr><td colspan=\"4\" class=\"table__empty\">조회된 상품이 없습니다.<\/td><\/tr>'}<\/tbody><\/table><\/div>\n      <div class=\"list-foot\"><div><\/div><div id=\"mf-pager\"><\/div><div class=\"list-foot__right muted small\">조회 전용 화면입니다. 전송·수정은 각 채널 상품피드에서 진행합니다.<\/div><\/div>`;\n    box.querySelector(\"#mf-pager\").appendChild(UI.pagination(all.length, view.page, view.size, (p) => { view.page = p; paint(box); }));\n    box.querySelector(\"#mf-size\").addEventListener(\"change\", (e) => { view.size = +e.target.value; view.page = 1; paint(box); });\n    box.querySelectorAll(\"[data-go]\").forEach((b) => b.addEventListener(\"click\", () => App.nav(b.dataset.go)));\n  }\n  return { render };\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   SCR-MKT-003 · TikTok 준비 중 (POL-031) — 안내만 표시, 버튼·일정 안내 없음\n   ========================================================================== */\nconst MktTiktok = (function () {\n  function render(root) {\n    const el = document.createElement(\"section\");\n    el.className = \"card ready\";\n    el.innerHTML = `<div class=\"ready__ic\">${UI.icon.tiktok.replace('width=\"44\" height=\"44\"', 'width=\"72\" height=\"72\"')}<\/div><h2>TikTok 연동 기능을 준비하고 있습니다.<\/h2><p>연동 기능이 제공되면 이 화면에서 연결하고 관리할 수 있습니다.<\/p>`;\n    root.appendChild(el);\n  }\n  return { render };\n})();\n\n<\/script>\n  <script>\n/* ==========================================================================\n   App — 마케팅 > 마케팅 채널 관리 셸 / 라우팅 / Meta 탭(FBE) / 시나리오 패널\n   - 1단 탭: 통합 현황 | 통합 상품 피드 | Meta | Google | TikTok (POL-002)\n   - 탭·하위 탭 위치는 URL(hash)에 남긴다. 잘못된 값이면 통합 현황 (POL-004)\n   ========================================================================== */\nconst App = (function () {\n  const appEl = document.getElementById(\"app\");\n  const lnbEl = document.getElementById(\"lnb-menu\");\n  const CH_TABS = [\n    { key: \"overview\", label: \"통합 현황\", href: \"#/mkt/overview\" },\n    { key: \"feed\", label: \"통합 상품 피드\", href: \"#/mkt/feed\" },\n    { key: \"meta\", label: \"Meta\", href: \"#/meta/home\" },\n    { key: \"google\", label: \"Google\", href: \"#/google/home\" },\n    { key: \"tiktok\", label: \"TikTok\", href: \"#/tiktok\" },\n  ];\n  const META_TABS = [\n    { key: \"home\", label: \"홈\" },\n    { key: \"connect\", label: \"연결 관리\" },\n    { key: \"feed\", label: \"상품 피드\" },\n    { key: \"ads\", label: \"광고 관리\" },\n    { key: \"shops\", label: \"Shops 관리\" },\n  ];\n  const MetaPages = { home: HomePage, connect: ConnectPage, feed: FeedPage, ads: AdsPage, shops: ShopsPage };\n\n  // 화면정의서(HTML)에 내장될 때는 location.hash 대신 SPEC_MODE.hash로 라우팅한다\n  const curHash = () => (window.SPEC_MODE ? window.SPEC_MODE.hash : location.hash);\n  function parseHash() {\n    const h = curHash().replace(/^#/, \"\") || \"/mkt/overview\";\n    const [path, qs] = h.split(\"?\");\n    const params = {};\n    (qs || \"\").split(\"&\").filter(Boolean).forEach((kv) => {\n      const [k, v] = kv.split(\"=\");\n      params[k] = decodeURIComponent(v || \"\");\n    });\n    return { parts: path.split(\"/\").filter(Boolean), params };\n  }\n  function nav(hash) {\n    if (window.SPEC_MODE) { window.SPEC_MODE.hash = hash; render(); return; }\n    if (location.hash === hash) render();\n    else location.hash = hash;\n  }\n  /** Meta 페이지 호환: App.go(tab) = Meta 하위 탭 이동 */\n  function go(tab, params) {\n    const q = params ? \"?\" + Object.keys(params).map((k) => k + \"=\" + encodeURIComponent(params[k])).join(\"&\") : \"\";\n    nav(\"#/meta/\" + tab + q);\n  }\n\n  /* ---------------- 공통 마크업 ---------------- */\n  function pageHead(crumbs) {\n    return `<div class=\"page-head\"><h1>마케팅 채널 관리<span class=\"chip-manual\">매뉴얼<\/span><\/h1><div class=\"crumbs\">${crumbs.map((c) => `<span>${c}<\/span>`).join(\"\")}<\/div><\/div>`;\n  }\n  function emptyState({ title, desc, btn, note, onClick, fbIcon, logo, btnIcon }) {\n    const el = document.createElement(\"div\");\n    el.className = \"empty-hero\";\n    el.innerHTML = `\n      <div class=\"empty-hero__logo\">${logo || UI.icon.meta.replace('width=\"56\" height=\"35\"', 'width=\"104\" height=\"65\"')}<\/div>\n      <h2>${title}<\/h2>\n      <p>${desc}<\/p>\n      <button class=\"btn btn--primary btn--xl\" type=\"button\">${fbIcon ? '<span class=\"fb-ic\">' + UI.icon.fb + \"<\/span>\" : btnIcon || UI.icon.gear}<span>${btn}<\/span><\/button>\n      ${note ? `<div class=\"empty-hero__note\">${UI.icon.info}<span>${note}<\/span><\/div>` : \"\"}`;\n    el.querySelector(\"button\").addEventListener(\"click\", onClick);\n    return el;\n  }\n  function banner(title, desc) {\n    const el = document.createElement(\"section\");\n    el.className = \"card banner\";\n    el.innerHTML = `<div><h3 class=\"banner__title\">${title}<\/h3><p class=\"banner__desc\">${desc}<\/p><\/div><button type=\"button\" class=\"btn btn--dark btn--sm\">자세히보기<\/button>`;\n    el.querySelector(\"button\").addEventListener(\"click\", () => UI.toast(\"가이드/매뉴얼 페이지가 새 탭으로 열립니다. (URL 추후 제공 — 프로토타입 미연결)\", \"info\"));\n    return el;\n  }\n  function section(title, actionsHtml, bodyHtml, opts) {\n    const el = document.createElement(\"section\");\n    el.className = \"card sec\" + (opts && opts.cls ? \" \" + opts.cls : \"\");\n    el.innerHTML = `\n      <div class=\"sec__head\"><h3>${title}<\/h3><div class=\"sec__actions\">${actionsHtml || \"\"}${opts && opts.noToggle ? \"\" : `<button type=\"button\" class=\"sec__toggle\" aria-label=\"접기/펼치기\" aria-expanded=\"true\">${UI.icon.chevUp}<\/button>`}<\/div><\/div>\n      <div class=\"sec__body\">${bodyHtml || \"\"}<\/div>`;\n    const tg = el.querySelector(\".sec__toggle\");\n    if (tg) tg.addEventListener(\"click\", () => {\n      const c = el.classList.toggle(\"is-collapsed\");\n      tg.setAttribute(\"aria-expanded\", String(!c));\n    });\n    return el;\n  }\n\n  /* ---------------- Meta FBE 연동 (Meta 프로토타입 v2.1과 동일) ---------------- */\n  function startFbe() {\n    const body = `\n      <div class=\"consent\">\n        <p class=\"consent__intro\">메이크샵 Meta 비즈니스 기능 이용을 위해 아래와 같이 정보가 Meta에 제공되며,<br>메이크샵이 연동 관리를 위해 일부 정보를 수집합니다. 내용을 확인하신 후 동의해 주세요.<\/p>\n        ${consentBox(\"c1\", \"개인정보 및 쇼핑몰 정보 제3자 제공 동의(필수)\", `제공받는 자: Meta Platforms, Inc. 및 Meta Platforms Ireland Limited<br>제공 목적: 페이스북·인스타그램 채널 상품 연동, 제품 카탈로그 생성 및 동기화, 광고 성과 측정 및 전환 추적<br>제공 항목: 쇼핑몰 도메인, 상품 정보(상품명·가격·이미지·재고·카테고리), 구매 전환 이벤트 정보<br>보유 및 이용 기간: Meta 개인정보처리방침에 따름`, false)}\n        ${consentBox(\"c2\", \"개인정보 수집·이용 동의 (메이크샵)\", `수집 항목: Facebook 계정 연동 토큰, 비즈니스 관리자 ID, Facebook 페이지 ID, Instagram 계정 ID, 광고 계정 ID, 픽셀 ID, 제품 카탈로그 ID, 광고 성과 데이터<br>수집 목적: Meta 비즈니스 연동 상태 관리, 상품 피드 동기화, 광고 성과 정보 제공<br>보유 및 이용 기간: 연동 해제 또는 회원 탈퇴 시까지`, true)}\n        <label class=\"chk\"><input type=\"checkbox\" id=\"agree1\" /><span><em>(필수)<\/em>위 제3자 제공 및 국외 이전에 동의합니다.<\/span><\/label>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"agree2\" /><span><em>(필수)<\/em>위 개인정보 수집 및 이용에 동의합니다.<\/span><\/label>\n      <\/div>`;\n    const m = UI.modal({ title: \"페이스북 채널 개인정보 수집 및 이용 동의\", size: \"md\", body, footer: '<button class=\"btn btn--dark btn--lg\" id=\"consent-ok\" type=\"button\">확인<\/button>' });\n    m.el.querySelectorAll(\".consent-box__toggle input\").forEach((t) => t.addEventListener(\"change\", () => t.closest(\".consent-box\").classList.toggle(\"is-open\", t.checked)));\n    m.el.querySelector(\"#consent-ok\").addEventListener(\"click\", async () => {\n      if (!(m.el.querySelector(\"#agree1\").checked && m.el.querySelector(\"#agree2\").checked)) return UI.alert(\"필수 동의 항목에 모두 동의해 주세요.\");\n      m.close(true);\n      openWizard(true);\n    });\n  }\n  function consentBox(id, title, text, open) {\n    return `<div class=\"consent-box ${open ? \"is-open\" : \"\"}\">\n      <div class=\"consent-box__head\"><span>${title}<\/span><label class=\"consent-box__toggle switch switch--sm\"><input type=\"checkbox\" ${open ? \"checked\" : \"\"} aria-label=\"펼쳐보기\"/><i><\/i><b>펼쳐보기<\/b><\/label><\/div>\n      <div class=\"consent-box__text\" id=\"${id}\">${text}<\/div><\/div>`;\n  }\n  function openWizard(initial) {\n    window.MOCK.account.instagramConnected = initial ? true : Store.s.ig;\n    FbeOAuth.open({\n      onComplete: (sel) => {\n        if (initial) {\n          Store.connect(sel);\n          go(\"connect\");\n          UI.toast(\"Meta 비즈니스 연동이 완료되었습니다.\", \"success\");\n          setTimeout(() => ConnectPage.openCategoryMatch(true), 200);\n        } else {\n          Store.reconfigure(sel);\n          render();\n          UI.toast(\"비즈니스 자산 연동 정보가 갱신되었습니다.\", \"success\");\n        }\n      },\n      onCancel: () => UI.toast(initial ? \"Meta 연동이 완료되지 않았습니다. 연동 정보는 저장되지 않으며 연동 가이드 화면을 유지합니다.\" : \"재설정을 취소하여 기존 연결 정보를 유지합니다.\", \"warn\"),\n    });\n  }\n  function gotoConnectAndStart() {\n    go(\"connect\");\n    setTimeout(startFbe, 150);\n  }\n\n  /* ---------------- 렌더 ---------------- */\n  function paintLnb() {\n    // 메뉴 권한이 없으면 메뉴를 숨기지 않고 비활성화(클릭 불가)로 표시 (POL-007)\n    lnbEl.innerHTML = GStore.s.noPerm\n      ? '<li>마케팅 홈<\/li><li>마케팅 캠페인<\/li><li class=\"is-disabled\" aria-disabled=\"true\" title=\"메뉴 권한이 없습니다.\">마케팅 채널 관리<\/li>'\n      : '<li>마케팅 홈<\/li><li>마케팅 캠페인<\/li><li class=\"is-active\"><a href=\"#/mkt/overview\">마케팅 채널 관리<\/a><span class=\"star\">☆<\/span><\/li>';\n  }\n  function render() {\n    UI.closeInfo();\n    UI.closeAllDropdowns();\n    paintLnb();\n    let { parts, params } = parseHash();\n    appEl.innerHTML = \"\";\n\n    // 메뉴 권한 없음: LNB 메뉴 비활성화. URL 직접 접근은 메이크샵 관리자 공통 권한 처리(목업에서는 안내만 표시) (POL-007)\n    if (GStore.s.noPerm) {\n      appEl.insertAdjacentHTML(\"beforeend\", `<section class=\"card noperm\"><h2>마케팅 채널 관리 메뉴 권한이 없는 운영자<\/h2><p>LNB의 마케팅 채널 관리 메뉴가 비활성화되어 들어올 수 없습니다.<br>URL로 직접 접근하는 경우는 메이크샵 관리자 공통 권한 처리를 따릅니다. (목업 안내 화면)<\/p><\/section>`);\n      return;\n    }\n    // 삭제된 기존 메뉴 URL → 새 화면으로 이동 (POL-010)\n    if (parts[0] === \"legacy\") {\n      const to = parts[1] === \"google-feed\" ? \"#/google/feed\" : \"#/meta/home\";\n      UI.toast(`삭제된 기존 메뉴 URL입니다. 마케팅 채널 관리 ${parts[1] === \"google-feed\" ? \"Google > 상품피드\" : \"Meta > 홈\"}으로 이동합니다.`, \"info\");\n      location.replace(to);\n      return;\n    }\n    let chKey = parts[0] === \"mkt\" ? (parts[1] === \"feed\" ? \"feed\" : parts[1] === \"overview\" ? \"overview\" : null) : [\"meta\", \"google\", \"tiktok\"].includes(parts[0]) ? parts[0] : null;\n    if (!chKey) { chKey = \"overview\"; parts = [\"mkt\", \"overview\"]; }\n    const ch = CH_TABS.find((t) => t.key === chKey);\n\n    let sub = null;\n    if (chKey === \"meta\") sub = META_TABS.find((t) => t.key === parts[1]) || META_TABS[0];\n    if (chKey === \"google\") sub = GooglePages.TABS.find((t) => t.key === parts[1]) || GooglePages.TABS[0];\n    const crumbs = [\"마케팅\", \"마케팅 채널 관리\", ch.label].concat(sub ? [sub.label] : []);\n    appEl.insertAdjacentHTML(\"beforeend\", pageHead(crumbs));\n    appEl.insertAdjacentHTML(\n      \"beforeend\",\n      `<nav class=\"ctabs\" aria-label=\"마케팅 채널 관리 탭\">${CH_TABS.map((t) => `<a href=\"${t.href}\" class=\"ctab ${t.key === chKey ? \"is-active\" : \"\"}\">${t.label}<\/a>`).join(\"\")}<\/nav>`\n    );\n    const body = document.createElement(\"div\");\n    body.className = \"ctab-body\";\n    appEl.appendChild(body);\n\n    if (chKey === \"overview\") MktOverview.render(body);\n    else if (chKey === \"feed\") MktFeed.render(body, params);\n    else if (chKey === \"tiktok\") MktTiktok.render(body);\n    else if (chKey === \"meta\") {\n      const wrap = channelWrap(UI.icon.meta, \"Meta\", META_TABS.map((t) => ({ href: \"#/meta/\" + t.key, label: t.label, on: t.key === sub.key })));\n      body.appendChild(wrap);\n      MetaPages[sub.key].render(wrap.querySelector(\".meta-main\"), params);\n    } else if (chKey === \"google\") {\n      const wrap = channelWrap(UI.icon.google, \"Google\", GooglePages.TABS.map((t) => ({ href: \"#/google/\" + t.key, label: t.label, on: t.key === sub.key })));\n      body.appendChild(wrap);\n      GooglePages.render(sub.key, wrap.querySelector(\".meta-main\"), params);\n    }\n    INFO.bind(appEl);\n  }\n  function channelWrap(logo, name, items) {\n    const wrap = document.createElement(\"div\");\n    wrap.className = \"meta-wrap\";\n    wrap.innerHTML = `<nav class=\"subnav card\" aria-label=\"${name} 메뉴\"><div class=\"subnav__logo\">${logo}<\/div><ul>${items.map((t) => `<li><a href=\"${t.href}\" class=\"${t.on ? \"is-active\" : \"\"}\">${t.label}<\/a><\/li>`).join(\"\")}<\/ul><\/nav><div class=\"meta-main\"><\/div>`;\n    return wrap;\n  }\n  let lastHash = \"\";\n  window.addEventListener(\"hashchange\", () => {\n    const base = location.hash.split(\"?\")[0];\n    render();\n    if (base !== lastHash) window.scrollTo(0, 0);\n    lastHash = base;\n  });\n\n  /* ---------------- 시나리오 패널 (Drawer) ---------------- */\n  const drawerEl = document.getElementById(\"scn-drawer\");\n  function paintDrawer() {\n    const g = GStore.s;\n    const sel = (name, val, opts) => `<select data-k=\"${name}\">${opts.map((o) => `<option value=\"${o[0]}\" ${String(val) === String(o[0]) ? \"selected\" : \"\"}>${o[1]}<\/option>`).join(\"\")}<\/select>`;\n    drawerEl.innerHTML = `\n      <div class=\"drawer__head\"><h3>프로토타입 시나리오 패널<\/h3><button type=\"button\" class=\"drawer__close\" aria-label=\"닫기\">×<\/button><\/div>\n      <div class=\"drawer__body\">\n        <p class=\"drawer__hint\">QA·리뷰용 상태 전환 도구입니다. 실제 서비스 화면에는 존재하지 않습니다.<\/p>\n        <h4>전체 프리셋<\/h4>\n        <div class=\"drawer__btns\"><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"all-on\">Meta·Google 모두 연동(운영 중)<\/button><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"all-off\">모두 미연동(최초 진입)<\/button><\/div>\n        <h4>Meta<\/h4>\n        <div class=\"drawer__btns\"><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"meta-on\">Meta 연동 완료<\/button><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"meta-off\">Meta 미연동<\/button><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"meta-queue\">Meta 전송 큐 처리<\/button><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"meta-sync\">Meta 심사 결과 동기화<\/button><\/div>\n        <h4>Google 연결<\/h4>\n        <div class=\"drawer__btns\"><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"g-full\">전체 연결 완료<\/button><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"g-account\">Google 계정만 연결<\/button><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"g-none\">Google 미연결<\/button><\/div>\n        <label>Google 계정 ${sel(\"account\", g.account, [[\"none\", \"미연결\"], [\"connected\", \"연결됨\"], [\"reauth\", \"재인증 필요(인증 만료)\"]])}<\/label>\n        <label>Merchant Center ${sel(\"mc\", g.mc, [[\"none\", \"미연결\"], [\"connected\", \"연결됨\"], [\"reauth\", \"재인증 필요(권한 오류)\"]])}<\/label>\n        <label>Merchant Center 계정 정지 ${sel(\"mcSuspended\", g.mcSuspended, [[false, \"정상\"], [true, \"계정 정지됨\"]])}<\/label>\n        <label>Google Ads ${sel(\"ads\", g.ads, [[\"none\", \"미연결\"], [\"connected\", \"연결됨\"], [\"reauth\", \"재인증 필요(AuthorizationError)\"]])}<\/label>\n        <label>Google Ads의 MC 연결 단계 ${sel(\"mcLink\", g.mcLink, [[\"none\", \"Google Ads만 연결\"], [\"detected\", \"MC 연결 감지(메이크샵 미연동)\"], [\"linked\", \"MC 연동 완료\"]])}<\/label>\n        <h4>Google 상품 피드<\/h4>\n        <div class=\"drawer__btns\"><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"g-queue\">전송 큐 지금 처리 (반영대기→검토중)<\/button><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"g-sync\">Google 심사 결과 동기화 (검토중→결과)<\/button><\/div>\n        <label>전송 큐 자동 처리 ${sel(\"queueAuto\", g.queueAuto !== false, [[true, \"사용 (반영 5초 후 자동 전송)\"], [false, \"일시정지 (반영대기 유지)\"]])}<\/label>\n        <h4>권한·기존 메뉴<\/h4>\n        <label>마케팅 채널 관리 메뉴 권한 ${sel(\"noPerm\", g.noPerm, [[false, \"있음\"], [true, \"없음(메뉴 비활성화)\"]])}<\/label>\n        <div class=\"drawer__btns\"><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"legacy-google\">기존 구글 상품 피드 URL 접속<\/button><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"legacy-meta\">기존 Meta 메뉴 URL 접속<\/button><\/div>\n        <h4>데이터<\/h4>\n        <div class=\"drawer__btns\"><button type=\"button\" class=\"btn btn--line btn--sm\" data-act=\"clear\">저장 데이터 전체 초기화<\/button><\/div>\n      <\/div>`;\n    drawerEl.querySelector(\".drawer__close\").addEventListener(\"click\", () => UI.drawer(drawerEl, false));\n    drawerEl.querySelectorAll(\"select[data-k]\").forEach((x) =>\n      x.addEventListener(\"change\", () => {\n        const v = x.value === \"true\" ? true : x.value === \"false\" ? false : x.value;\n        const k = x.dataset.k;\n        if (k === \"failMeta\") g.apiFail.meta = v;\n        else if (k === \"failGoogle\") g.apiFail.google = v;\n        else if (k === \"mc\" && v === \"connected\" && !g.mcAccount) GStore.connectMc(window.GMOCK.merchantCandidates[0]);\n        else if (k === \"ads\" && v === \"connected\" && !g.adsAccount) GStore.connectAds(window.GMOCK.adsAccounts[0]);\n        else g[k] = v;\n        if (k === \"mc\" && v === \"none\") GStore.disconnectMc();\n        if (k === \"ads\" && v === \"none\") GStore.disconnectAds();\n        GStore.save();\n        if (k === \"queueAuto\" && v) GStore.scheduleQueue();\n        render();\n        paintDrawer();\n        UI.toast(\"시나리오 값이 변경되었습니다.\", \"info\");\n      })\n    );\n    drawerEl.querySelectorAll(\"[data-act]\").forEach((b) =>\n      b.addEventListener(\"click\", () => {\n        const a = b.dataset.act;\n        if (a === \"all-on\") { Store.reset(\"connected\"); GStore.reset(\"full\"); nav(\"#/mkt/overview\"); }\n        if (a === \"all-off\") { Store.reset(\"new\"); GStore.reset(\"none\"); nav(\"#/mkt/overview\"); }\n        if (a === \"meta-on\") { Store.reset(\"connected\"); render(); }\n        if (a === \"meta-off\") { Store.disconnect(); render(); }\n        if (a === \"meta-queue\") { const n = Store.processQueue(); UI.toast(n ? `Meta 반영대기 ${n}건 전송 → 검토중` : \"Meta 반영대기 상품이 없습니다.\", \"info\"); render(); }\n        if (a === \"meta-sync\") { const n = Store.syncMeta(); UI.toast(n ? `Meta 검토중 ${n}건 결과 반영` : \"Meta 검토중 상품이 없습니다.\", \"info\"); render(); }\n        if (a === \"g-full\") { GStore.reset(\"full\"); render(); }\n        if (a === \"g-account\") { GStore.reset(\"account\"); render(); }\n        if (a === \"g-none\") { GStore.reset(\"none\"); render(); }\n        if (a === \"g-queue\") {\n          if (GStore.queueBlocked()) UI.toast(\"재인증이 필요해 전송 큐가 멈춰 있습니다(POL-059).\", \"warn\");\n          else { const n = GStore.processQueue(); UI.toast(n ? `반영대기 ${n}건이 Merchant Center로 전송되어 검토중으로 바뀌었습니다.` : \"반영대기 상품이 없습니다.\", \"info\"); }\n          render();\n        }\n        if (a === \"g-sync\") { const n = GStore.syncGoogle(); UI.toast(n ? `검토중 ${n}건의 Google 판정 결과가 반영되었습니다.` : \"검토중 상품이 없습니다.\", \"info\"); render(); }\n        if (a === \"legacy-google\") { UI.drawer(drawerEl, false); location.hash = \"#/legacy/google-feed\"; }\n        if (a === \"legacy-meta\") { UI.drawer(drawerEl, false); location.hash = \"#/legacy/meta\"; }\n        if (a === \"clear\") {\n          try { localStorage.clear(); } catch (e) {}\n          Store.reset(\"connected\");\n          GStore.reset(\"full\");\n          nav(\"#/mkt/overview\");\n        }\n        paintDrawer();\n      })\n    );\n  }\n  document.getElementById(\"scn-open\").addEventListener(\"click\", () => {\n    paintDrawer();\n    UI.drawer(drawerEl, true);\n  });\n  document.getElementById(\"drawer-dim\").addEventListener(\"click\", () => UI.drawer(drawerEl, false));\n\n  setTimeout(() => {\n    render();\n    lastHash = location.hash.split(\"?\")[0];\n  }, 0);\n\n  return { go, nav, render, startFbe, openWizard, gotoConnectAndStart, emptyState, banner, section };\n})();\n\n<\/script>\n<\/body>\n<\/html>\n"</script>
<script type="application/json" id="screens">[{"id":"0-1","group":"0. 공통","title":"IA·기존 메뉴 정리 흐름","scr":"SCR-MKT-000","path":"마케팅 > 마케팅 채널 관리","wf":"-","fr":"FR-001부터 FR-003","pol":"POL-001부터 POL-012","static":"ia","desc":[["1","신규 메뉴",["GNB 마케팅 아래 LNB에 마케팅 채널 관리 메뉴를 둡니다.","1단 탭은 통합 현황 / 통합 상품 피드 / Meta / Google / TikTok 순서입니다. 탭 지정 없이 들어오면 통합 현황을 엽니다.","현재 탭과 채널 하위 탭을 URL에 남기고, 값이 없거나 잘못되면 통합 현황을 엽니다."]],["2","기존 메뉴 정리 (배포 시)",["부가서비스 > 채널 > Meta, 구글 상품 피드 메뉴는 배포 시점에 삭제합니다. 안내 기간을 두지 않습니다.","기존 URL로 들어오면 Meta는 Meta 탭의 같은 하위 화면, 구글 상품 피드는 Google 탭 상품피드로 이동합니다. 대응 화면이 없으면 해당 채널 홈으로 이동합니다.","두 기존 메뉴 중 하나라도 권한이 있던 운영자에게 마케팅 채널 관리 메뉴 권한을 줍니다.","삭제한 메뉴가 만들던 외부 연동(상품 피드 URL 등)은 배포로 중단하지 않습니다(OPEN-002).","네트워크 광고 메뉴는 이번 범위가 아니며 그대로 둡니다."]],["3","브레드크럼",["마케팅 > 마케팅 채널 관리 > {탭명} > {채널 하위 탭명} 형식이며, 하위 탭이 없으면 {탭명}까지만 표시합니다."]]],"staticHtml":"<div class=\"ia\">\n    <h3>신규 메뉴<\/h3>\n    <div class=\"ia-row\"><div class=\"ia-box\"><b>GNB 마케팅<\/b><\/div><i>→<\/i><div class=\"ia-box\"><b>LNB 마케팅 채널 관리<\/b><\/div><i>→<\/i><div class=\"ia-box on\"><b>통합 현황<\/b><span>기본 진입<\/span><\/div><div class=\"ia-box on\"><b>통합 상품 피드<\/b><span>조회 전용<\/span><\/div><div class=\"ia-box on\"><b>Meta<\/b><span>개발 완료 화면<\/span><\/div><div class=\"ia-box on\"><b>Google<\/b><span>홈·연결관리·상품피드·구글애즈<\/span><\/div><div class=\"ia-box on\"><b>TikTok<\/b><span>준비 중<\/span><\/div><\/div>\n    <h3>기존 메뉴 (부가서비스 &gt; 부가서비스 &gt; 채널) — 배포 시 처리<\/h3>\n    <div class=\"ia-row\"><div class=\"ia-box\"><b>Meta<\/b><span>삭제<\/span><\/div><i>→<\/i><div class=\"ia-box on\"><b>Meta 탭<\/b><\/div><em>기존 URL → Meta 탭 대응 화면 · 메뉴 권한 이관<\/em><\/div>\n    <div class=\"ia-row\"><div class=\"ia-box\"><b>구글 상품 피드<\/b><span>삭제<\/span><\/div><i>→<\/i><div class=\"ia-box on\"><b>Google 탭 &gt; 상품피드<\/b><\/div><em>기존 URL → Google 상품피드 · 메뉴 권한 이관<\/em><\/div>\n    <div class=\"ia-row\"><div class=\"ia-box\"><b>네트워크 광고<\/b><span>유지<\/span><\/div><em>이번 범위 아님 — 메뉴 위치·기능 변경 없음<\/em><\/div>\n    <h3>브레드크럼<\/h3>\n    <div class=\"ia-row\"><em>마케팅 &gt; 마케팅 채널 관리 &gt; {탭명} &gt; {채널 하위 탭명}<\/em><\/div>\n  <\/div>"},{"id":"0-2","group":"0. 공통","title":"메뉴 권한 없음","scr":"SCR-MKT-000","path":"마케팅","wf":"WF-001부터 WF-008","fr":"FR-001","pol":"POL-007","steps":[["meta","connected"],["google","full"],["set",{"noPerm":true}],["go","#/mkt/overview"]],"marks":[["1","#lnb-menu .is-disabled"]],"desc":[["1","LNB 메뉴 비활성화",["마케팅 채널 관리 메뉴 권한이 없는 운영자에게는 메뉴를 숨기지 않고 비활성화(클릭 불가)로 표시합니다.","URL로 직접 접근하는 경우는 메이크샵 관리자 공통 권한 처리를 따르며 별도 안내 화면을 만들지 않습니다.","가운데 안내 박스는 목업 설명용이며 실제 화면이 아닙니다."]]],"staticHtml":null},{"id":"1-1","group":"1. 통합 현황","title":"통합 현황 (Meta·Google 연동)","scr":"SCR-MKT-001","path":"마케팅 > 마케팅 채널 관리 > 통합 현황","wf":"WF-001","fr":"FR-004, FR-005","pol":"POL-013부터 POL-022","steps":[["meta","connected"],["google","full"],["go","#/mkt/overview"]],"marks":[["1",".ctabs"],["2","h3@채널 연결 현황^.sec"],["2-1",".chcard__foot .pill|1"],["2-2",".chcard button|1"],["3","h3@채널별 운영 현황^.sec"],["3-1","th@계정 연결 상태"],["3-2","th@상품 피드 연결 상태"],["3-3","th@광고 연결 상태"],["3-4","th@채널 등록 상품 수"],["3-5",".v-btn button|1"]],"desc":[["1","1단 탭",["메뉴에 들어오면 기본으로 열리는 탭입니다.","탭·카드·행·컬럼의 채널 순서는 Meta, Google, TikTok으로 같고 신규 채널은 뒤에 추가합니다(POL-006)."]],["2","채널 연결 현황 · AREA-MKT-OVERVIEW-CONNECT",["카드에 채널 로고, 채널명, 제공 기능, 계정 연결 상태, 버튼을 표시합니다.","채널을 합산한 값(전체 상품 수, 확인 필요 건수, 전송 대기 건수)은 두지 않습니다."]],["2-1","계정 연결 상태",["Meta: Meta 연결관리에서 확인해 저장한 연결 상태(POL-014)","Google: Google 계정 연결 상태(연결됨 / 재인증 필요 / 미연결)(POL-015)","TikTok: '준비 중'을 표시하고 버튼을 두지 않습니다."]],["2-2","[관리하기] / [연동하기]",["연결됨·재인증 필요: [관리하기] → 해당 채널 탭의 홈","미연결: [연동하기] → 해당 채널 연결관리"]],["3","채널별 운영 현황 · AREA-MKT-OVERVIEW-OPERATION",["연동 기능을 제공하는 Meta, Google만 행으로 표시합니다(POL-017).","컬럼: 채널 / 계정 연결 상태 / 상품 피드 연결 상태 / 광고 연결 상태 / 채널 등록 상품 수 / 관리","외부 API를 호출하지 않고, 각 채널 화면에서 확인·판정해 메이크샵에 저장한 값을 표시합니다(POL-021).","광고비·ROAS 등 광고 성과는 통합 현황에 두지 않고 각 채널 광고 화면에서 확인합니다(POL-019)."]],["3-1","계정 연결 상태",["Meta: Meta 비즈니스(FBE) 연결 / Google: Google 계정 연결","값: 연결됨 / 재인증 필요 / 미연결"]],["3-2","상품 피드 연결 상태",["Meta: 제품 카탈로그 연결 / Google: Merchant Center 연결"]],["3-3","광고 연결 상태",["Meta: 광고 계정 연결 / Google: Google Ads 연결","Meta는 FBE로 한 번에 연결하므로 세 연결 상태가 Meta 연결 상태와 같습니다(POL-014).","Google 계정이 재인증 필요이면 Google의 세 연결 상태가 모두 재인증 필요입니다(POL-015)."]],["3-4","채널 등록 상품 수",["메이크샵이 전송해 채널에 등록된 상품(활동중·검토중·미승인) 수입니다(POL-018).","반영대기·노출제한·사용안함과 채널에서 직접 등록한 상품은 세지 않습니다.","상품 피드가 연결되지 않았으면 '-'입니다(POL-020). 채널 간 상품 수를 더하지 않습니다(POL-022)."]],["3-5","[바로가기] / [연동하기]",["연동된 채널: [바로가기] → 해당 채널 탭의 홈","미연동 채널: [연동하기] → 해당 채널 연결관리"]],["※","공통 상태·권한",["권한: 마케팅 채널 관리 메뉴 권한이 없으면 LNB 메뉴를 비활성화(클릭 불가)로 표시합니다. URL 직접 접근은 메이크샵 관리자 공통 권한 처리를 따릅니다(POL-007)."]]],"staticHtml":null},{"id":"1-2","group":"1. 통합 현황","title":"통합 현황 (Google 상품 피드·광고 미연결)","scr":"SCR-MKT-001","path":"마케팅 > 마케팅 채널 관리 > 통합 현황","wf":"WF-001","fr":"FR-004, FR-005","pol":"POL-016, POL-019, POL-020","steps":[["meta","connected"],["google","account"],["go","#/mkt/overview"]],"marks":[["1",".chcard|2"],["2","tr[data-ch=google]"]],"desc":[["1","Google 카드",["Google 계정이 연결되어 있어 카드 배지는 '연결됨', 버튼은 [관리하기]입니다."]],["2","서비스별 연결 상태",["계정 연결됨, 상품 피드(Merchant Center) 미연결, 광고(Google Ads) 미연결로 각각 표시합니다.","상품 피드가 연결되지 않아 채널 등록 상품 수는 '-'입니다(AC-009).","채널 전체가 미연결이면 세 연결 상태 모두 미연결, 관리 컬럼은 [연동하기]입니다(AC-008)."]]],"staticHtml":null},{"id":"1-3","group":"1. 통합 현황","title":"통합 현황 (Google 계정 재인증 필요)","scr":"SCR-MKT-001","path":"마케팅 > 마케팅 채널 관리 > 통합 현황","wf":"WF-001","fr":"FR-004, FR-005","pol":"POL-015, POL-021","steps":[["meta","connected"],["google","full"],["set",{"account":"reauth"}],["go","#/mkt/overview"]],"marks":[["1",".chcard|2"],["2","tr[data-ch=google]"]],"desc":[["1","Google 카드",["계정 연결 상태 '재인증 필요', 버튼은 [관리하기]입니다."]],["2","세 연결 상태 모두 재인증 필요",["Google 계정 인증이 만료되면 Merchant Center·Google Ads도 재인증 필요로 표시합니다(POL-015, AC-010).","통합 현황은 저장된 값으로 표시하며 외부 API를 호출하지 않습니다. 채널 등록 상품 수는 저장된 값을 그대로 보여줍니다(POL-021)."]]],"staticHtml":null},{"id":"2-1","group":"2. 통합 상품 피드","title":"통합 상품 피드","scr":"SCR-MKT-002","path":"마케팅 > 마케팅 채널 관리 > 통합 상품 피드","wf":"WF-002","fr":"FR-006, FR-007","pol":"POL-023부터 POL-029","steps":[["meta","connected"],["google","full"],["go","#/mkt/feed"],["wait",700]],"marks":[["1","#mf-form"],["1-1",".sform__row@연동 상태"],["1-2",".sform__btns"],["2","#mf-list .list-tools"],["3","#mf-list thead"],["3-1","#mf-list tbody td:nth-child(2)|1"],["3-2","#mf-list .col-manage2|2"]],"desc":[["1","검색 영역 · AREA-MKT-FEED-SEARCH",["상품명: 입력한 문자열을 포함하는 상품 / 상품번호: 일치하는 상품","검색조건은 모두 AND로 결합합니다(POL-028)."]],["1-1","연동 상태",["채널을 먼저 고르면 상태 선택이 활성화됩니다. 예: Google + 미승인","상태값은 각 채널 상품피드의 상태 라벨(활동중 / 검토중 / 미승인 / 노출제한 / 사용안함 / 반영대기)입니다.","채널만 고르고 상태를 고르지 않으면 채널 조건을 적용하지 않습니다.","상품 피드가 연동되지 않은 채널(Google은 Merchant Center 미연결)은 선택할 수 없습니다."]],["1-2","[검색] / [초기화]",["[검색]: 첫 페이지부터 다시 조회","[초기화]: 모든 조건을 비우고 전체 상품을 다시 조회"]],["2","목록 헤더",["총 상품 수는 검색 결과 건수입니다.","페이지당 20 / 50 / 100개, 기본 20개. 바꾸면 첫 페이지부터 조회합니다(POL-029)."]],["3","상품 목록 · CMP-MKT-FEED-TABLE",["메이크샵 등록 상품 전체(삭제 상품 제외)를 상품 1개 1행으로 표시합니다. 옵션 단위로 나누지 않습니다(POL-023).","컬럼: 상품정보(이미지·상품명·상품번호) / Meta 상태 / Google 상태 / 관리. 상품 등록일 최신순입니다.","조회 전용이며 전송·수정·카테고리 매칭·사용여부 변경 기능을 두지 않습니다(POL-027).","채널 컬럼이 늘어 폭을 넘으면 가로 스크롤하고 상품정보 컬럼은 고정합니다. TikTok 컬럼은 두지 않습니다."]],["3-1","채널별 상태",["각 채널 상품피드의 상태 라벨을 그대로 표시하고 채널 간 상태를 합치지 않습니다(POL-024).","상품 피드 미연동 채널, 채널 목록에 없는 상품은 '-'입니다(POL-025).","채널 상태는 각 채널 상품피드에서 판정해 저장한 값이며 외부 API를 호출하지 않습니다(POL-021)."]],["3-2","[Meta 관리 ↗] / [Google 관리 ↗]",["해당 채널 탭의 상품피드로 이동합니다(POL-026).","채널 상품 피드가 연동되지 않았으면 버튼을 표시하지 않습니다."]],["※","공통 상태",["Empty: '조회된 상품이 없습니다.' / Loading: 목록 영역 로딩","권한: 마케팅 채널 관리 메뉴 권한이 없으면 LNB 메뉴를 비활성화(클릭 불가)로 표시합니다. URL 직접 접근은 메이크샵 관리자 공통 권한 처리를 따릅니다(POL-007)."]]],"staticHtml":null},{"id":"2-2","group":"2. 통합 상품 피드","title":"검색 결과 (Google + 미승인)","scr":"SCR-MKT-002","path":"마케팅 > 마케팅 채널 관리 > 통합 상품 피드","wf":"WF-002","fr":"FR-007","pol":"POL-028","steps":[["meta","connected"],["google","full"],["go","#/mkt/feed"],["wait",500],["js","const c=document.querySelector('#mf-ch');c.value='google';c.dispatchEvent(new Event('change'));document.querySelector('#mf-st').value='미승인';document.querySelector('#mf-form').requestSubmit();"],["wait",700]],"marks":[["1",".sform__row@연동 상태"],["2","#mf-list tbody"]],"desc":[["1","채널 + 상태 조건",["Google + 미승인을 고르고 [검색]하면 Google 상태가 미승인인 상품만 조회합니다."]],["2","결과",["Meta 컬럼은 해당 상품의 Meta 상태를 그대로 보여줍니다(AC-011)."]]],"staticHtml":null},{"id":"2-3","group":"2. 통합 상품 피드","title":"Google 상품 피드 미연동","scr":"SCR-MKT-002","path":"마케팅 > 마케팅 채널 관리 > 통합 상품 피드","wf":"WF-002","fr":"FR-006","pol":"POL-025, POL-026","steps":[["meta","connected"],["google","account"],["go","#/mkt/feed"],["wait",700]],"marks":[["1","#mf-ch"],["2","#mf-list tbody td:nth-child(3)|1"],["3","#mf-list .col-manage2|2"]],"desc":[["1","채널 선택",["Google 상품 피드(Merchant Center)가 연동되지 않아 Google을 선택할 수 없습니다."]],["2","Google 상태",["모든 상품이 '-'입니다."]],["3","관리",["[Google 관리 ↗]를 표시하지 않습니다."]]],"staticHtml":null},{"id":"3-1","group":"3. Meta 탭","title":"Meta 탭 (기존 화면)","scr":"SCR-META-000","path":"마케팅 > 마케팅 채널 관리 > Meta > 홈","wf":"WF-003","fr":"FR-008","pol":"POL-030, POL-071","steps":[["meta","connected"],["google","full"],["go","#/meta/home"]],"marks":[["1",".page-head"],["2",".subnav"],["3",".meta-main"]],"desc":[["1","진입 경로·브레드크럼",["Meta 탭은 마케팅 > 마케팅 채널 관리 > Meta > {하위 탭} 기준으로 바뀝니다. 바뀌는 것은 진입 경로와 브레드크럼뿐입니다(POL-030)."]],["2","Meta 하위 탭",["홈 / 연결 관리 / 상품 피드 / 광고 관리 / Shops 관리 — 개발 완료 화면 그대로입니다."]],["3","화면 내용",["화면 구성·기능·정책은 Meta 비즈니스 연동 화면 정의서(3-2부터 3-6-1)을 따릅니다.","GPC는 Meta·Google 공통값입니다. Google에서 바꾼 값이 Meta 카테고리 매칭에도 같이 보입니다(POL-071)."]]],"staticHtml":null},{"id":"4-1","group":"4. TikTok 탭","title":"TikTok 준비 중","scr":"SCR-MKT-003","path":"마케팅 > 마케팅 채널 관리 > TikTok","wf":"WF-004","fr":"FR-009","pol":"POL-031","steps":[["meta","connected"],["google","full"],["go","#/tiktok"]],"marks":[["1",".ready"]],"desc":[["1","준비 중 안내 · AREA-MKT-TIKTOK-READY",["연동 기능을 준비 중이라는 안내만 표시합니다. 연동·설정 버튼과 연동 일정 안내는 두지 않습니다.","통합 현황 채널 연결 현황에는 '준비 중' 카드로 표시하고, 운영 현황 표와 통합 상품 피드에는 표시하지 않습니다."]]],"staticHtml":null},{"id":"5-1","group":"5. Google 홈","title":"Google 홈 (전체 연결)","scr":"SCR-GOOGLE-HOME-001","path":"마케팅 > 마케팅 채널 관리 > Google > 홈","wf":"WF-005","fr":"FR-010","pol":"POL-032부터 POL-034","steps":[["meta","connected"],["google","full"],["go","#/google/home"]],"marks":[["1",".subnav"],["2",".home-card|1"],["2-1",".home-card button|1"],["3",".home-card button|2"],["4",".home-card button|3"]],"desc":[["1","Google 하위 탭 · CMP-GOOGLE-SUBNAV",["홈 / 연결관리 / 상품피드 / 구글애즈. Google 탭을 누르면 홈을 엽니다(POL-032).","Meta 채널 화면과 같은 디자인 기준(레이아웃, 페이지 헤드, 하위 탭, 카드, 표, 버튼, 팝업, 상태 배지)을 씁니다.","하위 탭은 연동 상태와 관계없이 항상 들어갈 수 있고, 필요한 연동이 없으면 탭 안에 안내와 버튼을 표시합니다(5-2, 8-1, 9-1)."]],["2","연결관리 카드",["Google 계정을 연결하고 Merchant Center와 Google Ads를 각각 연결하는 공간이라는 설명을 표시합니다."]],["2-1","[설정하기] / [자세히 보기]",["Google 계정 미연결: [설정하기] → 연결관리","연결됨 또는 재인증 필요: [자세히 보기] → 연결관리"]],["3","상품피드 카드 버튼",["Merchant Center 미연결: [설정하기] → 연결관리 Merchant Center 영역","연결됨: [자세히 보기] → 상품피드"]],["4","구글애즈 카드 버튼",["Google Ads 미연결: [설정하기] → 연결관리로 이동 후 Google Ads 연결 모달","연결됨: [자세히 보기] → 구글애즈","카드별 연동 여부는 따로 판정합니다(POL-033)."]],["※","공통 상태",["Loading: 연동 상태를 확인하는 동안 카드 버튼 자리에 로딩","Error: 연동 상태 조회에 실패하면 [자세히 보기]를 표시하고 하위 탭에서 실제 상태를 다시 확인합니다.","권한: 마케팅 채널 관리 메뉴 권한이 없으면 LNB 메뉴를 비활성화(클릭 불가)로 표시합니다. URL 직접 접근은 메이크샵 관리자 공통 권한 처리를 따릅니다(POL-007)."]]],"staticHtml":null},{"id":"5-2","group":"5. Google 홈","title":"Google 홈 (계정만 연결)","scr":"SCR-GOOGLE-HOME-001","path":"마케팅 > 마케팅 채널 관리 > Google > 홈","wf":"WF-005","fr":"FR-010","pol":"POL-033","steps":[["meta","connected"],["google","account"],["go","#/google/home"]],"marks":[["1",".home-card button|1"],["2",".home-card button|2"],["3",".home-card button|3"]],"desc":[["1","연결관리",["Google 계정이 연결되어 [자세히 보기]입니다."]],["2","상품피드",["Merchant Center 미연결이라 [설정하기]이며 연결관리 Merchant Center 영역으로 이동합니다."]],["3","구글애즈",["Google Ads 미연결이라 [설정하기]이며 연결관리로 이동 후 Google Ads 연결 모달을 엽니다."]]],"staticHtml":null},{"id":"6-1","group":"6. Google 연결관리","title":"Google 계정 미연결 (시작)","scr":"SCR-GOOGLE-CONN-001","path":"마케팅 > 마케팅 채널 관리 > Google > 연결관리","wf":"WF-006","fr":"FR-011","pol":"POL-035, POL-041","steps":[["meta","connected"],["google","none"],["go","#/google/connect"]],"marks":[["1",".empty-hero h2"],["2",".empty-hero .btn"],["3",".empty-hero__note"]],"desc":[["1","시작 안내",["Google 계정 하나로 Merchant Center와 Google Ads를 연결한다는 안내를 표시합니다."]],["2","[Google 계정으로 시작하기]",["개인정보 동의 모달(6-2)을 엽니다. 동의 후 Google 로그인·권한 동의(6-3)로 이어집니다."]],["3","개별 연동 안내",["Merchant Center만, 또는 Google Ads만 연결해도 해당 기능을 쓸 수 있습니다(POL-035). Meta처럼 한 번에 연동하는 방식으로 바꾸지 않습니다."]]],"staticHtml":null},{"id":"6-2","group":"6. Google 연결관리","title":"개인정보 수집·이용 동의","scr":"SCR-GOOGLE-CONN-002","path":"마케팅 > 마케팅 채널 관리 > Google > 연결관리","wf":"WF-006","fr":"FR-011","pol":"POL-041, CON-002","h":980,"steps":[["meta","connected"],["google","none"],["go","#/google/connect"],["click",".empty-hero .btn"]],"marks":[["1",".modal .consent-box|1"],["2",".modal .consent-box|2"],["3",".modal .chk|1"],["4",".modal [data-act=ok]"]],"desc":[["1","제3자 제공 동의(필수)",["제공받는 자 Google LLC, 제공 목적·항목·국외 이전을 표시합니다. 법적 문구는 법무 확인본을 씁니다[법무·보안 확인 필요]."]],["2","수집·이용 동의(메이크샵)",["Google 계정 이메일, 인증 정보, Merchant Center 계정 ID, Google Ads 고객 ID 수집을 안내합니다."]],["3","필수 동의 체크",["두 항목 모두 체크해야 진행합니다."]],["4","[확인]",["미동의 시 얼럿 \"필수 동의 항목에 모두 동의해 주세요.\"","모두 동의하면 Google 로그인 화면(6-3)을 엽니다."]]],"staticHtml":null},{"id":"6-3","group":"6. Google 연결관리","title":"Google 로그인·권한 동의 (Google 화면)","scr":"SCR-GOOGLE-CONN-003","path":"Google OAuth 팝업","wf":"WF-006","fr":"FR-011","pol":"POL-041, CON-004","h":980,"steps":[["meta","connected"],["google","none"],["go","#/google/connect"],["click",".empty-hero .btn"],["js","document.querySelector('#g-agree1').click();document.querySelector('#g-agree2').click();document.querySelector('.modal [data-act=ok]').click();"],["wait",200],["click",".modal [data-act=pick]"]],"marks":[["1",".modal .glogin__acct"],["2",".modal .glogin__scopes"],["3",".modal [data-act=allow]"]],"desc":[["1","계정 선택",["Google이 제공하는 화면이며 메이크샵이 바꿀 수 없습니다(CON-004). 목업은 흐름 확인용 시뮬레이션입니다."]],["2","권한 동의",["Merchant Center 상품 데이터 관리, Google Ads 데이터 조회, 사이트 소유권 확인 권한을 요청합니다.","인증 코드 방식으로 연결하고 인증 정보를 보관합니다(POL-041)."]],["3","[허용]",["허용하면 Google 계정이 '연결됨'이 되고 연결관리(6-4)로 돌아옵니다.","취소·닫기: 연동하지 않고 시작 화면을 유지합니다."]]],"staticHtml":null},{"id":"6-4","group":"6. Google 연결관리","title":"Google 계정만 연결","scr":"SCR-GOOGLE-CONN-004","path":"마케팅 > 마케팅 채널 관리 > Google > 연결관리","wf":"WF-006","fr":"FR-011부터 FR-013","pol":"POL-035","steps":[["meta","connected"],["google","account"],["go","#/google/connect"]],"marks":[["1","h3@Google 계정^.sec"],["2","[data-act=mc-connect]"],["3","[data-act=ads-connect]"]],"desc":[["1","Google 계정",["로그인 이메일과 연결 상태를 표시합니다. [전체 연결 해제]는 6-9 참고."]],["2","[Merchant Center 연동하기]",["Merchant Center 연결 마법사(6-5, 6-6)를 엽니다."]],["3","[Google Ads 연결하기]",["Google Ads 연결 모달(6-12)을 엽니다. Merchant Center가 없어도 연결할 수 있습니다."]],["※","상품 피드 영역",["Merchant Center가 연결되지 않으면 상품 피드 영역을 표시하지 않습니다."]]],"staticHtml":null},{"id":"6-5","group":"6. Google 연결관리","title":"Merchant Center 연결 — 준비사항","scr":"SCR-GOOGLE-CONN-005","path":"마케팅 > 마케팅 채널 관리 > Google > 연결관리","wf":"WF-006","fr":"FR-012","pol":"POL-042","h":980,"steps":[["meta","connected"],["google","account"],["go","#/google/connect"],["click","[data-act=mc-connect]"]],"marks":[["1",".modal .wstep"],["2",".modal .checklist"],["3",".modal [data-act=next]"]],"desc":[["1","진행 단계",["준비사항 확인 → 계정 선택(생성) → 사업자 정보 제공 동의 → 대표 전화번호 인증 → 판매자 약관 동의","단계별 세부 화면은 v0.1 화면설계서 4-2부터 4-8을 따릅니다."]],["2","준비사항 4개",["커넥트 정보(사업자 정보), SSL, 쇼핑몰 이용약관·환불 정책, 결제 수단이 모두 완료되어야 합니다(POL-042).","미완료 항목이 있으면 [다음]을 비활성화하고 해당 항목 설정 안내를 표시합니다."]],["3","[다음]",["다음 단계로 이동합니다. 마지막 단계에서는 [연결 완료]입니다."]]],"staticHtml":null},{"id":"6-6","group":"6. Google 연결관리","title":"Merchant Center 연결 — 대표 전화번호 인증","scr":"SCR-GOOGLE-CONN-005","path":"마케팅 > 마케팅 채널 관리 > Google > 연결관리","wf":"WF-006","fr":"FR-012","pol":"POL-043, CON-002","h":980,"steps":[["meta","connected"],["google","account"],["go","#/google/connect"],["click","[data-act=mc-connect]"],["click",".modal [data-act=next]"],["click",".modal [data-act=next]"],["click","#mc-agree"],["click",".modal [data-act=next]"]],"marks":[["1",".modal .sec__lead"],["2",".modal .phone-box"],["3",".modal [data-act=g-verify]"],["4",".modal [data-act=ph-check]"]],"desc":[["1","안내",["대표 전화번호 인증은 운영자가 Google 화면에서 직접 합니다. 인증번호 받기·입력도 Google 화면에서 하며, 메이크샵은 인증번호를 보내거나 확인하지 않습니다(POL-043).","이 단계는 건너뛸 수 없습니다."]],["2","대표 전화번호·인증 상태",["전화번호는 마스킹해 표시하고 로그에 남기지 않습니다(CON-002, NFR-005).","인증 상태: 미인증 / 인증 완료. 조회 중에는 로딩을 표시합니다."]],["3","[Google에서 인증하기]",["Merchant Center 비즈니스 정보(전화번호 인증) 화면을 새 창으로 엽니다."]],["4","[인증 확인]",["누를 때만 Merchant API phoneVerificationState를 조회합니다. VERIFIED는 인증 완료, UNVERIFIED는 미인증으로 표시합니다.","조회에 실패하면 미인증으로 바꾸지 않고 확인 실패 안내를 표시합니다.","인증 완료 전에 [다음]을 누르면 얼럿 \"대표 전화번호 인증을 완료한 뒤 [인증 확인]을 눌러 주세요.\""]]],"staticHtml":null},{"id":"6-7","group":"6. Google 연결관리","title":"Merchant Center 연결 직후 (후속 설정)","scr":"SCR-GOOGLE-CONN-006","path":"마케팅 > 마케팅 채널 관리 > Google > 연결관리","wf":"WF-006","fr":"FR-012","pol":"POL-044, POL-045, POL-063","steps":[["meta","connected"],["google","account"],["js","GStore.connectMc(GMOCK.merchantCandidates[0]);"],["go","#/google/connect"]],"marks":[["1","dt@쇼핑몰 도메인 인증^.kv__row"],["2","dt@판매국가·배송 설정^.kv__row"],["3","h3@상품 피드^.sec"]],"desc":[["1","쇼핑몰 도메인 인증",["인증 필요 / 인증 중 / 인증 완료 / 인증 실패. 쇼핑몰 대표 도메인으로 인증하고 Homepage.claimed 재조회 결과로 판정합니다(POL-044).","실패하면 실패 단계와 안내 문구, [다시 시도]를 표시하고 원본 오류는 노출하지 않습니다."]],["2","판매국가·배송 설정",["설정 필요 / 설정 완료. [설정하기]로 6-8 모달을 엽니다."]],["3","상품 피드 영역",["Merchant Center 연결 후 표시합니다. 카테고리 설정은 매칭 전이라 '미설정'입니다.","도메인 인증과 판매국가·배송 설정이 모두 끝나면 카테고리 매칭 모달(7-1)을 1회 자동으로 엽니다(POL-063)."]]],"staticHtml":null},{"id":"6-8","group":"6. Google 연결관리","title":"판매국가·배송 설정","scr":"SCR-GOOGLE-CONN-007","path":"마케팅 > 마케팅 채널 관리 > Google > 연결관리","wf":"WF-006","fr":"FR-012","pol":"POL-045, CON-001","h":900,"steps":[["meta","connected"],["google","account"],["js","GStore.connectMc(GMOCK.merchantCandidates[0]);"],["go","#/google/connect"],["click","[data-act=ship]"]],"marks":[["1",".modal .kv"],["2",".modal .note"],["3",".modal [data-act=ok]"]],"desc":[["1","판매 국가·통화",["판매 국가는 대한민국, 통화는 KRW로 고정하며 바꿀 수 없습니다(CON-001)."]],["2","배송 자동 가져오기 제한",["착불 배송 또는 무게·가격별 차등 배송비를 쓰면 자동으로 가져올 수 없어 Merchant Center에서 직접 설정하도록 안내합니다(POL-045)."]],["3","[저장]",["저장하면 판매국가·배송 설정이 '설정 완료'가 됩니다."]]],"staticHtml":null},{"id":"6-9","group":"6. Google 연결관리","title":"전체 연결 완료","scr":"SCR-GOOGLE-CONN-001","path":"마케팅 > 마케팅 채널 관리 > Google > 연결관리","wf":"WF-006","fr":"FR-011부터 FR-014","pol":"POL-035부터 POL-051","steps":[["meta","connected"],["google","full"],["go","#/google/connect"]],"marks":[["1","h3@Google 계정^.sec"],["1-1","[data-act=unlink-all]"],["2","h3@Merchant Center^.sec"],["2-1","dt@Merchant Center 계정 ID^.kv__row"],["2-2","[data-act=mc-change]"],["3","h3@상품 피드^.sec"],["3-1","dt@카테고리 설정^.kv__row"],["3-2","dt@Merchant Center 연동 상품^.kv__row"],["4","h3@Google Ads^.sec"],["4-1","[data-act=ads-change]"]],"desc":[["1","Google 계정 · AREA-GOOGLE-CONN-ACCOUNT",["로그인 이메일, 연결 상태를 표시합니다. 연결 상태는 화면 진입마다 Google API로 다시 확인합니다(결정 주체 Google, POL-036).","연결 상태: 연결됨 / 재인증 필요(6-10)"]],["1-1","[전체 연결 해제]",["확인 모달 후 Merchant Center·Google Ads를 포함한 전체 연결을 해제하고 상품 피드 자동 전송을 멈춥니다."]],["2","Merchant Center · AREA-GOOGLE-CONN-MC",["계정 ID, 비즈니스 이름, 비즈니스 국가, 연결 완료 일시, 도메인 인증, 판매국가·배송 설정을 표시합니다.","[Merchant Center 바로가기]는 연결된 계정을 새 창으로 엽니다."]],["2-1","계정 상태",["연결됨 / 재인증 필요(Merchant API 접근 권한 오류, POL-038) / 계정 정지됨(연결됨 유지 + 함께 표시, 6-11)"]],["2-2","[계정 변경] / [연결 해제]",["[계정 변경]: 확인 후 계정 선택부터 다시 진행합니다. 계정이 바뀌면 Google 상품 피드 정보를 초기화하고 전송 대상을 반영대기로 큐에 등록합니다(POL-048).","[연결 해제]: Merchant Center만 해제합니다. 자동 전송을 멈추고 큐를 비우며 쇼핑 광고 기능을 비활성화합니다. Google Ads는 유지합니다(POL-049)."]],["3","상품 피드 · AREA-GOOGLE-CONN-FEED",["Meta 연결관리의 상품 피드 요약과 같은 구성입니다."]],["3-1","카테고리 설정 · [상품 카테고리 매칭]",["설정완료: 사용여부 ON인 매칭 대상 카테고리에 모두 유효한 Google 카테고리가 저장된 상태","미설정: 사용여부 ON인데 Google 카테고리가 없는 카테고리가 하나라도 있는 상태","[상품 카테고리 매칭]: 7-1 모달을 엽니다."]],["3-2","Merchant Center 연동 상품 · CMP-GOOGLE-FEED-STATUS-BAR",["상품개수(상태별 상품 수의 합)와 최근 업데이트 일시를 표시합니다. 전송한 상품이 없으면 '-'입니다.","활동중·검토중·미승인·노출제한·사용안함·반영대기 6개 상태 건수를 비율 바와 범례로 표시합니다."]],["4","Google Ads · AREA-GOOGLE-CONN-ADS",["광고 계정명(고객 ID), 연결 상태, Merchant Center 연결 여부를 표시합니다. Merchant Center가 없어도 오류로 처리하지 않습니다(POL-040).","Google Ads AuthorizationError는 원인을 나누지 않고 '재인증 필요'로 표시합니다(POL-039)."]],["4-1","[계정 변경] / [연결 해제]",["[계정 변경]: 계정 선택부터 연결 모달을 다시 진행합니다.","[연결 해제]: 확인 후 Google Ads만 해제합니다. Merchant Center와 상품 피드는 유지합니다(POL-050)."]],["※","공통 상태",["Loading: 영역별로 상태를 조회하며 조회 중인 영역에 로딩을 표시합니다.","Error: Google API 원본 오류 코드·메시지는 노출하지 않고 정해진 안내 문구로 바꿉니다. 원본 메시지와 request-id는 로그에만 남깁니다(NFR-004).","권한: 마케팅 채널 관리 메뉴 권한이 없으면 LNB 메뉴를 비활성화(클릭 불가)로 표시합니다. URL 직접 접근은 메이크샵 관리자 공통 권한 처리를 따릅니다(POL-007)."]]],"staticHtml":null},{"id":"6-10","group":"6. Google 연결관리","title":"재인증 필요 (Google 계정 인증 만료)","scr":"SCR-GOOGLE-CONN-001","path":"마케팅 > 마케팅 채널 관리 > Google > 연결관리","wf":"WF-006","fr":"FR-014","pol":"POL-037, POL-059","steps":[["meta","connected"],["google","full"],["set",{"account":"reauth"}],["go","#/google/connect"]],"marks":[["1","h3@Google 계정^.sec"],["2","[data-act=relogin]"],["3","dt@Merchant Center 계정 ID^.kv__row"],["4","dt@광고 계정^.kv__row"]],"desc":[["1","계정 인증 오류",["Google Ads AuthenticationError 또는 Merchant API 401이면 문제 위치를 Google 계정으로 판정합니다(POL-037).","Google 계정·Merchant Center·Google Ads 모두 재인증 필요로 표시하고 상품 피드 큐 전송을 멈춥니다(POL-059, AC-018)."]],["2","[다시 연결하기]",["Google 로그인·권한 동의를 다시 진행합니다. 인증되면 멈춘 전송을 이어갑니다."]],["3","Merchant Center",["재인증 필요로 함께 표시합니다."]],["4","Google Ads",["재인증 필요로 함께 표시합니다. 통합 현황에서는 해당 채널 값이 '-'입니다."]]],"staticHtml":null},{"id":"6-11","group":"6. Google 연결관리","title":"Merchant Center 계정 정지","scr":"SCR-GOOGLE-CONN-001","path":"마케팅 > 마케팅 채널 관리 > Google > 연결관리","wf":"WF-006","fr":"FR-014","pol":"POL-051","steps":[["meta","connected"],["google","full"],["set",{"mcSuspended":true}],["go","#/google/connect"]],"marks":[["1","dt@Merchant Center 계정 ID^.kv__row"],["2","#g-mc .note--warn"]],"desc":[["1","연결됨 + 계정 정지됨",["Google이 계정을 정지하면 연결은 유지하고 계정 상태를 함께 표시합니다(POL-051)."]],["2","안내",["정지 해제는 Merchant Center에서 진행하도록 안내합니다."]]],"staticHtml":null},{"id":"6-12","group":"6. Google 연결관리","title":"Google Ads 연결 — 연동 설정 확인","scr":"SCR-GOOGLE-CONN-008","path":"마케팅 > 마케팅 채널 관리 > Google > 연결관리","wf":"WF-006","fr":"FR-013","pol":"POL-046, POL-047","h":1000,"steps":[["meta","connected"],["google","account"],["go","#/google/connect"],["click","[data-act=ads-connect]"],["click","#ad-agree"],["click",".modal [data-act=next]"],["click",".modal [data-act=next]"],["wait",2300]],"marks":[["1",".modal .wstep"],["2",".modal #ad-checks"],["3",".modal [data-act=next]"]],"desc":[["1","진행 단계",["약관 동의 → 계정 선택 → 연동 설정 확인 → 완료. 단계별 세부 화면은 v0.1 화면설계서 4-15부터 4-18을 따릅니다."]],["2","10개 항목 확인",["필수 3개(계정 연결, 광고 성과 조회 권한, 연결 정보 저장)가 모두 완료되어야 연결합니다(POL-046).","'설정 필요'·'확인할 수 없음'은 오류가 아니며 구글애즈 탭에서 다시 확인합니다.","API 오류는 errorCode로 유형을 판정해 정해진 안내 문구를 보여주고 원본 메시지는 노출하지 않습니다(POL-047)."]],["3","[연결 완료]",["모든 항목 확인이 끝나면 활성화됩니다. 필수 항목이 하나라도 실패하면 연결 실패로 안내합니다."]]],"staticHtml":null},{"id":"7-1","group":"7. 카테고리 매칭","title":"Google 상품 카테고리 매칭 모달","scr":"SCR-GOOGLE-FEED-002","path":"마케팅 > 마케팅 채널 관리 > Google > 연결관리","wf":"WF-006","fr":"FR-017, FR-018","pol":"POL-063, POL-065부터 POL-073","h":1000,"steps":[["meta","connected"],["google","full"],["js","delete Store.s.catMap.c10; delete Store.s.catMap.c12; Store.save();"],["go","#/google/connect"],["click","[data-act=match]"]],"marks":[["1",".modal .infobox"],["2",".modal thead"],["3",".modal .switch|1"],["4",".modal .gpc-dd|1"],["5","#gcm-pager"],["6",".modal [data-act=later]"],["7",".modal [data-act=save]"]],"desc":[["1","안내 영역",["Merchant Center 연결이 끝나면 1회 자동으로 열고, 이후에는 연결관리 [상품 카테고리 매칭]으로 엽니다(POL-063).","GPC는 Meta와 공통값이며 여기서 바꾸면 Meta에도 적용된다는 점, 미매칭 상품은 노출제한이 된다는 점을 안내합니다.","Google 자동 분류로 바로 전송하는 방식은 두지 않습니다."]],["2","카테고리 목록",["메인 분류 트리의 최하위 카테고리만 전체 경로로 보여줍니다. 상위 카테고리 값은 하위로 이어지지 않습니다(POL-066).","컬럼: 사용여부 / 쇼핑몰 카테고리 / 연동 상품 수 / Google 카테고리. 카테고리 단위에는 성별·연령대를 두지 않습니다."]],["3","사용여부",["ON: 매칭 대상 / OFF: 해당 카테고리 상품은 사용안함, Google 카테고리 선택란 비활성화"]],["4","Google 카테고리 선택 · CMP-GOOGLE-GPC-SELECT",["저장된 공통 GPC가 있으면 선택된 상태로 보입니다. 없으면 '카테고리를 선택해주세요'(POL-071).","메이크샵 DB에 적재한 Google 공식 택소노미(taxonomy-with-ids) 현재 버전의 카테고리만 보여주고, 저장된 GPC가 현재 버전에 없으면 '카테고리를 선택해주세요'로 바꿉니다(POL-073)."]],["5","페이지네이션",["페이지를 이동해도 입력값을 유지합니다."]],["6","[다음에 반영] · X",["미매칭 카테고리(사용여부 ON, GPC 없음)가 있으면 확인 모달(7-2)을 띄웁니다. 없으면 바로 닫습니다.","모달에서 바꾼 값은 저장하지 않습니다."]],["7","[상품 피드 반영]",["입력값을 공통 GPC로 저장하고 전송 조건을 충족한 상품을 반영대기로 큐에 등록합니다(최초 동기화, POL-065). Meta가 연동되어 있으면 Meta도 바뀐 상품을 다시 판정합니다(POL-072).","완료 얼럿 \"선택한 카테고리가 상품 피드에 반영되었습니다.\"","저장 실패 시 입력값을 유지하고 얼럿으로 다시 시도를 안내합니다."]]],"staticHtml":null},{"id":"7-2","group":"7. 카테고리 매칭","title":"미매칭 닫기 확인","scr":"SCR-GOOGLE-FEED-002","path":"마케팅 > 마케팅 채널 관리 > Google > 연결관리","wf":"WF-006","fr":"FR-017","pol":"POL-064","h":1000,"steps":[["meta","connected"],["google","full"],["js","delete Store.s.catMap.c10; Store.save();"],["go","#/google/connect"],["click","[data-act=match]"],["click",".modal [data-act=later]"]],"marks":[["1",".nd"],["1-1",".nd__btn--ok"],["1-2",".nd__btn@취소"]],"desc":[["1","미매칭 닫기 확인 · CMP-GOOGLE-CONFIRM",["문구: \"카테고리를 매칭하지 않은 상품은 피드에서 제외되어 Google에 노출되지 않습니다. 다음에 반영하시겠습니까?\" (Meta와 같은 문구, 채널명만 다름)"]],["1-1","[확인]",["모달에서 바꾼 값을 저장하지 않고 닫습니다. 공통 GPC가 없는 상품은 노출제한(카테고리 미매칭), 이미 공통 GPC가 있는 상품은 전송 대상입니다(POL-064, AC-013)."]],["1-2","[취소]",["확인 창만 닫고 카테고리 매칭 모달을 유지합니다."]]],"staticHtml":null},{"id":"8-1","group":"8. Google 상품피드","title":"Merchant Center 미연결 안내","scr":"SCR-GOOGLE-FEED-001","path":"마케팅 > 마케팅 채널 관리 > Google > 상품피드","wf":"WF-007","fr":"FR-010","pol":"POL-034","steps":[["meta","connected"],["google","account"],["go","#/google/feed"]],"marks":[["1",".empty-hero h2"],["2",".empty-hero .btn"]],"desc":[["1","미연동 안내",["Google 계정 미연결 안내를 먼저 판정하고, 그다음 Merchant Center 미연결을 판정합니다(POL-034).","Google 계정 미연결이면 \"Google 계정 연결 후 이용할 수 있습니다.\"와 [Google 계정 연결하기] → 연결관리 이동 후 동의 모달 자동 표시"]],["2","[Merchant Center 연동하기]",["연결관리 Merchant Center 영역으로 이동합니다(Google 로그인 팝업은 다시 열지 않음)."]]],"staticHtml":null},{"id":"8-2","group":"8. Google 상품피드","title":"상품피드 (전체 탭)","scr":"SCR-GOOGLE-FEED-001","path":"마케팅 > 마케팅 채널 관리 > Google > 상품피드","wf":"WF-007","fr":"FR-015, FR-016, FR-019","pol":"POL-052부터 POL-062, POL-075, POL-076","steps":[["meta","connected"],["google","full"],["go","#/google/feed"]],"marks":[["1","h3@운영 현황^.sec"],["1-1","[data-act=hist]"],["1-2","[data-act=resync]"],["2","h3@상품 피드 등록 현황^.sec"],["3","h3@프로그램별 피드^.sec"],["4","#gfeed-list .stabs"],["4-1","#gfeed-search"],["4-2","#gfeed-size"],["4-3","#gfeed-list thead"],["4-4","#gfeed-list td.col-status|1"],["4-5","#gfeed-list [data-detail]|1"],["4-6","#gfeed-list [data-act=bulk]"]],"desc":[["1","운영 현황 · AREA-GOOGLE-FEED-OPERATION",["최근 전체 동기화, 최근 자동 동기화, 최근 동기화 결과(성공 / 일부 실패 / 실패 / 진행 중), 반영대기 상품 수(전송 큐), 전송 실패 상품 수를 표시합니다."]],["1-1","[동기화 이력]",["동기화 이력 모달(8-8)을 엽니다."]],["1-2","[다시 동기화]",["확인 팝업 후 전송 조건을 충족한 전체 상품을 큐에 등록합니다(전체 동기화, POL-060). 큐에 전송 중인 상품이 있으면 비활성화합니다."]],["2","상품 피드 등록 현황 · CMP-GOOGLE-FEED-STATUS-BAR",["Meta 상품 피드 등록 현황과 같은 구성입니다. 6개 상태 건수는 상태 탭 건수와 같습니다.","[Merchant Center 바로가기]는 연결된 계정을 새 창으로 엽니다."]],["3","프로그램별 피드 · AREA-GOOGLE-FEED-PROGRAMS",["무료 리스팅, 쇼핑 광고를 고정 표시합니다. 값은 aggregateProductStatuses(countryCode = KR) 기준이며 두 프로그램 수를 더하지 않습니다(POL-075)."]],["4","상태 탭",["전체 / 활동중 / 검토중 / 미승인 / 노출제한 / 사용안함 / 반영대기, 탭마다 건수 표시","판정 순서: 사용안함 → 노출제한 → 반영대기 → 미승인 → 검토중 → 활동중(POL-052)","메이크샵이 전송한 상품만 관리합니다. Merchant Center에서 직접 등록한 상품은 표시하지 않습니다(POL-062)."]],["4-1","상품명 검색",["현재 탭 안에서 상품명으로 조회합니다. 결과가 없으면 '검색 결과가 없습니다.'"]],["4-2","목록 개수",["10 / 20 / 50 / 100개. 바꾸면 첫 페이지부터 조회합니다."]],["4-3","목록 컬럼 · CMP-GOOGLE-FEED-TABLE",["전체 탭: 체크박스 / 상품정보(이미지·상품명·분류) / 가격 / 연동 상품 수(조합 옵션 SKU 수) / 상태 / Google 상품 카테고리 / 관리","Google 상품 카테고리는 저장된 공통 GPC를 표시하고, 미매칭이면 '-'입니다. Google이 자동 지정한 카테고리는 조회할 수 없어 표시하지 않습니다(POL-074).","탭별 컬럼은 8-3, 8-4 참고"]],["4-4","상태 배지",["여러 상태가 섞이는 '전체' 탭에만 표시합니다."]],["4-5","[상세]",["상품 상세 설정 모달(8-6)을 엽니다."]],["4-6","[선택 수정]",["체크한 상품으로 선택 수정 모달(8-7)을 엽니다. 선택한 상품이 없으면 얼럿 \"선택된 상품이 없습니다.\""]],["※","공통 상태",["Error: Google 계정 재인증이 필요하면 큐 전송을 멈추고 화면 상단에 안내를 표시합니다(POL-059).","권한: 마케팅 채널 관리 메뉴 권한이 없으면 LNB 메뉴를 비활성화(클릭 불가)로 표시합니다. URL 직접 접근은 메이크샵 관리자 공통 권한 처리를 따릅니다(POL-007)."]]],"staticHtml":null},{"id":"8-3","group":"8. Google 상품피드","title":"노출제한 탭","scr":"SCR-GOOGLE-FEED-001","path":"마케팅 > 마케팅 채널 관리 > Google > 상품피드","wf":"WF-007","fr":"FR-015","pol":"POL-053, POL-054","steps":[["meta","connected"],["google","full"],["go","#/google/feed?tab=노출제한"]],"marks":[["1","#gfeed-list thead"],["2","#gfeed-list td.col-reason|1"]],"desc":[["1","탭별 컬럼",["노출제한·미승인: 상품정보 / 가격 / 연동 상품 수 / Google 상품 카테고리 / 사유 / 관리","활동중·검토중·반영대기: 사유 컬럼 없음 / 사용안함: Google 상품 카테고리 컬럼 없음"]],["2","노출제한 사유 (메이크샵 판정, 전송하지 않음)",["진열 안 함 → 상품 노출 여부를 노출함으로 변경","판매 안 함 → 판매 가능 여부를 판매가능으로 변경","판매가 0원 → 판매가 입력 / 판매가 대체문구 사용 → 대체문구 해제 후 판매가 입력","상품명에 '개인 결제' 문구 포함 → 상품명 수정","상세이미지 없음 → 이미지 등록 / 상세설명 없음 → 상세설명 등록","카테고리 미매칭 → Google 카테고리 매칭 후 [상품 피드 반영] (GPC가 없거나 택소노미 현재 버전에 없는 경우)","품절은 노출제한 사유가 아니며 out_of_stock으로 전송합니다(POL-054)."]]],"staticHtml":null},{"id":"8-4","group":"8. Google 상품피드","title":"미승인 탭","scr":"SCR-GOOGLE-FEED-001","path":"마케팅 > 마케팅 채널 관리 > Google > 상품피드","wf":"WF-007","fr":"FR-015","pol":"POL-052, POL-055","steps":[["meta","connected"],["google","full"],["go","#/google/feed?tab=미승인"]],"marks":[["1","#gfeed-list td.col-reason|1"]],"desc":[["1","미승인 사유 (Google 판정)",["itemLevelIssues[].severity가 DISAPPROVED이거나 disapprovedCountries가 있으면 미승인입니다. DEMOTED·NOT_IMPACTED만 있으면 활동중을 유지합니다(POL-052).","itemLevelIssues[].code를 11개 그룹으로 바꿔 표시합니다: 가격 불일치 / 재고 불일치 / 필수 속성 누락 / 잘못된 속성값 / 방문 페이지 오류 / 이미지 문제 / Google 정책 위반 / 상품 식별자 문제 / 카테고리/속성 문제 / 중복 또는 상품 식별 문제 / 기타 상품 데이터 문제(POL-055).","상세 설명과 조치 안내는 Google이 돌려준 description, detail, documentation을 씁니다.","'Google 정책 위반' 그룹 코드는 실제 응답을 확인해 추가합니다(OPEN-003)."]]],"staticHtml":null},{"id":"8-5","group":"8. Google 상품피드","title":"반영대기 탭","scr":"SCR-GOOGLE-FEED-001","path":"마케팅 > 마케팅 채널 관리 > Google > 상품피드","wf":"WF-007","fr":"FR-016","pol":"POL-056, POL-057","steps":[["meta","connected"],["google","full"],["go","#/google/feed?tab=반영대기"]],"marks":[["1","#gfeed-list .list-foot_
