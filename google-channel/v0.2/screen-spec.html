_left"]],"desc":[["1","조회 전용",["반영대기 상품은 전송 큐에서 순서대로 자동 전송되며 직접 전송하는 버튼은 없습니다.","같은 상품이 여러 번 등록되면 최신 1건만 전송하고, 전송 시점 최신 정보로 다시 판정합니다(POL-056).","전송에 실패하면 반영대기를 유지하고 다음 전송에서 다시 보냅니다. 실패 사유는 동기화 이력에 남깁니다(POL-057)."]]],"staticHtml":null},{"id":"8-6","group":"8. Google 상품피드","title":"상품 상세 설정","scr":"SCR-GOOGLE-FEED-003","path":"마케팅 > 마케팅 채널 관리 > Google > 상품피드 > 상세","wf":"WF-007","fr":"FR-018","pol":"POL-053, POL-065, POL-066, POL-070부터 POL-074","h":1100,"steps":[["meta","connected"],["google","full"],["go","#/google/feed?tab=미승인"],["click","#gfeed-list [data-detail]|1"]],"marks":[["1",".modal .pbasic"],["1-1",".modal [data-act=edit]"],["2",".modal .gstate"],["3",".modal .mtable"],["3-1",".modal .d-gpc"],["3-2",".modal .d-gender"],["4",".modal [data-act=save]"]],"desc":[["1","상품 기본정보",["이미지, 상품코드, 카테고리, 상품명, 판매가, 진열상태, 판매상태를 현재 메이크샵 값으로 표시합니다. 여기서 수정할 수 없습니다."]],["1-1","[상품 상세 관리]",["해당 상품의 메이크샵 상품 상세 관리 화면을 엽니다."]],["2","Google 피드 상태",["현재 상태 1건, 판정 주체, 최근 연동일시를 표시합니다.","미승인: 판정 Google, 사유 그룹과 Google 안내 / 노출제한: 판정 메이크샵, 노출제한 사유","활동중·검토중: 판정 Google / 사용안함·반영대기: 판정 메이크샵"]],["3","카테고리 매칭",["컬럼: 사용여부 / Google 상품 카테고리 / 성별 / 연령대. 상품 단위 설정값은 대표 카테고리 설정값보다 우선합니다(POL-066).","사용여부 OFF: 사용안함(전송 제외), 나머지 선택란 비활성화"]],["3-1","Google 상품 카테고리",["Meta와 같은 공통 GPC를 표시합니다. 상품 단위 값이 없으면 대표 카테고리 값을 보여줍니다.","여기서 바꾸면 Meta에도 같이 적용되고 두 채널 모두 해당 상품을 다시 판정합니다(POL-072).","v0.1의 'Google 자동 분류' 선택지와 '적용 방식' 컬럼은 없습니다."]],["3-2","성별 · 연령대",["매칭 GPC가 의류 및 액세서리(166) 하위일 때만 입력하고, 그 외는 '해당없음'입니다(POL-070).","성별: 남성 / 여성 / 남녀공용, 연령대: 청소년·성인 / 아동 / 유아 / 영아 / 신생아. 선택 입력이며 채널별로 저장합니다."]],["4","[취소] / [상품 피드 반영]",["[취소]: 저장하지 않고 닫습니다.","[상품 피드 반영]: 저장 후 전송 조건을 충족하면 반영대기로 큐에 등록합니다. 완료 얼럿 \"선택한 상품이 상품 피드에 반영되었습니다.\"","Validation: 사용여부 ON인데 카테고리가 없으면 얼럿 \"상품 피드를 사용하려면 Google 상품 카테고리를 선택해 주세요.\""]]],"staticHtml":null},{"id":"8-7","group":"8. Google 상품피드","title":"선택 상품 카테고리 매칭 (선택 수정)","scr":"SCR-GOOGLE-FEED-004","path":"마케팅 > 마케팅 채널 관리 > Google > 상품피드 > 선택 수정","wf":"WF-007","fr":"FR-018","pol":"POL-065, POL-066, POL-070부터 POL-074","h":1000,"steps":[["meta","connected"],["google","full"],["go","#/google/feed"],["click","#gfeed-list .row-chk|1"],["click","#gfeed-list .row-chk|4"],["click","#gfeed-list [data-act=bulk]"]],"marks":[["1",".modal .infobox"],["2",".modal .bulkbar"],["2-1",".modal [data-act=apply]"],["3",".modal .mtable--prod"],["3-1",".modal .m-gpc|1"],["4",".modal [data-act=save]"]],"desc":[["1","안내",["선택한 상품 수와, [적용]은 입력값만 바꾸고 [상품 피드 반영]을 눌러야 저장된다는 점을 안내합니다."]],["2","일괄 변경",["사용여부, 성별, 연령대를 골라 [적용]하면 아래 목록 값을 한 번에 바꿉니다(입력 편의 기능)."]],["2-1","[적용]",["모달 안의 입력값만 바꾸며 저장하지 않습니다. 성별·연령대는 의류 GPC 상품에만 적용합니다(POL-065)."]],["3","선택 상품 목록",["컬럼: 사용여부 / 상태 / 상품정보 / 쇼핑몰 카테고리 / Google 상품 카테고리 / 성별 / 연령대. 각 행은 상품별로 따로 저장합니다."]],["3-1","Google 상품 카테고리",["상품별 공통 GPC를 바꿀 수 있고 Meta에도 같이 적용됩니다. 선택 목록은 Google 공식 택소노미 현재 버전 기준입니다."]],["4","[상품 피드 반영]",["상품마다 저장하고 전송 조건을 충족한 상품을 반영대기로 큐에 등록합니다. 완료 얼럿 \"선택한 상품이 상품 피드에 반영되었습니다.\"","Validation: 사용여부 ON인데 카테고리가 없는 상품이 있으면 저장하지 않고 얼럿을 띄웁니다."]]],"staticHtml":null},{"id":"8-8","group":"8. Google 상품피드","title":"동기화 이력","scr":"SCR-GOOGLE-FEED-005","path":"마케팅 > 마케팅 채널 관리 > Google > 상품피드","wf":"WF-007","fr":"FR-019","pol":"POL-076","h":1000,"steps":[["meta","connected"],["google","full"],["go","#/google/feed"],["click","[data-act=hist]"]],"marks":[["1",".modal .hist-filter"],["2",".modal .mtable"],["3",".modal [data-h]|1"]],"desc":[["1","조회 조건",["조회 기간(기본 최근 30일)과 결과(성공 / 일부 실패 / 실패 / 진행 중) 필터"]],["2","이력 목록",["일시 / 유형(최초·전체·자동 동기화, 정합성 점검) / 결과 / 대상 / 성공 / 실패 / 상세","1일 1회 정합성 점검 실행 시각은 OPEN-004입니다(POL-061)."]],["3","[상세]",["실패 상품이 있는 행에만 표시하며 실패 상세(8-9)를 엽니다. 재시도 버튼은 두지 않습니다(POL-076)."]]],"staticHtml":null},{"id":"8-9","group":"8. Google 상품피드","title":"동기화 실패 상세","scr":"SCR-GOOGLE-FEED-006","path":"마케팅 > 마케팅 채널 관리 > Google > 상품피드","wf":"WF-007","fr":"FR-019","pol":"POL-057, POL-076","h":1000,"steps":[["meta","connected"],["google","full"],["go","#/google/feed"],["click","[data-act=hist]"],["click",".modal [data-h]|1"]],"marks":[["1",".modal .sec__lead|1"],["2",".modal .mtable|2"]],"desc":[["1","안내",["실패 상품은 반영대기로 남아 다음 전송에서 다시 보낸다는 점을 안내합니다(POL-057)."]],["2","실패 상품·사유",["상품정보와 실패 사유를 표시합니다. Google API 원본 메시지 대신 정해진 안내 문구를 쓰고 원본은 로그에만 남깁니다."]]],"staticHtml":null},{"id":"9-1","group":"9. 구글애즈","title":"Google Ads 미연결 안내","scr":"SCR-GOOGLE-ADS-001","path":"마케팅 > 마케팅 채널 관리 > Google > 구글애즈","wf":"WF-008","fr":"FR-010","pol":"POL-034","steps":[["meta","connected"],["google","account"],["go","#/google/ads"]],"marks":[["1",".empty-hero h2"],["2",".empty-hero .btn"]],"desc":[["1","미연동 안내",["구글애즈 탭 조건에는 Merchant Center 연결 여부를 넣지 않습니다(POL-034)."]],["2","[Google Ads 연결하기]",["연결관리로 이동 후 Google Ads 연결 모달(6-12)을 자동으로 엽니다."]]],"staticHtml":null},{"id":"9-2","group":"9. 구글애즈","title":"구글애즈 (광고 기준)","scr":"SCR-GOOGLE-ADS-002","path":"마케팅 > 마케팅 채널 관리 > Google > 구글애즈","wf":"WF-008","fr":"FR-020, FR-021","pol":"POL-077부터 POL-083","steps":[["meta","connected"],["google","full"],["go","#/google/ads"]],"marks":[["1","h3@계정 정보^.sec"],["1-1","[data-act=status]"],["2","h3@광고 측정^.sec"],["3",".perf-top .seg|1"],["3-1",".perf-top .seg|2"],["3-2",".stabs--sub"],["4",".kpis"],["5","#gads-perf .table"]],"desc":[["1","계정 정보",["광고 계정명(고객 ID), 연결 상태, Merchant Center 연결 단계를 표시합니다.","MC 연결 단계: Google Ads만 연결 / MC 연결 감지 / MC 연동 완료. MerchantCenterLink ENABLED만 연결 감지로 봅니다(POL-077)."]],["1-1","[광고 운영 상태]",["권장사항·진단 모달(9-6)을 엽니다."]],["2","광고 측정",["Google Tag·향상된 전환은 메이크샵 설정 완료 결과, 전환 상태는 전환 액션 존재 + 활성으로 판정합니다. '정상'은 수집 보장이 아닙니다(POL-079)."]],["3","광고 기준 / 상품 기준",["상품 기준 탭은 메이크샵 Merchant Center 연동과 Google Ads·Merchant Center 간 연결이 모두 완료되어야 표시합니다(POL-080)."]],["3-1","조회 기간",["오늘 / 어제 / 최근 7일 / 최근 30일 / 이번 달. 비교 기간은 직전 같은 기간이며 데이터가 없으면 '비교 데이터 없음'(POL-081)."]],["3-2","캠페인 유형 서브탭",["Merchant Center 미연동·해제 시 쇼핑 서브탭을 비활성화하고 MC 연결 필요를 안내합니다(POL-083)."]],["4","성과 요약",["비용, 노출수, 클릭수, 전환수, 전환 가치(ROAS)와 직전 기간 대비 증감. 값은 Google Ads API 값을 그대로 쓰고 계산할 수 없으면 '-'입니다(POL-082)."]],["5","캠페인 목록",["캠페인명, 유형, 노출수, 클릭수, CTR, 비용, 전환수, 전환 가치, ROAS. 항목 설정은 v0.1 화면설계서 6-6·6-7을 따릅니다(POL-085)."]]],"staticHtml":null},{"id":"9-3","group":"9. 구글애즈","title":"구글애즈 (상품 기준)","scr":"SCR-GOOGLE-ADS-003","path":"마케팅 > 마케팅 채널 관리 > Google > 구글애즈","wf":"WF-008","fr":"FR-021","pol":"POL-080, POL-084","steps":[["meta","connected"],["google","full"],["go","#/google/ads"],["click","[data-mode=product]"]],"marks":[["1",".perf-top .seg|1"],["2","#gads-perf .table"]],"desc":[["1","상품 기준",["쇼핑 캠페인의 상품별 성과를 봅니다. 조회 중 Merchant Center 연동이 해제되면 광고 기준 탭으로 바꿉니다."]],["2","상품 성과 목록",["segments.product_item_id로 메이크샵 상품과 매칭해 현재 상품 정보로 표시합니다. 매칭 상품이 없으면 행을 유지하고 '삭제된 상품'으로 표시합니다(POL-084)."]]],"staticHtml":null},{"id":"9-4","group":"9. 구글애즈","title":"Google Ads만 연결 (MC 미연결)","scr":"SCR-GOOGLE-ADS-002","path":"마케팅 > 마케팅 채널 관리 > Google > 구글애즈","wf":"WF-008","fr":"FR-020","pol":"POL-040, POL-083","steps":[["meta","connected"],["google","full"],["js","GStore.disconnectMc(); GStore.s.mcLink='none'; GStore.save();"],["go","#/google/ads"]],"marks":[["1","dt@Merchant Center 연결^.kv__row"],["2",".stab@쇼핑"]],"desc":[["1","MC 연결 단계",["'Google Ads만 연결'로 표시하고, 쇼핑 광고 성과는 확인할 수 없다는 안내를 보여줍니다. 오류로 처리하지 않습니다(POL-040)."]],["2","쇼핑 서브탭 비활성",["상품 기준 탭은 표시하지 않고 쇼핑 서브탭은 비활성화합니다(AC-021)."]]],"staticHtml":null},{"id":"9-5","group":"9. 구글애즈","title":"Merchant Center 연결 감지","scr":"SCR-GOOGLE-ADS-004","path":"마케팅 > 마케팅 채널 관리 > Google > 구글애즈","wf":"WF-008","fr":"FR-020","pol":"POL-077, POL-078","steps":[["meta","connected"],["google","full"],["js","GStore.disconnectMc(); GStore.s.mcLink='detected'; GStore.save();"],["go","#/google/ads"]],"marks":[["1","h3@계정 정보^.sec"],["2","[data-act=link-mc]"]],"desc":[["1","감지 안내",["Google Ads에 연결된 Merchant Center가 있지만 메이크샵에는 연동되지 않은 상태입니다."]],["2","[이 Merchant Center를 메이크샵에 연결]",["감지된 계정을 대상으로 계정 선택을 생략하고 사업자 정보 동의 → 전화번호 인증 → 약관 동의를 진행합니다(POL-078)."]]],"staticHtml":null},{"id":"9-6","group":"9. 구글애즈","title":"광고 운영 상태 — 권장사항","scr":"SCR-GOOGLE-ADS-005","path":"마케팅 > 마케팅 채널 관리 > Google > 구글애즈","wf":"WF-008","fr":"FR-022","pol":"POL-086, POL-089","h":1000,"steps":[["meta","connected"],["google","full"],["go","#/google/ads"],["click","[data-act=status]"]],"marks":[["1","#st-tabs"],["2","#st-body .rec|1"]],"desc":[["1","권장사항 / 진단",["두 영역은 따로 조회하며 일부 API가 실패해도 정상 조회된 영역은 표시합니다. 권한 부족은 권한 확인 안내를 보여줍니다(POL-089, AC-022)."]],["2","권장사항",["Google Ads API가 반환한 권장사항만 유형별 안내 문구와 [Google Ads에서 확인]으로 표시합니다. 메이크샵에서 적용·닫기는 하지 않습니다(POL-086)."]]],"staticHtml":null},{"id":"9-7","group":"9. 구글애즈","title":"광고 운영 상태 — 진단","scr":"SCR-GOOGLE-ADS-005","path":"마케팅 > 마케팅 채널 관리 > Google > 구글애즈","wf":"WF-008","fr":"FR-022","pol":"POL-087, POL-088","h":1000,"steps":[["meta","connected"],["google","full"],["go","#/google/ads"],["click","[data-act=status]"],["click",".modal [data-t=diag]"]],"marks":[["1","#st-body .rec|1"],["2","#st-body .rec|2"]],"desc":[["1","계정 문제",["여러 문제가 있으면 CRITICAL → ERROR → SUGGESTION 순으로 가장 높은 것 하나를 표시합니다. 해소되면 알림을 없앱니다(POL-087)."]],["2","상품 문제",["SHOPPING_ADS aggregatedSeverity 기준이며 DISAPPROVED를 DEMOTED보다 우선합니다. PENDING은 제외하고 개별 상품은 상품피드에서 확인합니다(POL-088)."]]],"staticHtml":null},{"id":"9-8","group":"9. 구글애즈","title":"Google Ads 재인증 필요","scr":"SCR-GOOGLE-ADS-002","path":"마케팅 > 마케팅 채널 관리 > Google > 구글애즈","wf":"WF-008","fr":"FR-014","pol":"POL-039","steps":[["meta","connected"],["google","full"],["set",{"ads":"reauth"}],["go","#/google/ads"]],"marks":[["1",".meta-main > .note--warn"],["2","dt@광고 계정^.kv__row"]],"desc":[["1","재인증 안내",["Google Ads AuthorizationError면 Google Ads만 재인증 필요이며 상품 피드 전송은 계속됩니다(POL-039, AC-019).","아래 값은 마지막으로 확인된 정보임을 안내합니다."]],["2","광고 계정",["연결 상태 '재인증 필요'"]]],"staticHtml":null}]</script>
<script>
'use strict';
const PROTO=JSON.parse(document.getElementById('proto').textContent);
const pages=JSON.parse(document.getElementById('screens').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cur=-1,scale=1,fit=true,frame=null,docH=900,token=0;
function nav(){const q=$('search').value.trim().toLowerCase();let g='',o='';for(const p of pages){if(!(p.id+' '+p.group+' '+p.title+' '+p.scr).toLowerCase().includes(q))continue;if(g!==p.group){g=p.group;o+='<div class="group-label">'+esc(g)+'</div>';}o+='<a href="#s-'+p.id+'"'+(pages[cur]===p?' aria-current="page"':'')+'><span class="id">'+p.id+'</span><span>'+esc(p.title)+'</span></a>';}$('nav').innerHTML=o||'<p style="padding:12px;color:#6b778c;font-size:12px">일치하는 화면이 없습니다.</p>';}
function apply(){const w=1440;if(fit)scale=Math.min(1,Math.max(.2,($('viewport').clientWidth-42)/w));const s=$('sheet');s.style.width=Math.round(w*scale)+'px';s.style.height=Math.round(docH*scale)+'px';const inner=$('holder').firstElementChild;if(inner){inner.style.transform='scale('+scale+')';inner.style.transformOrigin='0 0';}$('zoom').textContent=Math.round(scale*100)+'%';}
function paintDesc(p,missing){const info=[['화면/기능명',p.title],['화면 ID',p.scr],['경로',p.path],['WF · FR',p.wf+' · '+p.fr],['관련 정책',p.pol]];
$('desc').innerHTML='<table class="info">'+info.map(r=>'<tr><th>'+r[0]+'</th><td>'+esc(r[1])+'</td></tr>').join('')+'</table><h3>DESCRIPTION</h3>'+(p.desc||[]).map(d=>'<div class="item" data-n="'+esc(d[0])+'"><div class="t"><span class="n'+(d[0]==='※'?' c':'')+'">'+esc(d[0])+'</span>'+esc(d[1])+'</div><ul>'+d[2].map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul></div>').join('')+(missing&&missing.length?'<p class="missing">마커 위치를 찾지 못함: '+esc(missing.join(', '))+'</p>':'');
$('desc').querySelectorAll('.item').forEach(it=>it.addEventListener('click',()=>focusMark(it.dataset.n)));}
function focusMark(n){$('desc').querySelectorAll('.item').forEach(i=>i.classList.toggle('on',i.dataset.n===n));if(!frame||!frame.contentWindow.SpecBridge)return;frame.contentWindow.SpecBridge.focus(n);const b=frame.contentDocument.querySelector('.spec-box[data-n="'+CSS.escape(n)+'"]');if(b){const y=parseFloat(b.style.top)*scale;$('viewport').scrollTo({top:Math.max(0,y-80),behavior:'smooth'});}}
async function select(id){let i=pages.findIndex(p=>p.id===id);if(i<0)i=0;cur=i;const p=pages[i];const my=++token;
$('title').textContent=p.id+' · '+p.title;$('breadcrumb').textContent='구글 채널 연동 / '+p.group+' / '+p.scr;$('count').textContent=(i+1)+' / '+pages.length;$('prev').disabled=i===0;$('next').disabled=i===pages.length-1;
document.title=p.id+' '+p.title+' · 구글 채널 화면 정의서';nav();paintDesc(p);$('viewport').scrollTo(0,0);
const route=(p.steps||[]).filter(s=>s[0]==='go').map(s=>s[1]).pop();$('open').hidden=!route;if(route)$('open').href='../10_Prototype/index.html'+route;
const holder=$('holder');holder.innerHTML='';frame=null;
if(p.staticHtml){holder.innerHTML='<div class="static">'+p.staticHtml+'</div>';$('loading').hidden=true;docH=holder.firstElementChild.scrollHeight+10;apply();return;}
$('loading').hidden=false;docH=p.h||900;apply();
const f=document.createElement('iframe');f.setAttribute('title',p.title+' 목업 화면');f.style.height=docH+'px';holder.appendChild(f);apply();
f.addEventListener('load',async()=>{if(my!==token)return;const w=f.contentWindow;await new Promise(r=>setTimeout(r,250));
try{await w.SpecBridge.run(p.steps||[]);await new Promise(r=>setTimeout(r,350));if(my!==token)return;
if(!p.h){f.style.height='900px';docH=Math.max(700,w.SpecBridge.height());f.style.height=docH+'px';}else{const need=w.SpecBridge.modalNeed();if(need>docH){docH=need;f.style.height=docH+'px';await new Promise(r=>setTimeout(r,150));}}
const res=w.SpecBridge.mark(p.marks||[]);frame=f;apply();paintDesc(p,res.missing);}catch(e){paintDesc(p,['오류: '+e.message]);}
$('loading').hidden=true;},{once:true});
f.srcdoc=PROTO;}
function fromHash(){select(decodeURIComponent(location.hash.replace(/^#s-/,'')));}
function go(i){if(i>=0&&i<pages.length)location.hash='s-'+pages[i].id;}
$('search').addEventListener('input',nav);$('prev').addEventListener('click',()=>go(cur-1));$('next').addEventListener('click',()=>go(cur+1));
$('fit').addEventListener('click',()=>{fit=true;apply();});$('actual').addEventListener('click',()=>{fit=false;scale=1;apply();});
const zoomBy=d=>{fit=false;scale=Math.max(.2,Math.min(2,scale+d));apply();};$('minus').addEventListener('click',()=>zoomBy(-.1));$('plus').addEventListener('click',()=>zoomBy(.1));
addEventListener('hashchange',fromHash);addEventListener('resize',()=>{if(fit)apply();});addEventListener('keydown',e=>{if(e.altKey&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();go(cur+(e.key==='ArrowRight'?1:-1));}});
fromHash();
</script></body></html>
