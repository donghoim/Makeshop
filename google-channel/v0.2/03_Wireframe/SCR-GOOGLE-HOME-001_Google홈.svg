<text x="462" y="340" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start">Google 계정 연결 후 두 서비스는 따로 연결할 수 있으며, 연결 상태와 계정 정보를 확인할 수 있습니다.</text>
