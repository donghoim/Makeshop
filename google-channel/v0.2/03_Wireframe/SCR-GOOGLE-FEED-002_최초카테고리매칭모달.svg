<text x="270" y="188" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">· 메이크샵 카테고리를 Google 상품 카테고리(GPC)에 연결합니다. 매칭한 카테고리의 상품만 Google로 전송합니다.</text>
<text x="270" y="212" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">· Google 상품 카테고리는 Meta와 공통으로 사용합니다. Meta에서 설정한 카테고리는 선택되어 있고, 여기서 바꾸면 Meta에도 같이 적용됩니다.</text>
<text x="270" y="236" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">· 카테고리를 선택하지 않은 상품은 노출제한(카테고리 미매칭)으로 표시되며 전송하지 않습니다.</text>
<text x="270" y="260" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">· 사용여부를 끄면 해당 카테고리 상품은 사용안함으로 처리합니다.</text>
