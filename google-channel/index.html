<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메이크샵 관리자 — 채널</title>
<link rel="stylesheet" href="src/css/common.css">
<style>
  .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .menu-card { background: #fff; border: 1px solid var(--gc-border); border-radius: var(--gc-radius); padding: 20px; transition: box-shadow .15s, transform .1s; cursor: pointer; }
  .menu-card:hover { box-shadow: var(--gc-shadow-modal); transform: translateY(-2px); }
  .menu-card.highlight { border: 2px solid #ea4335; position: relative; }
  .menu-card.highlight::after { content: "NEW"; position: absolute; top: 14px; right: 14px; background: #ea4335; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px; }
  .menu-icon { width: 44px; height: 44px; border-radius: 10px; background: #f1f3f5; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px; }
  .menu-card h3 { font-size: 15px; margin: 0 0 6px; }
  .menu-card p { font-size: 12px; color: var(--gc-text-sub); line-height: 1.6; margin: 0; }
  @media (max-width: 900px) { .menu-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .menu-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="gc-header">
    <div>
      <div class="gc-breadcrumb"><a href="#">부가서비스</a> &gt; <a href="#">부가서비스</a> &gt; 채널</div>
      <h1 class="gc-title">채널</h1>
    </div>
  </div>
  <div class="gc-page">
    <div class="menu-grid" id="menu-grid"></div>
  </div>

  <script>
    const CHANNELS = [
      { icon: "🅝", name: "네이버 연동 설정", desc: "네이버 서비스 연동 설정 및 네이버 광고 유입 관련 설정을 진행할 수 있습니다." },
      { icon: "🛍️", name: "네이버 쇼핑", desc: "네이버 이용자와 네이버 쇼핑에 입점한 쇼핑몰 및 스마트스토어간의 편리한 연결과 정보를 제공하는 쇼핑 포털 서비스입니다." },
      { icon: "📌", name: "네이버 앵커", desc: "네이버 메인에 노출되는 고유 영역으로, 다양한 방문자에게 노출하여 매출 및 브랜드 경쟁력을 극대화하는 광고입니다." },
      { icon: "💳", name: "네이버페이 CPS", desc: "네이버페이 혜택광고 영역을 통해 쇼핑몰 배너를 노출하고 링크를 통해 쇼핑몰 방문 또는 결제 시 네이버페이 포인트 리워드를 지급하는 결제 유도형 광고상품입니다." },
      { icon: "🔗", name: "다음/제휴 마케팅", desc: "쇼핑몰 홍보에 가장 효과적인 키워드 광고 다음클릭스와 제휴 마케팅 설정을 관리할 수 있습니다." },
      { icon: "📌", name: "다음 앵커", desc: "쇼핑에 특화된 영역을 통해 카카오의 수많은 소비자와 만날 수 있는 쇼핑광고이며 쇼핑몰 및 브랜드 인지도 상승, 구매 전환에 최적화된 광고입니다." },
      { icon: "📊", name: "가격비교사이트 등록", desc: "가격 비교 사이트에 쇼핑몰 상품을 등록 시, 필요한 상품 DB 링크 주소를 제공하는 기능입니다." },
      { icon: "💬", name: "카카오 연동 설정", desc: "카카오 채널, 톡 체크아웃과 같은 카카오 비즈니스를 간편하게 연결하고 관리할 수 있습니다." },
      { icon: "G", name: "구글 쇼핑", desc: "구글 계정과 상품 정보를 연동하여 구글 쇼핑 광고 운영에 필요한 다양한 기능을 간편하게 이용할 수 있습니다.", href: "src/html/google-channel.html", highlight: true },
      { icon: "📘", name: "Meta 비즈니스", desc: "메타 비즈니스 계정을 연동하여 광고 운영부터 쇼핑 기능까지 다양한 마케팅 기능을 간편하게 이용할 수 있습니다." },
      { icon: "🔍", name: "V파인더", desc: "인스타그램에 등록된 상품과 관련된 코디 상품/추천상품을 동시에 노출하여 판매할 수 있는 플랫폼입니다." },
      { icon: "📡", name: "네트워크 광고", desc: "크리테오, 구글애즈, TikTok 광고 등 빅데이터를 기반으로한 타겟팅 광고 관리 기능입니다." },
      { icon: "📦", name: "다누리 신청", desc: "메이크샵과 다나와, 에누리가 협력하여 제공하는 서비스로 다나와와 에누리 가격 비교 서비스에 더 많이 노출할 수 있습니다." },
      { icon: "🧾", name: "다누리 청구내역", desc: "다누리 청구 내역을 확인할 수 있습니다." }
    ];
    const grid = document.getElementById("menu-grid");
    CHANNELS.forEach(c => {
      const card = document.createElement("div");
      card.className = "menu-card" + (c.highlight ? " highlight" : "");
      card.innerHTML = `<div class="menu-icon">${c.icon}</div><h3>${c.name}</h3><p>${c.desc}</p>`;
      if (c.href) card.addEventListener("click", () => location.href = c.href);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
